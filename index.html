<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="考察手記">
<title>考察手記</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
:root{
  --ground:#EEF2EC; --surface:#FFFFFF; --surface-2:#E2E8E1; --sunk:#F5F7F4;
  --ink:#16231D; --ink-soft:#50605A; --ink-faint:#83918A; --rule:#D2DBD4;
  --accent:#12705C; --accent-press:#0C5A4A; --on-accent:#FFFFFF; --accent-soft:#D8ECE5;
  --marker:#F0B23B; --on-marker:#2A1C00;
  --danger:#B3261E; --on-danger:#FFFFFF; --danger-soft:#F9E1DE;
  --good:#1D7443; --good-soft:#DCF0E3; --mid:#855700; --mid-soft:#F7EBD0; --low:#B3261E; --low-soft:#F9E1DE;
  --scrim:rgba(14,22,18,.46); --on-scrim:#FFFFFF;
  --b0:#50605A; --b0s:#E2E8E1;
  --b1:#1B6A86; --b1s:#DCECF2;
  --b2:#874774; --b2s:#F3E3EE;
  --b3:#86590C; --b3s:#F5EAD4;
  --b4:#3B56A2; --b4s:#E1E6F5;
  --shadow:0 1px 2px rgba(22,35,29,.06),0 6px 18px rgba(22,35,29,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1613; --surface:#18211C; --surface-2:#222C26; --sunk:#131A16;
    --ink:#E4ECE7; --ink-soft:#A1AFA7; --ink-faint:#6F7D76; --rule:#2D3932;
    --accent:#52BA9D; --accent-press:#66C9AD; --on-accent:#06231B; --accent-soft:#163A30;
    --marker:#F3BF55; --on-marker:#2A1C00;
    --danger:#F2A69F; --on-danger:#2A0B08; --danger-soft:#3A1D1A;
    --good:#73D49C; --good-soft:#173826; --mid:#F0C261; --mid-soft:#3A2E12; --low:#F2A69F; --low-soft:#3A1D1A;
    --scrim:rgba(0,0,0,.62); --on-scrim:#FFFFFF;
    --b0:#A1AFA7; --b0s:#222C26;
    --b1:#7CC3DA; --b1s:#15313B;
    --b2:#DB9CC8; --b2s:#35202F;
    --b3:#E2B460; --b3s:#352912;
    --b4:#A0B3EA; --b4s:#1E2640;
    --shadow:0 1px 2px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1613; --surface:#18211C; --surface-2:#222C26; --sunk:#131A16;
  --ink:#E4ECE7; --ink-soft:#A1AFA7; --ink-faint:#6F7D76; --rule:#2D3932;
  --accent:#52BA9D; --accent-press:#66C9AD; --on-accent:#06231B; --accent-soft:#163A30;
  --marker:#F3BF55; --on-marker:#2A1C00;
  --danger:#F2A69F; --on-danger:#2A0B08; --danger-soft:#3A1D1A;
  --good:#73D49C; --good-soft:#173826; --mid:#F0C261; --mid-soft:#3A2E12; --low:#F2A69F; --low-soft:#3A1D1A;
  --scrim:rgba(0,0,0,.62); --on-scrim:#FFFFFF;
  --b0:#A1AFA7; --b0s:#222C26;
  --b1:#7CC3DA; --b1s:#15313B;
  --b2:#DB9CC8; --b2s:#35202F;
  --b3:#E2B460; --b3s:#352912;
  --b4:#A0B3EA; --b4s:#1E2640;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:"Noto Sans TC","PingFang HK","Hiragino Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-inline:1rem;padding-top:env(safe-area-inset-top,0px)}
html.locked,html.locked body{overflow:hidden}
#app{max-width:28rem;margin-inline:auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* 頂欄 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:.35rem;min-height:3.5rem;background:var(--ground);border-bottom:1px solid var(--rule)}
.bar h1{flex:1;margin:0;font-size:1.06rem;font-weight:700;letter-spacing:.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar>.iconbtn:first-child{margin-left:-.65rem}
.iconbtn{display:inline-grid;place-items:center;width:2.75rem;height:2.75rem;border:none;border-radius:.8rem;background:transparent;color:var(--ink)}
.iconbtn:active{background:var(--surface-2)}
.iconbtn.sm{width:2.25rem;height:2.25rem;color:var(--ink-soft)}
.syncchip{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--rule);border-radius:999px;padding:.3rem .75rem;background:var(--surface);color:var(--ink-soft);font-size:.78rem;font-weight:700;min-height:2.3rem;white-space:nowrap;max-width:9.5rem;overflow:hidden;text-overflow:ellipsis}
.syncchip.pending{background:var(--mid-soft);border-color:transparent;color:var(--mid)}
.syncchip.busy{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.syncchip.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}

/* 版面 */
.view{display:flex;flex-direction:column;gap:1.15rem;padding-block:1rem 7.5rem}
.stack{display:flex;flex-direction:column;gap:1.15rem}
.field{display:flex;flex-direction:column;gap:.4rem}
.field.hide{display:none}
label,.label{font-size:.88rem;font-weight:700;color:var(--ink-soft)}
input:not([type=file]):not([type=checkbox]),textarea{width:100%;min-height:3rem;padding:.7rem .85rem;border:1px solid var(--rule);border-radius:.8rem;background:var(--surface);font-size:1rem;color:var(--ink)}
textarea{resize:vertical;line-height:1.75}
input::placeholder,textarea::placeholder{color:var(--ink-faint)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{margin:0;font-size:.8rem;color:var(--ink-faint);line-height:1.55}
.fineprint{margin:0;font-size:.8rem;color:var(--ink-soft);line-height:1.65}
.eyebrow{margin:0;font-size:.76rem;letter-spacing:.12em;color:var(--accent);font-weight:700}
.eyebrow b{font-size:.95rem;letter-spacing:.18em;font-variant-numeric:tabular-nums}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3.25rem;padding:0 1.2rem;border:none;border-radius:.95rem;font-weight:700;font-size:1.02rem;letter-spacing:.02em}
.btn.sm{min-height:2.6rem;padding:0 .95rem;font-size:.9rem;border-radius:.75rem}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:active{background:var(--accent-press)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--rule)}
.btn-dangerghost{background:transparent;color:var(--danger);border:1px dashed var(--danger)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-block{width:100%}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap}
.linkbtn{display:inline-flex;align-items:center;gap:.25rem;border:none;background:none;color:var(--accent);font-weight:700;font-size:.9rem;padding:.4rem .2rem;min-height:2.6rem;text-align:left}
.linkbtn.danger{color:var(--danger)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;padding:1.4rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--ground) 60%,transparent);pointer-events:none}
.dock>*{pointer-events:auto;width:100%;max-width:28rem;box-shadow:var(--shadow)}

/* 登入 */
.login{display:flex;flex-direction:column;gap:1.7rem;padding-block:2.6rem 3rem}
.brand{display:flex;flex-direction:column;gap:.35rem}
.trailmark{display:flex;align-items:center;margin-bottom:.7rem}
.trailmark i{position:relative;width:.95rem;height:.95rem;border-radius:.3rem;background:var(--marker)}
.trailmark i+i{margin-left:1.7rem}
.trailmark i+i::before{content:"";position:absolute;right:100%;top:50%;width:1.7rem;border-top:2px dashed var(--accent)}
.appname{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;font-size:2.5rem;line-height:1.2;letter-spacing:.08em}
.appsub{margin:0;color:var(--ink-soft);font-size:.95rem;letter-spacing:.08em}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:1.1rem;padding:1.25rem}
.quick{display:flex;flex-direction:column;gap:.3rem;padding-top:.6rem;border-top:1px solid var(--rule)}

/* 考察列表 */
.hello{margin:0;font-size:.9rem;color:var(--ink-soft)}
.triplist{display:flex;flex-direction:column;gap:.75rem}
.tripcard{position:relative;display:flex;gap:.9rem;align-items:stretch;width:100%;padding:.75rem;border:1px solid var(--rule);border-radius:1.05rem;background:var(--surface);text-align:left}
.tripcard:active{background:var(--sunk)}
.tc-cover{flex:none;display:grid;place-items:center;width:5.25rem;height:5.25rem;border-radius:.75rem;overflow:hidden;background:var(--surface-2);color:var(--ink-faint)}
.tc-cover img{width:100%;height:100%;object-fit:cover}
.tc-body{display:flex;flex-direction:column;gap:.12rem;min-width:0;justify-content:center}
.tc-date{font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tc-place{font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;font-size:1.12rem;line-height:1.35}
.tc-meta{font-size:.78rem;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.empty{padding:1.4rem;border:1px dashed var(--rule);border-radius:1rem;color:var(--ink-soft);font-size:.92rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.empty p{margin:0}

/* 新增考察 */
.suggest{display:flex;gap:.45rem;overflow-x:auto;margin-inline:-1rem;padding:0 1rem .35rem;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.sugg{flex:none;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:.5rem .85rem;font-size:.86rem;white-space:nowrap}
.sugg:active{background:var(--accent-soft)}

/* 封面 */
.cover{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/8;border-radius:1rem;overflow:hidden;background:var(--surface-2)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .phbtn{height:100%}
.cover-blank{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;width:100%;max-width:100%;aspect-ratio:16/6;border:2px dashed var(--rule);border-radius:1rem;background:var(--sunk);color:var(--ink-soft);cursor:pointer;text-align:center;padding:1rem}
.ce-title{font-weight:700;color:var(--accent);font-size:.98rem}
.ce-sub{font-size:.8rem;font-weight:500;color:var(--ink-faint)}
.cover-btn{position:absolute;right:.6rem;bottom:.6rem;display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .8rem;border-radius:999px;background:var(--scrim);color:var(--on-scrim);font-size:.8rem;font-weight:700;cursor:pointer}

/* 考察頁 */
.triphead{display:flex;flex-direction:column;gap:.55rem}
.th-date{margin:0;display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.th-place{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;font-size:1.75rem;line-height:1.3;text-wrap:balance}
.th-purpose{margin:0;font-size:.92rem;color:var(--ink-soft)}
.th-sum{margin:0;font-size:.88rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.th-sum b{color:var(--ink);font-size:1.02rem}
.covered{display:flex;flex-direction:column;gap:.35rem}
.covered .label{margin:0}
.menu{display:flex;flex-direction:column;gap:.5rem}

/* 分類色 */
.b0{--c:var(--b0);--cs:var(--b0s)}
.b1{--c:var(--b1);--cs:var(--b1s)}
.b2{--c:var(--b2);--cs:var(--b2s)}
.b3{--c:var(--b3);--cs:var(--b3s)}
.b4{--c:var(--b4);--cs:var(--b4s)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.dot{width:.5rem;height:.5rem;border-radius:50%;flex:none;background:var(--c)}
.tchip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border-radius:.45rem;font-size:.8rem;font-weight:500;line-height:1.5;background:var(--cs);color:var(--c)}
.cchip{display:inline-flex;align-items:center;gap:.2rem;padding:.12rem .55rem;border-radius:999px;font-size:.78rem;line-height:1.5;border:1px solid var(--c);color:var(--c)}

/* 路線（紀錄點時間軸） */
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1rem}
.stop{position:relative;display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:.7rem;align-items:start}
.stop::before{content:"";position:absolute;left:1.3rem;top:2.6rem;bottom:-1rem;border-left:2px dashed var(--accent);transform:translateX(-1px)}
.stop:last-child::before{display:none}
.wp{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:.7rem;background:var(--marker);color:var(--on-marker);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.wp.sm{display:inline-grid;width:1.9rem;height:1.9rem;font-size:.78rem;border-radius:.5rem}
.stopcard{display:flex;flex-direction:column;gap:.55rem;width:100%;padding:.8rem;border:1px solid var(--rule);border-radius:1rem;background:var(--surface);text-align:left}
button.stopcard:active{background:var(--sunk)}
.st-time{font-size:.82rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.st-photos{display:grid;gap:.35rem;grid-template-columns:repeat(3,minmax(0,1fr))}
.st-photos.n1{grid-template-columns:minmax(0,1fr)}
.st-photos.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.st-photos img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:.55rem;background:var(--surface-2)}
.st-photos.n1 img{aspect-ratio:16/9}
.phbtn{display:block;width:100%;padding:0;border:none;background:none;border-radius:.55rem;overflow:hidden;cursor:zoom-in}
.st-note{font-size:.92rem;line-height:1.7;color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
div.stopcard .st-note{display:block;white-space:pre-wrap}

/* 紀錄點編輯 */
.pe-meta{margin:0;display:flex;align-items:center;gap:.5rem;font-size:.88rem;color:var(--ink-soft);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.block{display:flex;flex-direction:column;gap:.6rem}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:2.5rem}
.block-head h3{margin:0;font-size:1rem;font-weight:700}
.block-head h3 label{font-size:inherit;color:inherit}
.count{font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.slot{position:relative;aspect-ratio:1;max-width:100%;border-radius:.85rem;overflow:hidden;background:var(--surface-2)}
.slot .phbtn{height:100%;border-radius:0}
.slot img{display:block;width:100%;height:100%;object-fit:cover}
.slot.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;border:2px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:700;text-align:center;padding:.4rem;cursor:pointer;line-height:1.35}
.slot-x{position:absolute;top:.3rem;right:.3rem;display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;border:none;background:var(--scrim);color:var(--on-scrim)}
.seltopics{display:flex;flex-direction:column;gap:.6rem}
.seltopic{border:1px solid var(--rule);border-radius:1rem;background:var(--surface);padding:.6rem .7rem .75rem;display:flex;flex-direction:column;gap:.55rem}
.stp-head{display:flex;align-items:center;gap:.55rem}
.stp-label{flex:1;display:flex;flex-direction:column;min-width:0}
.stp-num{font-size:.72rem;color:var(--c);font-weight:700;letter-spacing:.04em}
.stp-title{font-size:.98rem;font-weight:700;line-height:1.4}
.conchips{display:flex;flex-wrap:wrap;gap:.4rem}
.concept{border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:.35rem .78rem;font-size:.86rem;line-height:1.4;min-height:2.3rem}
.concept[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.pickcta{display:flex;align-items:center;gap:.6rem;width:100%;min-height:3.5rem;padding:.8rem 1rem;border:2px dashed var(--accent);border-radius:1rem;background:var(--accent-soft);color:var(--accent);font-weight:700;text-align:left}
.addrow{display:flex;gap:.5rem}
.addrow input{flex:1;min-width:0}
.cchip.rm{padding-right:.15rem;font-size:.84rem}
.cchip.rm button{display:grid;place-items:center;width:1.75rem;height:1.75rem;border:none;background:none;color:inherit;border-radius:50%}
.flash{margin:0;padding:.7rem .85rem;border-radius:.8rem;background:var(--danger-soft);color:var(--danger);font-size:.88rem;font-weight:500}
.okbox{margin:0;padding:.7rem .85rem;border-radius:.8rem;background:var(--accent-soft);color:var(--accent);font-size:.88rem;font-weight:500}
.danger-zone{padding-top:.8rem;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:.6rem}

/* 考察題目 */
.qcards{display:flex;flex-direction:column;gap:.5rem}
.qcard{display:flex;align-items:center;gap:.8rem;width:100%;padding:.7rem .85rem;border:1px solid var(--rule);border-radius:.95rem;background:var(--surface);text-align:left;min-height:3.6rem}
.qcard:active{background:var(--sunk)}
.qc-code{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.12em;color:var(--accent);font-size:1.05rem}
.qc-main{flex:1;display:flex;flex-direction:column;min-width:0}
.qc-title{font-weight:700;font-size:.95rem;line-height:1.4}
.qc-sub{font-size:.78rem;color:var(--ink-soft)}
.pill-todo{flex:none;font-size:.75rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:var(--mid-soft);color:var(--mid);white-space:nowrap}
.score{flex:none;display:inline-flex;align-items:baseline;gap:.2rem;padding:.2rem .65rem;border-radius:999px;font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{font-size:1rem}
.score.good{background:var(--good-soft);color:var(--good)}
.score.mid{background:var(--mid-soft);color:var(--mid)}
.score.low{background:var(--low-soft);color:var(--low)}
.score.big{font-size:1rem;padding:.35rem .95rem}
.score.big b{font-size:1.55rem}
.codebox{display:flex;flex-direction:column;gap:.45rem}
#inCode{font-size:1.35rem;letter-spacing:.3em;font-variant-numeric:tabular-nums;text-align:center;font-weight:700}
.qhead{display:flex;flex-direction:column;gap:.45rem}
.scorebig{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;font-size:.84rem;color:var(--ink-soft)}
.qa{display:flex;flex-direction:column;gap:.6rem;padding:.9rem;border:1px solid var(--rule);border-radius:1rem;background:var(--surface)}
.qa-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:start}
.qa-no{display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--ink);color:var(--surface);font-size:.85rem;font-weight:700}
.qa-text{margin:0;font-weight:500;line-height:1.65}
.qa-marks{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;padding-top:.15rem}
.qa-ans{margin:0;padding:.65rem .8rem;border-radius:.75rem;background:var(--sunk);line-height:1.75;white-space:pre-wrap}
.qa-ans.none{color:var(--ink-faint)}
.qa-res{display:flex;flex-direction:column;gap:.4rem}
.qa-score{margin:0;font-size:.85rem;color:var(--ink-soft)}
.qa-score b{color:var(--ink);font-size:1rem}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
.pts li{display:flex;align-items:flex-start;gap:.45rem;font-size:.86rem;line-height:1.55}
.pt-mark{display:grid;place-items:center;width:1.35rem;height:1.35rem;border-radius:50%;flex:none;margin-top:.1rem}
.pts li.hit .pt-mark{background:var(--good-soft);color:var(--good)}
.pts li.miss .pt-mark{background:var(--low-soft);color:var(--low)}
.pts li.miss{color:var(--ink-soft)}
.pts li.key .pt-mark{background:var(--accent-soft);color:var(--accent)}

/* ── 本機儲存（IndexedDB）：未上載的紀錄先存在手機 ── */
const STORES = ["trips","points","photos","responses","meta","outbox"];
const mem = {}; STORES.forEach(s => { mem[s] = new Map(); });
let idb = null;
function openDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open("kaocha-shouji-formal", 1);
      r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath:"id"}); }); };
      r.onsuccess = () => { idb = r.result; res(true); };
      r.onerror = () => res(false);
      r.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
}
function req(store, mode, fn){
  return new Promise(res => {
    try {
      const t = idb.transaction(store, mode); const q = fn(t.objectStore(store));
      t.oncomplete = () => res(q && q.result);
      t.onerror = t.onabort = () => { if (mode === "readwrite") logErr("idb", store + " " + ((t.error && t.error.name) || "寫入失敗"), false); res(undefined); };
    } catch (e) { logErr("idb", store + " " + (e && e.name), false); res(undefined); }
  });
}
async function put(store, obj){ mem[store].set(obj.id, obj); if (idb) await req(store, "readwrite", s => s.put(obj)); }
async function del(store, id){ mem[store].delete(id); if (idb) await req(store, "readwrite", s => s.delete(id)); }
async function getOne(store, id){ if (mem[store].has(id)) return mem[store].get(id); if (!idb) return undefined; const v = await req(store, "readonly", s => s.get(id)); if (v) mem[store].set(id, v); return v; }
async function getAll(store){ if (!idb) return [...mem[store].values()]; const v = await req(store, "readonly", s => s.getAll()); (v || []).forEach(o => mem[store].set(o.id, o)); return v || []; }
async function clearStore(store){ mem[store].clear(); if (idb) await req(store, "readwrite", s => s.clear()); }

/* ── 伺服器 ── */
async function api(action, params = {}){
  const body = JSON.stringify(Object.assign({action, token: S.session ? S.session.token : ""}, params));
  const ctl = typeof AbortController === "function" ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 90000) : null;
  let data;
  try {
    const res = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body, signal: ctl ? ctl.signal : undefined});
    data = await res.json();
  } catch (e) {
    const err = new Error("未能連接伺服器，請檢查網絡後再試。"); err.net = true; throw err;
  } finally { if (timer) clearTimeout(timer); }
  if (!data || !data.ok) {
    const err = new Error((data && data.message) || "伺服器發生錯誤，請稍後再試。");
    err.code = (data && data.code) || "error";
    if (err.code === "auth" && S.session) authLost();
    throw err;
  }
  return data;
}

async function localURL(id, size){
  const key = id + "|" + size;
  if (urlCache.has(key)) return urlCache.get(key);
  if (!isStudent()) return null;
  const p = await getOne("photos", id);
  const data = p && (size === "l" ? p.full : (p.thumb || p.full));
  return data ? setURL(key, asBlob(data)) : null;
}
function hydrate(root){
  root.querySelectorAll("img[data-photo]").forEach(async img => {
    const id = img.dataset.photo, size = img.dataset.size || "s";
    const u = await localURL(id, size);
    if (u) { img.src = u; return; }
    if (size === "l") { const s = await localURL(id, "s"); if (s && !img.getAttribute("src")) img.src = s; }
    wantPhoto(id, size);
  });
}
function wantPhoto(id, size){
  const key = id + "|" + size;
  if (!S.session || want.has(key) || missing.has(key)) return;
  want.set(key, {id, size});
  clearTimeout(wantT); wantT = setTimeout(pumpPhotos, 50);
}
async function pumpPhotos(){
  if (pumping) return; pumping = true;
  try {
    while (want.size && S.session) {
      const size = want.values().next().value.size;
      const batch = [...want.values()].filter(w => w.size === size).slice(0, size === "l" ? 3 : 12);
      let res;
      try { res = await api("getPhotos", {ids: batch.map(w => w.id), size}); }
      catch (e) { want.clear(); break; }
      for (const w of batch) {
        const key = w.id + "|" + w.size; want.delete(key);
        const ph = res.photos && res.photos[w.id];
        if (!ph) { missing.add(key); continue; }
        const buf = b64ToBuf(ph.data);
        if (isStudent()) {
          const p = (await getOne("photos", w.id)) || {id: w.id, w: ph.w, h: ph.h, remote: true, thumb: null, full: null};
          if (w.size === "l") p.full = buf; else p.thumb = buf;
          await put("photos", p);
        }
        const u = setURL(key, asBlob(buf));
        document.querySelectorAll('img[data-photo="' + w.id + '"]').forEach(img => { if ((img.dataset.size || "s") === w.size || !img.getAttribute("src")) img.src = u; });
      }
    }
  } finally { pumping = false; }
}
async function dropPhoto(id){ if (!id) return; await del("photos", id); dropURLs(id); }

function loadImg(url){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("未能讀取圖片")); i.src = url; }); }
function freeCanvas(c){ if (c) { c.width = 0; c.height = 0; } }   // iPhone 限制 canvas 總記憶體，用完即刻釋放
async function drawJPEG(src, max, q){
  const w0 = src.naturalWidth || src.width, h0 = src.naturalHeight || src.height, s = Math.min(1, max / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  if (!g) { freeCanvas(c); throw new Error("canvas 無法使用（原圖 " + w0 + "×" + h0 + "）"); }
  g.drawImage(src, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
  if (!blob) { freeCanvas(c); throw new Error("壓縮失敗（原圖 " + w0 + "×" + h0 + "）"); }
  return {blob, w, h, c};
}
async function makePhoto(file){
  const url = URL.createObjectURL(file);
  let img = null, full = null, thumb = null;
  try {
    img = await loadImg(url);
    full = await drawJPEG(img, 1280, 0.8);
    img.src = ""; img = null;                    // 手機原相可達數千萬像素，縮細之後即刻放手
    thumb = await drawJPEG(full.c, 480, 0.72);   // 縮圖由已縮細嘅相再縮，唔再用原相
    return {id: uid(), full: await asBuf(full.blob), thumb: await asBuf(thumb.blob), w: full.w, h: full.h, remote: false};
  } finally {
    if (img) img.src = "";
    freeCanvas(full && full.c); freeCanvas(thumb && thumb.c);
    URL.revokeObjectURL(url);
  }
}
// 相片以 ArrayBuffer 存入 IndexedDB（部分 iPhone 版本存 Blob 之後會讀唔返）
const asBlob = x => (x instanceof Blob ? x : new Blob([x], {type: "image/jpeg"}));
async function asBuf(x){
  if (!x || x instanceof ArrayBuffer) return x || null;
  if (x.arrayBuffer) return await x.arrayBuffer();
  return await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(x); });
}
function bufToB64(buf){ const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBuf(b64){ const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }

/* ── 錯誤紀錄：送去伺服器「錯誤紀錄」工作表，方便查問題 ── */
const LOGQ = [];
const INAPP = /(FBAN|FBAV|Instagram|Line\/|MicroMessenger|WhatsApp|Snapchat|TikTok|musical_ly)/i.test(navigator.userAgent);
const STANDALONE = (() => { try { return !!(navigator.standalone || matchMedia("(display-mode: standalone)").matches); } catch (e) { return false; } })();
function logErr(kind, msg, persist = true){
  try {
    LOGQ.push({t: new Date().toISOString(), kind, msg: String(msg || "").slice(0, 300), route: S.route ? S.route.name : "", ua: navigator.userAgent.slice(0, 160), standalone: STANDALONE});
    while (LOGQ.length > 40) LOGQ.shift();
    if (persist) put("meta", {id: "logs", items: LOGQ.slice()});
  } catch (e) {}
}
window.addEventListener("error", e => logErr("error", (e.message || "") + " @" + String(e.filename || "").split("/").pop() + ":" + (e.lineno || "")));
window.addEventListener("unhandledrejection", e => { const r = e.reason; logErr("promise", r && (r.message || r.name) ? (r.name || "") + " " + (r.message || "") : String(r)); });
async function sendLogs(){
  if (!S.session || S.authLost || !LOGQ.length) return;
  const items = LOGQ.splice(0, 30);
  try { await api("clientLog", {items}); }
  catch (e) { if (e.net || e.code === "busy") LOGQ.unshift(...items); }   // 伺服器未更新就放棄
  put("meta", {id: "logs", items: LOGQ.slice()});
}
// 記低 app 係咪喺前景：下次開啟時，如果上次喺前景突然結束（閃退），就寫入錯誤紀錄
function markAlive(fg){ if (idb) put("meta", {id: "alive", fg, route: S.route ? S.route.name : "", photos: S.draft ? S.draft.photos.length : 0, t: Date.now()}); }

/* ── 返回鍵：Android 返回掣／iPhone 向右掃，會返上一頁，唔會成個 app 走咗 ── */
const ROOTS = new Set(["boot", "setup", "login", "trips", "admin"]);
let guard = false, dropPop = false, guardT = null;
function wantGuard(){ return !!S.viewer || !!S.sheet || !(ROOTS.has(S.route.name) || (S.route.name === "setpw" && S.route.must)); }
function guardSoon(){ clearTimeout(guardT); guardT = setTimeout(syncGuard, 0); }
function syncGuard(){
  const w = wantGuard();
  try {
    if (w && !guard) { history.pushState({kaocha: 1}, ""); guard = true; }
    else if (!w && guard) { guard = false; dropPop = true; history.back(); }
  } catch (e) {}
}
window.addEventListener("popstate", () => {
  if (dropPop) { dropPop = false; return; }
  guard = false;
  if (S.viewer) A.closeviewer();
  else if (S.sheet) A.closesheet();
  else if (!ROOTS.has(S.route.name)) inAppBack();
  guardSoon();
});
function inAppBack(){
  const n = S.route.name;
  if (n === "point") return A.leavepoint();
  if (n === "trip" || n === "newtrip") return go("trips");
  if (n === "register") return go("login");
  if (n === "setpw" && S.route.must) return;
  A.back();
}

let draftT = null;
function saveDraftSoon(ms = 300){
  clearTimeout(draftT);
  draftT = setTimeout(() => { if (S.draft && isStudent()) put("meta", {id: "draft", d: JSON.parse(JSON.stringify(S.draft))}); }, ms);
}
async function clearDraft(){ clearTimeout(draftT); S.draftRestored = false; await del("meta", "draft"); }
async function restoreDraft(){
  const dr = await getOne("meta", "draft");
  if (!dr || !dr.d) return false;
  if (!S.trips.some(t => t.id === dr.d.tripId)) { await del("meta", "draft"); return false; }
  S.draft = Object.assign(dr.d, {_busy: 0}); S.draftRestored = true;
  logErr("restore", "已恢復未儲存的紀錄點（相片 " + S.draft.photos.length + " 張）");
  return true;
}

function go(name, params = {}){ S.route = Object.assign({}, params, {name}); S.confirm = null; S.flash = null; S.menu = false; S.codeOpen = false; render(); try { window.scrollTo(0, 0); } catch (e) {} guardSoon(); markAlive(document.visibilityState !== "hidden"); }
function render(){
  const r = S.route; let html;
  switch (r.name) {
    case "setup": html = vSetup(); break;
    case "login": html = vLogin(); break;
    case "register": html = vRegister(); break;
    case "setpw": html = vSetPw(); break;
    case "trips": html = vTrips(); break;
    case "newtrip": html = vNewTrip(); break;
    case "trip": html = vTrip(r.id); break;
    case "point": html = vPoint(); break;
    case "answer": html = vAnswer(r.rid); break;
    case "admin": html = vAdmin(); break;
    case "astudent": html = vAStudent(r.sid); break;
    case "atrip": html = vATrip(r.sid, r.id); break;
    case "aresp": html = vAResp(r.rid); break;
    case "qset": html = vQset(r.id); break;
    case "qedit": html = vQEdit(); break;
    default: html = '<p class="loading">載入中……</p>';
  }
  const app = $("#app"); app.innerHTML = html; hydrate(app);
  if (r.name === "login") syncLoginMode();
}
function refresh(){ const y = window.scrollY; render(); try { window.scrollTo(0, y); } catch (e) {} if (S.sheet === "account") renderSheet(); }
let toastT; function toast(msg){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }
function flashIn(msg){ const el = $("[data-flash]"); if (el) { el.textContent = msg || ""; el.hidden = !msg; } }

function bar(title, o = {}){
  return '<header class="bar">' +
    (o.back ? '<button type="button" class="iconbtn" data-act="' + o.back + '" aria-label="返回">' + ICON.back + '</button>' : '') +

    (o.logout ? '<button type="button" class="iconbtn" data-act="tlogout" aria-label="登出">' + ICON.logout + '</button>' : '') +
    '</header>';
}
function syncChip(){
  const s = S.sync, n = s.pending;
  let cls = "", label;
  if (n && s.busy) { cls = "busy"; label = "上載中…"; }
  else if (n) { cls = "pending"; label = "未上載 " + n; }
  else if (s.busy && !s.pulled) { cls = "busy"; label = "同步中…"; }
  else label = ICON.user + esc(S.session ? S.session.name : "帳戶");
  return '<button type="button" class="syncchip ' + cls + '" data-act="account" data-sync aria-label="帳戶及同步狀態">' + label + '</button>';
}
function paintSync(){
  document.querySelectorAll("[data-sync]").forEach(el => { el.outerHTML = syncChip(); });
  if (S.sheet === "account") renderSheet();
}
function confirmBtn(key, label, sure){ const armed = S.confirm === key; return '<button type="button" class="btn ' + (armed ? 'btn-danger' : 'btn-dangerghost') + ' btn-block" data-act="confirm" data-key="' + esc(key) + '">' + (armed ? sure : label) + '</button>'; }
function stateHTML(c, key){
  if (c.err) return '<div class="empty"><p>' + esc(c.err) + '</p><button type="button" class="btn btn-ghost sm" data-act="tretry" data-key="' + esc(key) + '">再試一次</button></div>';
  return '<p class="loading">載入中……</p>';
}
function brandHTML(){ return '<div class="brand"><div class="trailmark" aria-hidden="true"><i></i><i></i><i></i></div><h1 class="appname">考察手記</h1><p class="appsub">旅遊與款待科　實地考察紀錄</p></div>'; }
function topicInfo(k){ return k.startsWith("c:") ? null : TOPIC.get(k); }
function topicChip(tp){ const b = tp.b || 0; return '<span class="tchip b' + b + '"><span class="dot"></span>' + esc(tp.t) + '</span>'; }
function conceptChip(c){ const i = c.k === "custom" ? null : topicInfo(c.k); return '<span class="cchip b' + (i ? i.b : 0) + '">' + esc(c.c) + '</span>'; }
function tripPoints(tid, points = S.points){ return points.filter(p => p.tripId === tid).sort((a, b) => a.seq - b.seq); }
function nextSeq(tid){ return tripPoints(tid).reduce((m, p) => Math.max(m, p.seq), 0) + 1; }
function tripStats(tid, points = S.points){ const pts = tripPoints(tid, points); const topics = new Map(); let photos = 0; pts.forEach(p => { p.topics.forEach(t => { if (!topics.has(t.k)) topics.set(t.k, t); }); photos += p.photos.length; }); return {pts, topics, photos}; }
function tripCover(t, points = S.points){ if (t.cover) return t.cover; for (const p of tripPoints(t.id, points)) if (p.photos.length) return p.photos[0]; return null; }
function scoreClass(s, t){ const r = t ? s / t : 0; return r >= .8 ? "good" : r >= .5 ? "mid" : "low"; }
function scorePill(s, t, big){ return '<span class="score ' + scoreClass(s, t) + (big ? " big" : "") + '"><b>' + s + '</b> / ' + t + '</span>'; }
function qTotal(q){ return q.questions.reduce((s, x) => s + (x.marks ?? x.points.length), 0); }
function sortTrips(list){ return [...list].sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || "").localeCompare(a.createdAt || "")); }

function tripCard(t, act, points, sid){
  const st = tripStats(t.id, points), cover = tripCover(t, points);
  return '<button type="button" class="tripcard" data-act="' + act + '" data-id="' + t.id + '"' + (sid ? ' data-sid="' + sid + '"' : '') + '>' +
    '<span class="tc-cover">' + (cover ? '<img data-photo="' + cover + '" alt="">' : ICON.img) + '</span>' +
    '<span class="tc-body"><span class="tc-date">' + fmtDate(t.date) + '</span>' +
    '<span class="tc-place">' + esc(t.place) + '</span>' +
    '<span class="tc-meta">' + st.pts.length + ' 個紀錄點 · ' + st.topics.size + ' 個課題 · ' + st.photos + ' 張相片</span></span></button>';
}
function photoTag(id, size, zoom){
  const img = '<img data-photo="' + id + '"' + (size === "l" ? ' data-size="l"' : '') + ' alt="">';
  return zoom ? '<button type="button" class="phbtn" data-act="viewphoto" data-id="' + id + '" aria-label="放大相片">' + img + '</button>' : img;
}
function stopHTML(p, readonly){

  const chips = p.topics.map(topicChip).join("") + p.concepts.map(conceptChip).join("");
  const inner = '<span class="st-time">' + fmtTime(p.time) + '</span>' + photos +
    (chips ? '<span class="chips">' + chips + '</span>' : '') + (p.note ? '<span class="st-note">' + esc(p.note) + '</span>' : '');
  return '<li class="stop"><span class="wp" aria-hidden="true">' + pad(p.seq) + '</span>' +
    (readonly ? '<div class="stopcard">' + inner + '</div>'
      : '<button type="button" class="stopcard" data-act="openpoint" data-id="' + p.id + '" aria-label="紀錄點 ' + pad(p.seq) + '，' + fmtTime(p.time) + '，按此檢視或修改">' + inner + '</button>') + '</li>';

function tripHeadHTML(t, st){

function respCards(rs, act){
  return rs.map(r => {
    const q = r.qset; if (!q) return "";
    const done = r.status === "submitted", answered = r.answers.filter(a => (a.text || "").trim()).length;
    return '<button type="button" class="qcard" data-act="' + act + '" data-id="' + r.id + '"><span class="qc-code">' + esc(q.code) + '</span>' +
      '<span class="qc-main"><span class="qc-title">' + esc(q.title) + '</span><span class="qc-sub">' + (done ? "已於 " + fmtStamp(r.submittedAt) + " 提交" : "已作答 " + answered + " / " + q.questions.length + " 題") + '</span></span>' +
      (done ? scorePill(r.score, r.total) : '<span class="pill-todo">未提交</span>') + '</button>';
  }).join("");

function resultHTML(q, res){
  return '<div class="qa-res"><p class="qa-score">得分 <b>' + res.score + '</b> / ' + res.total + '</p><ul class="pts">' +
    res.got.map((g, j) => '<li class="' + (g ? 'hit' : 'miss') + '"><span class="pt-mark" aria-hidden="true">' + (g ? ICON.check : ICON.x) + '</span>' +
      '<span>' + (q.points ? esc(q.points[j]) : "得分點 " + (j + 1)) + '<span class="vh">' + (g ? "（已取得）" : "（未取得）") + '</span></span></li>').join("") + '</ul></div>';

function answerBody(r, o){
  const q = r.qset, done = r.status === "submitted";
  const head = '<section class="qhead"><p class="eyebrow">題目編號 <b>' + esc(q.code) + '</b></p>' +
    '<h2 class="th-place">' + esc(q.title) + '</h2>' +
    '<p class="th-sum">' + (o.who ? esc(o.who) + "　·　" : "") + q.questions.length + ' 題　共 ' + qTotal(q) + ' 分' + (o.place ? "　·　" + esc(o.place) : "") + '</p>' +
    (done ? '<div class="scorebig">' + scorePill(r.score, r.total, true) + '<span>於 ' + fmtStamp(r.submittedAt) + ' 提交，系統已按參考答案自動評分</span></div>' : '') + '</section>';
  const body = q.questions.map((x, i) => {
    const a = r.answers[i] || {text:""}, txt = (a.text || "").trim();
    let main;
    if (done) main = '<p class="qa-ans' + (txt ? '' : ' none') + '">' + (txt ? esc(a.text) : "（未有作答）") + '</p>' + resultHTML(x, r.results[i]);
    else if (o.teacher) main = '<p class="qa-ans none">' + (txt ? esc(a.text) + "\n（作答中，尚未提交）" : "（尚未作答）") + '</p>' +
      (x.points ? '<ul class="pts">' + x.points.map(pt => '<li class="key"><span class="pt-mark" aria-hidden="true">' + ICON.check + '</span><span>' + esc(pt) + '</span></li>').join("") + '</ul>' : '');
    else main = '<label class="vh" for="ans' + i + '">第 ' + (i + 1) + ' 題答案</label><textarea id="ans' + i + '" data-ans="' + i + '" rows="4" maxlength="800" placeholder="在此輸入答案">' + esc(a.text) + '</textarea>';
    return '<section class="qa"><div class="qa-head"><span class="qa-no">' + (i + 1) + '</span><p class="qa-text">' + esc(x.text) + '</p><span class="qa-marks">' + x.marks + ' 分</span></div>' + main + '</section>';
  }).join("");
  return head + '<div class="qlist">' + body + '</div>';
}

/* ── 同步：本機先存，有網絡就逐項上載 ── */
let opSeq = 0, flushing = null, syncing = null;
async function enqueue(op, ref, delay = 800){
  const ops = await getAll("outbox");
  if (!ops.some(o => o.op === op && o.ref === ref && o.id !== S.sync.inflight)) {
    await put("outbox", {id: Date.now() * 1000 + (opSeq++ % 1000), op, ref, tries: 0});
    S.sync.pending = ops.length + 1; paintSync();
  }
  clearTimeout(S.sync.timer); S.sync.timer = setTimeout(() => { flush(); }, delay);
}
function flush(){ if (!flushing) flushing = doFlush().finally(() => { flushing = null; }); return flushing; }
async function doFlush(){
  if (!isStudent() || S.authLost) return;
  S.sync.busy = true; paintSync();
  try {
    for (;;) {
      if (!isStudent() || S.authLost) break;
      const ops = (await getAll("outbox")).sort((a, b) => a.id - b.id);
      S.sync.pending = ops.length;
      if (!ops.length) { S.sync.error = null; S.sync.offline = false; S.sync.last = Date.now(); break; }
      paintSync();
      const op = ops[0];
      let keep = false;
      S.sync.inflight = op.id;
      try { await runOp(op); S.sync.offline = false; }
      catch (e) {
        if (e.net || e.code === "busy" || e.code === "auth") { S.sync.offline = !!e.net; S.sync.error = e.net ? null : e.message; keep = true; }
        else {
          // 其他錯誤先再試幾次；仍然失敗就跳過，免得一項卡住後面全部
          op.tries = (op.tries || 0) + 1;
          logErr("sync", op.op + " 第" + op.tries + "次失敗：" + (e.code || e.name || "") + " " + e.message);
          if (op.tries < (e.code === "error" ? 5 : e.code ? 1 : 3)) { await put("outbox", op); S.sync.error = e.message; keep = true; }
          else {
            S.sync.note = e.message;
            const store = op.op === "trip" ? "trips" : op.op === "point" ? "points" : null;
            if (store) { const x = await getOne(store, op.ref); if (x) { x.rejected = true; await put(store, x); } }
          }
        }
      } finally { S.sync.inflight = null; }
      if (keep) break;
      await del("outbox", op.id);
    }
  } finally {
    S.sync.busy = false;
    S.sync.pending = (await getAll("outbox")).length;
    paintSync();
    sendLogs();
  }
}
async function markSynced(store, id){ const x = await getOne(store, id); if (x && !x.synced) { x.synced = true; delete x.rejected; await put(store, x); } }
async function runOp(op){
  if (op.op === "trip") { const t = await getOne("trips", op.ref); if (t) { await api("saveTrip", {trip: t}); await markSynced("trips", op.ref); } }
  else if (op.op === "tripdel") await api("deleteTrip", {id: op.ref});
  else if (op.op === "point") { const p = await getOne("points", op.ref); if (p) { await api("savePoint", {point: p}); await markSynced("points", op.ref); } }
  else if (op.op === "pointdel") await api("deletePoint", {id: op.ref});
  else if (op.op === "photo") {
    const ph = await getOne("photos", op.ref);
    if (ph && !ph.remote && ph.full) {
      const full = bufToB64(await asBuf(ph.full)), thumb = ph.thumb ? bufToB64(await asBuf(ph.thumb)) : "";
      await api("uploadPhoto", {id: ph.id, full, thumb, w: ph.w, h: ph.h});
      ph.remote = true; await put("photos", ph);
    }
  }
  else if (op.op === "answers") {
    const r = await getOne("responses", op.ref);
    if (r && r.status !== "submitted") await api("saveAnswers", {rid: r.id, answers: r.answers.map(a => a.text || "")});
  }
}
async function pull(){
  const d = await api("pull");
  if (!isStudent()) return;
  const pend = new Set((await getAll("outbox")).map(o => o.ref));
  Object.assign(S.session, {name: d.me.name, cls: d.me.cls, no: d.me.no}); await put("meta", S.session);
  const sTrips = new Set(d.trips.map(t => t.id)), sPoints = new Set(d.points.map(p => p.id)), sResp = new Set(d.responses.map(r => r.id));
  // 只刪除「曾經上載、而家伺服器冇」嘅紀錄（即係喺其他手機刪咗）；未上載過嘅一定保留
  for (const t of await getAll("trips")) if (!sTrips.has(t.id) && !pend.has(t.id) && t.synced) await del("trips", t.id);
  for (const t of d.trips) if (!pend.has(t.id)) await put("trips", Object.assign(t, {synced: true}));
  for (const p of await getAll("points")) if (!sPoints.has(p.id) && !pend.has(p.id) && p.synced) await del("points", p.id);
  for (const p of d.points) if (!pend.has(p.id)) await put("points", Object.assign(p, {synced: true}));
  const local = new Map((await getAll("photos")).map(p => [p.id, p]));
  for (const m of d.photos) {
    const p = local.get(m.id);
    if (!p) await put("photos", {id: m.id, w: m.w, h: m.h, remote: true, thumb: null, full: null});
    else if (!p.remote) { p.remote = true; await put("photos", p); }
  }
  for (const r of await getAll("responses")) if (!sResp.has(r.id) && !pend.has(r.id)) await del("responses", r.id);
  for (const r of d.responses) {
    if (pend.has(r.id) && r.status !== "submitted") { const loc = await getOne("responses", r.id); if (loc) r.answers = loc.answers; }
    await put("responses", r);
  }
  await gcPhotos();
  await loadLocal();
  await reconcile();
}
// 補回漏咗排隊嘅紀錄（例如撳完儲存即刻閃退）
async function reconcile(){
  const has = new Set((await getAll("outbox")).map(o => o.op + ":" + o.ref));
  const photos = new Map((await getAll("photos")).map(p => [p.id, p]));
  const needPhoto = id => { const p = photos.get(id); return p && !p.remote && p.full && !has.has("photo:" + id); };
  let n = 0;
  for (const t of await getAll("trips")) {
    if (!t.synced && !t.rejected && !has.has("trip:" + t.id)) { await enqueue("trip", t.id); n++; }
    if (t.cover && needPhoto(t.cover)) { await enqueue("photo", t.cover); n++; }
  }
  for (const p of await getAll("points")) {
    for (const id of p.photos) if (needPhoto(id)) { await enqueue("photo", id); n++; }
    if (!p.synced && !p.rejected && !has.has("point:" + p.id)) { await enqueue("point", p.id); n++; }
  }
  if (n) logErr("reconcile", "補回 " + n + " 項未上載的紀錄");
}
async function gcPhotos(){
  const keep = new Set();
  (await getAll("trips")).forEach(t => { if (t.cover) keep.add(t.cover); });
  (await getAll("points")).forEach(p => p.photos.forEach(id => keep.add(id)));
  (await getAll("outbox")).forEach(o => { if (o.op === "photo") keep.add(o.ref); });
  if (S.draft) S.draft.photos.forEach(id => keep.add(id));
  const dr = await getOne("meta", "draft"); if (dr && dr.d) dr.d.photos.forEach(id => keep.add(id));
  for (const p of await getAll("photos")) if (!keep.has(p.id)) await dropPhoto(p.id);
}
function syncNow(){
  if (!syncing) syncing = (async () => {
    try {
      await flush();
      if (!isStudent() || S.authLost) return;
      S.sync.busy = true; paintSync();
      await pull();
      S.sync.pulled = true; S.sync.lastPull = Date.now(); S.sync.offline = false;
    } catch (e) { if (e.net) S.sync.offline = true; else { S.sync.error = e.message; logErr("pull", (e.code || e.name || "") + " " + e.message); } }
    finally {
      S.sync.busy = false; syncing = null; paintSync();
      if (isStudent() && (S.route.name === "trips" || (S.route.name === "trip" && !S.codeOpen && !S.menu))) refresh();
    }
  })();
  return syncing;
}
async function loadLocal(){
  S.trips = await getAll("trips"); S.points = await getAll("points"); S.responses = await getAll("responses");
  S.sync.pending = (await getAll("outbox")).length;
}
async function wipeLocal(){
  for (const s of ["trips","points","photos","responses","outbox"]) await clearStore(s);
  await del("meta", "draft");
  resetPhotoCache();
  S.trips = []; S.points = []; S.responses = []; S.draft = null;
  Object.assign(S.sync, {pending: 0, error: null, note: null, offline: false, last: 0, lastPull: 0, pulled: false});
}
async function startSession(d){
  const me = d.me;
  resetPhotoCache();
  if (me.role === "student") {
    const owner = await getOne("meta", "owner");
    if (owner && owner.sid !== me.sid) await wipeLocal();
    await put("meta", {id: "owner", sid: me.sid, name: me.name});
  }
  S.session = {id: "session", token: d.token, role: me.role, sid: me.sid || "", cls: me.cls || "", no: me.no || "", name: me.name || "", mustChange: !!d.mustChange};
  S.authLost = false; S.t = {};
  await put("meta", S.session);
  if (me.role === "teacher") return go("admin", {tab: "students"});
  await loadLocal();
  if (d.mustChange) go("setpw", {must: true});

function isDirty(d){ return JSON.stringify([d.photos, d.topics, d.concepts, (d.note || "").trim()]) !== d._orig; }
async function purgeLocalTrip(tid){
  const t = S.trips.find(x => x.id === tid);
  for (const p of tripPoints(tid)) { for (const id of p.photos) await dropPhoto(id); await del("points", p.id); }
  for (const r of S.responses.filter(x => x.tripId === tid)) await del("responses", r.id);
  if (t && t.cover) await dropPhoto(t.cover);
  await del("trips", tid);
  S.points = S.points.filter(p => p.tripId !== tid); S.responses = S.responses.filter(r => r.tripId !== tid); S.trips = S.trips.filter(x => x.id !== tid);
}

}

      r.answers[+t.dataset.ans].text = t.value;
      clearTimeout(ansT); ansT = setTimeout(async () => {
        const cur = S.responses.find(x => x.id === r.id);

      }, 600);
    }
  }
});

  if (e.key === "Escape") { if (S.viewer) A.closeviewer(); else if (S.sheet) A.closesheet(); }
  if ((e.key === "Enter" || e.key === " ") && t.tagName === "LABEL" && t.htmlFor && t.getAttribute("role") === "button") { e.preventDefault(); const f = document.getElementById(t.htmlFor); if (f) f.click(); }
});

    const lg = await getOne("meta", "logs"); if (lg && lg.items) LOGQ.push(...lg.items.slice(-40));
    const alive = await getOne("meta", "alive");
    if (alive && alive.fg) logErr("crash", "上次在「" + (alive.route || "") + "」畫面時突然結束" + (alive.photos ? "（編輯中相片 " + alive.photos + " 張）" : ""));
    const sess = await getOne("meta", "session");
    if (sess && sess.token) {
      S.session = sess;
      if (sess.role === "teacher") { go("admin", {tab: "students"}); sendLogs(); return; }
      await loadLocal();
      if (sess.mustChange) go("setpw", {must: true});
      else if (await restoreDraft()) go("point");
      else go("trips");
      syncNow();
      return;
    }
  } catch (e) { logErr("boot", e && e.message); }
  go("login");
})();
</script>
</body>
</html>
