<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EA">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的旅遊手帳">
<title>我的旅遊手帳</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+HK:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ═══ 考察手記 · 旅行手帳風格 ═══ */
:root{
  --paper:#F3F1EA; --paper-2:#E8E4D9; --sheet:#FFFFFF; --sunk:#ECE9E1; --frame:#FFFFFF;
  --ink:#1C2840; --ink-2:#4A5467; --ink-3:#8A8F99; --rule:#D8D2C4; --dot:#D2CCBD;
  --navy:#1B2A45; --navy-2:#111C31; --on-navy:#F3F1EA; --gold:#C9A659; --gold-line:rgba(201,166,89,.45);
  --stamp:#BE3A2C; --stamp-soft:rgba(190,58,44,.08);
  --green:#2E7A4E; --ochre:#976810;
  --hl:#FBE38C;
  --btn:#1B2A45; --on-btn:#F3F1EA; --btn-press:#0B1424;
  --tape0:rgba(150,146,134,.38); --tape1:rgba(88,166,190,.42); --tape2:rgba(196,118,168,.40); --tape3:rgba(222,168,70,.48); --tape4:rgba(120,142,216,.42); --tape5:rgba(96,168,120,.42);
  --b0:#5A6170; --b1:#1D6C84; --b2:#88467A; --b3:#8A5E0E; --b4:#3C57A5; --b5:#2F6B4A;
  --shadow:0 1px 1px rgba(28,40,64,.07),0 3px 10px rgba(28,40,64,.08);
  --scrim:rgba(17,24,38,.52);
  --f-hand:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB",serif;
  --f-ui:"Noto Sans HK","PingFang HK","Hiragino Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --zig:polygon(0 8%,3% 0,97% 6%,100% 0,98% 50%,100% 100%,96% 94%,4% 100%,0 92%,2% 50%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#13161C; --paper-2:#1B1F27; --sheet:#1E232B; --sunk:#181C23; --frame:#E6E1D5;
    --ink:#ECE6D8; --ink-2:#B8B2A5; --ink-3:#7E7A71; --rule:#2F3540; --dot:#262B34;
    --navy:#0D1525; --navy-2:#060B15; --on-navy:#ECE6D8; --gold:#D9B96E; --gold-line:rgba(217,185,110,.4);
    --stamp:#EE7A6B; --stamp-soft:rgba(238,122,107,.12);
    --green:#7ACB97; --ochre:#E2B45C;
    --hl:rgba(251,227,140,.22);
    --btn:#D9B96E; --on-btn:#15181E; --btn-press:#7E6734;
    --tape0:rgba(150,146,134,.28); --tape1:rgba(88,166,190,.32); --tape2:rgba(196,118,168,.30); --tape3:rgba(222,168,70,.32); --tape4:rgba(120,142,216,.32); --tape5:rgba(96,168,120,.30);
    --b0:#A9A59B; --b1:#79C1D6; --b2:#D69AC6; --b3:#E1B35E; --b4:#9FB2EA; --b5:#8DCCA5;
    --shadow:0 1px 2px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#13161C; --paper-2:#1B1F27; --sheet:#1E232B; --sunk:#181C23; --frame:#E6E1D5;
  --ink:#ECE6D8; --ink-2:#B8B2A5; --ink-3:#7E7A71; --rule:#2F3540; --dot:#262B34;
  --navy:#0D1525; --navy-2:#060B15; --on-navy:#ECE6D8; --gold:#D9B96E; --gold-line:rgba(217,185,110,.4);
  --stamp:#EE7A6B; --stamp-soft:rgba(238,122,107,.12);
  --green:#7ACB97; --ochre:#E2B45C;
  --hl:rgba(251,227,140,.22);
  --btn:#D9B96E; --on-btn:#15181E; --btn-press:#7E6734;
  --tape0:rgba(150,146,134,.28); --tape1:rgba(88,166,190,.32); --tape2:rgba(196,118,168,.30); --tape3:rgba(222,168,70,.32); --tape4:rgba(120,142,216,.32); --tape5:rgba(96,168,120,.30);
  --b0:#A9A59B; --b1:#79C1D6; --b2:#D69AC6; --b3:#E1B35E; --b4:#9FB2EA; --b5:#8DCCA5;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.62);
}

*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-inline:1rem;padding-top:env(safe-area-inset-top,0px);
  background-color:var(--paper);background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.3px);background-size:22px 22px}
html.locked,html.locked body{overflow:hidden}
#app{max-width:28rem;margin-inline:auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* 頂欄 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:.4rem;min-height:3.6rem;margin-inline:-1rem;padding-inline:1rem;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.bar h1{flex:1;margin:0;font:700 1.22rem/1.3 var(--f-hand);letter-spacing:.04em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1.plain{font:700 1.08rem/1.3 var(--f-ui);letter-spacing:.02em}
.bar>.iconbtn:first-child{margin-left:-.6rem}
.iconbtn{display:inline-grid;place-items:center;width:2.75rem;height:2.75rem;border:none;border-radius:50%;background:transparent;color:var(--ink)}
.iconbtn:active{background:var(--paper-2)}
.iconbtn.sm{width:2.2rem;height:2.2rem;color:var(--ink-2)}
/* 同步狀態：行李牌 */
.syncchip{position:relative;display:inline-flex;align-items:center;gap:.3rem;max-width:9.5rem;min-height:2.1rem;padding:.2rem .7rem .2rem 1.35rem;border:1.5px solid var(--ink-2);border-radius:.3rem .95rem .95rem .3rem;background:var(--sheet);color:var(--ink);font:700 .78rem var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncchip::before{content:"";position:absolute;left:.5rem;top:50%;width:.42rem;height:.42rem;border-radius:50%;border:1.5px solid var(--ink-2);background:var(--paper);transform:translateY(-50%)}
.syncchip svg{display:none}
.syncchip.pending{border-color:var(--stamp);color:var(--stamp)}
.syncchip.pending::before{border-color:var(--stamp);background:var(--stamp)}
.syncchip.busy{border-color:var(--ink-3);color:var(--ink-2)}
.syncchip.bad{border-color:var(--stamp);color:var(--stamp);border-style:dashed}

/* 版面 */
.view{display:flex;flex-direction:column;gap:1.35rem;padding-block:1.2rem 8rem}
.stack{display:flex;flex-direction:column;gap:1.25rem}
.field{display:flex;flex-direction:column;gap:.25rem}
.field.hide{display:none}
label,.label{font:700 .8rem var(--f-ui);letter-spacing:.08em;color:var(--ink-2)}
input:not([type=file]):not([type=checkbox]):not([type=radio]){width:100%;min-height:2.9rem;padding:.5rem .1rem;border:0;border-bottom:1.5px solid var(--ink-3);border-radius:0;background:transparent;font:500 1.08rem var(--f-ui);color:var(--ink)}
input:not([type=file]):not([type=checkbox]):not([type=radio]):focus{outline:none;border-bottom-color:var(--ink);box-shadow:inset 0 -1.5px 0 var(--ink)}
textarea{--lh:1.95rem;width:100%;min-height:calc(var(--lh) * 3 + 1rem);padding:.5rem .7rem;border:1.5px solid var(--rule);border-radius:.35rem;resize:vertical;font:400 1.02rem/var(--lh) var(--f-ui);color:var(--ink);
  background:var(--sheet) repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh));background-position:0 .5rem;background-attachment:local}
textarea:focus{outline:none;border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.hint{margin:0;font-size:.8rem;color:var(--ink-3);line-height:1.6}
.fineprint{margin:0;font-size:.8rem;color:var(--ink-2);line-height:1.65}
.eyebrow{margin:0;font:500 .72rem var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.eyebrow b{font:500 .95rem var(--f-mono);letter-spacing:.16em;color:var(--ink)}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3.2rem;padding:0 1.3rem;border:0;border-radius:.5rem;font:700 1.02rem var(--f-ui);letter-spacing:.08em}
.btn.sm{min-height:2.5rem;padding:0 .9rem;font-size:.88rem;border-radius:.4rem;letter-spacing:.04em}
.btn-primary{background:var(--btn);color:var(--on-btn);box-shadow:0 3px 0 var(--btn-press)}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-press)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-ghost:active{background:var(--paper-2)}
.btn-dangerghost{background:transparent;color:var(--stamp);border:1.5px dashed var(--stamp)}
.btn-danger{background:var(--stamp);color:#FFFFFF}
.btn-block{width:100%}
.btnrow{display:flex;gap:.5rem;flex-wrap:wrap}
.linkbtn{display:inline-flex;align-items:center;gap:.25rem;border:none;background:none;color:var(--ink);font:700 .9rem var(--f-ui);padding:.4rem .1rem;min-height:2.6rem;text-align:left;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.28em;text-decoration-color:var(--gold)}
.linkbtn svg{color:var(--ink-2)}
.linkbtn.danger{color:var(--stamp);text-decoration-color:var(--stamp)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;padding:1.6rem 1rem calc(.9rem + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 62%,transparent);pointer-events:none}
.dock>*{pointer-events:auto;width:100%;max-width:28rem}

/* 登入：護照封面 */
.login{display:flex;flex-direction:column;gap:1.5rem;padding-bottom:3rem}
/* 登入：封面圖（中間空白位放註冊／登入） */
.cover-page{margin-inline:-1rem;padding-bottom:2.5rem}
.cover-wrap{position:relative;aspect-ratio:768/1376;background:#F8F3E8}
.cover-wrap>img{display:block;width:100%;height:100%;object-fit:cover}
.cover-login{position:absolute;left:30.5%;width:45%;top:75%;height:17.5%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;text-align:center}
.cl-title{margin:0;font:700 clamp(1rem,5.2vw,1.4rem)/1.2 var(--f-hand);letter-spacing:.12em;padding-left:.12em;color:#5B3A24}
.cover-login .gbtn{min-height:40px;align-items:center}
.cover-login .gbtn .loading{margin:0;font-size:.78rem}
.cover-login .linkbtn{min-height:1.9rem;padding:.1rem;font-size:.8rem;color:#5B3A24;text-decoration-color:#C9A659}
.cl-row{display:flex;gap:.35rem;width:100%}
#inLc{flex:1;min-width:0;min-height:2.5rem;padding:.3rem .45rem;border:2px solid #C9A21E;border-radius:.4rem;background:#FBE07A;color:#111;font:600 1rem var(--f-mono);text-align:center}   /* 登入碼＝黃色方格 */
.cl-row .btn{flex:none;min-height:2.5rem;padding:0 .7rem}
.cover-alert{position:absolute;top:1.5%;left:4%;right:4%;z-index:2;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.cover-alert .flash{width:100%;background:rgba(255,250,244,.97);box-shadow:var(--shadow)}
.cover-alert .btn{background:rgba(255,250,244,.97)}
.cover-help{margin:.9rem 1rem 0;font-size:.8rem;line-height:1.7;color:var(--ink-2)}
.cover-fallback{display:none}
.cover-wrap.noimg{aspect-ratio:auto;padding:2rem 1rem}
.cover-wrap.noimg>img{display:none}
.cover-wrap.noimg .cover-fallback{display:block;margin:0 0 1.2rem;text-align:center;font:700 2rem var(--f-hand);color:#5B3A24}
.cover-wrap.noimg .cover-login,.cover-wrap.noimg .cover-alert{position:static;width:auto;height:auto;margin-bottom:1rem}
.passport{position:relative;display:flex;flex-direction:column;align-items:center;gap:.55rem;margin:0 -1rem;padding:2.4rem 1.5rem 2.3rem;background:var(--navy);color:var(--gold);border-radius:0 0 1.6rem 1.6rem;text-align:center;overflow:hidden}
.passport::after{content:"";position:absolute;inset:.7rem .7rem .8rem;border:1px solid var(--gold-line);border-top:0;border-radius:0 0 1.1rem 1.1rem;pointer-events:none}
.pp-top{margin:0;font:500 .74rem var(--f-ui);letter-spacing:.42em;padding-left:.42em}
.pp-emblem{width:68px;height:68px;margin:.5rem 0 .2rem}
.pp-title{margin:0;font:700 2.75rem/1.1 var(--f-hand);letter-spacing:.16em;padding-left:.16em}
.pp-pre{display:block;margin-bottom:.35rem;font:700 1.3rem/1.3 var(--f-hand);letter-spacing:.22em;padding-left:.22em}
.pp-sub{margin:0;font:500 .7rem var(--f-mono);letter-spacing:.55em;padding-left:.55em;opacity:.85}
.panel{background:var(--sheet);border-radius:.8rem;padding:1.4rem 1.25rem 1.2rem;box-shadow:var(--shadow)}
.quick{display:flex;flex-direction:column;gap:.2rem;padding-top:.7rem;border-top:1.5px dashed var(--rule)}
.gbtn{display:flex;justify-content:center;min-height:44px}
.gmail{margin:0;padding:.6rem .8rem;border-radius:.4rem;background:var(--sunk);font:500 .9rem var(--f-ui);color:var(--ink);word-break:break-all}
.rowfields{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* 考察列表：車飛 */
.hello{margin:0;display:flex;align-items:baseline;gap:.6rem;font:700 1.02rem var(--f-ui);color:var(--ink)}
.hello::before{content:"考察員";font:500 .7rem var(--f-mono);letter-spacing:.2em;color:var(--ink-3)}
.triplist{display:flex;flex-direction:column;gap:1.1rem}
.ticket{--stub:6.3rem;position:relative;display:grid;grid-template-columns:var(--stub) minmax(0,1fr);width:100%;min-height:6.8rem;padding:0;border:0;border-radius:.7rem;background:var(--sheet);box-shadow:var(--shadow);text-align:left;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;left:calc(var(--stub) - .6rem);width:1.2rem;height:1.2rem;border-radius:50%;background:var(--paper);z-index:2}
.ticket::before{top:-.6rem}
.ticket::after{bottom:-.6rem}
.ticket:active{transform:translateY(1px)}
.tk-stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;padding:.6rem .3rem;background:var(--navy);color:var(--gold);overflow:hidden}
.tk-stub img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tk-stub.photo{color:#FFFFFF}
.tk-stub.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,16,30,.78),rgba(10,16,30,.28))}
.tk-stub>span{position:relative;z-index:1}
.tk-day{font:500 2.15rem/1 var(--f-mono)}
.tk-mon{font:500 .7rem var(--f-mono);letter-spacing:.14em}
.tk-wd{font:500 .72rem var(--f-ui);opacity:.9}
.tk-main{display:flex;flex-direction:column;justify-content:center;gap:.25rem;padding:.85rem 1rem .85rem 1.25rem;border-left:2px dashed var(--rule)}
.tk-label{font:500 .64rem var(--f-mono);letter-spacing:.22em;color:var(--ink-3)}
.tk-place{font:700 1.32rem/1.3 var(--f-hand);color:var(--ink)}
.tk-meta{font:400 .74rem var(--f-mono);letter-spacing:.02em;color:var(--ink-2)}
.empty{padding:1.3rem 1.2rem;border:1.5px dashed var(--ink-3);border-radius:.4rem;color:var(--ink-2);font:400 1.02rem/1.75 var(--f-hand);display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.empty p{margin:0}

/* 新增考察 */
.suggest{display:flex;gap:.45rem;overflow-x:auto;margin-inline:-1rem;padding:.3rem 1rem .4rem;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.sugg{flex:none;border:1.5px solid var(--ink-3);background:var(--sheet);border-radius:.3rem;padding:.4rem .75rem;font:500 .86rem var(--f-ui);white-space:nowrap}
.sugg:active{background:var(--hl)}

/* 封面：即影即有＋紙膠帶 */
.cover{position:relative;display:block;width:92%;max-width:100%;margin:.9rem auto .2rem;padding:.55rem .55rem 2.3rem;background:var(--frame);border-radius:.15rem;box-shadow:0 1px 2px rgba(0,0,0,.12),0 10px 24px rgba(28,40,64,.14);transform:rotate(-1.4deg)}
.cover img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--paper-2)}
.cover .phbtn{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.cover::before,.cover::after{content:"";position:absolute;top:-.75rem;width:5.2rem;height:1.55rem;clip-path:var(--zig);z-index:1}
.cover::before{left:10%;background:var(--tape3);transform:rotate(-7deg)}
.cover::after{right:9%;background:var(--tape1);transform:rotate(6deg)}
.cover-cap{position:absolute;left:0;right:0;bottom:.5rem;text-align:center;font:700 1.02rem var(--f-hand);color:#2A2E36;letter-spacing:.05em}
.cover-btn{position:absolute;right:1rem;bottom:2.9rem;display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .75rem;border-radius:.3rem;background:rgba(17,24,38,.66);color:#FFFFFF;font:700 .78rem var(--f-ui);cursor:pointer}
.cover-blank{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;width:92%;max-width:100%;margin:.9rem auto .2rem;aspect-ratio:16/9;border:2px dashed var(--ink-3);border-radius:.2rem;background:var(--sunk);color:var(--ink-2);cursor:pointer;text-align:center;padding:1rem;transform:rotate(-1.2deg)}
.ce-title{font:700 1.12rem var(--f-hand);color:var(--ink)}
.ce-sub{font:400 .8rem var(--f-ui);color:var(--ink-3)}

/* 考察頁：標題＋日期印章 */
.triphead{display:flex;flex-direction:column;gap:.55rem}
.scorestrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.scorestrip>div{display:flex;flex-direction:column;gap:.12rem;min-width:0;padding:.65rem .7rem .6rem;border-radius:.55rem;background:var(--sheet);box-shadow:var(--shadow)}
.scorestrip .k{font:700 .74rem var(--f-ui);letter-spacing:.12em;color:var(--ink-2)}
.scorestrip b{font:500 1.35rem/1.15 var(--f-mono);color:var(--ink);white-space:nowrap}
.scorestrip b small{margin-left:.1rem;font-size:.78rem;color:var(--ink-3)}
.scorestrip .sub{font:500 .7rem/1.3 var(--f-ui);color:var(--ink-3)}
.scorestrip>.total{background:var(--navy)}
.scorestrip>.total .k,.scorestrip>.total .sub,.scorestrip>.total b small{color:var(--gold)}
.scorestrip>.total b{color:var(--on-navy)}
.scoreedit{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.5rem .8rem;padding:.9rem 1rem;border-left:4px solid var(--gold);border-radius:.2rem;background:var(--sheet);box-shadow:var(--shadow)}
.scoreedit .field{flex:1 1 9rem}
.scoreedit .hint,.scoreedit .flash{flex-basis:100%}
.th-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem}
.th-place{margin:0;font:700 2.05rem/1.22 var(--f-hand);letter-spacing:.03em;text-wrap:balance}
.th-place.plain{font:700 1.7rem/1.3 var(--f-ui);letter-spacing:.02em}
.datestamp{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:5rem;height:5rem;margin-top:.1rem;border:2.5px solid var(--stamp);border-radius:50%;color:var(--stamp);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--stamp);transform:rotate(-13deg);opacity:.9;line-height:1.15;text-align:center}
.datestamp b{font:500 1.08rem var(--f-mono);letter-spacing:.02em}
.datestamp i{font:500 .6rem var(--f-mono);font-style:normal;letter-spacing:.2em}
.datestamp em{font:700 .66rem var(--f-ui);font-style:normal}
.th-date{margin:0;font:500 .8rem var(--f-mono);color:var(--ink-2)}
.th-purpose{margin:0;font:400 .95rem/1.7 var(--f-ui);color:var(--ink-2)}
.th-sum{margin:0;font:400 .8rem var(--f-mono);color:var(--ink-2);letter-spacing:.02em}
.th-sum b{font:500 1.05rem var(--f-mono);color:var(--ink)}
.covered{display:flex;flex-direction:column;gap:.45rem;margin-top:.2rem}
.covered .label{margin:0}
.menu{display:flex;flex-direction:column;gap:.5rem}

/* 分類色（紙膠帶） */
.b0{--c:var(--b0);--tape:var(--tape0)}
.b1{--c:var(--b1);--tape:var(--tape1)}
.b2{--c:var(--b2);--tape:var(--tape2)}
.b3{--c:var(--b3);--tape:var(--tape3)}
.b4{--c:var(--b4);--tape:var(--tape4)}
.b5{--c:var(--b5);--tape:var(--tape5)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem .35rem}
.dot{width:.5rem;height:.5rem;border-radius:50%;flex:none;background:var(--c)}
.tchip{display:inline-flex;align-items:center;padding:.18rem .75rem;font:500 .82rem/1.5 var(--f-ui);color:var(--ink);background:var(--tape);clip-path:var(--zig)}
.tchip .dot{display:none}
.cchip{display:inline-flex;align-items:center;gap:.2rem;padding:.08rem .5rem;border:1.2px solid var(--c);border-radius:.25rem;font:500 .76rem/1.5 var(--f-ui);color:var(--c)}

/* 路線：紀錄點 */
.route{list-style:none;margin:.2rem 0 0;padding:0;display:flex;flex-direction:column;gap:1.4rem}
.stop{position:relative;display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.85rem;align-items:start}
.stop::before{content:"";position:absolute;left:1.2rem;top:2.6rem;bottom:-1.4rem;border-left:2px dashed var(--ink-3);transform:translateX(-1px)}
.stop:last-child::before{display:none}
.wp{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--navy);color:var(--gold);font:500 .88rem var(--f-mono);box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--navy)}
.wp.sm{display:inline-grid;width:1.9rem;height:1.9rem;font-size:.74rem;box-shadow:none}
.stopcard{display:flex;flex-direction:column;gap:.65rem;width:100%;padding:.35rem .1rem 1rem;border:0;border-bottom:1.5px solid var(--rule);border-radius:0;background:transparent;text-align:left}
button.stopcard:active{background:var(--sunk)}
.st-time{font:500 .8rem var(--f-mono);letter-spacing:.08em;color:var(--ink-2)}
.st-photos{display:grid;gap:.7rem;grid-template-columns:repeat(3,minmax(0,1fr));padding:.25rem .2rem .2rem}
.st-photos.n1{grid-template-columns:minmax(0,1fr);padding-right:18%}
.st-photos.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pola{display:block;min-width:0;padding:.3rem .3rem 1rem;background:var(--frame);box-shadow:0 1px 2px rgba(0,0,0,.14),0 3px 8px rgba(28,40,64,.1);transform:rotate(var(--rot,0deg))}
.st-photos>.pola:nth-child(1){--rot:-2deg}
.st-photos>.pola:nth-child(2){--rot:1.6deg}
.st-photos>.pola:nth-child(3){--rot:-.8deg}
.st-photos img{display:block;width:100%;max-width:100%;aspect-ratio:1;object-fit:cover;background:var(--paper-2)}
.st-photos.n1 img{aspect-ratio:4/3}
.phbtn{display:block;width:100%;padding:0;border:none;background:none;cursor:zoom-in}
.ph-miss,.ph-fail{position:relative}
.ph-miss::after,.ph-fail::after{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:.5rem;text-align:center;font:500 .74rem/1.45 var(--f-ui);color:var(--ink-2);pointer-events:none}
.ph-miss::after{content:"相片未上載"}
.ph-fail::after{content:"未能載入相片"}
.st-note{font:400 .96rem/1.8 var(--f-ui);color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
div.stopcard .st-note{display:block;white-space:pre-wrap}

/* 紀錄點編輯 */
.pe-meta{margin:0;display:flex;align-items:center;gap:.55rem;font:500 .8rem var(--f-mono);color:var(--ink-2);flex-wrap:wrap;letter-spacing:.04em}
.block{display:flex;flex-direction:column;gap:.7rem}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:2.5rem}
.block-head h3{margin:0;font:700 1.18rem var(--f-hand);letter-spacing:.03em;padding:0 .15rem;background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%)}
.block-head h3 label{font:inherit;color:inherit;letter-spacing:inherit}
.count{font:500 .8rem var(--f-mono);color:var(--ink-2)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;padding:.3rem .2rem}
.slot{position:relative;aspect-ratio:.86;max-width:100%;padding:.3rem .3rem 1.1rem;background:var(--frame);box-shadow:0 1px 2px rgba(0,0,0,.14),0 3px 8px rgba(28,40,64,.1)}
.slot:nth-child(1){transform:rotate(-2deg)}
.slot:nth-child(2){transform:rotate(1.5deg)}
.slot:nth-child(3){transform:rotate(-1deg)}
.slot .phbtn{height:100%}
.slot img{display:block;width:100%;height:100%;object-fit:cover}
.slot.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.4rem;background:transparent;border:2px dashed var(--ink-3);box-shadow:none;transform:none;color:var(--ink-2);font:700 .78rem/1.35 var(--f-ui);text-align:center;cursor:pointer}
.slot-x{position:absolute;top:-.5rem;right:-.5rem;display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid var(--frame);background:var(--stamp);color:#FFFFFF}
.seltopics{display:flex;flex-direction:column;gap:1rem;padding-top:.3rem}
.seltopic{position:relative;display:flex;flex-direction:column;gap:.6rem;padding:1rem .85rem .85rem;background:var(--sheet);border-radius:.3rem;box-shadow:var(--shadow)}
.seltopic::before{content:"";position:absolute;top:-.5rem;left:.9rem;width:3.8rem;height:1.05rem;background:var(--tape);clip-path:var(--zig);transform:rotate(-4deg)}
.stp-head{display:flex;align-items:center;gap:.55rem}
.stp-head .dot{display:none}
.stp-label{flex:1;display:flex;flex-direction:column;min-width:0}
.stp-num{font:500 .68rem var(--f-mono);color:var(--c);letter-spacing:.14em}
.stp-title{font:700 1rem/1.45 var(--f-ui)}
.conchips{display:flex;flex-wrap:wrap;gap:.45rem}
.concept{border:1.5px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:.3rem;padding:.32rem .7rem;font:500 .86rem/1.4 var(--f-ui);min-height:2.3rem}
.concept[aria-pressed="true"]{background:var(--tape);border-color:var(--c);color:var(--ink);font-weight:700}
.pickcta{display:flex;align-items:center;gap:.6rem;width:100%;min-height:3.5rem;padding:.8rem 1rem;border:2px dashed var(--ink-3);border-radius:.35rem;background:transparent;color:var(--ink);font:700 1.02rem var(--f-hand);text-align:left}
.addrow{display:flex;gap:.6rem;align-items:flex-end}
.addrow input{flex:1;min-width:0}
.cchip.rm{padding-right:.1rem;font-size:.84rem}
.cchip.rm button{display:grid;place-items:center;width:1.7rem;height:1.7rem;border:none;background:none;color:inherit;border-radius:50%}
.flash{margin:0;padding:.65rem .85rem;border-left:3px solid var(--stamp);border-radius:.15rem;background:var(--stamp-soft);color:var(--stamp);font:500 .88rem/1.6 var(--f-ui)}
.okbox{margin:0;padding:.65rem .85rem;border-left:3px solid var(--gold);border-radius:.15rem;background:var(--hl);color:var(--ink);font:500 .88rem/1.6 var(--f-ui)}
.danger-zone{padding-top:1rem;border-top:1.5px dashed var(--rule);display:flex;flex-direction:column;gap:.7rem}

/* 課文配對 */
.btn-match{background:var(--hl);color:var(--ink);border:1.5px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn-match:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.mres{display:flex;flex-direction:column;gap:.3rem;padding:.8rem .95rem;border-left:3px solid var(--gold);border-radius:.2rem;background:var(--sheet);box-shadow:var(--shadow)}
.m-tag{margin:0;display:flex;align-items:center;gap:.35rem;font:500 .68rem var(--f-mono);letter-spacing:.16em;color:var(--ink-3)}
.m-tag svg{color:var(--gold)}
.m-topic{margin:0;font:700 .95rem/1.5 var(--f-ui);color:var(--ink)}
.m-text{margin:0;font:400 .95rem/1.75 var(--f-ui);color:var(--ink)}
.m-foot{display:flex;justify-content:flex-end}
.mmiss{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;padding:.75rem .9rem;border:1.5px dashed var(--rule);border-radius:.3rem;background:var(--paper)}
.mmiss p{margin:0;font:400 .88rem/1.65 var(--f-ui);color:var(--ink-2)}
.mmiss b{color:var(--ink)}
.stopcard .mres{padding:.55rem .75rem;background:var(--sunk);box-shadow:none}
.mres .chips{margin-top:.1rem}
.mcar{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.mtrack{display:flex;gap:.7rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:.2rem .15rem .5rem;margin:0 -.15rem;scrollbar-width:none}
.mtrack::-webkit-scrollbar{display:none}
.mtrack:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:.4rem}
.mcard{flex:0 0 86%;scroll-snap-align:start;display:flex;flex-direction:column;gap:.45rem;padding:.8rem .95rem .9rem;border-top:4px solid var(--c);border-radius:.3rem;background:var(--sheet);box-shadow:var(--shadow)}
.mcard:only-child{flex-basis:100%}
.m-top{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem}
.mcard .m-tag{margin:0;font:600 .72rem/1.45 var(--f-ui);letter-spacing:.03em;color:var(--c)}
.m-idx{flex:none;font:500 .72rem var(--f-mono);color:var(--ink-3)}
.m-concept{margin:0;font:700 1.18rem/1.4 var(--f-hand);color:var(--ink);text-wrap:balance}
.mcard .m-text{flex:1}
.clschip{display:inline-flex;align-items:baseline;gap:.35rem;padding:.2rem .65rem;border:1.5px solid var(--ink);border-radius:.3rem;background:var(--sheet);font:700 .92rem var(--f-ui);color:var(--ink)}
.clschip small{font:400 .72rem var(--f-ui);color:var(--ink-2)}
.meter{height:.5rem;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--gold)}
.regbox.open .meter i{background:var(--green)}
.m-apply{display:flex;flex-direction:column;gap:.15rem;padding:.55rem .7rem .3rem;border-left:3px solid var(--c);border-radius:.15rem;background:var(--hl)}
.m-apply-k{margin:0;font:700 .72rem var(--f-ui);letter-spacing:.08em;color:var(--ink-2)}
.m-apply-t{margin:0;font:400 1rem/1.75 var(--f-hand);color:var(--ink);user-select:text;-webkit-user-select:text}
.m-apply .linkbtn{align-self:flex-start;min-height:2.2rem;font-size:.8rem}
.m-add{align-self:flex-start;display:inline-flex;align-items:center;gap:.35rem;min-height:2.5rem;padding:0 .9rem;border:1.5px solid var(--c);border-radius:999px;background:transparent;color:var(--ink);font:600 .86rem var(--f-ui)}
.m-add svg{color:var(--c)}
.m-add[aria-pressed="true"]{background:var(--tape)}
.mnav{display:flex;align-items:center;justify-content:center;gap:.6rem}
.mdots{display:flex;gap:.45rem}
.mdots i{width:.5rem;height:.5rem;border-radius:50%;background:var(--rule)}
.mdots i.on{background:var(--ink);transform:scale(1.15)}
.iconbtn.flip svg{transform:scaleX(-1)}

/* 考察題目：作業簿 */
.qcards{display:flex;flex-direction:column;gap:.6rem}
.qcard{display:flex;align-items:center;gap:.85rem;width:100%;padding:.8rem .9rem;border:0;border-radius:.45rem;background:var(--sheet);box-shadow:var(--shadow);text-align:left;min-height:3.8rem}
.qcard:active{background:var(--sunk)}
.qc-code{flex:none;font:500 1.05rem var(--f-mono);letter-spacing:.14em;color:var(--ink);padding:.15rem .4rem;border:1.5px solid var(--ink);border-radius:.2rem}
.qc-main{flex:1;display:flex;flex-direction:column;min-width:0}
.qc-title{font:700 1.02rem/1.4 var(--f-hand)}
.qc-sub{font:400 .76rem var(--f-ui);color:var(--ink-2)}
.pill-todo{flex:none;font:700 .72rem var(--f-ui);padding:.12rem .5rem;border:1.5px dashed currentColor;border-radius:.25rem;color:var(--ochre);white-space:nowrap}
.score{flex:none;display:inline-flex;align-items:baseline;gap:.15rem;padding:.08rem .45rem;border:1.8px solid currentColor;border-radius:.3rem;font:500 .8rem var(--f-mono);white-space:nowrap;transform:rotate(-4deg)}
.score b{font:500 1.05rem var(--f-mono)}
.score.good{color:var(--green)}
.score.mid{color:var(--ochre)}
.score.low{color:var(--stamp)}
.score.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:5.6rem;height:5.6rem;padding:0;border:3px double currentColor;border-radius:50%;font-size:.8rem;line-height:1.1;transform:rotate(-11deg)}
.score.big::before{content:"得分";font:700 .62rem var(--f-ui);letter-spacing:.3em;padding-left:.3em}
.score.big b{font-size:1.9rem;line-height:1.05}
.codebox{display:flex;flex-direction:column;gap:.45rem;padding:.9rem;background:var(--sheet);border-radius:.45rem;box-shadow:var(--shadow)}
#inCode{font:500 1.5rem var(--f-mono);letter-spacing:.45em;text-align:center}
.qhead{display:flex;flex-direction:column;gap:.5rem}
.scorebig{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2);padding:.3rem 0}
.qlist{display:flex;flex-direction:column;gap:.9rem}
.qa{position:relative;display:flex;flex-direction:column;gap:.7rem;padding:1rem .95rem 1rem 1.55rem;background:var(--sheet);border-radius:.3rem;box-shadow:var(--shadow)}
.qa::before{content:"";position:absolute;left:.85rem;top:0;bottom:0;border-left:1.5px solid var(--stamp);opacity:.35}
.qa-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:start}
.qa-no{font:500 .9rem/1.8 var(--f-mono);color:var(--stamp)}
.qa-no::before{content:"Q"}
.qa-text{margin:0;font:500 1rem/1.75 var(--f-ui)}
.qa-marks{font:500 .76rem/1.9 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.qa-ans{--lh:1.95rem;margin:0;padding:.35rem .6rem;border-radius:.2rem;font:400 1rem/var(--lh) var(--f-ui);white-space:pre-wrap;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh));background-position:0 .35rem}
.qa-ans.none{color:var(--ink-3)}
.qa-res{display:flex;flex-direction:column;gap:.4rem}
.qa-score{margin:0;font:500 .82rem var(--f-mono);color:var(--ink-2)}
.qa-score b{font-size:1rem;color:var(--ink)}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35rem}
.pts li{display:flex;align-items:flex-start;gap:.5rem;font:400 .88rem/1.6 var(--f-ui)}
.pt-mark{display:grid;place-items:center;width:1.4rem;height:1.4rem;flex:none;margin-top:.05rem}
.pt-mark svg{width:1.2rem;height:1.2rem;stroke-width:3}
.pts li.hit .pt-mark{color:var(--green)}
.pts li.miss .pt-mark{color:var(--stamp)}
.pts li.miss{color:var(--ink-2)}
.pts li.key .pt-mark{color:var(--ink-2)}

/* 老師後台：點名簿 */
.adminhead{display:flex;flex-direction:column;gap:.35rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin-top:.35rem}
.stats span{display:flex;flex-direction:column;gap:.1rem;padding:.15rem 0 .15rem .6rem;border-left:2px solid var(--ink);font:500 .72rem/1.3 var(--f-ui);color:var(--ink-2)}
.stats b{font:500 1.45rem/1.1 var(--f-mono);color:var(--ink)}
.regbox{display:flex;flex-direction:column;gap:.5rem;padding:.9rem 1rem;border-left:4px solid var(--navy);border-radius:.2rem;background:var(--sheet);box-shadow:var(--shadow)}
.regbox.open{border-left-color:var(--green)}
.reg-status{margin:0;font:700 1.05rem var(--f-hand)}
.reg-sub{margin:0;font-size:.8rem;color:var(--ink-2);line-height:1.65}
.pwrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.pwval{font:500 1.35rem var(--f-mono);letter-spacing:.12em;user-select:all;-webkit-user-select:all;word-break:break-all}
.pill-off{flex:none;font:700 .72rem var(--f-ui);padding:.1rem .45rem;border:1.5px solid var(--ink-3);border-radius:.25rem;color:var(--ink-3);white-space:nowrap}
.seg{display:flex;gap:.35rem;padding:0 .2rem;border-bottom:1.5px solid var(--ink)}
.seg button{flex:1;margin-bottom:-1.5px;min-height:2.7rem;border:1.5px solid var(--ink);border-bottom:0;border-radius:.55rem .55rem 0 0;background:var(--paper-2);color:var(--ink-2);font:700 1rem var(--f-hand)}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);border-bottom:1.5px solid var(--paper)}
.slist{display:flex;flex-direction:column}
.grp{margin:1.1rem 0 0;padding:.2rem 0 .35rem;font:500 .74rem var(--f-mono);letter-spacing:.14em;color:var(--ink-2);border-bottom:1.5px solid var(--ink)}
.srow{display:flex;align-items:center;gap:.8rem;width:100%;min-height:3.7rem;padding:.65rem .15rem;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left}
.srow:active{background:var(--sunk)}
.avatar{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--navy);color:var(--gold);font:700 .95rem var(--f-ui);flex:none}
.srow.off .avatar{background:var(--paper-2);color:var(--ink-3);font:500 .7rem var(--f-mono)}
.sr-main{flex:1;display:flex;flex-direction:column;min-width:0}
.sr-name{font:700 .98rem var(--f-ui)}
.srow.off .sr-name{color:var(--ink-3)}
.sr-sub{font:400 .76rem var(--f-ui);color:var(--ink-2)}
.slist .qsrow+.qsrow{margin-top:.6rem}
.qsrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1rem 1rem;align-items:center;width:100%;padding:.85rem 1rem;border:0;border-radius:.5rem;background:var(--sheet);box-shadow:var(--shadow);text-align:left}
.qsrow:active{background:var(--sunk)}
.qs-code{grid-row:span 2;font:500 1.55rem var(--f-mono);letter-spacing:.14em;color:var(--ink)}
.qs-title{font:700 1.02rem/1.4 var(--f-hand)}
.qs-sub{font:400 .76rem var(--f-ui);color:var(--ink-2)}
.bigcode{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.3rem 1rem 1.2rem;border-radius:.8rem;background:var(--navy);color:var(--on-navy);text-align:center}
.bigcode .eyebrow{color:var(--gold)}
.bigcode .digits{margin:0;font:500 3.3rem/1.05 var(--f-mono);letter-spacing:.28em;padding-left:.28em;color:var(--gold);user-select:all;-webkit-user-select:all}
.bigcode .digits.sm{font-size:2.3rem}
.bigcode .hint{color:var(--on-navy);opacity:.75}
.bigcode .btn-ghost{color:var(--on-navy);border-color:var(--gold-line)}
.qlist .pts li.key .pt-mark{color:var(--gold)}
fieldset.qedit{position:relative;display:flex;flex-direction:column;gap:.9rem;min-width:0;margin:0;padding:1rem .95rem 1rem 1.55rem;border:0;border-radius:.3rem;background:var(--sheet);box-shadow:var(--shadow)}
fieldset.qedit::before{content:"";position:absolute;left:.85rem;top:0;bottom:0;border-left:1.5px solid var(--stamp);opacity:.35}
.pt-keys{display:block;margin-top:.1rem;font:500 .74rem/1.5 var(--f-mono);color:var(--ink-3)}
.ans-head{margin:.35rem 0 0;font:700 .8rem var(--f-ui);letter-spacing:.06em;color:var(--stamp)}
.pts.ans-red li,.pts.ans-red .pt-mark,.pts.ans-red .pt-keys{color:var(--stamp)}
.pts.ans-red .pt-keys{opacity:.8}
fieldset.modes{display:flex;flex-direction:column;gap:.35rem;margin:0;padding:0;border:0}
fieldset.modes legend{margin-bottom:.3rem;font:700 .9rem var(--f-ui)}
.pts-more{margin:.3rem 0 0;font:700 .74rem var(--f-ui);color:var(--ink-3)}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.catbtn{display:flex;align-items:center;gap:.5rem;min-height:2.9rem;padding:.4rem .7rem;border:1.5px solid var(--rule);border-radius:.45rem;background:var(--sheet);font:700 .86rem/1.35 var(--f-ui);color:var(--ink);text-align:left}
.catbtn b{flex:none;font:500 1rem var(--f-mono);color:var(--ink-3)}
.catbtn[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--on-navy)}
.catbtn[aria-pressed="true"] b{color:var(--gold)}
.qgcons{display:flex;flex-direction:column;gap:.45rem}
.qgcon{display:flex;flex-direction:column;border:1.5px solid var(--rule);border-radius:.45rem;background:var(--sheet)}
.qgcon.on{border-color:var(--navy);box-shadow:inset 4px 0 0 var(--gold)}
.qgcon-row{display:flex;align-items:stretch}
.qgcon-b{flex:1;display:flex;align-items:center;gap:.6rem;min-height:2.9rem;padding:.5rem .75rem;border:0;background:none;font:700 .9rem/1.45 var(--f-ui);color:var(--ink);text-align:left}

勵文化交流，減少負面理解和成見。"},{"t":"1-14","c":"空間承載力","k":["座位","泊車","停車場","車位","容量","容納","限額","名額","人數上限","限制人數","預約","分批","空間","停泊"],"s":"景點設施可容納的人流有限，例如泊車位、座位及場地空間，這是空間承載力；超出上限時，可增加設施或控制人流。"},{"t":"1-14","c":"環境承載力","k":["踐踏","破壞","草地","草原","沙灘","植被","侵蝕","荒地"],"s":"旅客過多會令環境受到嚴重破壞，例如大量單車和汽車經過草原，令草原變成荒地，生態無法自行復原，即超出環境承載力。"},{"t":"1-14","c":"經濟承載力","k":["店舖","舖位","租金","物價","藥房","金舖","找換店","紀念品店"],"s":"旅遊紀念品店舖增加，日常購物的店舖便會減少，影響本地社群的日常經濟活動，這是經濟承載力的例子。"},{"t":"1-14","c":"社會文化承載力","k":["傳統手工藝","手工藝","社區風貌","傳統市集","機械化","大量生產"],"s":"在旅客大量需求下，傳統手工藝可能被工廠式的機械化生產代替而逐漸流失；超出社會文化承載力會破壞社區原有的風貌。"},{"t":"1-1","c":"環境因素","k":["污染","空氣","霧霾","環境保護","可持續發展","綠色酒店","生態旅遊","氣候變化","全球暖化","暖化"],"s":"缺乏環境保護會阻礙旅遊業發展；現時全球重視環境保護及可持續發展，衍生了生態旅遊與綠色酒店等概念。"},{"t":"1-24","c":"非生物環境影響","k":["垃圾","污染","噪音","廢物","膠樽","膠袋","油污","廣告招牌","廢氣","塗鴉"],"s":"旅遊業會造成非生物環境影響，包括水質、空氣、土壤、噪音及視覺污染，例如不可生物降解的垃圾會導致土壤污染。"},{"t":"1-24","c":"生物環境影響","k":["花草","樹木","植物","採摘","野生動物","動物","雀鳥","鳥類","候鳥","昆蟲","蝴蝶","棲息地","生態"],"s":"旅客採集或踐踏花草樹木會改變植物品種組成；興建旅遊設施及道路亦可能令野生動物失去棲息地，改變其覓食及繁殖模式。"},{"t":"1-24","c":"","k":["保護區","自然公園","環保意識","環境教育"],"s":"旅遊業亦可為環境帶來正面影響，包括環境的保存及復原、環境的改善，以及加強環保意識。"},{"t":"1-1","c":"文化因素","k":["獨特文化","文化特色","本土文化","民俗","傳統習俗","宗教"],"s":"文化色彩獨特而濃烈的地方可推動旅遊發展；相反，若國民因宗教文化關係不喜歡受外地旅客影響，則會令旅客大減。"},{"t":"1-24","c":"文化商業化","k":["手工藝品","手作","表演","迎合旅客","大量生產","商業化","紀念品"],"s":"手工藝品可能因迎合旅客喜好而被大量生產，失去原有的文化意義；東道國亦可能為迎合旅客而改變傳統文化，這是文化商業化。"},{"t":"1-11","c":"生產與消費不可分割性","k":["導賞","表演","工作坊","現場","即場","服務"],"s":"旅遊產品的生產和消費同時進行，例如景點提供導賞服務時，旅客同時使用這些服務和設施，這是生產與消費不可分割性。"},{"t":"1-11","c":"無形性","k":["體驗","感受","回憶","經歷","氣氛","享受"],"s":"旅客購買旅遊產品，不會取得及擁有實物，只餘下對旅程的體驗和回憶，這是旅遊產品的無形性。"},{"t":"1-11","c":"差異性","k":["態度","服務質素","不同員工","親切","友善","有禮","禮貌","熱情","耐心","耐性"],"s":"即使企業規定服務標準，不同員工的經驗、性格及態度不同，提供的服務也不會完全相同，這是旅遊產品的差異性。"},{"t":"1-11","c":"需求與價格不固定","k":["旺季","淡季","假期","週末","周末","優惠","折扣","減價","天氣","季節","平日"],"s":"旅遊產品的需求與價格常受天氣、經濟環境及淡旺季等因素影響，大部分在需求暢旺時價格會調高。"},{"t":"1-11","c":"不可保存性","k":["空置","空房","空位","冷清"],"s":"旅遊產品不能暫時收存待日後銷售，例如酒店不能把淡季空置的客房留起，待旺季才租出，這是不可保存性。"},{"t":"1-11","c":"互補性及替代性","k":["附近","周邊","配套","鄰近","一帶"],"s":"外遊需購買多個機構的產品，彼此緊密聯繫；某景點旅客減少時，附近餐館和商店的生意也會受影響，這是互補性。"},{"t":"1-9","c":"生理需要","k":["休息","座椅","長椅","洗手間","廁所","飲水機","食物","飲食","餐廳","飲品","茶點","午餐","口渴","肚餓"],"s":"旅客首先要滿足飲食、休息等生理需要；因此行程應安排頻密的休息點，飲食場所亦須位於方便和容易到達的地方。"},{"t":"1-9","c":"安全需要","k":["安全","欄杆","圍欄","保安","閉路電視","救生","急救","警告","防滑"],"s":"滿足生理需要後，旅客會追求安全需要；景點設置欄杆、保安及急救等安全設施，能令旅客安心遊覽。"},{"t":"1-9","c":"社交需要","k":["朋友","同學","家人","一家人","親子","親友","結識","交流","一起"],"s":"旅客透過與親友同遊、結交朋友來聯繫感情，獲得歸屬感，滿足馬斯勞需求層次中的社交需要。"},{"t":"1-9","c":"尊重需要","k":["會員","貴賓","VIP","尊貴","名牌","獎賞計劃"],"s":"業界會為忠誠客戶設立金、銀、銅等級別會員，給予他們尊貴地位，以滿足旅客的尊重需要。"},{"t":"1-9","c":"自我實現需要","k":["挑戰","攀登","成就感","學習團","突破","自我實現"],"s":"旅客為證實自己的能力而參與攀山、學習團等活動，以求達致最高層次的自我實現需要。"},{"t":"1-7","c":"自我/尊重的需求","k":["打卡","拍照","影相","分享","社交媒體","社交平台","IG","Instagram","炫耀"],"s":"旅客希望透過旅遊得到別人的尊重和令人滿意的社會地位；經常外遊、見識廣博的人，常被周圍的人羨慕。"},{"t":"1-7","c":"好奇心","k":["好奇","新奇","新鮮","第一次","探索","發現","未見過"],"s":"根據赫曼的旅遊動機，好奇心會驅使旅客渴望體驗新奇事物，前往未曾到過的地方。"},{"t":"1-3","c":"運動旅遊","k":["行山","遠足","登山","單車","運動","跑步","球場","比賽","賽事","潛水","划艇"],"s":"運動旅遊包括旅客親身參與運動，例如登山、潛水；亦可以是觀看賽事，例如香港國際七人欖球賽。"},{"t":"1-10","c":"拉動因素","k":["夜景","風景","景色","景觀","美景","海景","山景","日落","吸引","著名","地標","特色建築","漂亮","美麗"],"s":"拉動因素指影響旅客選擇具體目的地的因素，例如美麗的風景、著名的天然景點及獨特的人造建築，都會吸引旅客慕名前往。"},{"t":"1-10","c":"推動因素","k":["放鬆","減壓","輕鬆","逃離","休閒","寧靜","悠閒"],"s":"推動因素是旅客的個人內在需要，例如渴望逃離日常生活、放鬆減壓，會令人產生旅遊的動機。"},{"t":"1-6","c":"有特殊需要的旅客","k":["無障礙","輪椅","斜道","升降機","長者","老人","孕婦","嬰兒","兒童","小朋友","殘疾","殘障","傷健","清真","祈禱室","點字","扶手","育嬰"],"s":"有特殊需要的旅客包括高齡、懷孕、兒童及嬰兒、殘障旅客及宗教信徒，服務提供者需調整或提供額外服務，以迎合他們的需要。"},{"t":"1-6","c":"人身安全","k":["危險","小心","意外","受傷","走火通道","逃生","安全指示","救生衣"],"s":"旅行會為旅客帶來不確定性與風險，安全是旅客首要的關注事項；旅客應注意人身安全，例如遵守景點的安全指示。"},{"t":"1-6","c":"健康","k":["衞生","口罩","消毒","蚊","中暑","防曬","飲用水","疫苗","生病","洗手液"],"s":"健康是旅遊時的關注事項之一；旅客應了解目的地的健康狀況，並做好預防措施，例如防蚊、防曬及注意衞生。"},{"t":"1-6","c":"尊重文化資源","k":["請勿觸摸","禁止拍照","保持安靜","尊重","習俗","守則","規則","告示"],"s":"根據旅客行為守則，旅客應尊重文化資源及了解當地習俗，例如遵守「請勿觸摸展品」等指示。"},{"t":"1-6","c":"協助保護自然環境","k":["請勿餵飼","不准採摘","亂拋垃圾","垃圾帶走","垃圾桶","保護環境","愛護","自備","即棄","告示","餵飼","野生動物"],"s":"旅客行為守則要求旅客協助保護自然環境，例如不亂拋垃圾、不採摘植物、不餵飼野生動物。"},{"t":"1-4","c":"旅行團群體旅客","k":["旅行團","導遊","領隊","旅遊巴","團友","一站式","跟團"],"s":"旅行團群體旅客追求舒適旅程，享受一站式服務及固定行程，依賴領隊和導遊解決問題，與當地人交流最少。"},{"t":"1-4","c":"個別的群體旅客","k":["自由行","機票連酒店","套票"],"s":"個別的群體旅客基本上依賴旅行社安排交通及食宿，但不一定以團體方式活動，例如自由行；他們也期望增遊新穎的景點。"},{"t":"1-4","c":"環境泡泡","k":["熟悉","多國語言","英文","外語","國際化"],"s":"環境泡泡是一種熟悉的環境氛圍，例如提供多國語言服務及不同種類的食物，可降低旅程中的環境變化，是旅客的「安全網」。"},{"t":"1-5","c":"探奇型","k":["冷門","偏遠","未開發","背包","小眾","秘境","冒險"],"s":"探奇型旅客外向獨立，有冒險精神，喜歡冷門或尚未開發的目的地，自行安排旅程，追求新穎的體驗。"},{"t":"1-1","c":"科技因素","k":["高鐵","電子","手機","應用程式","APP","二維碼","QR","網上","網站","WIFI","WI-FI","互動","屏幕","觸控","八達通","自助機","自助服務","平板","科技","VR","投影"],"s":"科技因素能提升旅遊業的服務效能，例如互聯網普及減低地域限制，網上交易及電子貨幣方便旅客購買門票；高速鐵路亦令運輸更有效率。"},{"t":"1-1","c":"旅遊推廣者","k":["宣傳","推廣","廣告","海報","單張"],"s":"旅遊推廣者包括旅遊局、直接推銷商、旅行代理商、旅行團經營商及會議策劃者，負責提供資訊及銷售旅遊產品，與旅客保持密切聯繫。"},{"t":"1-16","c":"旅行代理商","k":["旅行社","旅行代理","預訂","訂票","網上訂"],"s":"旅行代理商銷售旅遊產品，例如機票、酒店及活動門票，可分為傳統及線上代理商。"},{"t":"1-17","c":"宣傳推廣者","k":["旅客中心","旅客諮詢","旅遊資訊","小冊子","宣傳片","旅發局","旅遊發展局","旅遊地圖"],"s":"政府擔當宣傳推廣者，例如設計市場定位及主題、製作宣傳短片、提供旅遊資訊及設立旅客諮詢中心，支援旅客。"},{"t":"1-17","c":"直接經營者","k":["政府","康文署","郊野公園","公園","博物館","公營"],"s":"政府亦會擔當直接經營者，擁有公園、博物館、古蹟、主題公園等與旅遊業有關的項目，例如香港迪士尼樂園及海洋公園。"},{"t":"1-17","c":"政策制定者","k":["活化","政策","發展規劃","大灣區","資助"],"s":"政府作為政策制定者，會計劃及促進旅遊業發展，並以提供土地、寬減稅項、低息貸款等方法吸引投資者發展旅遊業。"},{"t":"1-17","c":"監管者","k":["牌照","持牌","規例","法例","發牌","監管","條例"],"s":"政府擔當監管者，透過發牌制度監管旅行代理商、航空公司、酒店、運輸工具及導遊等，以保障旅客。"},{"t":"1-21","c":"優質旅遊服務計劃","k":["優質旅遊服務","QTS","明碼實價","價錢牌","標價","列明價錢"],"s":"「優質旅遊服務」計劃評審零售及餐飲商戶，標準包括明碼實價、清晰資料及優質服務；餐館則着重食物水準、清潔衞生及貼心服務。"},{"t":"1-13","c":"重生","k":["翻新","重建","新設施","擴建","活化","改建","重開"],"s":"巴特勒生命週期中，目的地可透過新投資、更換設備及解決承載力問題而重生；否則設施老化陳舊，目的地會步向停滯甚至衰落。"},{"t":"1-13","c":"停滯","k":["殘舊","老化","陳舊","失修","過時","回頭客"],"s":"停滯階段的旅客人數達最高點，增長大為放緩，目的地非常倚賴回頭客，設施亦開始老化陳舊，需要持續推廣。"},{"t":"1-19","c":"煩厭不快階段","k":["居民","街坊","村民","投訴","不滿","滋擾","泊車問題"],"s":"當旅遊業發展接近飽和，或現有設施不足以應付旅客數目時，當地居民便會產生煩厭不快的情緒，例如旅遊區經常面對泊車問題。"},{"t":"1-24","c":"直接職位","k":["職員","員工","工作人員","導賞員","店員","侍應","廚師","就業","工作機會","職位"],"s":"旅遊業能製造就業機會：酒店、景點、旅行代理商等職位屬直接職位；的士司機、商店店主等則屬間接職位。","w":0.6},{"t":"1-24","c":"示範效應","k":["年輕人","模仿","潮流","服飾","時裝"],"s":"當地年輕人模仿旅客的服飾、飲食習慣及消費模式，稱為示範效應，可能令居民感到挫折或對旅客產生敵意。"},{"t":"1-24","c":"擠塞","k":["塞車","交通擠塞","擠塞","用水短缺","食水不足","設施不足","爭用"],"s":"大量旅客湧至會造成擠塞，例如用水需求大於供應、公共娛樂設施出現使用衝突，以及對社區服務和基建產生額外需求。"},{"t":"1-24","c":"無形出口","k":["外匯","海外旅客","外國旅客"],"s":"入境旅客在本地消費，令本地透過提供服務賺取外匯，等同「出口」服務，因此入境旅遊業被稱為無形出口。"},{"t":"1-18","c":"第三重效應","k":["薪酬","人工","薪金","再投資"],"s":"企業東主把收入再投資，例如裝修翻新；從業員則把薪酬用於消費、儲蓄及交稅，屬資金流動的第三重效應。"},{"t":"1-18","c":"流失","k":["進口","外國品牌","外資","國際品牌"],"s":"旅客或業界購買進口貨品及服務、外資企業把利潤帶返海外，都會令旅遊收益流失，減少留在當地的資金。"},{"t":"1-25","c":"會議","k":["會議","研討會","論壇","發布會"],"s":"根據UNWTO／ICCA的定義，會議指十位或以上參與者聚集在指定場地，共同進行最少四小時的活動，屬MICE旅遊的一部分。"},{"t":"1-25","c":"展覽","k":["會展","展銷","博覽","商貿展","展覽會"],"s":"展覽屬MICE旅遊的一環，可分為消費展覽會及商貿展覽會，能吸引商務旅客，帶動酒店、餐飲等消費。"},{"t":"1-15","c":"母港","k":["郵輪","啟德","海運碼頭","母港","停靠港"],"s":"郵輪旅遊費用一般包括船上住宿、基本飲食及指定娛樂設施；作為母港可帶來持續客源、穩定的碼頭收入及較高的人均消費。"},{"t":"1-2","c":"短程旅遊（不過夜）","k":["即日","一日遊","半日","不過夜","短途"],"s":"旅遊須具備有時間性、離開原居地、自願及往返等特性；即日來回、不過夜的行程屬短程旅遊。"},{"t":"1-1","c":"旅遊服務供應商","k":["酒店","住宿","餐廳","交通","巴士","港鐵","小巴","的士","渡輪","景點","設施","娛樂","旅舍","住一晚","過夜"],"s":"旅遊服務供應商為旅客提供住宿、餐飲膳食、交通運輸、旅遊目的地及景點娛樂設施，可直接或透過旅遊推廣者服務旅客。","w":0.6},{"t":"1-1","c":"旅客","k":["遊客","旅客","外國人","遊人","訪客"],"s":"旅客是旅遊業整合模式的核心元素，有旅客才有旅遊活動；旅遊推廣者及服務供應商均圍繞旅客的需要提供服務。","w":0.6},{"t":"1-23","c":"尖沙咀海濱","k":["尖沙咀海濱","星光大道","海濱長廊"],"s":"尖沙咀海濱的星光大道以香港電影為主題，逾百個巨星掌印刻於扶手上，遊人可用手機掃描二維碼瀏覽巨星簡介。","w":1.5},{"t":"1-23","c":"太平山頂","k":["山頂","太平山","凌霄閣"],"s":"太平山是香港島地勢最高的地方，可盡覽城市景觀；山頂凌霄閣提供美食、特式商店、互動娛樂設施及觀景台。","w":1.5},{"t":"1-23","c":"香港迪士尼樂園","k":["迪士尼"],"s":"香港迪士尼樂園位於大嶼山，屬世界級的家庭度假勝地，設有七個園區，提供機動遊戲、主題人物匯演及音樂劇。","w":1.5},{"t":"1-23","c":"香港海洋公園","k":["海洋公園"],"s":"香港海洋公園設有水族館「海洋奇觀」及「大熊貓之旅」等設施；水上樂園的設計亦以保護環境為大前提。","w":1.5},{"t":"1-23","c":"女人街／男人街","k":["女人街","男人街","廟街","通菜街"],"s":"女人街是旺角通菜街，攤檔售賣服裝飾物；男人街是廟街，晚上最熱鬧，有天后廟、占卦算命及粵劇折子戲表演。","w":1.5},{"t":"1-23","c":"蘭桂坊／蘇豪區","k":["蘭桂坊","蘇豪"],"s":"蘭桂坊／蘇豪區位於中環，是香港最熱鬧的夜生活消遣場所之一，有不少特色酒吧和食肆。","w":1.5},{"t":"1-23","c":"昂坪360","k":["昂坪","360","大佛","寶蓮","心經簡林"],"s":"昂坪是十大景點之一，包括昂坪360纜車、昂坪市集及寶蓮禪寺天壇大佛，旅客可乘纜車欣賞大嶼山景色。","w":1.5},{"t":"1-23","c":"香港會議展覽中心","k":["會展中心","會議展覽中心","金紫荊"],"s":"香港會議展覽中心是國際會議及展覽場地，吸引會展旅客；旁邊的金紫荊廣場亦是旅客常到的景點。","w":1.5},{"t":"1-23","c":"大館","k":["大館","中區警署"],"s":"大館由前中區警署建築群活化而成，是課本列出的文化景點，保留歷史建築，並舉辦藝術展覽及文化活動。","w":1.5},{"t":"1-23","c":"中環街市","k":["中環街市"],"s":"中環街市是課本列出的文化景點，活化後保留原有建築特色，並引入本地特色商店及食肆。","w":1.5},{"t":"1-23","c":"南豐紗廠","k":["南豐紗廠"],"s":"南豐紗廠由舊紡紗廠活化而成，是課本列出的文化景點，展示香港紡織業歷史，並設有藝術空間及創意商店。","w":1.5},{"t":"1-23","c":"戲曲中心","k":["戲曲中心"],"s":"戲曲中心位於西九文化區，是課本列出的文化景點，以粵劇等戲曲表演為主，並設茶館劇場及導賞。","w":1.5},{"t":"1-23","c":"M+","k":["M+","M+博物館"],"s":"M+是西九文化區的視覺文化博物館，屬課本列出的文化景點，展示設計、建築及當代藝術。","w":1.5},{"t":"1-23","c":"香港故宮文化博物館","k":["故宮"],"s":"香港故宮文化博物館位於西九文化區，屬課本列出的文化景點，展出北京故宮博物院的珍貴文物。","w":1.5},{"t":"1-23","c":"香港地質公園","k":["地質公園","六角","石柱"],"s":"香港地質公園是課本列出的自然景點，擁有獨特的岩石地貌，例如六角形岩柱，適合地質旅遊及生態旅遊。","w":1.5},{"t":"1-23","c":"米埔自然保護區","k":["米埔"],"s":"米埔自然保護區是課本列出的自然景點，擁有濕地及大量候鳥，適合觀鳥及生態旅遊。","w":1.5},{"t":"1-23","c":"麥理浩徑","k":["麥理浩徑"],"s":"麥理浩徑是課本列出的自然景點，屬長途遠足徑，旅客可欣賞郊野及海岸景色。","w":1.5},{"t":"1-23","c":"大潭郊野公園","k":["大潭"],"s":"大潭郊野公園是課本列出的自然景點，設有水塘及遠足徑，適合遠足及欣賞自然景色。","w":1.5},{"t":"2-12","c":"與食物有關的因素","k":["健康","營養","有機","少油","少鹽","少糖","食材","新鮮","時令","蔬菜","本地+菜","本地+食材","咖啡豆","本地+咖啡","本地+豆","本地+茶","本地+米"],"s":"與食物有關的因素包括食材供應和品質穩定性、菜式種類、食物衞生與安全及營養價值；一般餐廳亦會加入標榜健康飲食的菜式。"},{"t":"2-12","c":"顧客方面","k":["素食","齋","清真","過敏","飲食要求","目標顧客","長者餐","兒童餐","消費能力","人均消費","套餐","價錢"],"s":"規劃餐單要考慮顧客方面，包括目標顧客群的喜好、消費能力、用餐次序和習慣，以及飲食要求，例如素食。"},{"t":"2-12","c":"市場方面","k":["餐牌","菜牌","餐單","菜單","菜式","新菜","潮流","特色菜","招牌菜","主題餐廳"],"s":"規劃餐單時須迎合飲食潮流，定期加入新菜式；餐單既要有自己的特色，又要配合餐廳的形象主題。"},{"t":"2-12","c":"營運方面","k":["營業時間","製作時間","廚房設備","廚師","廚房"],"s":"營運方面的考慮包括餐廳位置、營業時間、廚房員工的廚藝及人數、廚房設備、製作時間及樓面設施。","w":0.8},{"t":"2-14","c":"視覺","k":["燈光","光線","顏色","色調","裝修","佈置","裝飾","設計","壁畫","擺設","風格","昏暗","明亮","柔和","光猛","浪漫","裝修風格","和風"],"s":"餐廳可利用視覺元素增強氣氛，例如燈光、顏色、裝修及擺設，營造配合主題的用餐環境。"},{"t":"2-14","c":"聽覺","k":["音樂","聲音","寧靜","安靜","嘈吵","嘈雜","鳥叫","播放"],"s":"聽覺是餐廳增強氣氛的感官元素之一，例如播放合適的背景音樂、控制嘈雜程度，令顧客感到舒適。"},{"t":"2-14","c":"嗅覺","k":["香味","氣味","香氣","味道","臭","花香"],"s":"嗅覺是餐廳增強氣氛的感官元素之一，例如食物及咖啡的香氣能刺激食慾，異味則會影響顧客的用餐體驗。"},{"t":"2-14","c":"溫度","k":["客人面前","即場烹調","即場煮","鐵板","冷氣","溫度","涼快","涼爽","炎熱","通風","暖氣","風扇"],"s":"溫度是餐廳增強氣氛的感官元素之一，適當的室內溫度及通風能令顧客用餐時感到舒適。"},{"t":"2-14","c":"觸覺","k":["質感","觸感","木製","木枱","桌布","枱布","餐具","座椅","梳化","柔軟"],"s":"觸覺是餐廳增強氣氛的感官元素之一，例如餐具、桌布及座椅的質感，都會影響顧客的舒適感和對餐廳的印象。"},{"t":"2-11","c":"閒暇市場","k":["餐廳","咖啡","CAFE","茶座","小食","食肆","餐飲","飲品","雪糕","茶餐廳"],"s":"閒暇市場的餐飲服務設在旅遊景點和休閒活動場所，為遊客提供餐飲，是本港八類餐飲服務市場之一。"},{"t":"2-11","c":"學生市場","k":["學校","飯堂","食堂","大學","校園"],"s":"學生市場的餐飲服務設於大專院校及中學的食堂或餐廳；大專院校內亦有服務和菜式較好的餐廳供校職員享用。"},{"t":"2-11","c":"零售市場","k":["便利店","超級市場","超市","外賣","自動售賣機"],"s":"零售市場指在便利店、超級市場等地方出售場內用餐或外賣的餐飲，是本港餐飲服務市場的其中一類。"},{"t":"2-11","c":"交通市場","k":["機場","車站","港鐵站","碼頭","飛機餐","高鐵"],"s":"交通市場的餐飲服務主要設於各交通樞紐，並提供交通工具上的膳食。"},{"t":"2-11","c":"連鎖經營","k":["連鎖","集團","分店","分店林立"],"s":"連鎖式經營規模龐大、資金實力雄厚，設有總公司以專業人員進行中央管理，部分以特許授權方式經營。"},{"t":"2-11","c":"獨立經營","k":["獨立經營","小店","家庭式","東主","老闆","小本經營","老字號"],"s":"獨立式經營多為小本經營，經營權及經營方式均由東主全權負責，市場細分多為社區小企業或高檔餐飲。"},{"t":"2-13","c":"用餐區","k":["座位","餐桌","用餐區","貴賓房","包廂","私人房","戶外座位","露天"],"s":"餐廳把用餐區劃分為不同區域，便於管理及營運，亦可增加服務級別，例如設貴賓區，讓客人享有較高私隱度和更舒適的環境。"},{"t":"2-13","c":"水吧","k":["水吧","吧枱","酒吧","咖啡機","調酒","飲料"],"s":"水吧負責提供各類飲料；酒水利潤頗高，水吧設於用餐區亦能增加格調和氣氛。"},{"t":"2-13","c":"收銀部","k":["收銀","付款","結帳","結賬","埋單","找贖"],"s":"收銀部負責收銀工作，是餐廳用餐區以外的附屬區域之一；經理室及行政部則處理行政和會計工作。"},{"t":"2-13","c":"款接部","k":["帶位","訂座","安排座位","等位","接待員","迎賓"],"s":"餐廳款接部的員工一般設於入口處，負責安排座位、接受訂座等，並把客人平均分配到各區域。"},{"t":"2-13","c":"電子銷售終端機（POS）","k":["點餐機","電子點餐","平板","掃碼","QR","二維碼","POS","點菜機"],"s":"用餐區設有電子銷售終端機（POS），用於輸入客人訂單，餐具等用品也多放置於附近。","n":["點餐","點菜","落單","餐廳","食","餐牌","菜單"]},{"t":"2-17","c":"保持清潔","k":["清潔","乾淨","衞生","洗手","手套","口罩","髮網","消毒","抹枱","戴帽","帽子","圍裙"],"s":"「保持清潔」是食物安全五要點之一，指保持個人衞生，並保持飲食場所及用具清潔。","n":["食","餐","廚","飲","菜","茶"]},{"t":"2-10","c":"公共地方","k":["清潔","乾淨","整潔","打掃","清潔工","洗手間","廁所","走廊"],"s":"管家部負責清潔客房樓層、公共地方及客用設施，保持環境整潔，讓客人留下良好印象。"},{"t":"2-10","c":"其他職能","k":["花卉","鮮花","植物","盆栽","園藝","花園","防蟲","綠化","蚊"],"s":"管家部的其他職能包括花卉植物、園藝及防蟲工作，令酒店環境更舒適美觀。"},{"t":"2-10","c":"制服及布草房","k":["制服","布草","毛巾","床單","被鋪"],"s":"制服及布草房負責保管、收發及修補員工制服及布草用品，並定期盤點，確保數量和質素合乎所需；洗衣房則負責洗熨。"},{"t":"2-15","c":"","k":["滅火筒","滅火器","消防","火警","走火通道","逃生","花灑","警鐘","消防栓","喉轆","緊急出口"],"s":"餐廳常見的消防設施包括滅火筒、滅火氈、消防喉轆、自動花灑系統、應急照明及火警警報系統，可分為預防及示警性與撲救性兩類。"},{"t":"2-15","c":"滅火氈","k":["滅火氈"],"s":"滅火氈屬撲救性消防用具；油鍋起火時不應直接用水撲救，因為水遇熱油會令油濺起擴散，使火勢惡化。"},{"t":"2-15","c":"可燃物","k":["爐頭","明火","石油氣","煤氣","燒烤","蠟燭","火爐"],"s":"物質燃燒需要可燃物、溫度、氧氣及連鎖反應四個要素；妥善處理可燃物及火源，有助預防火警。"},{"t":"2-17","c":"精明選擇","k":["供應商","食材來源","農場","產地","農產品"],"s":"精明選擇指透過各種措施選擇安全的原材料，例如慎選有牌及信譽良好的供應商，並可要求出示單據或衞生證明書。"},{"t":"2-17","c":"生熟分開","k":["生熟","砧板","生肉","分開存放","分開處理","不同顏色"],"s":"生熟分開是食物安全五要點之一，指把生熟食物分開處理，例如使用不同的砧板及用具。"},{"t":"2-17","c":"安全溫度","k":["雪櫃","冷藏","保溫","翻熱","4度","60度","攝氏","溫度計"],"s":"安全溫度指以安全的溫度存放和烹調食物，例如熱吃食品收貨時的溫度須在60°C以上。"},{"t":"2-17","c":"煮熟食物","k":["煮熟","熟透"],"s":"煮熟食物是食物安全五要點之一，指食物要徹底煮熟，以減低食物中毒的風險。"},{"t":"2-16","c":"物理性","k":["異物","頭髮","雜質","碎片","蒼蠅","曱甴"],"s":"物理性食物污染指食物在製作及銷售過程中混入非食物的雜質，未必傷害顧客，但會打擊食肆的形象。"},{"t":"2-16","c":"化學性","k":["農藥","清潔劑","化學"],"s":"化學性食物污染的成因包括蔬菜殘餘農藥、清潔劑處理不當，以及不合規格的容器遇熱釋出有害物質。"},{"t":"2-16","c":"細菌性","k":["細菌","生雞蛋","未熟","刺身","變壞","腐壞","食物中毒"],"s":"細菌性食物污染可引致食物中毒，例如沙門氏菌來自生的肉類及未經煮熟的蛋類製品，病徵包括發燒、肚痛及腹瀉。"},{"t":"2-1","c":"地理位置","k":["酒店","賓館","旅館","度假村","渡假村","住宿","青年旅舍","營舍","旅舍","住一晚","過夜"],"s":"酒店可按地理位置、功能設施、服務水平、規模、房價、評級及產權分類；例如市中心酒店交通便捷，近郊酒店空間較大、設施完善。","w":0.8},{"t":"2-1","c":"功能設施","k":["會議室","宴會廳","商務中心","會議酒店","商務酒店","機場酒店"],"s":"按功能設施分類，會議酒店設有大量客房、會議廳及宴會廳；商務酒店設有完善的商務中心，主要服務商務旅客。"},{"t":"2-2","c":"","k":["五星","四星","星級","豪華酒店","甲級","高級酒店"],"s":"香港酒店按設施、地點、職員與客房數目比例、實際平均房租及商務組合計算級別，分為甲級高價、乙級高價、中價酒店及旅客賓館。"},{"t":"2-3","c":"","k":["客房","房間","睡房","雙人房","單人房","套房","床鋪","無障礙客房"],"s":"客房按等級可分為標準級、特級、豪華級客房、行政套房及總統套房；按住客人數亦有單人房、雙人房、三人房及無障礙客房等。","w":0.7},{"t":"2-4","c":"旅遊季節節慶及活動","k":["房價","旺季","淡季","節日","節慶","長假","週末"],"s":"影響酒店房價的因素包括旅遊季節、節慶及活動、房間級別、計價方法、租住時間長短及顧客類別；旺季及節慶時房價一般較高。"},{"t":"2-5","c":"入住率","k":["入住率","客滿","滿房","爆滿","空房","超額預訂"],"s":"入住率反映已售出客房佔可銷售客房的比例，與每日平均房價及每間可銷售房收入同為計算酒店銷售收入的指標。"},{"t":"2-7","c":"保安部","k":["保安","閉路電視","巡邏","門禁"],"s":"保安部屬後勤部門，負責確保客人財產和人身安全，例如巡查消防通道及避免客人受可疑人物滋擾。"},{"t":"2-7","c":"營業及市場推廣部","k":["宣傳","推廣","優惠","廣告","常客","會員","公關"],"s":"營業及市場推廣部負責向同業及本地公司促銷、管理常客優惠計劃、策劃公關及宣傳活動，並進行市場調查。"},{"t":"2-7","c":"人力資源部","k":["招聘","培訓","聘請","員工餐"],"s":"人力資源部負責所有關乎員工的工作，包括招聘、培訓、表現評核、薪酬福利、制服管理及員工膳食安排。"},{"t":"2-7","c":"餐飲部","k":["宴會","自助餐","到會"],"s":"餐飲部屬前線部門，提供各類飲食安排及到會服務，直接為酒店帶來收益。"},{"t":"2-8","c":"抵埗","k":["入住","登記","CHECKIN","辦理手續","行李","迎接","歡迎"],"s":"顧客享用酒店服務分為抵埗前、抵埗、入住及離開四個階段；抵埗時禮賓部員工會上前歡迎，行李生協助客人辦理登記。"},{"t":"2-9","c":"款接部","k":["接待處","前台","櫃檯","櫃台","服務台","詢問處","查詢","登記","退房"],"s":"款接部主要安排客人入住及退房，客人有查詢或需要協助時也常會先聯絡款接部，款接部亦會適時推銷各項設施和服務。"},{"t":"2-9","c":"禮賓部","k":["禮賓","門僮","行李","泊車","接送","穿梭巴士","開門"],"s":"禮賓部提供住房以外的支援服務，包括行李安排、汽車接送、代辦郵遞、泊車及開門，部門主管為禮賓司。"},{"t":"2-9","c":"大堂副經理","k":["大堂","投訴","經理"],"s":"大堂副經理負責大堂範圍的客戶關係和秩序，包括歡迎重要客人、回答查詢、處理投訴和聆聽意見。"},{"t":"3-3","c":"高品質","k":["指示牌","路牌","標示","地圖","洗手間","廁所","停車場","垃圾桶","設施","乾淨","整潔","保養","維修","外觀","簇新","友善","說明","展板","整齊","無障礙","輪椅","斜道"],"s":"高品質是成功景點的特性之一，包括良好外觀、恰當的保養、顧客主導的營運（如清晰的指示牌、洗手間及停車場），以及友善貼心的服務。"},{"t":"3-3","c":"真實性","k":["地道","保留","原貌","原有","原來","原本","舊","歷史建築","古蹟","傳統","原汁原味","活化","警署","百年","建築","年代","歷史","前身","以前是","改作","警察"],"s":"真實性指景點保留原來的色彩和氛圍，例如歷史建築保留原有的特色，讓旅客感受當年的面貌。"},{"t":"3-3","c":"獨特性","k":["獨特","特別","唯一","獨有","罕見","特色","別具","與別不同","全港"],"s":"獨特性強調景點需要有其他地方無法複製的獨特之處，令旅客值得專程到訪。"},{"t":"3-3","c":"活動選擇","k":["DIY","活動","工作坊","導賞","遊戲","體驗","表演","展覽","參加","課程","親子","互動"],"s":"提供更多活動選擇給旅客，例如導賞、工作坊及展覽，吸引力自然增加，做到「玩之不盡，物有所值」 歧視。"},{"t":"4-7","c":"地區福祉","k":["居民生活","社區設施","生活質素","滋擾"],"s":"地區福祉指維持及提升當地社區的生活質素，包括社區結構、資源及設施，避免旅遊業對社區造成破壞或剝削。"},{"t":"4-10","c":"公平利益分配","k":["公平貿易","本地+菜","本地+食材","本地+產品","本地+農","本地+原料","本地+出產","本地+種植","本地+製","本地+手作","本地+供應","小農","農夫","農場","本地+咖啡","本地+豆","本地+米","本地+茶","本地+蜜"],"s":"公平貿易準則之一是本地持份者的公平利益分配，例如以公平價格向本地供應商採購、使用本地產品和原料，以減少資金流失。"},{"t":"4-10","c":"公平夥伴合作關係","k":["僱用本地","本地員工","居民參與","諮詢","合作"],"s":"公平夥伴合作關係要求投資者充份諮詢本地社群、僱用本地人士，並訓練和培養本地人士出任管理職務。"},{"t":"4-10","c":"旅客與本地居民的公平貿易","k":["價錢牌","列明價錢","明碼實價","價錢合理","公道","合理價錢","劏客","價錢","價格"],"s":"旅客與本地居民的公平貿易要求使用公平的市場價格，令旅客以合理價錢購買產品和服務。"},{"t":"4-10","c":"合理使用自然資源","k":["保護環境","環境保護","自然資源","研發"],"s":"合理而可延續地使用自然資源，包括投資及研發環境保護、執行有助優化本地環境的措施，並諮詢本地社群意見。"},{"t":"4-1","c":"可信性","k":["專業","知識","講解","導賞員","熟悉","解答","回答","詳細","清楚"],"s":"可信性指員工有知識、技能和能力服務顧客，例如導賞員能清楚解答問題，令顧客安心及有信心。"},{"t":"4-1","c":"關懷性","k":["關心","主動","幫忙","協助","體貼","貼心","照顧","耐心","耐性","友善","親切","笑容","微笑","熱情","有禮","禮貌"],"s":"關懷性指顧客能感受到員工的關懷和重視，在顧客遇到問題或需要協助時特別重要。"},{"t":"4-1","c":"有形性","k":["餐牌","菜式圖片","圖片","制服","裝修","環境","設施","指示牌","整潔","外觀","佈置","燈光","乾淨","設備","展板","舒適","地圖","整齊"],"s":"有形性指顧客實質可見及可感覺的事物，例如設施、環境及員工制服，最能影響顧客的第一印象和最後印象。"},{"t":"4-1","c":"反應性","k":["很快","迅速","效率","即時","快捷","立即","馬上","等很久"],"s":"反應性指企業為顧客提供快捷、高效率的服務，包括員工的效率、態度及完成服務的速度。"},{"t":"4-1","c":"可靠性","k":["準時","準確","承諾","如期","守時"],"s":"可靠性指員工能準確、準時及一貫地提供承諾的服務，包括書面和口頭的明確承諾，以及顧客合理預期的隱性承諾。"},{"t":"4-12","c":"市面秩序混亂","k":["擠迫","擠逼","擁擠","人潮","排隊","爆滿","人山人海","噪音","嘈吵","小販"],"s":"過度旅遊指旅客人數超越東道國的承載力，可能令市面秩序混亂、公共交通受阻及資源被佔用，對居民造成困擾。"},{"t":"4-12","c":"公共交通受阻","k":["塞車","交通擠塞","巴士滿","車廂擠迫","排隊上車","公共交通"],"s":"過度旅遊會令公共交通受阻，影響居民日常出行；應對方法包括鼓勵旅客分流及分時到訪、開發新景點分散人流。"},{"t":"4-12","c":"","k":["打卡","社交媒體","網紅","IG","INSTAGRAM","小紅書","熱點"],"s":"社交媒體興起是過度旅遊的成因之一；應對方法包括鼓勵旅客分流及分時到訪、開發新行程及新景點分散人流。"},{"t":"4-3","c":"互動行銷","k":["職員","員工","店員","侍應","導賞員","工作人員","服務員","接待"],"s":"互動行銷指員工與顧客之間的服務接觸，企業能否兌現服務承諾，非常倚賴前線員工對顧客的表現。","w":0.6},{"t":"4-3","c":"對外行銷","k":["宣傳","廣告","海報","網站","推廣","單張","宣傳片"],"s":"對外行銷是企業透過宣傳、廣告、公共關係及社交網站吸引顧客注意，並影響顧客的期望，即「製造承諾」。"},{"t":"4-3","c":"內部行銷","k":["培訓","員工福利","員工休息室","員工待遇","義工"],"s":"內部行銷視員工為「內部顧客」，透過員工培訓、營運制度、員工待遇及溝通，讓員工先感到滿意，才能做好對外服務。"},{"t":"4-4","c":"關鍵時刻","k":["第一印象","迎接","歡迎","點餐","上菜","大堂","接待處","第一眼","踏入","一進門"],"s":"關鍵時刻是顧客與企業接觸的「接觸點」，可以是員工、設施、產品或服務，例如踏入大堂的第一刻；顧客的滿意度主要來自這些印象。"},{"t":"4-2","c":"簡單積分計劃","k":["會員","積分","儲分","印花","會員卡","優惠券","現金券","集點"],"s":"簡單積分計劃讓顧客每次消費賺取積分，換取折扣或產品，設計簡單、容易操作，但未足以大大提高顧客的忠誠度。"},{"t":"4-5","c":"差距三：服務表現差距","k":["態度差","態度欠佳","服務差","不理睬","出錯","做錯"],"s":"服務表現差距指公司提供服務時無法達至原有的設計要求，主要來自員工的能力和態度。"},{"t":"4-5","c":"差距五：顧客差距","k":["期望","失望","與宣傳不符","不如預期","比想像","超出預期"],"s":"顧客期望與實際感受之間的差距稱為顧客差距，由認識、服務設計及標準、服務表現和溝通四個差距組成。"},{"t":"4-6","c":"不滿意的客人","k":["投訴","發脾氣","憤怒","爭執","不滿","吵架"],"s":"面對不滿意的客人，員工應耐心積極聆聽、覆述問題以確保理解正確，並提出解決方法；問題解決後，客人可能成為忠誠顧客。"},{"t":"4-8","c":"標準化","k":["連鎖","快餐","麥當勞","星巴克","國際品牌","劃一","標準"],"s":"標準化令產品和服務的提供方式趨向統一，例如全球各地的國際性快餐大同小異；雖可提高效率，但目的地可能會失去特色。"},{"t":"4-8","c":"同質化","k":["相似","大同小異","千篇一律","一樣","差不多","沒有特色"],"s":"同質化令旅遊產品和服務的模式漸趨一致，旅客可能感受不到不同國家地區的獨有風格，文化的獨特性亦難以保持。"},{"t":"4-11","c":"老一輩","k":["長者","老人","年長","公公","婆婆","老年"],"s":"老一輩重視安全及保安，酒店設計須方便長者，例如較矮的床、提高照明度、使用較大字體及步入式淋浴間。"},{"t":"4-14","c":"提供一站式搜尋","k":["網上","KLOOK","平台","比較價錢","訂票","預訂","手機程式","APP"],"s":"網上旅遊代理商提供一站式搜尋，令購買食住行遊購娛等旅遊產品簡單得多，並兼具溝通與討論平台的特色。"},{"t":"4-15","c":"只提供有限服務","k":["廉航","低成本航空","平價機票"],"s":"低成本航空公司票價明顯較低，但只提供有限服務，大部分服務逐項收費，營運成本亦較低。"},{"t":"4-16","c":"協調各部門運作","k":["電腦系統","管理系統","PMS"],"s":"酒店資產管理系統（PMS）是涵蓋各部門運作的電腦系統，可協調各部門運作、提高服務水平及節省營運成本。"},{"t":"4-17","c":"樓面點餐","k":["點餐","電子點餐","掃碼","QR","二維碼","平板","點菜機","自助點餐"],"s":"銷售點系統可用於樓面點餐，侍應輸入訂單後，資料即時傳到廚房及收銀櫃檯，減少出錯並節省時間。","n":["點餐","點菜","落單","餐廳","食","餐牌","菜單"]},{"t":"4-17","c":"櫃檯結帳","k":["付款","結帳","結賬","八達通","電子支付","收銀","埋單"],"s":"銷售點系統令客人用餐完畢後可在最短時間結賬，結賬後亦可立即安排新客入座。"},{"t":"4-17","c":"現場座位管理","k":["叫號","輪候號碼","取籌","攞飛","等位","候位","顯示屏"],"s":"餐廳可於候餐區設置顯示屏，提供輪候號碼，讓等候的顧客知悉輪候情況，這是銷售點系統的現場座位管理功能。"},{"t":"1-3","c":"閒暇／度假式旅遊","k":["度假","渡假","觀光","遊覽","休閒","陽光","沙灘","海灘","拍照","影相","放假","假期"],"s":"閒暇／度假式旅遊分輕鬆式（欣賞風景、享受陽光海灘）及觀光式（探索新地方、增廣見聞，旅客會拍很多照片），是最常見的旅遊形式。","w":0.7},{"t":"1-3","c":"宗教朝聖","k":["廟宇","寺","廟","祠","教堂","清真寺","大佛","佛像","拜神","上香","祈福","朝聖","宗教"],"s":"宗教朝聖旅遊以參拜宗教聖地為目的，需求穩定，例如穆斯林前往麥加朝聖；香港的寶蓮禪寺及黃大仙祠亦吸引不少旅客參拜。","w":0.8},{"t":"1-3","c":"保健旅遊","k":["溫泉","水療","SPA","按摩","養生","瑜伽"],"s":"保健旅遊以促進身心健康為目的，例如到內地或日本浸溫泉、享受水療及按摩服務。"},{"t":"1-3","c":"探訪親友","k":["探親","親戚","探望","祖父母","老家"],"s":"探訪親友的旅客一般不住旅館，但會光顧超級市場及餐廳，並由主人家安排觀光活動。"},{"t":"1-2","c":"本地旅客","k":["本地人","香港人","市民","本地遊","本地旅遊","街坊"],"s":"本地旅遊指居民在本國或本地境內旅遊；本地居民參加本地遊，或在本地酒店住宿最少一晚，屬本地旅客。","w":0.7},{"t":"1-2","c":"國際旅客","k":["外國遊客","外國旅客","外國人","內地旅客","海外旅客","訪港旅客","入境旅客","入境"],"s":"國際旅遊分入境及出境旅遊；外地居民到訪香港屬入境旅客，香港居民到外地旅遊則屬出境旅客。"},{"t":"1-12","c":"引入階段","k":["新開","新開幕","剛開幕","開幕","新推出","剛推出","開業","試業","全新"],"s":"旅遊產品在引入階段剛推出市場，知名度不高，需要大量宣傳推廣吸引旅客。"},{"t":"1-12","c":"成長階段","k":["愈來愈多","越來越多","人氣","爆紅","愈來愈受歡迎","越來越受歡迎"],"s":"旅遊產品在成長階段知名度上升，旅客人數快速增長，競爭者亦逐漸增加。"},{"t":"1-12","c":"衰退階段","k":["冷清","結業","倒閉","荒廢","殘舊","老化","過時"],"s":"旅遊產品在衰退階段吸引力下降、旅客減少，原因包括產品老化、管理不善及外在競爭；海洋公園曾以更新設施及加入保育元素重新推出。"},{"t":"1-13","c":"發掘","k":["未開發","人跡罕至","很少人","好少人","沒有設施","冇設施","秘境","偏遠"],"s":"發掘階段只有少量探險式或漫遊式旅客到訪，當地沒有公眾旅遊設施，旅客被自然或文化特色吸引，與居民交流多。"},{"t":"1-13","c":"投入","k":["村民+開","村民+經營","居民+開","士多","民宿","小食店","村民+賣"],"s":"投入階段當地人看到旅遊業帶來的收益，開始主動為旅客提供住宿及設施，當地人仍能掌握旅遊發展。"},{"t":"1-13","c":"發展","k":["外資","大型酒店","連鎖店","發展商","大型商場"],"s":"發展階段設施增加、推廣加強，外來企業逐漸控制旅遊業；旺季旅客數目遠超居民，可能引起居民敵視。"},{"t":"1-15","c":"停靠港","k":["岸上觀光","靠岸","停靠","上岸"],"s":"停靠港是郵輪航程途中停泊的港口；乘客多在船上住宿用膳，只作短暫岸上觀光，對當地經濟的貢獻較母港少。"},{"t":"1-15","c":"自給自足的目的地","k":["郵輪+泳池","郵輪+劇院","郵輪+餐廳","郵輪+娛樂","船上"],"s":"郵輪被視為「自給自足的目的地」，船上提供膳宿、娛樂及旅遊活動，旅程大多在同一地方開始及結束。"},{"t":"1-16","c":"單向模式","k":["官方網站","官網","直接預訂","直接購買","直銷","網上購票","網上買票","售票處"],"s":"單向分銷模式指供應商直接把產品售予消費者，例如在官方網站或售票處購票，毋須支付佣金，亦可給忠誠顧客優惠。"},{"t":"1-19","c":"興奮愉快階段","k":["居民歡迎","熱情招呼","村民歡迎","歡迎旅客","好客"],"s":"興奮愉快階段的居民歡迎旅客到訪，主客雙方都感到滿足，通常出現在旅遊發展初期。"},{"t":"1-19","c":"敵對感覺階段","k":["反對","抗議","敵視","趕走","不歡迎"],"s":"敵對感覺階段的居民把社會問題歸咎於旅客，公開表達不滿，甚至敵視旅客。"},{"t":"1-21","c":"香港旅遊發展局","k":["旅發局","旅遊發展局","旅客諮詢","DISCOVERHONGKONG","好客之道"],"s":"香港旅遊發展局是政府資助的法定機構，負責在全球宣傳推廣香港、提升旅客體驗，並設有旅客諮詢中心提供旅遊資訊。"},{"t":"1-21","c":"機場管理局","k":["機場","航廈","登機","禁區"],"s":"機場管理局負責管理香港國際機場，並推動智慧機場發展，為旅客提供方便快捷的出入境體驗。","w":0.8},{"t":"1-21","c":"香港貿易發展局","k":["貿發局","書展","美食博覽","玩具展","時裝展"],"s":"香港貿易發展局舉辦書展、美食博覽等大型展覽，吸引商務旅客及公眾，亦是推廣香港旅遊的機構之一。"},{"t":"1-21","c":"旅遊業賠償基金","k":["印花","賠償基金","倒閉"],"s":"旅遊業賠償基金在持牌旅行代理商倒閉時，向外遊旅客賠償所繳外遊費的九成；外遊意外受傷或死亡亦可獲特惠賠償。"},{"t":"1-21","c":"旅遊業監管局","k":["旅監局","導遊證","領隊證","持牌導遊","持牌旅行社","牌照"],"s":"旅遊業監管局自2022年起負責旅行代理商、導遊及領隊的發牌及規管，並管理旅遊業賠償基金。","w":0.9},{"t":"1-21","c":"香港酒店業協會","k":["酒店業協會"],"s":"香港酒店業協會代表酒店業界，保障會員權益、加強業界合作，並向政府反映意見及提供培訓。"},{"t":"1-24","c":"間接職位","k":["的士司機","司機","小販","便利店","外判","供應商","清潔工"],"s":"旅遊業亦帶來間接職位，例如的士司機、商店店主及酒店外判洗衣員工；他們服務旅客及本地人，或支援直接服務旅客的機構。"},{"t":"1-24","c":"過分依賴","k":["只靠","全靠","依賴旅客","依賴遊客","主要收入"],"s":"若地區經濟過分依賴旅遊業，一旦旅客減少，例如出現疫情或經濟不景，當地經濟及就業便會大受打擊。"},{"t":"1-25","c":"獎勵旅遊","k":["獎勵","員工旅行","公司旅行","年會"],"s":"獎勵旅遊是企業回饋及鼓勵表現優秀員工或分銷商的管理工具，通常包括酒店住宿、觀光節目、晚宴及派對。"},{"t":"1-25","c":"消費展覽會","k":["書展","美食博覽","車展","購物展","電腦節","年宵"],"s":"消費展覽會面向公眾，例如書展、車展及美食博覽，參展商向消費者展示及售賣產品。"},{"t":"1-25","c":"商貿展覽會","k":["商貿","買家","業界","採購","貿易"],"s":"商貿展覽會面向業界買家，讓參展商推廣新產品、建立業務關係及收集市場資訊。"},{"t":"1-23","c":"香港摩天輪","k":["摩天輪"],"s":"香港摩天輪位於中環海濱，是課本列出的十大景點之一，旅客可從高處欣賞維多利亞港景色。","w":1.5},{"t":"1-23","c":"鹽田梓","k":["鹽田梓"],"s":"鹽田梓是西貢的客家村落，課本以鹽田梓藝術節為例，說明結合藝術、古蹟及綠色旅遊的本地遊。","w":1.5},{"t":"1-23","c":"大澳","k":["大澳","棚屋","水鄉","漁村","漁民","鹹魚","蝦醬"],"s":"大澳保留棚屋及漁村文化；舊大澳警署活化為大澳文物酒店，約一半員工是大澳居民，亦有居民帶領的文化生態導賞團。","w":1.5},{"t":"2-1","c":"舊式建築改建酒店","k":["活化","前身","改建","歷史建築","警署","古蹟","保留","殖民地","以前是","改作"],"s":"舊式建築改建酒店把具重要歷史意義的建築改為住宿並保留歷史特色，例如由舊警署改建的大澳文物酒店及前水警總部1881公館。","n":["酒店","住宿","旅舍","旅館","客房","房間","入住"]},{"t":"2-1","c":"度假酒店","k":["度假村","渡假村","度假酒店","渡假酒店","度假屋"],"s":"度假酒店多位於風景優美的地方，提供全面的康樂及餐飲設施，旅客通常停留較長時間。"},{"t":"2-1","c":"精品酒店","k":["精品酒店","設計酒店","主題客房","主題房"],"s":"精品酒店規模較小，設計個性化、別具風格，又稱設計或生活品味酒店，為客人提供獨特的住宿體驗。"},{"t":"2-1","c":"旅舍","k":["青年旅舍","旅舍","床位","宿舍","共用廚房","背包客"],"s":"旅舍以宿舍形式提供廉價床位，設有共用洗手間及自助煮食設施，適合背包客及學生。"},{"t":"2-1","c":"民宿","k":["民宿","村屋","家庭旅館"],"s":"民宿多由家庭擁有及經營，房價包含早餐，主人亦會提供當地資訊，讓旅客體驗地道生活。"},{"t":"2-1","c":"服務式住宅","k":["服務式住宅","服務式公寓","月租","長住"],"s":"服務式住宅供長期住客入住，設有廚房設施，清潔服務較少，房價一般較同質素的酒店低。"},{"t":"2-1","c":"膠囊酒店","k":["膠囊"],"s":"膠囊酒店以細小的膠囊式床位提供住宿，價錢便宜，屬特色酒店的一種。"},{"t":"2-3","c":"無障礙客房","k":["無障礙客房","無障礙房","扶手","緊急按鈕","緊急召喚"],"s":"無障礙客房為殘疾顧客而設，設有扶手、緊急按鈕、火警顯示燈及向外開的門，多位於低樓層近升降機，亦適合長者。"},{"t":"2-3","c":"行政樓層","k":["行政樓層","行政酒廊","行政客房","貴賓酒廊"],"s":"行政樓層住客可享特快入住登記及免費使用行政酒廊的茶點和商務設施，主要服務商務及高消費客人。"},{"t":"2-4","c":"房間計價方法","k":["包早餐","連早餐","早餐","半膳","全膳","含早"],"s":"房間計價方法包括歐式（只包房間）、歐陸式（連早餐）、修正美式（連兩餐）及美式（連三餐）計價。","w":0.8},{"t":"2-4","c":"顧客類別","k":["團體價","公司價","商務價","散客","會員價"],"s":"酒店按顧客類別訂定房價，例如與公司簽約的公司價、旅行團的團體價及航空公司價；沒有預訂的散客則多付正價。"},{"t":"2-6","c":"特許經營","k":["特許經營","加盟","特許"],"s":"特許經營讓投資者使用特許經營權擁有者的品牌及業務模式，按嚴格準則自行經營，但須繳交加盟費及持續經營費。"},{"t":"2-6","c":"管理合約","k":["管理合約","酒店管理公司","酒店集團管理"],"s":"管理合約指業主聘請酒店管理企業經營其物業；業主可得專業知識及品牌知名度，但失去營運控制權。"},{"t":"2-6","c":"獨立擁有及經營","k":["獨立酒店","家族經營","家族擁有"],"s":"獨立擁有及經營的酒店沒有與其他酒店聯營，由擁有人自行管理，對營運有最大的控制權。"},{"t":"2-7","c":"工程部","k":["維修","維修保養","冷氣機","水電","技術員","升降機維修"],"s":"工程部屬後勤部門，負責酒店電力、水管、空調及升降機等設施的維修保養。"},{"t":"2-7","c":"前線部門","k":["前線","面對客人","接觸客人"],"s":"前線部門是顧客可接觸及看見的部門，例如款接部、餐廳、禮賓部及行李服務，直接影響顧客的體驗。"},{"t":"2-7","c":"後勤部門","k":["後勤","後台","員工通道","員工專用"],"s":"後勤部門較少與顧客直接接觸，例如廚房、管家部、人力資源部及工程部，支援前線部門運作。"},{"t":"2-8","c":"離開","k":["退房","寄存行李","結帳離開","離開酒店","CHECKOUT"],"s":"離開階段客人辦理退房及結帳，酒店可提供行李寄存服務，並更新客房狀況及顧客紀錄。"},{"t":"2-8","c":"入住","k":["叫醒","保險箱","客房服務","送餐","住客"],"s":"入住階段客人會使用各種服務，例如叫醒服務、保險箱、客房餐飲及查詢；酒店亦須妥善處理客人的投訴。"},{"t":"2-9","c":"訂房部","k":["訂房","預訂房間","網上訂房"],"s":"訂房部負責處理客房預訂，並可能以超額預訂盡量客滿，減少客人預訂後缺席的損失。"},{"t":"2-9","c":"電話通訊部","k":["電話","接線","總機"],"s":"電話通訊部提供一站式電話服務及叫醒服務，保障住客私隱，亦是酒店的緊急通訊中心。","w":0.8},{"t":"2-10","c":"客房樓層","k":["房務員","執房","清潔客房","開床","鋪床","床鋪"],"s":"客房樓層的房務員負責清潔客房、開床服務及報告故障；清潔程度是顧客選擇酒店的首要因素。"},{"t":"2-10","c":"洗衣房","k":["洗衣","熨衫","乾洗"],"s":"洗衣房負責洗熨酒店布草、員工制服及住客衣物。"},{"t":"2-11","c":"酒店市場","k":["酒店餐廳","酒店自助餐","酒店咖啡","酒店酒吧","宴會廳"],"s":"酒店市場指酒店內的餐飲服務，例如餐廳、酒吧、宴會及客房餐飲，服務住客及外來顧客。"},{"t":"2-11","c":"醫護市場","k":["醫院","病人","安老院","護老院"],"s":"醫護市場指醫院及護理機構的餐飲服務，須嚴格控制食物以配合病人的需要。"},{"t":"2-11","c":"商業及工業市場","k":["員工飯堂","公司飯堂","工廠","職員餐廳"],"s":"商業及工業市場指公司及工廠為員工提供的餐飲服務，例如員工飯堂。"},{"t":"2-15","c":"二氧化碳式滅火筒","k":["二氧化碳"],"s":"二氧化碳式滅火筒以排擠空氣滅火，適用於電火及易燃液體，亦不會損壞電子儀器及文件，但在密閉空間使用可引致窒息。","n":["滅火","火"]},{"t":"2-15","c":"乾粉式滅火筒","k":["乾粉"],"s":"乾粉式滅火筒適用於大多數火警，但使用後會降低能見度。"},{"t":"2-15","c":"水式滅火筒","k":["水劑","水式"],"s":"水式滅火筒以降溫滅火，適用於木材、紙張及紡織品火警，切勿用於電火、易燃液體或金屬火警。","n":["滅火","火"]},{"t":"2-15","c":"泡沫式滅火筒","k":["泡沫"],"s":"泡沫式滅火筒以泡沫隔絕燃燒中液體的表面，適用於易燃液體火警，但切勿用於電火。","n":["滅火","火"]},{"t":"2-16","c":"沙門氏菌","k":["生雞蛋","生蛋","半熟蛋","溫泉蛋","溏心蛋","生雞"],"s":"沙門氏菌常見於生的肉類及未經煮熟的蛋類製品，病徵包括發燒、腹痛及腹瀉；加熱至70°C可殺死細菌。"},{"t":"2-16","c":"副溶血性弧菌","k":["海鮮","刺身","生蠔","魚生","貝殼","海產"],"s":"副溶血性弧菌常見於海產及介貝類水產動物，進食未煮熟的海鮮可能引致食物中毒。","w":0.8},{"t":"2-16","c":"金黃葡萄球菌","k":["傷口","膠布"],"s":"金黃葡萄球菌存在於人的皮膚、毛髮、鼻腔及傷口，其毒素耐熱；食物處理人員應以防水膠布覆蓋傷口。"},{"t":"2-16","c":"李斯特菌","k":["沙律","芝士","凍肉","冷盤"],"s":"李斯特菌可存在於軟芝士、即食凍肉及沙律等食物，並能在雪櫃的低溫下生長。","w":0.8},{"t":"2-17","c":"","k":["食物安全","食安","衞生標準","衞生牌照","食環署"],"s":"食物安全五要點包括精明選擇、保持清潔、生熟分開、煮熟食物及安全溫度，可減低食物中毒的風險。"},{"t":"x:款待業","c":"文化多樣性","k":["多國語言","不同國籍","不同文化","外籍","素食選擇","清真"],"s":"款待業具文化多樣性，須照顧不同文化背景顧客的需要，例如為素食者提供素食、為穆斯林提供不含豬肉的食物。","w":0.8},{"t":"x:款待業","c":"勞工密集","k":["很多員工","好多員工","人手","大量員工"],"s":"款待業勞工密集，需要大量員工提供服務；員工的質素往往比有形產品更影響顧客的體驗。"},{"t":"x:款待業","c":"產品服務組合","k":["有形","無形","服務態度","友善態度"],"s":"款待業提供產品服務組合：有形部分如食物、裝潢，無形部分如舒適環境、友善態度，兩者共同構成顧客的體驗。","w":0.7},{"t":"x:餐廳類型","c":"高級餐廳","k":["高級餐廳","米芝蓮","西裝","衣著要求","燭光","服務費","餐酒","法國菜","FINEDINING"],"s":"高級餐廳提供自選餐單、即點即煮，職員與顧客比率高、翻檯率低，並有衣著要求及收取服務費，氣氛高貴典雅。"},{"t":"x:餐廳類型","c":"咖啡室","k":["咖啡室","咖啡店","CAFE","咖啡館","COFFEE"],"s":"咖啡室提供簡單餐單及自助點餐，座位舒適、燈光暖色，鼓勵顧客逗留，部分設開放式廚房。"},{"t":"x:餐廳類型","c":"快餐店","k":["快餐","麥當勞","肯德基","大家樂","大快活","美心MX","漢堡"],"s":"快餐店菜式有限，由中央廚房半加工，服務快捷、翻檯率高，並以艷麗色彩、醒目標誌及制服建立品牌形象。"},{"t":"x:餐廳類型","c":"自助食堂","k":["飯堂","食堂","自助食堂","櫃檯取餐","取餐"],"s":"自助食堂讓顧客在櫃檯排隊選取食物，翻檯率高、員工與顧客比例低，常見於學校、醫院及公司。"},{"t":"x:餐廳類型","c":"特色餐廳","k":["特色餐廳","素食餐廳","有機餐廳","泰國菜","越南菜","日本菜","韓國菜","地方菜","日本餐廳","日式","和風","韓式","泰式餐廳"],"s":"特色餐廳以單一種類食物或地方菜為主，亦有針對健康、有機、素食等小眾市場的餐廳。"},{"t":"x:餐廳類型","c":"主題餐廳","k":["主題餐廳","懷舊","老香港","復古","主題裝飾"],"s":"主題餐廳以概念凌駕一切，由建築、食物、音樂到感覺都配合主題，例如懷舊、運動、電影及生態主題。"},{"t":"x:餐廳類型","c":"酒吧","k":["酒吧","啤酒","雞尾酒","紅酒","酒精"],"s":"酒吧主要供應酒精飲品，燈光較昏暗，只招待18歲以上人士。","w":0.8},{"t":"x:餐廳類型","c":"休閒餐廳","k":["休閒餐廳","家庭餐廳","茶餐廳","大排檔"],"s":"休閒餐廳價錢中等、氣氛輕鬆，適合家庭及朋友聚會；茶餐廳、大排檔等亦反映香港的地道飲食文化。"},{"t":"x:餐單","c":"套餐","k":["套餐","午市","A餐","B餐","常餐","快餐"],"s":"套餐（非選擇性餐單）以預定次序上菜，食材種類較少、可大量採購及預先準備，成本較低、翻檯率較高。","w":0.9},{"t":"x:餐單","c":"自選餐","k":["散餐","單點","自選"],"s":"自選餐餐單讓客人從列表中自由選擇菜式，每項獨立定價，選擇較多，但採購及準備較複雜。"},{"t":"x:餐單","c":"兒童餐單","k":["兒童餐","小童餐"],"s":"兒童餐單份量較少，常加入謎語、圖畫等設計吸引小朋友，主題餐廳尤其常見。"},{"t":"x:餐單","c":"自助餐","k":["自助餐","自助早餐","自助午餐","自助晚餐","任食","放題","BUFFET"],"s":"自助餐以一個價錢任食，食物預先煮好讓客人自取，能有效服務大量客人，但容易造成食物浪費。"},{"t":"x:餐單","c":"是日精選","k":["是日精選","今日推介","今日精選","廚師推介"],"s":"是日精選是餐廳每天推介的菜式，可配合時令食材，亦可推銷特色菜式。"},{"t":"x:景點類型","c":"自然景點","k":["海灘","沙灘","山頂","山脈","郊野","濕地","瀑布","岩石","石頭","海岸","樹林","森林","紅樹林","小島","島嶼","小溪","河流","湖泊","水塘","地質","自然"],"s":"自然景點由大自然形成，例如海灘、山嶺、濕地及地質地貌；旅客可欣賞景色、觀察動植物或進行康樂活動。","w":0.8},{"t":"x:景點類型","c":"人工但非為吸引旅客而建","k":["教堂","廟宇","廟","寺","祠","警署","街市","碼頭","舊建築","歷史建築","前身","以前是","圍村","圍屋","天星小輪","村落","大學","學校","政府","天星","電車"],"s":"「人工」但非為吸引旅客而建的景點，原本建造目的並非旅遊，例如歷史建築、宗教建築、街市及碼頭，後來才吸引旅客到訪。"},{"t":"x:景點類型","c":"人工並為吸引旅客而建","k":["主題公園","樂園","摩天輪","星光大道","觀景台","纜車","遊樂場","水族館","博物館","展覽館","景點"],"s":"「人工」並為吸引旅客而建的景點，專為招徠旅客而設計興建，例如主題公園、摩天輪、星光大道及博物館。"},{"t":"x:景點類型","c":"特別活動（盛事）","k":["慶典","舞獅","舞龍","節日","節慶","盛事","嘉年華","比賽","賽事","煙花","音樂會","巡遊","太平清醮","龍舟","藝術節","展覽會","市集"],"s":"特別活動是短暫、有限期的景點，例如體育賽事、文化節慶及商業展覽，可分為運動、文化及商業等類別。"},{"t":"x:景點類型","c":"文化景點","k":["歷史","博物館","古蹟","傳統","手工藝","宗教","戲曲","藝術 let reopening = null;

function req(store, mode, fn, again){
  return new Promise(res => {

      if (over) return; over = true;
      if (lost && !again) return reopen().then(ok => (ok ? req(store, mode, fn, true) : undefined)).then(res);
      if (mode === "readwrite" || lost) logErr("idb", store + " " + (name || "寫入失敗"), false);
      res(undefined);
    };
    try {
      const t = idb.transaction(store, mode); const q = fn(t.objectStore(store));

function setURL(key, blob){ const old = urlCache.get(key); if (old) { try { URL.revokeObjectURL(old); } catch (e) {} } const u = URL.createObjectURL(blob); urlCache.set(key, u); return u; }
function resetPhotoCache(){ for (const u of urlCache.values()) { try { URL.revokeObjectURL(u); } catch (e) {} } urlCache.clear(); want.clear(); missing.clear(); failN.clear(); }
function dropURLs(id){ ["s","l"].forEach(z => { const k = id + "|" + z, u = urlCache.get(k); if (u) { try { URL.revokeObjectURL(u); } catch (e) {} urlCache.delete(k); } }); }
async function localURL(id, size){
  const key = id + "|" + size;
  if (urlCache.has(key)) return urlCache.get(key);
  if (!isStudent()) return null;
  const p = await getOne("photos", id);
  const data = p && (size === "l" ? p.full : (p.thumb || p.full));
  return data ? setURL(key, asBlob(data)) : null;
}
function hydrate(root){
  root.querySelectorAll("img[data-photo]").forEach(async img => {
    const id = img.dataset.photo, size = img.dataset.size || "s";
    const u = await localURL(id, size);
    if (u) { img.src = u; return; }
    if (size === "l") { const s = await localURL(id, "s"); if (s && !img.getAttribute("src")) img.src = s; }
    if (missing.has(id + "|" + size)) { if (!img.getAttribute("src")) markEl(img, "miss"); return; }
    wantPhoto(id, size);
  });
}
// 相片未上載／載入失敗：喺相框顯示文字，唔好淨係一格空白
function markEl(img, state){
  const box = img.parentElement;
  if (!box || !box.matches(".phbtn, .pola, .slot")) return;
  box.classList.toggle("ph-miss", state === "miss"); box.classList.toggle("ph-fail", state === "fail");
}
function markPhoto(id, size, state){
  document.querySelectorAll('img[data-photo="' + id + '"]').forEach(img => { if ((img.dataset.size || "s") === size && !img.getAttribute("src")) markEl(img, state); });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function wantPhoto(id, size){
  const key = id + "|" + size;
  if (!S.session || want.has(key) || missing.has(key)) return;
  want.set(key, {id, size});
  clearTimeout(wantT); wantT = setTimeout(pumpPhotos, 50);
}
async function pumpPhotos(){
  if (pumping) return; pumping = true;
  try {
    while (want.size && S.session) {
      const size = want.values().next().value.size;
      // 每次少量：第一批相片快啲出現；網絡慢或者伺服器繁忙就等一陣再試，唔好即刻放棄
      const batch = [...want.values()].filter(w => w.size === size).slice(0, size === "l" ? 2 : 6);
      let res = null;
      for (let i = 0; i < 3 && !res && S.session; i++) {
        try { res = await api("getPhotos", {ids: batch.map(w => w.id), size}); }
        catch (e) { if (e.code === "auth") break; await sleep(1500 * (i + 1)); }
      }
      // 伺服器話「冇呢張相」＝仲未上載（仲喺學生手機）；讀取失敗就下次再試
      const got = res ? res.photos || {} : {};
      const gone = new Set(res ? (res.missing || (res.failed ? [] : batch.map(w => w.id).filter(x => !got[x]))) : []);
      for (const w of batch) {
        const key = w.id + "|" + w.size; want.delete(key);
        const ph = got[w.id];
        if (!ph) {
          if (gone.has(w.id)) { missing.add(key); markPhoto(w.id, w.size, "miss"); continue; }
          const n = (failN.get(key) || 0) + 1; failN.set(key, n);
          if (res && n < 3) { setTimeout(() => wantPhoto(w.id, w.size), 2500 * n); continue; }   // 伺服器讀取失敗：隔一陣自動再試
          markPhoto(w.id, w.size, "fail"); continue;
        }
        failN.delete(key);
        const buf = b64ToBuf(ph.data);
        if (isStudent()) {
          const p = (await getOne("photos", w.id)) || {id: w.id, w: ph.w, h: ph.h, remote: true, thumb: null, full: null};
          if (w.size === "l") p.full = buf; else p.thumb = buf;
          await put("photos", p);
        }
        const u = setURL(key, asBlob(buf));
        document.querySelectorAll('img[data-photo="' + w.id + '"]').forEach(img => { if ((img.dataset.size || "s") === w.size || !img.getAttribute("src")) { img.src = u; markEl(img, ""); } });
      }
    }
  } finally { pumping = false; }
}
async function dropPhoto(id){ if (!id) return; await del("photos", id); dropURLs(id); }

function loadImg(url){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("未能讀取圖片")); i.src = url; }); }
function freeCanvas(c){ if (c) { c.width = 0; c.height = 0; } }   // iPhone 限制 canvas 總記憶體，用完即刻釋放
async function drawJPEG(src, max, q){
  const w0 = src.naturalWidth || src.width, h0 = src.naturalHeight || src.height, s = Math.min(1, max / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * s)), h = Math.max(1, Math.round(h0 * s));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  if (!g) { freeCanvas(c); throw new Error("canvas 無法使用（原圖 " + w0 + "×" + h0 + "）"); }
  g.drawImage(src, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
  if (!blob) { freeCanvas(c); throw new Error("壓縮失敗（原圖 " + w0 + "×" + h0 + "）"); }
  return {blob, w, h, c};
}
const isHeic = f => /hei[cf]/i.test(f.type || "") || /\.hei[cf]$/i.test(f.name || "");
const HEIC_MSG = "這張相片是 HEIC 格式，這部手機的瀏覽器讀取不到。請在相機設定關閉「高效率相片」（HEIF），之後拍攝的相片就可以使用；或者選擇其他相片。";
async function makePhoto(file){
  const url = URL.createObjectURL(file);
  let img = null, bmp = null, full = null, thumb = null;
  try {
    try { img = await loadImg(url); }
    catch (e) {
      // 有啲相 <img> 讀唔到（例如部分 Android 手機嘅 HEIC 相），試多一個方法
      try { if (window.createImageBitmap) bmp = await createImageBitmap(file, {imageOrientation: "from-image"}); } catch (e2) {}
      if (!bmp) throw Object.assign(new Error((isHeic(file) ? "HEIC 相片" : "未能讀取圖片") + "（" + (file.type || "未知格式") + "）"), {heic: isHeic(file)});
    }
    full = await drawJPEG(img || bmp, 1080, 0.75);   // 壓縮細啲：上載快啲，老師用手機睇都輕鬆
    if (img) { img.src = ""; img = null; }        // 手機原相可達數千萬像素，縮細之後即刻放手
    if (bmp) { try { bmp.close(); } catch (e) {} bmp = null; }
    thumb = await drawJPEG(full.c, 480, 0.7);    // 縮圖由已縮細嘅相再縮，唔再用原相
    return {id: uid(), full: await asBuf(full.blob), thumb: await asBuf(thumb.blob), w: full.w, h: full.h, remote: false};
  } finally {
    if (img) img.src = "";
    if (bmp) { try { bmp.close(); } catch (e) {} }
    freeCanvas(full && full.c); freeCanvas(thumb && thumb.c);
    URL.revokeObjectURL(url);
  }
}
// 相片以 ArrayBuffer 存入 IndexedDB（部分 iPhone 版本存 Blob 之後會讀唔返）
const asBlob = x => (x instanceof Blob ? x : new Blob([x], {type: "image/jpeg"}));
async function asBuf(x){
  if (!x || x instanceof ArrayBuffer) return x || null;
  if (x.arrayBuffer) return await x.arrayBuffer();
  return await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(x); });
}
function bufToB64(buf){ const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToBuf(b64){ const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }

function logErr(kind, msg, persist = true){

/* ── 分數：自己開嘅考察＝考察分（老師評分，滿分 10，未評當 10）；
   老師考察點＝紀錄點分（每個有相或描述嘅紀錄點 1 分，上限係老師要求嘅數目；老師可以改）。再加題目分（自動評分）＝總分 ── */
const fmtN = n => String(Math.round((Number(n) || 0) * 10) / 10);
function siteOf(t, responses){
  if (!t || !t.siteId) return null;
  const r = responses.find(x => x.qsetId === t.siteId && x.qset);
  return r ? r.qset : {nPts: t.nPts || 0, code: t.siteCode || "", title: t.place};
}
function recCount(tid, points){ return tripPoints(tid, points).filter(p => p.photos.length || (p.note || "").trim()).length; }
function tripScore(map, t, points, responses){
  const q = siteOf(t, responses), n = q ? q.nPts || 0 : 0, v = map && map[t.id], set = typeof v === "number";
  if (n) { const c = recCount(t.id, points); return {label: "紀錄點分", v: set ? v : Math.min(c, n), max: n, site: true, sub: set ? "老師評分" : "已完成 " + c + " 個"}; }
  return {label: "考察分", v: set ? v : 10, max: 10, site: false, sub: "老師評分"};
}
function tripQ(responses, id){
  const q = {score: 0, max: 0, pending: 0};
  responses.filter(r => r.tripId === id && r.qset && r.status !== "deleted").forEach(r => {
    q.max += qTotal(r.qset);
    if (r.status === "submitted") q.score += Number(r.score) || 0; else q.pending++;
  });
  return q;
}
function scoreStripHTML(a, q){
  const total = Math.round((a.v + q.score) * 10) / 10, max = a.max + q.max, pct = Math.round(total / max * 1000) / 10;
  return '<section class="scorestrip" aria-label="分數">' +
    '<div><span class="k">' + a.label + '</span><b>' + fmtN(a.v) + '<small>/' + a.max + '</small></b><span class="sub">' + esc(a.sub) + '</span></div>' +
    '<div><span class="k">題目分</span><b>' + (q.max ? fmtN(q.score) + '<small>/' + fmtN(q.max) + '</small>' : '—') + '</b><span class="sub">' + (!q.max ? '未有題目' : q.pending ? q.pending + ' 組未提交' : '自動評分') + '</span></div>' +
    '<div class="total"><span class="k">總分</span><b>' + fmtN(total) + '<small>/' + fmtN(max) + '</small></b><span class="sub">' + pct + '%</span></div></section>';

async function workBlocks(t){

  P("h1", "紀錄點");

  for (const p of pts) {
    P("h2", "紀錄點 " + pad(p.seq) + "　" + fmtTime(p.time));

    if (pics.length) B.push({k: "pics", pics});

    }
    const m = normMatch(p.match);

        P("body", [[(it.c || it.t), {b: 1}], ["（" + BOOK_TAG(it.b) + "・" + it.t + "）", {c: "#6B6F78"}]]);

      if (st.bar) { g.fillStyle = st.bar; g.fillRect((left - 8) * PDF_SC, bgTop * PDF_SC, 3 * PDF_SC, bgH * PDF_SC); }
      let x = (left + (st.bg && !st.bar ? 0 : pad / 2)) * PDF_SC;
      lines[i].forEach(seg => {
        g.font = font(Object.assign({}, st, seg.f.b ? {b: 1} : {})); g.fillStyle = seg.f.c || st.color;
        g.fillText(seg.tok, x, (top + st.size * 1.1 + (lineH - st.size * 1.25) / 2) * PDF_SC); x += seg.w;
      });
      y += lineH;
    }
    if (st.rule) { g.fillStyle = st.rule; g.fillRect(PDF_M * PDF_SC, (y + 1) * PDF_SC, (PDF_W - 2 * PDF_M) * PDF_SC, 1.5 * PDF_SC); y += 4; }
    y += (st.bg ? pad / 2 : 0) + (st.after || 0);
