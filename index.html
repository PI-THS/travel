}
// 將每頁 JPEG 砌成 PDF（每頁一張圖，鋪滿 A4）
function pdfFromJpegs(pages, pw, ph){
  const parts = [], offs = [];
  let pos = 0;
  const add = x => { const u = typeof x === "string" ? utf8(x) : x; parts.push(u); pos += u.length; };
  const obj = (n, body) => { offs[n] = pos; add(n + " 0 obj\n"); body(); add("\nendobj\n"); };
  add("%PDF-1.4\n"); add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  const n = pages.length, kids = pages.map((_, i) => (3 + i * 3) + " 0 R").join(" ");
  obj(1, () => add("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2, () => add("<< /Type /Pages /Kids [" + kids + "] /Count " + n + " >>"));
  pages.forEach((jpg, i) => {
    const p = 3 + i * 3, cs = "q " + PDF_W + " 0 0 " + PDF_H + " 0 0 cm /Im0 Do Q";
    obj(p, () => add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PDF_W + " " + PDF_H + "] /Resources << /XObject << /Im0 " + (p + 2) + " 0 R >> >> /Contents " + (p + 1) + " 0 R >>"));
    obj(p + 1, () => { add("<< /Length " + cs.length + " >>\nstream\n"); add(cs); add("\nendstream"); });
    obj(p + 2, () => { add("<< /Type /XObject /Subtype /Image /Width " + pw + " /Height " + ph + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpg.length + " >>\nstream\n"); add(jpg); add("\nendstream"); });
  });
  const xref = pos, total = 3 + n * 3;
  add("xref\n0 " + total + "\n0000000000 65535 f \n");
  for (let i = 1; i < total; i++) add(String(offs[i]).padStart(10, "0") + " 00000 n \n");
  add("trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
  return new Blob(parts, {type: "application/pdf"});
}
// 存入手機：一般瀏覽器直接下載；iPhone「加入主畫面」app 或其他 app 內置瀏覽器下載唔到，改用分享（可揀「儲存到檔案」）
async function savePDF(blob, name){

}

// 呢部手機有另一個帳戶未上載嘅紀錄：唔好靜靜雞刪走，先問清楚
function vSwitch(){
  const w = S.swap;
  if (!w) return vLogin();
  const o = w.owner, me = w.d.me, who = (o.name || "另一位同學") + (o.cls ? "（" + codeOf(o.cls, o.no) + "）" : "");

    '<p class="fineprint">這部手機仍有 ' + w.n + ' 項屬於 ' + esc(who) + ' 的紀錄（例如相片）未上載。如果這是你的紀錄，請返回，用原本的帳戶登入，紀錄便會自動上載。</p>' +

}
// Google 登入掣：等 Google 個程式庫載入完先畫
let gReady = false, gWait = null;
function initGoogle(){
  const box = $("#gBtn"); if (!box || !GCID) return;
  const g = window.google && google.accounts && google.accounts.id;
  if (!g) {
    if (!gWait) gWait = Date.now();
    if (Date.now() - gWait > 12000) { box.innerHTML = '<p class="loading">未能載入，請重新整理</p>'; flashIn("未能載入 Google 登入。請檢查網絡，然後重新整理這一頁。"); logErr("gsi", "Google 登入程式庫載入失敗"); return; }
    return void setTimeout(initGoogle, 250);
  }
  if (!gReady) {
    g.initialize({client_id: GCID, callback: onGoogle, ux_mode: "popup", auto_select: false, cancel_on_tap_outside: true, itp_support: true});
    gReady = true;
  }
  box.innerHTML = "";
  g.renderButton(box, {type: "standard", theme: "filled_blue", size: "large", text: "signin", shape: "pill", logo_alignment: "left", locale: "zh-HK"});   // 細身掣：放得入封面空白位
}
async function onGoogle(resp){
  if (!resp || !resp.credential || S.route.name !== "login") return;
  flashIn(""); const box = $("#gBtn"); if (box) box.style.opacity = ".4";
  try {
    const d = await api("gLogin", {idToken: resp.credential});
    if (d.token) await startSession(d);
    else go("register", {ticket: d.ticket, email: d.email});
  } catch (e) { if (box) box.style.opacity = ""; flashIn(e.message); }
}

      '<div class="field kc kc-inv"><label for="rInvite">老師邀請碼</label><input id="rInvite" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="6 位數字" autocomplete="off">' +

    c = S.t[key] = {loading:true};

    api(action, params).then(d => { box[key] = {data:d}; }, e => { box[key] = {err:e.message}; }).then(() => {

      '<div class="field"><label for="qp' + i + '">參考答案（得分點）</label><textarea id="qp' + i + '" rows="4" maxlength="2500" placeholder="排隊／輪候／擠迫 —— 館內人多，旅客要排隊輪候，反映心理承載力。&#10;預約／分時段 —— 實行網上預約，控制人流。">' + esc(q.pts) + '</textarea>' +
        '<p class="hint">每行一個得分點，每點 1 分；可以寫多過答案數量，學生任答其中幾項即可。同一得分點的不同寫法以「／」分隔；「——」之後是示範答案，只供參考，不用作評分。</p></div>' +
      '<div class="btnrow"><button type="button" class="linkbtn" data-act="toqgen" data-i="' + i + '">' + ICON.book + '用出題助手重出這題</button>' +

    (d.qs.length < 10 ? '<button type="button" class="btn btn-ghost btn-block" data-act="addq">' + ICON.plus + '加一題</button>' : '') +
    '<fieldset class="modes"><legend>參考答案顯示方式</legend>' + ANS_MODES.map(([v, l]) => '<label class="check" for="qm_' + v + '"><input type="radio" name="qmode" id="qm_' + v + '" value="' + v + '"' + ((d.mode || "submit") === v ? ' checked' : '') + '><span>' + l + '</span></label>').join("") +
      '<p class="hint">揀第三項，儲存後系統會產生「答案編碼」。所有同學完成後，把答案編碼告訴學生；學生輸入後，每題答案下會以紅色顯示完整參考答案。</p></fieldset>' +
    (d.id && nResp ? '<p class="hint">已有 ' + nResp + ' 位學生作答。儲存後，已提交的答案會按修改後的參考答案重新評分。</p>' : '') +
    (S.flash ? '<p class="flash" role="alert">' + esc(S.flash) + '</p>' : '') +
    '</form></main>' +
    '<div class="dock"><button type="submit" form="qForm" class="btn btn-primary" id="qBtn">' + ICON.check + (d.id ? '儲存修改' : '儲存並產生考察點編碼') + '</button></div>';
}

題公園":{"t":"主題公園的成功因素","c":["教育與娛樂","互動體驗","整體環保設計","年長客群","整潔和舒適的環境","物有所值"]},"x:服務性質":{"t":"顧客服務的性質","c":["應變性","情緒性"]},"x:環境趨勢":{"t":"環境趨勢：住宿及飲食業","c":["環保酒店","減少紅肉","採購本地食品","可持續採購","減少廚餘","減少包裝廢棄物"]},"x:負責任旅遊":{"t":"環境保育及負責任旅遊","c":["生態旅遊","地質旅遊","負責任旅遊","良心旅客"]},"x:社會趨勢":{"t":"社會文化趨勢","c":["多代同遊","獨生子女家庭","樂活社群（LOHAS）"]},"x:經濟趨勢":{"t":"經濟趨勢","c":["無障礙旅遊","養生度假"]},"x:科技趨勢":{"t":"科技趨勢","c":["自助服務科技","電子餐牌","社交媒體"]},"x:全球化":{"t":"全球化","c":["大眾化旅遊","生產轉移"]}},"items":[{"tp":"1-1","cs":["旅遊推廣者","旅遊服務供應商"],"ty":[],"q":"根據旅遊業整合模式，指出{n}個你在{地}或附近觀察到的旅遊推廣者或旅遊服務供應商，並說明其角色。","a":[["旅發局／旅遊局／旅遊發展局／HKTB","旅遊推廣者：旅遊局（如旅發局）宣傳{地}，並提供地圖、單張等資訊。"],["旅行社／代理商／OTA／網上平台／代售","旅遊推廣者：旅行社或網上旅遊平台代售{地}的門票及套票。"],["旅行團／導遊／領隊／團體行程","旅遊推廣者：旅行團經營商把{地}納入整套行程，由導遊領隊帶團。"],["住宿／酒店住宿／住酒店／旅舍／賓館／度假村","旅遊服務供應商：{地}附近的酒店及旅舍為旅客提供住宿。"],["餐廳／餐飲／咖啡室／食肆／茶座","旅遊服務供應商：{地}內外的餐廳及咖啡室為旅客提供餐飲膳食。"],["交通／港鐵／巴士／的士／渡輪／航空","旅遊服務供應商：鐵路、巴士等交通運輸接載旅客往返{地}。"],["旅遊景點／景點及娛樂／娛樂／表演／遊樂設施","旅遊服務供應商：{地}本身是旅遊景點，為旅客提供參觀及娛樂。"]]},{"tp":"1-1","cs":["經濟因素","政治因素","社會因素","文化因素","環境因素","科技因素"],"ty":[],"q":"根據旅遊業整合模式，指出{n}項會影響{地}旅客人數的外在因素，並以例子加以說明。","a":[["經濟因素／經濟方面／經濟發展／經濟不景／匯率／通脹","經濟因素：經濟暢旺或匯率有利時，旅客較樂意花費到{地}旅遊。"],["政治／簽證／政策／外交／政局","政治因素：政局穩定或放寬簽證，旅客較放心到訪{地}。"],["社會因素／社會方面／治安／假期／人口老化／銀髮","社會因素：治安良好、假期增多及銀髮族增加，有利旅客到訪{地}。"],["文化因素／文化方面／文化特色／文化色彩／習俗／宗教","文化因素：{地}的文化色彩獨特而濃烈，能推動旅遊發展。"],["環境因素／環境方面／污染／空氣質素／環保／可持續","環境因素：空氣污染會阻礙旅客到訪；重視環保則有利可持續發展。"],["科技／互聯網／網上／手機／電子支付","科技因素：旅客可透過互聯網或手機程式預訂{地}的門票。"]]},{"tp":"1-1","cs":["旅遊推廣者"],"ty":[],"q":"{地}希望吸引更多旅客。根據旅遊業整合模式，建議{n}項可與旅遊推廣者合作的方法。","a":[["旅發局／旅遊局／旅遊發展局／盛事","與旅遊局合作，把{地}納入其宣傳及盛事活動，提高知名度。"],["旅行社／代理商／代售／網上平台／OTA","與旅行代理商及網上平台合作，代售{地}的門票及套票。"],["旅行團／納入行程／團體優惠／包團","與旅行團經營商合作，把{地}納入行程並提供團體優惠。"],["直接推銷／直銷／官方網站／社交媒體","與直接推銷商合作，透過網站及社交媒體直接向旅客推銷{地}。"],["會議策劃／會展／會獎／企業活動","與會議策劃者合作，為會獎旅客安排到{地}參觀或舉行活動。"]]},{"tp":"1-2","cs":["有時間性","離開原居地","自願","往返","性質"],"ty":[],"q":"以一位到訪{地}的旅客為例，說明「旅遊」的{n}項特性。","a":[["時間性／少於一年／不多於一年／一年內／短暫","有時間性：旅客只在{地}一帶短暫逗留，少於一年。"],["離開原居地／離開居住地／離開慣常／非原居地／離家","離開原居地：旅客離開居住的地方，前往{地}遊覽。"],["自願／自己選擇／被迫／自發","自願：旅客自願到{地}遊覽，有別於被迫流亡的難民。"],["往返／返回／回程／回家／回國","往返：旅客遊覽{地}後，最終會返回原居地。"],["性質／度假／公幹／升學／消閒／謀生","性質：旅客到{地}屬消閒度假性質，並非到當地謀生。"]]},{"tp":"1-2","cs":["本地旅客","國際旅客","短程旅遊（不過夜）"],"ty":[],"q":"根據你在{地}的觀察，指出{n}類不同的人士，並根據聯合國世界旅遊組織的定義，說明他們是否屬於旅客。","a":[["入境旅客／國際旅客／外國／海外／內地旅客／訪港","國際旅客：外地居民到訪{地}後會返回原居地，屬入境旅客。"],["本地旅客／本地居民／本地人／市民／本地遊","本地旅客：本地居民參加本地遊到訪{地}，屬本地旅客。"],["不過夜／即日／一日遊／短程／半日","短程旅客：即日來回{地}而不過夜的訪客，屬短程旅客。"],["住一晚／最少一晚／入住酒店／住酒店","過夜旅客：在{地}附近入住酒店最少一晚的訪客，屬過夜旅客。"],["職員／工作人員／保安員／謀生","非旅客：在{地}工作的職員屬謀生性質，不屬旅客。"],["過境／轉機／中轉","過境旅客：只在機場禁區內轉機而沒有入境，不計入到訪的旅客。"]]},{"tp":"1-3","cs":["公幹/商務旅遊","文化旅遊","環保旅遊","學習旅遊","宗教朝聖","保健旅遊","運動旅遊"],"ty":[],"q":"根據你的觀察，指出{地}可促進的{n}種旅遊形式，並以例證加以說明。","a":[["文化旅遊／文物／古蹟／傳統習俗／歷史建築／文化體驗","文化旅遊：旅客在{地}認識當地歷史及傳統，體驗不同文化。"],["學習旅遊／導賞／工作坊／講座／遊學／課程","學習旅遊：{地}設導賞及工作坊，旅客可從中獲得知識。"],["度假／閒暇／休閒／觀光／消閒／放鬆","閒暇／度假式旅遊：旅客在{地}觀光拍照、放鬆身心。"],["環保旅遊／生態／環保／大自然／自然風光／低碳","環保旅遊：旅客在{地}欣賞大自然，並盡量減低對環境的影響。"],["宗教／朝聖／寺廟／廟宇／教堂／參拜","宗教朝聖：旅客到{地}參拜宗教場所，滿足信仰需要。"],["保健／水療／溫泉／按摩／養生／SPA","保健旅遊：旅客在{地}享受水療、按摩等促進身心健康的服務。"],["運動旅遊／運動／行山／遠足／單車／賽事","運動旅遊：旅客在{地}參與行山、單車等運動或觀看賽事。"],["公幹／商務／開會／商貿／洽談","公幹／商務旅遊：商務旅客到{地}開會或洽談生意。"]]},{"tp":"1-3","cs":["文化旅遊"],"ty":[],"q":"建議{n}項{地}可推出的活動或安排，以吸引更多文化旅遊的旅客。","a":[["導賞／講解員／專題講解","舉辦導賞團，由導賞員講解{地}的歷史及文化背景。"],["工作坊／DIY／手作／傳統工藝","舉辦傳統工藝工作坊，讓旅客親手製作手工藝品。"],["表演／演出／節慶／戲曲／民俗","安排傳統表演或節慶活動，讓旅客體驗當地民俗。"],["語音導覽／語言／翻譯／外語","提供多語言語音導覽，方便不同國籍的旅客了解文化內涵。"],["VR／AR／擴增實境／虛擬實境／多媒體","運用VR或多媒體重現歷史場景，加深旅客對文化的認識。"],["紀念品／文創／手信／精品","推出具本土特色的文創紀念品，延續旅客的文化體驗。"],["地道美食／傳統美食／特色餐飲／傳統小食／主題餐廳","引入以傳統美食為主題的餐飲，讓旅客品嚐地道美食文化。"],["文化路線／聯票／步行路線／周邊景點","與周邊景點推出聯票或文化路線，豐富旅客的文化體驗。"]]},{"tp":"1-3","cs":["環保旅遊"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項有助推動環保旅遊的設施或措施。","a":[["回收／廢物分類／減廢／廚餘","{地}設回收箱進行廢物分類，減少送往堆填區的垃圾。"],["節能／省電／LED／太陽能／自然光","{地}使用LED燈、太陽能板等節能設施，減少耗電。"],["節水／省水／雨水／感應水龍頭","{地}安裝感應水龍頭或收集雨水，節約用水。"],["走塑／即棄／自備水樽／飲水機／重用","{地}設飲水機並推行走塑，鼓勵旅客自備水樽。"],["電子門票／無紙化／電子票／二維碼／QR","{地}採用電子門票及二維碼資訊，減少印製單張，推行無紙化。"],["綠化／植物／綠色建築／天台花園／種植","{地}大量綠化並種植植物，改善環境質素。"],["公共交通／步行／單車徑／電動車／低碳","鼓勵旅客乘公共交通或步行到{地}，實踐低碳旅遊。"],["環境教育／保育／生態導賞／展板","{地}設展板或生態導賞，推行環境教育，教導旅客愛護環境。"]]},{"tp":"1-3","cs":["學習旅遊"],"ty":[],"q":"到{地}考察屬於學習旅遊。根據你的觀察，指出{n}項有助旅客增進知識的安排。","a":[["導賞／講解員／導賞團","{地}提供導賞服務，由導賞員講解相關背景。"],["展板／說明牌／解說牌／文字介紹","{地}設展板及說明牌，以文字和圖片介紹相關資料。"],["互動／多媒體／觸控／VR／AR","{地}設互動屏幕及多媒體裝置，讓旅客從體驗中學習。"],["語音導覽／手機程式／APP／二維碼／QR","旅客可用語音導覽或掃描二維碼，自行深入了解內容。"],["工作坊／示範／DIY／親身體驗","{地}舉辦工作坊或示範，讓旅客親身體驗並掌握技能。"],["講座／分享會／研討會","{地}舉辦講座或分享會，由專家介紹相關專題。"],["工作紙／小冊子／教材／教育套","{地}提供工作紙及小冊子等教材，方便學校考察團使用。"]]},{"tp":"1-4","cs":["環境泡泡","旅行團群體旅客"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項為旅客營造「環境泡泡」的設施或服務。","a":[["語言／英文／外語／普通話／翻譯","{地}有多語言標示及服務，旅客毋須懂當地語言也能溝通。"],["連鎖餐廳／快餐／西餐／家鄉口味／熟悉的食物","{地}一帶有國際連鎖餐廳，提供旅客熟悉的家鄉口味。"],["導遊／領隊／旅行團","旅行團由導遊及領隊帶領，旅客遇到問題時有人解決。"],["旅遊巴／專車／接駁／穿梭巴士","{地}設旅遊巴上落點及穿梭巴士，旅客毋須自行乘搭當地交通。"],["信用卡／電子支付／流動支付／Wi-Fi","{地}接受信用卡及電子支付，並有免費Wi-Fi，如在家中一樣方便。"],["詢問處／服務台／諮詢中心／客務","{地}設詢問處及服務台，旅客有需要時可獲協助。"],["保安／閉路電視／安全措施","{地}有保安人員及閉路電視，令旅客感到安全。"],["連鎖酒店／國際酒店／舒適住宿","{地}附近有國際連鎖酒店，提供熟悉而舒適的住宿環境。"]]},{"tp":"1-4","cs":["旅行團群體旅客","個別的群體旅客","制度化旅遊"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項例證，分辨到訪的旅客屬高恆（Cohen）分類法中的旅行團群體旅客或個別的群體旅客。","a":[["導遊／領隊／旗幟／小旗／擴音器","旅行團群體旅客：由導遊或領隊拿着小旗帶領參觀{地}，依賴導遊解決問題。"],["旅遊巴／旅遊車／大巴","旅行團群體旅客：集體乘旅遊巴抵達{地}，交通由旅行社安排。"],["集合／固定行程／行程表／限時","旅行團群體旅客：行程固定，須按指定時間集合，對行程沒有決定權。"],["團章／襟章／貼紙／帽子／團體標誌","旅行團群體旅客：團友佩戴相同襟章或貼紙，以團體形式活動。"],["自由行／自行參觀／自己參觀／自行遊覽","個別的群體旅客：以自由行方式自行參觀{地}，可自行分配時間。"],["套票／機票連酒店／機加酒","個別的群體旅客：購買機票連酒店套票，交通食宿仍由旅行社安排。"],["地圖／語音導覽／手機導航／旅遊指南","個別的群體旅客：手持地圖或用語音導覽參觀，不受團體限制。"]]},{"tp":"1-4","cs":["探險式旅客","漫遊式旅客","非制度化旅遊"],"ty":[],"q":"如要吸引高恆（Cohen）分類法中的探險式旅客或漫遊式旅客到訪{地}一帶，建議{n}項可提供的安排。","a":[["民宿／青年旅舍／旅舍／寄宿","提供民宿或青年旅舍資訊，讓旅客入住民居，體驗日常生活。"],["地道食肆／街市／大排檔／茶餐廳","介紹{地}一帶的地道食肆及街市，讓旅客品嚐日常飲食。"],["公共交通／交通指南／路線圖／巴士路線","提供公共交通指南，方便旅客自行乘搭巴士、鐵路等日常交通工具。"],["當地人／居民／社區活動／街坊","舉辦社區活動，讓旅客與當地居民交流，融入當地生活。"],["當地語言／語言班／方言／粵語","開辦簡單的當地語言班，讓旅客嘗試說當地語言。"],["打工換宿／義工／散工／工作假期","提供打工換宿或義工機會，讓漫遊式旅客在當地工作以支付旅費。"],["冷門／深度遊／小眾／非傳統","推介{地}一帶冷門或非傳統的地點，滿足旅客的冒險精神。"]]},{"tp":"1-5","cs":["探奇型","接近探奇型"],"ty":[],"q":"建議{n}項{地}可推出的活動，以吸引蒲樂（Plog）分類法中的探奇型旅客。","a":[["冷門／小眾／鮮為人知／秘境／隱世","推出冷門或小眾路線，滿足探奇型旅客發掘新地方的心態。"],["當地人／居民／街坊／本地人／融入","安排旅客與當地居民交流，嘗試融入當地人的生活。"],["冒險／探險／刺激／挑戰／極限／動態","推出具挑戰性的動態活動，切合探奇型旅客的冒險精神。"],["自由探索／自行探索／自行安排／彈性","設計自由探索路線，讓旅客自行安排，享受彈性大的旅程。"],["幕後／後台／限定／新穎／獨家","開放幕後或限定體驗，讓旅客獲得新穎而獨特的經歷。"],["夜宿／露營／營地／簡樸","推出夜宿或露營體驗，探奇型旅客只要求簡單的住宿環境。"],["結識／新朋友／交友","舉辦小組探索聚會，讓外向的旅客結識新朋友。"]]},{"tp":"1-5","cs":["中庸型"],"ty":[],"q":"根據蒲樂（Plog）分類法，指出{n}項{地}能吸引中庸型旅客的特點，並加以解釋。","a":[["安全／保安／受控制／有秩序","{地}環境安全且有管理，切合中庸型旅客對安全的要求。"],["新體驗／新鮮感／新事物／嘗試新","{地}提供新鮮體驗而無需冒險，切合其願意嘗試新事物的性格。"],["舒適／冷氣／休息區／配套完善","{地}設施舒適齊全，切合中庸型旅客對舒適的要求。"],["家人／親友／朋友／一家大小／親子","{地}適合與家人朋友一同放鬆及娛樂，切合其喜好。"],["交通便利／交通方便／自由行／容易到達／港鐵","{地}交通便利，適合自由行，切合中庸型旅客的旅程安排。"],["當地文化／文化體驗／認識文化／導賞","{地}設導賞等，讓旅客與當地人有一定接觸，認識當地文化。"],["知名／著名／熱門／成熟","{地}是知名而成熟的景點，切合中庸型旅客對目的地的選擇。"]]},{"tp":"1-5","cs":["保守型","接近保守型"],"ty":[],"q":"建議{n}項{地}可作出的安排，以吸引蒲樂（Plog）分類法中的保守型旅客。","a":[["一站式／套票／全包／跟團","與旅行社推出一站式套票或旅行團，讓旅客跟團參觀。"],["預先安排／預約／固定行程／時間表","提供網上預約及固定的參觀時間表，讓旅程預先安排妥當。"],["保安／安全／閉路電視／急救","加強保安及急救設施，切合保守型旅客重視安全的性格。"],["連鎖／家鄉／熟悉的食物／快餐","引入國際連鎖餐廳，提供旅客熟悉的家鄉食物。"],["設施齊全／舒適／休息區／冷氣","設置舒適的休息區及齊全設施，令旅客感到舒適。"],["衞生／衛生／清潔／合乎標準","確保餐飲及洗手間清潔衞生、合乎標準，令旅客安心。"],["悠閒／輕鬆／傳統活動／觀光","提供傳統悠閒的觀光活動，而非刺激冒險的體驗。"]]},{"tp":"1-6","cs":["尊重人權","協助保護自然環境","尊重文化資源","遵守公平貿易原則","了解當地習俗"],"ty":[],"q":"根據聯合國世界旅遊組織的旅客行為守則，指出{n}項旅客到訪{地}時應有的行為，並以你觀察到的告示或安排加以說明。","a":[["文化資源／觸摸／閃光燈／文物／古蹟／飲食","尊重文化資源：遵守{地}請勿觸摸展品、不用閃光燈拍照的規定。"],["習俗／規範／禮儀／衣著／安靜／喧嘩","了解當地習俗：遵守{地}的規範，例如衣著得體、保持安靜。"],["垃圾／餵飼／採摘／野生動物／自然環境","協助保護自然環境：不亂拋垃圾、不餵飼野生動物、不採摘植物。"],["公平貿易／手工藝／當地產品／本地商戶／支持當地","遵守公平貿易原則：購買當地手工藝品及產品，支持當地經濟。"],["人權／剝削／歧視／私隱／肖像權","尊重人權：不歧視職員或其他旅客，未經同意不拍攝他人，尊重私隱。"],["法例／法律／違法／罰款／吸煙","熟悉當地法例：遵守{地}禁止吸煙等規定，避免觸犯法例。"],["開放態度／包容／寬容／多樣性／多元文化","對其他文化存開放態度：以寬容態度欣賞{地}展示的多元文化。"]]},{"tp":"1-6","cs":["罪行的可能性","人身安全","財務風險","健康","有特殊需要的旅客"],"ty":[],"q":"指出{n}項旅客到訪{地}時須關注的事項（風險），並以你觀察到的相關措施加以說明。","a":[["罪行／罪案／扒手／盜竊／治安／報警","罪行的可能性：人多時或有扒手，{地}有保安巡邏及報警求助途徑。"],["人身安全／走火通道／逃生／欄杆／防滑／急救","人身安全：留意{地}的走火通道、安全指示及急救設施，避免意外。"],["財務／財物／錢包／貴重物品／儲物櫃／信用卡","財務風險：小心保管財物及證件，可使用{地}的儲物櫃。"],["健康／衞生／衛生／中暑／防蚊／消毒","健康：注意{地}的衞生及天氣，預防中暑或蚊叮。"],["無障礙／輪椅／長者／孕婦／嬰兒／特殊需要","有特殊需要的旅客：{地}設無障礙通道及輪椅借用服務。"]]},{"tp":"1-6","cs":["有特殊需要的旅客"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項照顧有特殊需要旅客的設施或服務。","a":[["輪椅／無障礙／斜道／升降機／暢通易達／傷健","殘障旅客：{地}設無障礙通道、斜道及升降機，並借出輪椅。"],["點字／觸感／引路徑／視障／盲人","視障旅客：{地}設點字指示、觸感地圖及引路徑。"],["手語／字幕／聽障／助聽／感應環","聽障旅客：{地}提供手語導賞、字幕或助聽感應環。"],["育嬰室／嬰兒車／尿片／哺乳／兒童","嬰兒及兒童旅客：{地}設育嬰室並借出嬰兒車。"],["長者／老人／高齡／扶手／休息椅","高齡旅客：{地}設扶手及休息椅，並提供長者優惠。"],["孕婦／懷孕／優先座位","懷孕旅客：{地}設優先座位及優先通道，方便孕婦。"],["祈禱室／清真／素食／宗教","宗教信徒：{地}的餐廳提供清真或素食選擇，或設祈禱室。"]]},{"tp":"1-6","cs":["罪行的可能性","人身安全","財務風險","健康"],"ty":["overseas"],"q":"如你到{地}旅遊，建議{n}項可減低旅遊風險的預防措施。","a":[["分開存放／分開放／分散存放","財務風險：把信用卡、銀行卡及現金分開存放。"],["保險箱／夾萬／貴重物品","財務風險：把貴重物品存放於酒店保險箱。"],["影印本／副本／護照／證件","財務風險：小心保管旅行證件，並預先準備影印本。"],["持牌／正規商店／認可商戶","財務風險：只向持牌經營者購買商品及服務。"],["旅遊保險／購買保險／買保險","人身安全：出發前購買旅遊保險，保障意外及醫療開支。"],["藥物／疫苗／藥品／疫區","健康：攜帶所需藥物，如有需要先接種疫苗。"],["煮熟／食水／樽裝水／清洗","健康：進食未經煮熟的食物前應仔細清洗，避免飲用不潔食水。"],["緊急電話／旅遊警察／報警／罪案率／領事","罪行的可能性：避開罪案率高的地方，並保留緊急電話號碼。"]]},{"tp":"1-7","cs":["好奇心","快樂","健康","專業及公商務","自我/尊重的需求","親友交往","尋根","宗教信仰及精神審美"],"ty":[],"q":"根據赫曼（Hudman）的理論，指出{n}項吸引旅客到訪{地}的旅遊動機，並以你的觀察加以說明。","a":[["好奇／增廣見聞／求知／新奇／見識","好奇心：旅客到{地}增廣見聞，認識未曾接觸的事物。"],["快樂／開心／娛樂／打破刻板／玩樂","快樂：旅客在{地}參與有趣的活動，打破刻板的生活。"],["健康／放鬆身心／鬆弛／療養／減壓","健康：旅客在{地}休閒放鬆，有助促進身心健康。"],["公幹／商務／學術／遊學／開會","專業及公商務：旅客到{地}開會、進行學術交流或遊學。"],["尊重／羨慕／社經地位／炫耀／打卡","自我／尊重的需求：旅客在{地}打卡分享，獲得別人羨慕。"],["親友／探親／家人／朋友／聯繫感情","親友交往：旅客與家人朋友同遊{地}，聯繫感情。"],["尋根／祖先／家鄉／故鄉／家族／歸屬感","尋根：旅客到{地}了解祖先或家鄉的歷史文化，獲得歸屬感。"],["宗教／審美／朝聖／藝術／拜祭／精神滿足","宗教信仰及精神審美：旅客在{地}欣賞藝術及美好事物，獲得精神滿足。"]]},{"tp":"1-7","cs":["好奇心","快樂","健康","運動","自我/尊重的需求","親友交往","尋根","宗教信仰及精神審美"],"ty":[],"q":"建議{n}項{地}可推出的新活動，並指出每項活動能滿足旅客哪一項旅遊動機。","a":[["親子／家庭／一家大小","舉辦親子活動，讓一家人共度時光，滿足親友交往的動機。"],["導賞／導覽／講座／講解／工作坊","舉辦專題導賞團或講座，讓旅客增廣見聞，滿足好奇心。"],["瑜伽／靜觀／健體／伸展／冥想","舉辦瑜伽或靜觀活動，讓旅客放鬆身心，促進健康。"],["會員／貴賓／VIP／專享／尊享","推出會員專享活動，令旅客感到尊貴，滿足自我／尊重的需求。"],["音樂會／表演／演出／藝術節","舉辦音樂會或藝術表演，讓旅客欣賞美好事物，滿足精神審美。"],["跑步／單車／運動會／比賽／健行","舉辦跑步或單車活動，吸引旅客參與運動。"],["族譜／家族史／尋根／祖籍","舉辦族譜或家族史展覽，讓旅客尋根，了解家族淵源。"],["嘉年華／遊戲／市集／派對","舉辦嘉年華或市集，讓旅客打破刻板生活，尋求快樂。"]]},{"tp":"1-7","cs":["好奇心"],"ty":[],"q":"赫曼（Hudman）認為好奇心是最重要的旅遊動機。根據你在{地}的觀察，指出{n}項能滿足旅客好奇心的元素。","a":[["罕見／珍貴／獨一無二／國寶／稀有","{地}有罕見而珍貴的展品或景觀，旅客難以在別處看到。"],["新展覽／特別展／期間限定／更新","{地}定期推出新展覽或期間限定活動，吸引旅客探索。"],["互動／VR／AR／多媒體／觸控","{地}設互動及多媒體裝置，讓旅客親身探索新事物。"],["導賞／導覽／講解／解說","{地}的導賞服務講解背後故事，滿足旅客的求知慾。"],["異國／生活方式／當地生活／異地文化","旅客在{地}接觸有別於日常的異地文化及生活方式。"],["歷史故事／前身／由來／背景故事","{地}的前身及歷史故事，引起旅客探究的興趣。"],["建築／外觀／造型／裝潢","{地}的建築及外觀別具一格，吸引旅客細心觀賞。"]]},{"tp":"1-7","cs":["宗教信仰及精神審美"],"ty":["museum","heritage"],"q":"根據你在{地}的觀察，指出{n}項能滿足旅客「宗教信仰及精神審美」動機的元素。","a":[["藝術品／名畫／書法／雕塑／瓷器","{地}展出藝術品，旅客可欣賞美好事物，獲得精神上的滿足。"],["建築美／建築設計／園林／庭園","{地}的建築及園林設計優美，讓旅客欣賞其美感。"],["表演／演出／音樂／戲曲","{地}有音樂或戲曲表演，旅客可欣賞藝術表演。"],["參拜／上香／祈福／儀式／朝聖","旅客可在{地}參拜、祈福，滿足宗教信仰的需要。"],["寧靜／靜謐／平靜／心靈","{地}環境寧靜，讓旅客心靈得到平靜。"],["文物／古物／珍藏","{地}的文物珍藏展現昔日工藝之美，令旅客讚嘆。"],["美景／景色／山水","{地}的自然美景令旅客心曠神怡，獲得精神上的滿足。"]]},{"tp":"1-8","cs":["雙向往返模式","中轉圓形往返模式","圓形往返模式","幅射往返模式"],"ty":[],"q":"根據旅客流量概念下的行程模式，描述{n}種旅客把{地}納入行程時可能採用的行程模式。","a":[["雙向往返／雙向／同一路線／單一目的地","雙向往返模式：旅客以{地}所在地為單一目的地，以同一路線往返。"],["中轉圓形／中轉站／中轉","中轉圓形往返模式：以{地}所在城市為中轉站，圓形遊覽區內各地後返回中轉站。"],["沒有核心／多個目的地／多個城市／不同路線／環迴","圓形往返模式：{地}是多個目的地之一，沒有核心停留地，旅客以不同路線往返。"],["幅射／輻射／基地／集散中心","幅射往返模式：以{地}一帶為基地，到周邊作短程過夜旅遊後返回基地。"]]},{"tp":"1-8","cs":["幅射往返模式","中轉圓形往返模式"],"ty":["overseas","hotel","transport"],"q":"指出{n}項有利旅客以{地}一帶作為基地或中轉站，到周邊地區旅遊的條件。","a":[["交通樞紐／四通八達／機場／高鐵／交通便利","{地}一帶是交通樞紐，接近機場及鐵路，方便往返周邊地區。"],["住宿選擇／酒店選擇／不同價位／住宿","{地}一帶有不同價位的住宿選擇，方便旅客長時間留宿。"],["鄰近／距離近／一程多站／車程短","{地}鄰近多個目的地，車程短，可發展一程多站的行程。"],["免簽／簽證／通關／過關","前往周邊地區的簽證要求寬鬆、通關便利，方便旅客出入。"],["旅遊資訊／旅客諮詢／多語言／旅行社","{地}一帶有旅客諮詢中心及旅行社，方便安排短程旅遊。"],["治安／安全／穩定","{地}一帶治安良好、社會穩定，旅客可安心以此為據點。"],["購物／餐飲選擇／美食／夜生活","{地}一帶購物、美食及夜生活配套完善，旅客回程後仍可消遣。"]]},{"tp":"1-9","cs":["生理需要","安全需要","社交需要","尊重需要","自我實現需要"],"ty":[],"q":"根據馬斯勞（Maslow）需求定論，以你在{地}觀察到的設施或服務為例，說明旅客{n}個層次的需要如何得到滿足。","a":[["生理／洗手間／餐廳／飲水機／座椅／休息","生理需要：{地}設洗手間、餐廳及座椅，讓旅客飲食及休息。"],["安全／保安／欄杆／急救／閉路電視","安全需要：{地}有保安、閉路電視及急救設施，令旅客安心。"],["社交／歸屬感／親友／家人／朋友","社交需要：旅客可與親友同遊{地}，聯繫感情，獲得歸屬感。"],["尊重／會員／貴賓／VIP／禮貌／受重視","尊重需要：職員有禮貌地接待，會員享專屬優惠，令旅客受重視。"],["自我實現／增廣見聞／挑戰／成就感／發揮潛能","自我實現需要：旅客在{地}增廣見聞或完成挑戰，獲得成就感。"]]},{"tp":"1-9","cs":["社交需要"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項{地}如何滿足旅客的社交需要。","a":[["親子／家庭／一家大小／家人","{地}設親子活動及家庭設施，讓一家人共度時光，增進感情。"],["團體／小組／團友／導賞團","{地}提供團體導賞或小組活動，讓團友互相交流，獲得歸屬感。"],["共膳／聚餐／咖啡室／茶座／餐廳","{地}設餐廳及咖啡室，旅客可與親友閒談共膳。"],["友善／親切／熱情／笑容","{地}職員友善親切地接待旅客，令旅客有被接納的歸屬感。"],["結識／新朋友／交朋友／不同國籍","旅客可在{地}的活動中結識不同國籍的新朋友。"],["休憩空間／草地／廣場／野餐","{地}設廣場、草地等休憩空間，方便親友聚會。"]]},{"tp":"1-9","cs":["生理需要","安全需要"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項能滿足旅客生理需要或安全需要的設施或服務。","a":[["餐廳／餐飲／食肆／小食亭／咖啡室","生理需要：{地}設餐廳及咖啡室，滿足旅客飲食的需要。"],["洗手間／廁所／衞生間／衛生間","生理需要：{地}設足夠的洗手間，方便旅客。"],["座椅／長椅／休息區／座位","生理需要：{地}設座椅及休息區，讓旅客休息。"],["飲水機／飲用水／水機","生理需要：{地}設飲水機，讓旅客隨時補充水分。"],["冷氣／空調／遮蔭／涼亭","生理需要：{地}有冷氣或遮蔭位置，避免旅客中暑。"],["保安／閉路電視／CCTV／巡邏","安全需要：{地}有保安巡邏及閉路電視，保障旅客安全。"],["急救／醫療室／AED／除顫器","安全需要：{地}設急救站及除顫器，以應付突發意外。"],["走火通道／滅火筒／逃生／消防","安全需要：{地}有走火通道及滅火筒等消防設備。"]]},{"tp":"1-9","cs":["尊重需要","自我實現需要"],"ty":[],"q":"建議{n}項{地}可推出的服務或活動，以滿足旅客的尊重需要或自我實現需要。","a":[["會員／貴賓／VIP／尊享／專享","尊重需要：推出會員或貴賓專享服務，令旅客感到尊貴。"],["私人導賞／度身訂造／專人／個人化","尊重需要：提供私人導賞或個人化服務，令旅客受重視。"],["限量／獨家／珍藏版","尊重需要：推出限量紀念品，令旅客獲得別人羨慕。"],["挑戰／攀爬／闖關／極限","自我實現需要：推出具挑戰性的闖關活動，讓旅客突破自我。"],["工作坊／學習班／DIY／課程","自我實現需要：舉辦工作坊，讓旅客學習新技能，增廣見聞。"],["證書／徽章／成就／紀念證明","自我實現需要：完成任務後頒發證書，讓旅客獲得成就感。"],["義工／保育工作／貢獻／義務","自我實現需要：讓旅客參與義工或保育工作，發揮所長。"],["創作／作品展／比賽","自我實現需要：舉辦創作比賽，讓旅客發揮創意及潛能。"]]},{"tp":"1-10","cs":["拉動因素"],"ty":[],"q":"根據你的觀察，指出{n}項吸引旅客到訪{地}的拉動因素。","a":[["旅遊資源／展品／文物／景色／景觀／珍藏","{地}擁有獨特的旅遊資源，例如珍貴展品或優美景色。"],["建築／地標／外觀／特色設計","{地}的建築設計獨特，已成為地標，形象鮮明。"],["交通便利／交通方便／交通配套／鐵路站／容易到達／可達","{地}鄰近鐵路站，交通便利，容易到達。"],["優惠／免費／折扣／票價／價錢","{地}票價合理並有優惠，令旅客覺得物有所值。"],["節目／盛事／表演／特別展／節慶","{地}定期舉辦表演及特別展，增加吸引力。"],["餐飲／購物／紀念品店／商店／餐廳","{地}有餐廳及商店，旅客可一站式飲食購物。"],["宣傳／口碑／社交媒體／網紅／知名度","{地}透過社交媒體宣傳，知名度高，口碑良好。"],["清潔／整潔／治安／衞生／衛生","{地}環境整潔，治安良好，旅客可安心遊覽。"]]},{"tp":"1-10","cs":["推動因素","拉動因素"],"ty":[],"q":"指出{n}項可能推動旅客出外旅遊的推動因素，並說明{地}可如何以相應的拉動因素配合。","a":[["放鬆／減壓／逃離／逃避／鬆弛","放鬆減壓：旅客想逃離刻板生活，{地}悠閒的環境正好配合。"],["增廣見聞／好奇／求知／見識","增廣見聞：旅客渴望求知，{地}豐富的旅遊資源正好配合。"],["親友／家人／朋友／聯繫感情／相聚","與親友相聚：{地}適合一家大小同遊，配合聯繫感情的需要。"],["羨慕／自尊／炫耀／打卡／地位","獲得別人羨慕：{地}是著名打卡點，配合旅客追求自尊的需要。"],["新體驗／冒險／刺激／新鮮感","追求新體驗：{地}提供新奇的體驗，配合旅客尋求新鮮感的渴望。"],["健康／體能／運動／養生","促進健康：{地}可進行步行等活動，配合旅客鍛鍊體能的需要。"]]},{"tp":"1-10","cs":["拉動因素"],"ty":[],"q":"建議{n}項{地}可加強其拉動因素的方法，以吸引更多旅客到訪。","a":[["新展覽／新設施／新項目／翻新","定期推出新展覽或新設施，保持{地}的新鮮感。"],["盛事／節慶／嘉年華／表演","舉辦節慶及盛事，吸引旅客專程到訪{地}。"],["宣傳／社交媒體／網紅／KOL／廣告","透過社交媒體及網紅宣傳，提升{地}的知名度及形象。"],["優惠／套票／折扣／免費","推出優惠或套票，令旅客覺得物有所值。"],["接駁／穿梭巴士／交通配套／指示牌","增設穿梭巴士及清晰指示牌，提升{地}的可達度。"],["打卡位／打卡／裝置藝術／拍照位","在{地}設置特色打卡位，吸引旅客拍照分享。"],["聯票／一程多站／周邊景點／合作","與周邊景點合作推出聯票或一程多站路線。"],["服務質素／培訓／多語言／多種語言","加強員工培訓及多語言服務，提升服務質素。"]]},{"tp":"1-11","cs":["無形性","生產與消費不可分割性","差異性","不可保存性","互補性及替代性","不可擁有及不可轉移","需求與價格不固定","帶有風險"],"ty":[],"q":"以{地}為例，指出{n}項旅遊產品的特性，並以你的觀察加以說明。","a":[["無形／沒有實物／回憶／只餘下／不能觸摸","無形性：旅客參觀{地}後沒有實物，只餘下體驗和回憶。"],["不可分割／不可分離／同時進行／同時發生","不可分割性：導賞員講解時旅客同時接受服務，生產與消費同時進行。"],["差異／因人而異／質素不一／不同職員","差異性：不同職員的態度及經驗不同，旅客每次的感受也有差異。"],["不可保存／不能保存／無法保存／不能儲存／空置","不可保存性：{地}當日未售出的入場名額，不能保存至日後出售。"],["互補／替代／食住行／配套／代替","互補性：旅客到{地}需配合交通、餐飲等配套，一環出問題便影響體驗。"],["不可擁有／不能擁有／不可轉移／不能轉讓／擁有權","不可擁有及不可轉移：旅客只可使用{地}的服務，不能擁有或轉讓。"],["淡季／旺季／淡旺季／價格浮動／不固定","需求與價格不固定：{地}的人流及票價受假期、淡旺季等影響。"],["風險／不能試用／無法試用／先付款／先購買","帶有風險：旅客須先購票後參觀，不能試用，存在風險。"]]},{"tp":"1-11","cs":["無形性","生產與消費不可分割性","差異性","不可保存性","互補性及替代性","不可擁有及不可轉移","需求與價格不固定","帶有風險"],"ty":[],"q":"建議{n}項{地}可針對旅遊產品的特性而採取的策略，以改善旅客體驗。","a":[["虛擬導覽／網上預覽／宣傳短片／虛擬實境","無形性：推出網上虛擬導覽，讓旅客預先了解{地}的內容。"],["培訓／服務標準／服務指引／監督","差異性：加強員工培訓及訂立服務標準，確保服務質素一致。"],["語音導覽／自助導覽／網上資源／錄影","不可分割性：提供自助語音導覽，旅客毋須等候導賞員也能了解。"],["預約／分時段／限額／預訂系統","不可保存性：設網上預約及分時段入場，預測需求並善用名額。"],["差別定價／淡季優惠／平日優惠／旺季加價","需求與價格不固定：推出淡季或平日優惠，平衡淡旺季人流。"],["餐飲配套／商店／聯票／周邊合作","互補性：設餐飲配套及商店，並與周邊景點推出聯票。"],["紀念品／文創／手信／明信片","不可擁有：推出文創紀念品，讓旅客把回憶帶回家。"],["退款／改期／顧客評價／評分","帶有風險：提供退款或改期安排，並展示顧客評價，減低顧慮。"]]},{"tp":"1-11","cs":["互補性及替代性"],"ty":[],"q":"根據旅遊產品的互補性，指出{n}個與{地}互相影響的旅遊環節，並以你的觀察加以說明。","a":[["餐飲／餐廳／食肆／美食","食：旅客參觀{地}後多到附近餐廳用膳，兩者互相帶動。"],["住宿／酒店住宿／住酒店／旅舍／賓館／入住率","住：{地}的旅客增加，附近酒店住宿的入住率亦會上升。"],["交通／港鐵／巴士／的士／渡輪","行：交通服務若出現問題，旅客便難以到達{地}。"],["附近景點／其他景點／周邊景點／鄰近景點","遊：{地}與附近景點組成行程，一處吸引力下降會影響另一處。"],["購物／商店／紀念品／商場","購：旅客在{地}的商店購買紀念品，帶動零售生意。"],["娛樂／表演／夜生活／戲院","娛：{地}附近的娛樂及表演可延長旅客的逗留時間。"]]},{"tp":"1-11","cs":["不可保存性","需求與價格不固定"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項為應對淡旺季人流變化而推出的措施，並以旅遊產品的特性加以解釋。","a":[["預約／分時段／限額／預訂","不可保存性：設網上預約及分時段入場，善用每個時段的名額。"],["平日優惠／淡季優惠／折扣／減價","需求與價格不固定：推出淡季優惠及平日優惠，填補空置名額。"],["差別定價／加價／週末票價／高峰票價","需求與價格不固定：週末票價較高，需求暢旺時價格會調高。"],["年票／會員／季票","推出年票或會員計劃，鼓勵旅客在淡季重複到訪。"],["特別節目／夜間開放／延長開放／限定活動","淡季舉辦特別節目或夜間開放，刺激旅客需求。"],["套票／聯票／套餐","與酒店或其他景點推出套票，在淡季增加旅客人數。"]]},{"tp":"1-12","cs":["衰退階段"],"ty":[],"q":"假設{地}進入旅遊產品生命週期的衰退階段，建議{n}項可採取的營銷策略。","a":[["新市場／新客源／新客群／開拓市場","開拓新的市場：針對新客源，例如推出長者或親子專場。"],["革新／翻新／擴建／重建／更新設施","部署大革新：翻新或擴建{地}，更新老化的設施。"],["新特色／新主題／新展覽／新項目","發展產品新特色：加入新主題或新展覽，重新吸引旅客。"],["減價／促銷／優惠／折扣","減價促銷：推出折扣或優惠，刺激旅客到訪。"],["宣傳／社交媒體／廣告／重塑形象","加強宣傳：透過社交媒體及廣告重塑{地}的形象。"],["注資／合作／贊助／資助","尋求政府注資或與其他機構合作，增加發展資金。"],["服務質素／培訓／服務水平","提升服務質素：加強員工培訓，改善旅客體驗。"]]},{"tp":"1-12","cs":["開發階段","引入階段","成長階段","成熟階段","衰退階段"],"ty":[],"q":"以{地}為例，描述旅遊產品生命週期中{n}個階段的營運重點。","a":[["開發階段／市場調查／市場研究／只有開支","開發階段：投入資金設計及興建{地}，須做好市場調查。"],["引入階段／知名度／打響名堂","引入階段：{地}開幕初期須提高產品質素及知名度。"],["成長階段／品牌／獨特性／獨特形象／競爭對手","成長階段：面對更多競爭對手，{地}須建立獨特形象及品牌。"],["成熟階段／忠誠度／回頭客／再次光臨","成熟階段：{地}已有大群顧客，重點是維持顧客的忠誠度。"],["衰退階段／革新／減價促銷／新市場","衰退階段：{地}須變更營銷策略，如開拓新市場或大革新。"]]},{"tp":"1-13","cs":["發掘","投入","發展","鞏固","停滯","重生","衰落"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項現場特徵，並說明各項特徵反映{地}處於巴特勒旅遊目的地生命週期的哪一個階段。","a":[["人跡罕至／未開發／很少人／遊客稀少","發掘階段：{地}旅客稀少、旅遊設施很少，只有少量漫遊式或探險式旅客到訪。"],["居民經營／本地人經營／村民經營／士多／民宿","投入階段：當地居民開設士多或民宿招待旅客，本地人開始提供旅遊設施。"],["連鎖／國際品牌／外資／跨國企業／大集團","發展或鞏固階段：{地}有國際連鎖店及大企業進駐，外來企業逐漸主導旅遊業。"],["人山人海／擠迫／擠逼／排隊／多人／人很多","鞏固或停滯階段：{地}旅客眾多甚至擠迫，旅客人數已很多甚至達最高點。"],["殘舊／老化／陳舊／失修／過時","停滯階段：{地}部分設施殘舊老化，旅客滿意度下降。"],["回頭客／會員／年票／熟客","停滯階段：{地}以會員或年票吸引重遊，目的地非常倚賴回頭客。"],["翻新／活化／擴建／新景點／重新定位","重生階段：{地}經翻新、活化或擴建，以新投資及新設備重新吸引旅客。"],["空置／倒閉／結業／冷清","衰落階段：{地}店舖空置或結業、人流冷清，旅客人數與收益均下跌。"]]},{"tp":"1-13","cs":["停滯","重生"],"ty":[],"q":"假設{地}的旅客人數已達最高點，增長停滯，設施亦開始老化。參考巴特勒旅遊目的地生命週期，建議{n}項措施，讓{地}走向重生而非衰落。","a":[["翻新／更換設備／維修保養／修葺","投入新資金翻新或更換老化陳舊的設備，改善{地}的形象及旅客體驗。"],["新景點／新展區／擴建／新增設施","開發新景點、新展區或進行擴建，為旅客帶來新鮮感，吸引重遊。"],["重新定位／新市場／新客群／新客源","重新定位，開拓新的客源市場，例如吸引年輕旅客或家庭旅客。"],["社交媒體／宣傳／推廣／廣告","加強宣傳推廣，例如利用社交媒體介紹{地}的新面貌。"],["盛事／節慶／舉辦活動／限定活動／主題活動","舉辦盛事、節慶或期間限定活動，增加旅客再次到訪的理由。"],["投資者／引入資金／合作夥伴／聯乘","引入新的投資者或與品牌聯乘合作，帶來資金及新意念。"],["預約／限流／分流／控制人數／控制人流","解決承載力問題，例如以預約及分流控制人數，改善擠迫情況。"],["會員計劃／年票／套票／重遊優惠","推出年票、優惠套票或會員計劃，鼓勵旅客重遊並帶朋友到訪。"]]},{"tp":"1-14","cs":["空間承載力","環境承載力","心理承載力","經濟承載力","社會文化承載力"],"ty":[],"q":"{地}的訪客人數不斷增加。指出{n}類承載力，並各以{地}或其周邊社區可能出現的一個問題加以說明。","a":[["空間承載力／空間／座位不足／泊車位／容納","空間承載力：{地}場地面積有限，座位、泊車位及交通容量不足以容納大量訪客。"],["環境承載力／塗污／踐踏／亂拋垃圾／損毀","環境承載力：訪客塗污或觸摸損毀建築及展品，周邊亦出現亂拋垃圾問題。"],["心理承載力／心理／感覺上／擠迫／擠逼／喧嘩","心理承載力：人多擠迫、有人大聲喧嘩，令其他訪客的旅遊樂趣明顯減弱。"],["經濟承載力／物價／加價／定價較高／租金","經濟承載力：周邊食肆因訪客需求而提高定價，影響本地人的日常消費。"],["社會文化／居民不滿／居民反感／滋擾居民","社會文化承載力：大量訪客湧入社區造成滋擾，居民對旅客產生反感。"]]},{"tp":"1-14","cs":["環境承載力"],"ty":[],"q":"建議{n}項{地}可採取的措施，以免旅客活動超出{地}的環境承載力，並加以解釋。","a":[["限制人數／限制入場／預約／限額／分時段／人數上限","實行預約及分時段入場，限制同一時間的人數，減輕對環境的壓力。"],["指定路線／木棧道／行人徑／欄杆／圍欄","設立指定路線、木棧道或欄杆，避免旅客踐踏草地或觸碰脆弱地方。"],["告示／標語／守則／提示牌／禁止","樹立告示及守則，提醒旅客不可觸摸展品、踐踏草地或亂拋垃圾。"],["導賞／教育／保育意識／講解","透過導賞及講解加強旅客的保育意識，令他們自覺愛護{地}。"],["垃圾桶／回收／自備水樽／走塑","增設垃圾桶及回收設施，鼓勵自備水樽，減少垃圾及污染。"],["輪流開放／暫停開放／封閉／休養","輪流或暫停開放部分範圍，讓受損的地方有時間自行復原。"],["巡邏／監察／罰款／檢控","派職員巡邏監察，並對破壞行為罰款或檢控，加強阻嚇作用。"],["維修／修復／保養／加固","定期維修及修復受損部分，例如加固古蹟或補種植物，減少永久損害。"]]},{"tp":"1-14","cs":["心理承載力","空間承載力"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項可能令旅客感到{地}已超出心理承載力的情況。","a":[["排隊／輪候／大排長龍／等候時間","入場或使用設施要大排長龍，輪候時間長，令旅客感到不耐煩。"],["擠迫／擠逼／人山人海／人太多／多人／人很多","{地}人山人海、擠迫不堪，旅客難以自由走動。"],["嘈吵／喧嘩／噪音／大聲","有人大聲喧嘩，環境嘈吵，破壞參觀氣氛。"],["座位不足／沒有座位／冇位／休息區不足","座位及休息區不足，旅客找不到地方休息或用膳。"],["洗手間／廁所","洗手間數目不足，需要排隊輪候，令旅客不滿。"],["看不到／視線被阻／阻擋／遮擋","展品或景觀前擠滿人，視線被阻，看不到展品或拍不到照片。"],["垃圾／骯髒／不潔","人多令垃圾增加、環境骯髒，降低旅客的旅遊樂趣。"],["插隊／不文明／爭先恐後／推撞","有人插隊或推撞，旅客之間出現爭執，令人感到不快。"]]},{"tp":"1-14","cs":["經濟承載力","社會文化承載力"],"ty":[],"q":"如{地}的旅客人數持續上升，分析{n}項{地}周邊社區可能因超出經濟承載力或社會文化承載力而出現的轉變。","a":[["物價／通脹／通貨膨脹／價格上漲／加價","旅客需求推高日常消費品及餐飲價格，加重居民的生活負擔。"],["租金／舖租／地價／樓價","店舖租金及地價上升，小店難以經營，居民住屋負擔亦加重。"],["紀念品店／藥房／金舖／找換店／民生店舖","紀念品店及藥房取代民生店舖，居民購買日用品的選擇減少。"],["居民不滿／反感／敵意／排斥","居民不滿旅客影響日常生活，對旅客產生反感甚至敵意。"],["噪音／阻街／滋擾／拖行李","旅客拖行李阻街及製造噪音，滋擾居民的日常生活。"],["傳統手工藝／手工藝／傳統特色／社區風貌","傳統手工藝被大量生產的紀念品取代，社區原有風貌逐漸消失。"],["模仿旅客／示範效應／衣著／消費模式","當地年輕人模仿旅客的衣著及消費模式，改變社區原有價值觀。"]]},{"tp":"1-15","cs":["母港","停靠港","超級大型郵輪","大型郵輪"],"ty":["transport"],"q":"根據你在{地}的觀察，指出{n}項{地}為郵輪旅客提供的設施或服務，並解釋它們如何有助吸引郵輪公司以這裏作為母港。","a":[["出入境／海關／檢疫／入境檢查","設有出入境、海關及檢疫設施，方便大量旅客在此開始或結束郵輪行程。"],["登船手續／登船櫃位／辦理登船／登記櫃位","設登船手續櫃位，可同時處理大量旅客登船，符合母港的需要。"],["行李／行李寄存／行李託運","提供行李處理及寄存，旅客只需搬運一次行李，方便由此出發。"],["接駁巴士／穿梭巴士／的士站／公共交通","設接駁巴士及的士站，連接市區、機場及酒店，方便旅客往返。"],["泊位／超級大型郵輪／大型郵輪","泊位可停泊超級大型郵輪，吸引郵輪公司在此開始及結束航程。"],["免稅店／零售店／購物","提供購物設施，增加旅客在當地的消費，提高人均消費。"],["旅客諮詢／資訊櫃台／旅遊資訊","設旅客諮詢櫃台提供旅遊資訊，鼓勵旅客在登船前後多留幾天。"],["補給／物資供應／維修／加油","支援郵輪補給及維修，郵輪在母港的花費較多，為當地帶來收入。"]]},{"tp":"1-15","cs":["停靠港","母港","登船卡"],"ty":[],"q":"郵輪泊岸期間，乘客可上岸觀光。建議{n}項{地}可採取的措施，吸引郵輪旅客在泊岸期間到訪{地}並增加消費。","a":[["接駁巴士／穿梭巴士／專車接送／交通接駁","安排接駁巴士往返郵輪碼頭與{地}，方便旅客在有限時間內到訪。"],["半日遊／短途行程／岸上行程／一日遊","設計配合泊岸時間的半日遊，讓旅客在開船前準時返回船上。"],["郵輪公司／旅行社合作／套票","與郵輪公司或旅行社合作，把{地}納入岸上觀光行程或套票。"],["登船卡／優惠／折扣","憑登船卡可享購物或餐飲折扣，刺激郵輪旅客消費。"],["延長開放／提早開放／營業時間／開放時間","配合郵輪清晨抵達、晚上啟航，提早或延長開放時間。"],["多語言／外語／英語導賞／多國語言","提供多語言導賞及指示，照顧來自五湖四海的郵輪旅客。"],["行李寄存／寄存","提供行李寄存，方便在此登船或下船的旅客順道遊覽{地}。"],["碼頭推廣／推廣攤位／碼頭宣傳／宣傳單張","在郵輪碼頭設推廣攤位或派發單張，介紹{地}的特色。"]]},{"tp":"1-15","cs":["母港","停靠港"],"ty":[],"q":"郵輪旅遊目的地傾向成為母港，而非只作停靠港。從{地}及附近旅遊服務供應商的角度，解釋{n}項{地}所在城市成為郵輪母港可帶來的好處。","a":[["酒店／住宿／過夜","在母港登船的旅客多在出發前或回程後留宿酒店，帶來住宿收入。"],["餐飲／用膳／食肆","旅客在當地逗留時間較長，會在{地}及附近食肆用膳。"],["購物／手信／紀念品","旅客有較多時間購物及購買手信，零售商戶受惠。"],["人均消費／消費較高／花費較多","母港旅客的人均消費較停靠港旅客高，為{地}帶來更多收入。"],["持續客源／穩定客源／客源穩定","每次啟航及返航都有大批旅客出入，帶來持續而穩定的客源。"],["交通運輸／機票／航空公司／的士","旅客需乘飛機及本地交通往返碼頭，交通運輸業受惠。"],["補給／物資／維修","郵輪在母港補給物資及維修，本地供應商可獲得更多生意。"],["就業／職位／工作機會","郵輪相關消費增加，為{地}及附近創造更多就業機會。"]]},{"tp":"1-16","cs":["單向模式","雙向模式","多向模式","旅行代理商","旅行團經營商","旅遊批發商","旅遊零售商"],"ty":[],"q":"旅客可透過不同途徑購買{地}的門票、導賞團或其他旅遊產品。指出{n}個這類途徑，並說明各屬單向、雙向還是多向分銷模式。","a":[["官方網站／官網／官方App／官方程式","在{地}的官方網站或官方手機程式購買，屬單向模式：供應商直接售予消費者。"],["售票處／票房／即場購買／現場購買","在{地}的售票處即場購買，屬單向模式，毋須經中介機構。"],["電話預約／電話訂購／電郵預約／團體預約","以電話或電郵直接向{地}預約導賞團，屬單向模式。"],["OTA／Klook／KKday／攜程／網上平台","經Klook等網上旅行代理商購買，屬雙向模式：經一層中介機構銷售。"],["旅行社／旅行代理商","經旅行社購買，屬雙向模式：旅行代理商作為中間人分銷產品。"],["旅行團／旅行團經營商／批發商／本地遊","旅行團經營商把{地}與交通膳食組合成旅行團，再經旅行社出售，屬多向模式。"],["酒店禮賓部／禮賓部／酒店套票","經酒店禮賓部或酒店套票購買，酒店擔當中介，屬雙向模式。"],["便利店／城市售票網／快達票／售票網","在便利店或售票網購買，屬雙向模式：經一層中介機構分銷。"]]},{"tp":"1-16","cs":["單向模式"],"ty":[],"q":"從{地}營運者的角度，解釋{n}項以單向模式（例如官方網站或售票處）直接向旅客銷售旅遊產品的好處。","a":[["佣金／節省成本／慳錢","毋須向中介機構支付佣金，收入全數歸{地}，節省成本。"],["顧客資料／客戶數據／數據／個人資料","可直接收集顧客資料及數據，分析市場需要，作日後推廣之用。"],["忠誠／會員／回頭客／獎勵","可向忠誠顧客提供會員優惠及獎勵，鼓勵他們再次光臨。"],["價格優惠／更便宜／優惠價／較平","省下佣金後可提供較優惠的價格，吸引顧客直接購買。"],["準確資訊／資料準確／清楚介紹","由{地}自行發放資訊，內容準確，顧客清楚知道會得到甚麼服務。"],["溝通／互動／個人化／建立關係","與顧客直接溝通互動，建立長遠關係，提供個人化服務。"],["交叉銷售／加購／附加產品／順道推銷","購票時可順道推銷導賞團、餐飲或紀念品，增加收入。"]]},{"tp":"1-17","cs":["政策制定者","宣傳推廣者","監管者","直接經營者"],"ty":[],"q":"以{地}為例，指出政府在旅遊業發展中擔當的{n}個角色，並以{地}的例子加以說明。","a":[["政策制定／制定政策／規畫／規劃／計劃及促進","政策制定者：政府制定旅遊及保育政策，例如推動活化及發展{地}一帶。"],["宣傳推廣／宣傳／推廣／旅發局","宣傳推廣者：政府及旅發局以宣傳短片、地圖及盛事向海外推廣{地}。"],["監管／管制／監察／發牌／牌照","監管者：政府透過發牌及法例監管{地}內的食肆及商戶，保障旅客。"],["直接經營／政府擁有／康文署／公營","直接經營者：政府直接擁有或經營博物館、公園及古蹟等旅遊項目。"],["基建／基礎建設／公共設施／交通配套","提供基礎建設，例如興建道路及公共交通配套，方便旅客前往{地}。"],["培訓／專業培訓／人才","提供專業培訓，例如資助導遊及旅遊從業員的培訓課程，提升服務質素。"],["研究／市場調查／評估／統計","進行市場調查及研究，評估{地}的承載力及推廣成效。"]]},{"tp":"1-17","cs":["監管者"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項反映政府擔當旅遊業監管者角色的例子。","a":[["牌照／食肆牌照／酒牌／發牌","{地}內的食肆展示牌照，反映政府以發牌制度規管餐飲業。"],["消防／走火通道／滅火筒／緊急出口","設有消防設備及走火通道，反映政府以建築及消防條例保障旅客安全。"],["禁煙／禁止吸煙／不准吸煙","張貼禁煙告示，反映政府以法例規管公眾地方的行為。"],["罰款／檢控／違者","告示列明違者會被罰款或檢控，例如亂拋垃圾定額罰款。"],["衞生／衛生／食物安全","食肆須符合食物衞生規定並接受巡查，保障旅客健康。"],["導遊證／持牌導遊／領隊證","旅行團導遊須持導遊證，反映政府透過旅監局發證規管導遊。"],["保安／警察／巡邏／保安檢查","有警察或保安人員巡邏及進行保安檢查，維持秩序及安全。"],["法定古蹟／文物保護／古物古蹟","{地}或附近建築受古物古蹟條例保護，反映政府規管文物保育。"]]},{"tp":"1-17","cs":["宣傳推廣者"],"ty":[],"q":"政府擔當宣傳推廣者的角色。建議{n}項政府或旅遊推廣機構（例如香港旅遊發展局）可用以向本地及海外市場推廣{地}的方法。","a":[["宣傳短片／宣傳片／短片／影片／廣告","製作宣傳短片及廣告，在電視及網上播放，介紹{地}的特色。"],["社交媒體／網紅／KOL／社交平台","邀請網紅在社交媒體分享{地}的打卡位，吸引年輕旅客。"],["名人／明星／代言人／名人推介","邀請名人或明星拍攝推介，提升{地}的知名度。"],["旅遊展／旅展／推介會／路演","參加國際旅遊展及舉辦推介會，向海外業界介紹{地}。"],["優惠／折扣／免費入場／消費券","與商戶合作推出優惠，例如免費入場或餐飲折扣，吸引旅客到訪。"],["地圖／單張／小冊子／旅遊指南","派發地圖、單張及旅遊指南，以多種語言介紹{地}。"],["諮詢中心／熱線／旅客中心","在旅客諮詢中心及熱線提供{地}的資訊，支援旅客。"],["盛事／節慶／大型活動／嘉年華","在{地}舉辦盛事或節慶活動，吸引傳媒報道及旅客到訪。"]]},{"tp":"1-17","cs":["政策制定者"],"ty":[],"q":"政府作為政策制定者，可如何計劃及促進{地}一帶的旅遊業發展？建議{n}項措施。","a":[["基建／交通設施／交通配套／改善交通／道路／接駁","改善基建及交通配套，例如擴闊道路或增設接駁交通，方便旅客前往。"],["土地／撥地／批地／用地","提供土地資源，興建酒店及新景點等旅遊設施。"],["稅項寬減／減稅／免稅／稅務優惠","寬減甚至豁免稅項，吸引投資者發展{地}一帶的旅遊項目。"],["低息貸款／資助／撥款／津貼","提供低息貸款或資助，支持營運者改善{地}的旅遊設施。"],["簽證／免簽證／入境便利","放寬簽證安排，方便更多海外旅客到訪。"],["一程多站／區域合作／大灣區／鄰近地區","與鄰近地區合作推廣一程多站行程，擴大旅客流量。"],["保育／平衡發展／環境評估／可持續","制定發展與保育並重的規劃，平衡旅遊業發展與環境保育。"],["協調部門／統籌／公私營合作／跨部門","協調各政府部門及公私營機構，互相配合推動發展。"]]},{"tp":"1-18","cs":["第一重效應","第二重效應","第三重效應","旅遊業乘數效應"],"ty":[],"q":"以{地}為例，指出{n}項旅客消費後資金在當地經濟中流動的例子，並說明各屬資金流動的第幾重效應。","a":[["門票／入場費／購票／房租","第一重效應：旅客繳付{地}的門票等費用，資金進入東道國。"],["薪酬／薪金／人工／工資","第二重效應：{地}的經營者以收入支付員工薪酬。"],["食材／貨品／物資／入貨／採購","第二重效應：經營者向供應商購買食材、貨品及物資。"],["租金／利息／水電費","第二重效應：經營者支付租金、水電費及資本借貸的利息。"],["再投資／翻新／擴充／開分店","第三重效應：企業東主把利潤再投資，例如翻新店舖或開設分店。"],["日用品／買餸／交租／家庭開支","第三重效應：從業員把薪金用於購買食物、日用品及交租。"],["儲蓄／存款／銀行","第三重效應：從業員把部分薪金儲蓄或存入銀行。"],["交稅／薪俸稅／繳稅／稅款","第三重效應：從業員把部分薪金用作繳交薪俸稅。"]]},{"tp":"1-18","cs":["流失"],"ty":[],"q":"根據你在{地}及附近的觀察，指出{n}項可能令旅客的消費流失到外地的例子。","a":[["進口貨品／進口食材／進口／外國製造／外國貨","售賣進口貨品或使用進口食材，部分收入要付給海外供應商。"],["外國名牌／國際品牌／名牌／奢侈品","旅客購買外國名牌商品，利潤歸海外品牌公司。"],["連鎖／特許經營／專營權／加盟","國際連鎖店需向海外總公司繳付特許經營費用，令收益流到外地。"],["外資／跨國企業／外國公司／海外總部","外資企業把在{地}賺取的盈利帶返所屬國家。"],["外籍員工／外地員工／海外專才／匯款","外籍員工把在當地賺取的薪金匯回家鄉。"],["佣金／海外平台／外地平台","旅客經海外網上平台預訂，部分收入以佣金形式流到外地。"],["借展費／版權費／外地表演者／海外藝術家","向海外機構支付借展費或邀請外地表演者，部分收入流到外地。"],["管理費／管理合約／外國管理公司","由外國公司以管理合約經營，須支付管理費予海外公司。"]]},{"tp":"1-18","cs":["流失","旅遊業乘數效應"],"ty":[],"q":"建議{n}項{地}可採取的措施，讓旅客的消費更多留在當地，以加強旅遊業乘數效應。","a":[["本地製造／香港製造／本地產品／本地手工藝","售賣本地製造的紀念品及手工藝品，減少進口貨品引致的流失。"],["本地食材／本地農產品／本地漁農","餐飲設施採用本地食材，令收入流向本地農漁業。"],["本地員工／聘請本地人／本地人才","聘請本地員工，令薪酬留在當地並在本地消費。"],["本地商戶／本地品牌／本地小店","優先租予本地商戶及品牌，令利潤留在本地再投資。"],["本地供應商／本地採購","向本地供應商採購物資，帶動本地相關行業。"],["本地藝術家／本地設計師／本地創作","邀請本地藝術家及設計師參與展覽或產品設計，減少海外支出。"],["本地旅行社／本地導遊／本地營運","與本地旅行社及導遊合作，令收益留在本地旅遊業。"]]},{"tp":"1-18","cs":["旅遊業乘數效應","第二重效應"],"ty":[],"q":"旅遊業乘數效應令旅遊收入惠及其他行業。以{地}為例，指出{n}個會因旅客在{地}消費而間接受惠的行業，並加以解釋。","a":[["交通運輸／運輸／的士／巴士","旅客乘搭的士及巴士前往{地}，交通運輸業收入增加。"],["食品供應／食材供應／漁農業／農業","{地}的餐廳需要更多食材，帶動食品供應及漁農業。"],["清潔／保安／外判","{地}人流增加，需要更多外判清潔及保安服務。"],["印刷／廣告／設計公司","{地}需印製單張及製作廣告，印刷及廣告業受惠。"],["建造／裝修／工程／維修","{地}擴建或翻新時聘用建造及裝修公司。"],["洗衣／布草","附近酒店及餐廳的布草需送洗，洗衣業受惠。"],["零售／便利店／商店","附近便利店及商店的生意增加。"],["銀行／金融／保險／電子支付","交易增加帶動銀行及電子支付等金融服務。"]]},{"tp":"1-19","cs":["興奮愉快階段","理所當然階段","煩厭不快階段","敵對感覺階段","得不償失階段"],"ty":[],"q":"根據你在{地}附近的觀察或訪問居民，判斷當地居民對旅客的態度處於多克西旅客情緒指標的哪一個階段，並指出{n}項支持你判斷的證據。","a":[["熱情／主動招呼／好客／熱烈歡迎／當作朋友","興奮愉快階段：居民熱情好客，視旅客為遠方朋友。"],["形式化／商業化／只為賺錢／商業款待","理所當然階段：居民只把旅客視為生意，款待禮貌但形式化。"],["冷淡／習以為常／不理睬／見慣","理所當然階段：居民對旅客習以為常，反應冷淡。"],["投訴／不滿／抱怨／厭煩","煩厭不快階段：居民投訴旅客造成擠塞及噪音，影響日常生活。"],["標語／橫額／抗議／示威","敵對感覺階段：社區出現反對旅客的標語或抗議行動。"],["粗暴／衝突／辱罵／口角","敵對感覺階段：居民與旅客發生口角或衝突，甚至出現粗暴言行。"],["歸咎／怪責／怪罪","敵對感覺階段：居民把社區問題歸咎於旅客。"],["面目全非／特色消失／完全改變","得不償失階段：社區原有環境完全改變，原本吸引旅客的特色消失。"]]},{"tp":"1-19","cs":["煩厭不快階段","敵對感覺階段"],"ty":[],"q":"如到訪{地}的旅客持續增加，指出{n}項可能令附近居民由「理所當然」轉為「煩厭不快」甚至「敵對感覺」的情況。","a":[["交通擠塞／塞車／車廂擠迫／排隊候車","旅客擠滿公共交通工具，居民要排隊候車，出行受阻。"],["噪音／嘈吵／喧嘩","旅客喧嘩製造噪音，滋擾居民休息。"],["垃圾／衞生／衛生／骯髒","旅客亂拋垃圾，令社區衞生變差。"],["物價／租金／樓價／通脹／加價","旅客需求推高物價及租金，加重居民生活負擔。"],["藥房／金舖／紀念品店／民生店舖","民生店舖被藥房及紀念品店取代，居民購物不便。"],["阻街／拖篋／行人路擠迫／點貨","旅客拖篋或在行人路點貨，阻塞街道。"],["不文明／插隊／隨地便溺／隨地吐痰","旅客插隊或隨地便溺等不文明行為，引起居民反感。"],["私隱／偷拍／拍照滋擾／闖入","旅客拍攝居民或闖入私人地方打卡，侵犯居民私隱。"]]},{"tp":"1-19","cs":["興奮愉快階段","理所當然階段"],"ty":[],"q":"建議{n}項{地}可採取的措施，以免附近居民對旅客的情緒由「理所當然」轉差至「煩厭不快」，並加以解釋。","a":[["限制人數／限制入場／預約／分流／限額","控制旅客人數或分流，避免超出社區可承受的程度。"],["居民優先／居民優惠／居民專用／街坊優惠","給予居民優先或免費入場等優惠，讓居民分享旅遊業的好處。"],["聘請居民／聘請本地人／社區就業／街坊就業／本地員工","聘請附近居民工作，令社區直接受惠於旅遊業。"],["社區活動／開放日／街坊活動／社區參與","舉辦社區活動及開放日，加強居民與{地}的聯繫。"],["守則／文明旅遊／教育旅客／宣傳教育","向旅客宣傳守則，提醒他們尊重社區、保持安靜。"],["清潔／垃圾桶／清理","加強清潔及增設垃圾桶，減少旅客對社區衞生的影響。"],["回饋社區／社區基金／收益回饋","把部分收益撥作社區基金，回饋社區。"],["諮詢／聽取意見／溝通／居民大會","定期諮詢居民及聽取意見，及早處理他們的不滿。"]]},{"tp":"1-20","cs":["地理環境","人口特性","消費心態","社會經濟影響"],"ty":[],"q":"如要了解到訪{地}旅客的概況，建議{n}項可收集的旅遊統計資料，並指出各屬哪一個統計數據範疇。","a":[["來源地／國籍／居住地／客源地","地理環境：旅客來自哪些國家或地區，例如內地或東南亞。"],["季節／月份／旺季／淡季","地理環境：每月到訪人次及旺淡季分布（季節性）。"],["年齡／性別","人口特性：旅客的年齡分布及性別比例。"],["收入水平／入息／月入／教育程度／職業／受僱","人口特性：旅客的收入水平、教育程度及受僱情況。"],["興趣／喜好／價值觀／生活方式／性格","消費心態：旅客的興趣、價值觀及生活方式。"],["人均消費／消費金額／總消費／花費","社會經濟影響：旅客在{地}的人均消費及總消費。"],["社會地位／消費能力／購買力","社會經濟影響：旅客的社會地位及消費能力。"],["逗留時間／逗留日數／到訪次數／重遊","社會經濟影響：旅客平均逗留時間及重遊次數，反映對經濟的貢獻。"]]},{"tp":"1-20","cs":["地理環境","人口特性","消費心態","社會經濟影響"],"ty":[],"q":"指出{n}個旅遊業統計數據範疇，並各舉一例說明{地}可如何運用該範疇的資料改善推廣或營運。","a":[["地理環境／來源地／客源地","地理環境：按主要客源地集中推廣，並提供相應語言的服務及資訊。"],["人口特性／年齡／性別／收入水平","人口特性：按旅客年齡及收入水平設計合適產品，例如親子或長者導賞。"],["消費心態／興趣／生活方式／價值觀","消費心態：按旅客興趣及生活方式設計體驗，作針對性推廣。"],["社會經濟／消費能力／人均消費／社會地位","社會經濟影響：按旅客消費能力釐定價格，並協助吸引投資者。"]]},{"tp":"1-21","cs":["香港旅遊發展局"],"ty":[],"q":"根據你在{地}的觀察或資料搜集，指出{n}項香港旅遊發展局為推廣{地}或提升旅客體驗所做的工作。","a":[["網站／手機程式／社交媒體／網上平台","透過discoverhongkong.com網站、手機程式及社交媒體介紹{地}。"],["宣傳短片／宣傳片／廣告／亞洲國際都會／品牌","製作宣傳短片及廣告，以「亞洲國際都會」品牌向全球宣傳香港。"],["盛事／節慶／美酒佳餚／大型活動","舉辦盛事及節慶，例如香港美酒佳餚巡禮，吸引旅客到訪。"],["優惠／折扣／合作推出","與商戶合作推出旅遊產品、活動及優惠，吸引旅客消費。"],["諮詢中心／旅客中心／熱線","設旅客諮詢中心及熱線，提供{地}的交通及景點資訊。"],["地圖／單張／小冊子／旅遊指南","印製地圖、單張及旅遊指南，以多種語言介紹{地}。"],["優質旅遊服務／QTS／認證／標貼","推行「優質旅遊服務」計劃認證優質商戶，令旅客安心消費。"],["市場研究／調查／訪港旅客特質","進行市場研究，了解旅客特質及喜好，制定合適的推廣策略。"]]},{"tp":"1-21","cs":["優質旅遊服務計劃"],"ty":[],"q":"「優質旅遊服務」計劃會評審零售及餐飲商戶。根據你在{地}內或附近的觀察，指出{n}項商戶符合其評審標準的表現。","a":[["明碼實價／標價／價錢牌／價目表","貨品明碼實價，清楚標示價錢，避免旅客被濫收費用。"],["清晰資料／產品資料／收據／單據","提供清晰的產品資料及收據，保障消費者權益。"],["清潔／衞生／衛生／整潔／乾淨","餐館環境清潔衞生，符合評審標準。"],["食物水準／新鮮／味道／食物質素","食物新鮮、水準高，符合高水準食物的要求。"],["禮貌／笑容／態度親切／貼心","職員有禮貌、態度親切，提供貼心周到的服務。"],["多語言／英語／普通話／外語","職員能以多種語言溝通，方便不同地方的旅客。"],["退換／退款／保證書／保養","清楚列明退換及退款安排，令旅客安心購物。"],["標貼／QTS／認證標誌","店舖張貼「優質旅遊服務」計劃的認證標貼。"]]},{"tp":"1-21","cs":["香港旅遊發展局","旅遊事務署","香港旅遊業議會","香港貿易發展局","香港酒店業協會","機場管理局"],"ty":[],"q":"指出{n}個與{地}的旅遊業發展有關的公營或私營機構，並說明它們在本地旅遊業中擔當的角色。","a":[["旅發局／旅遊發展局","香港旅遊發展局：向全球宣傳推廣香港及{地}，提升旅客體驗。"],["旅遊事務署／旅遊事務專員","旅遊事務署：制定旅遊政策及策略，協調各部門改善旅遊設施。"],["旅議會／旅遊業議會","香港旅遊業議會：推動旅行社自律，調解旅客與旅行社的糾紛。"],["貿發局／貿易發展局","香港貿易發展局：舉辦大型展覽及會議，吸引商務旅客。"],["酒店業協會／酒店協會","香港酒店業協會：代表酒店業界，向政府提供意見及提供培訓。"],["機管局／機場管理局","機場管理局：營運及發展香港國際機場，是旅客出入香港的門戶。"],["旅監局／旅遊業監管局","旅遊業監管局：發牌及規管旅行代理商、導遊及領隊。"],["康文署／康樂及文化","康樂及文化事務署：管理博物館及文化設施，舉辦文化活動。"]]},{"tp":"1-21","cs":["旅遊業賠償基金","香港旅遊業議會"],"ty":["overseas"],"q":"香港旅客經本地持牌旅行社參加前往{地}的旅行團。指出{n}項香港的旅遊業規管制度或機構為這些旅客提供的保障。","a":[["倒閉／九成／賠償基金","旅行社倒閉時，旅客可從旅遊業賠償基金獲發團費九成的特惠補償。"],["意外／受傷／傷亡／緊急援助","旅客在外遊期間因意外受傷或死亡，可獲特惠賠償及緊急援助。"],["牌照／發牌／旅監局","旅遊業監管局向旅行社發牌並規管其營運，保障旅客權益。"],["領隊證／持證領隊／合資格領隊","領隊須持有領隊證，具備專業知識帶領旅行團。"],["守則／作業守則／專業操守","業界須遵守作業守則，規範領隊及旅行社的專業操守。"],["投訴／調解／糾紛","旅客可向香港旅遊業議會投訴，由其調解旅客與旅行社的糾紛。"],["外遊警示／保安局／黃色警示／紅色警示","保安局發出外遊警示，提醒旅客前往{地}的風險。"]]},{"tp":"1-22","cs":["聯合國世界旅遊組織（UNWTO）"],"ty":[],"q":"聯合國世界旅遊組織（UNWTO）致力促進負責任、可持續和人人可享受的旅遊業。根據你在{地}的觀察，指出{n}項符合這方向的做法。","a":[["無障礙／輪椅／斜道／升降機／點字","設有無障礙設施，讓長者及殘疾人士也能享受旅遊（人人可享受）。"],["環保／回收／節能／減廢","推行回收及節能措施，減少對環境的影響（可持續）。"],["保育／活化／保護文物／古蹟保育","保育歷史建築或自然環境，讓後代也能享用（可持續）。"],["本地員工／聘請本地／社區經濟／本地小店","聘請本地人及支持社區小店，令旅遊收益惠及當地居民（減貧與發展）。"],["免費入場／優惠票／長者優惠／學生優惠","提供免費或優惠門票，令不同收入人士都能參觀（人人可享受）。"],["守則／尊重文化／告示","以告示及守則提醒旅客尊重當地文化及環境（負責任）。"],["教育／導賞／工作坊／講座","舉辦導賞及工作坊，提升旅客的知識及保育意識（知識教育）。"],["多語言／語音導覽／外語","提供多語言及語音導覽，照顧不同地方旅客的需要。"]]},{"tp":"1-22","cs":["亞太旅遊協會（PATA）"],"ty":[],"q":"亞太旅遊協會（PATA）是連繫公營及私營部門會員的非牟利協會。如{地}的營運機構成為其會員，指出{n}項它可得到的好處。","a":[["研究／市場資訊／研究報告／趨勢","取得具洞察力的研究及市場資訊，了解亞太區旅客的趨勢。"],["培訓／培訓計劃／員工培訓","參加旅遊業培訓計劃，提升員工的專業水平。"],["人脈／交流／聯繫／網絡","與政府、航空公司及酒店等會員交流，建立業務聯繫。"],["推廣／曝光／知名度／宣傳","透過協會的活動向亞太區業界推廣{地}，提高知名度。"],["會議／論壇／年會／峰會","參與協會舉辦的會議及論壇，掌握業界最新發展。"],["可持續／負責任／倡議／指引","跟從協會的倡議及指引，推動負責任及可持續的旅遊發展。"],["合作夥伴／夥伴關係／聯乘／合作","與其他會員建立夥伴關係，例如合作推出旅遊產品。"]]},{"tp":"1-23","cs":[],"ty":[],"q":"根據課本，香港的旅遊資源可分為十大旅遊景點、文化景點及自然景點。判斷{地}屬於哪一類，並根據你的觀察，指出{n}項支持你判斷的特色。","a":[["歷史建築／古蹟／活化／保育","文化景點：{地}保留或活化歷史建築，展示香港的歷史。"],["展覽／藝術／文物／藏品","文化景點：{地}展出藝術品或文物，讓旅客認識中外文化。"],["戲曲／表演／傳統文化／工作坊","文化景點：{地}舉辦戲曲表演或傳統文化工作坊。"],["岩石／地貌／濕地／生態","自然景點：{地}擁有獨特的岩石地貌或濕地生態。"],["遠足／郊野／觀鳥／行山","自然景點：旅客可在{地}遠足或觀鳥，欣賞郊野景色。"],["人山人海／必到／人氣／打卡","十大旅遊景點：{地}人氣高，是旅客必到的打卡熱點。"],["購物／娛樂／夜生活／機動遊戲","十大旅遊景點：{地}集購物、娛樂及夜生活於一身。"],["維港／地標／觀景／夜景","十大旅遊景點：{地}可欣賞維港景色，是香港的地標。"]]},{"tp":"1-23","cs":["大館","中環街市","南豐紗廠","戲曲中心","M+","香港故宮文化博物館","太平山頂","尖沙咀海濱","昂坪360","女人街／男人街","香港地質公園","米埔自然保護區","麥理浩徑","大潭郊野公園"],"ty":["museum","heritage"],"q":"{地}屬於香港的文化旅遊資源。試建議{n}個課本列舉的香港十大旅遊景點或自然景點，與{地}組成一程多站的行程，並說明這樣安排的好處。","a":[["太平山頂／山頂／太平山","太平山頂：俯瞰維港景色，與{地}的文化體驗互相配合。"],["尖沙咀海濱／星光大道／尖沙咀","尖沙咀海濱：晚上欣賞維港夜景，延長旅客的逗留時間。"],["昂坪／天壇大佛／寶蓮禪寺／昂坪360","昂坪360：乘纜車觀賞大嶼山景色，並認識佛教文化。"],["女人街／男人街／廟街／通菜街","女人街及男人街：購買相宜貨品，體驗地道街頭文化。"],["地質公園／六角岩柱／萬宜水庫","香港地質公園：欣賞獨特岩石地貌，為行程加入自然元素。"],["米埔／米埔濕地","米埔自然保護區：觀賞候鳥及濕地生態，吸引生態旅客。"],["麥理浩徑／麥徑","麥理浩徑：遠足欣賞郊野及海岸景色，吸引喜愛戶外活動的旅客。"],["大潭／大潭郊野公園","大潭郊野公園：設有水塘及遠足徑，適合輕鬆遠足。"]]},{"tp":"1-23","cs":["香港地質公園","米埔自然保護區","麥理浩徑","大潭郊野公園","中環街市","南豐紗廠","戲曲中心","M+","香港故宮文化博物館","昂坪360","太平山頂","尖沙咀海濱"],"ty":["nature"],"q":"{地}屬於香港的自然旅遊資源。試建議{n}個課本列舉的香港文化景點或十大旅遊景點，與{地}組成一程多站的行程，以吸引興趣不同的旅客。","a":[["中環街市／中環舊街市","中環街市：活化的歷史建築，可品嚐本地特色美食。"],["南豐紗廠／南豐／紗廠","南豐紗廠：由紗廠活化而成，可認識香港紡織業歷史。"],["戲曲中心／西九戲曲中心","戲曲中心：欣賞粵劇等戲曲表演，體驗傳統文化。"],["M+／M+博物館","M+：欣賞當代視覺文化及設計，吸引藝術愛好者。"],["故宮／故宮博物館","香港故宮文化博物館：欣賞故宮珍貴文物，認識中華文化。"],["昂坪／天壇大佛／寶蓮禪寺／昂坪360","昂坪360：乘纜車欣賞大嶼山景色，並參觀天壇大佛。"],["太平山頂／山頂／太平山","太平山頂：俯瞰維港及城市景觀，與{地}的郊野景色形成對比。"],["尖沙咀海濱／星光大道／尖沙咀","尖沙咀海濱：晚上欣賞維港夜景，豐富行程。"]]},{"tp":"1-23","cs":["尖沙咀海濱","太平山頂","香港迪士尼樂園","香港海洋公園","昂坪360","女人街／男人街","蘭桂坊／蘇豪區","香港會議展覽中心"],"ty":[],"q":"從課本列舉的香港十大旅遊景點中，建議{n}個可與{地}組成一程多站行程的景點，並說明它們能吸引哪類旅客。","a":[["尖沙咀海濱／星光大道／尖沙咀","尖沙咀海濱：星光大道以香港電影為主題，吸引電影迷及觀光旅客。"],["太平山頂／山頂／太平山","太平山頂：香港島最高點，可俯瞰維港，吸引首次訪港的旅客。"],["迪士尼／迪士尼樂園","香港迪士尼樂園：世界級家庭度假勝地，吸引家庭旅客。"],["海洋公園／海洋奇觀","香港海洋公園：寓教育於娛樂的主題公園，吸引家庭及學生旅客。"],["昂坪／天壇大佛／寶蓮禪寺／昂坪360","昂坪360：乘纜車往天壇大佛，吸引文化及宗教旅客。"],["女人街／男人街／廟街／通菜街","女人街及男人街：售賣相宜貨品，吸引喜愛購物及地道文化的旅客。"],["蘭桂坊／蘇豪","蘭桂坊及蘇豪區：酒吧及食肆林立，吸引喜愛夜生活的旅客。"],["會展／會議展覽中心／金紫荊廣場","香港會議展覽中心：舉辦大型展覽及會議，吸引商務旅客。"]]},{"tp":"1-24","cs":["直接職位","間接職位","無形出口"],"ty":[],"q":"以{地}為例，指出{n}項旅遊業為當地帶來的經濟正面影響。","a":[["直接職位／就業／工作機會／職員","製造直接職位，例如{地}的職員、導賞員及店員。"],["間接職位／的士司機／供應商／外判","帶來間接職位，例如接載旅客的的士司機及外判清潔工。"],["稅收／利得稅／薪俸稅／酒店房間稅","政府從商戶及從業員收取利得稅、薪俸稅等稅收。"],["無形出口／外匯／收支","入境旅客在{地}消費屬無形出口，賺取外匯，改善收支差額。"],["乘數效應／乘數效果／聯繫效應／帶動其他行業","旅客消費透過乘數效應及聯繫效應帶動其他行業，增加收入。"],["經濟增長／生活水平／GDP／本地生產總值","旅遊收入帶動整體經濟增長，提升市民的生活水平。"],["商機／生意／營業額／收入增加","旅客消費令{地}及附近商戶的生意及營業額增加。"]]},{"tp":"1-24","cs":["社會文化正面影響","示範效應","文化商業化","擠塞"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項旅遊業對當地社會文化的影響（正面或負面），並以現場例子加以說明。","a":[["保育／活化／修復／文化保育","加強文化保育：旅遊收入可用作修復及活化歷史建築，例如{地}一帶的古蹟。"],["文化交流／交流／互相理解／認識文化","鼓勵文化交流：旅客與本地人交流，增加互相理解，減少成見。"],["社區設施／休憩空間／改善生活","改善生活方式：旅遊發展帶來更多社區設施及休憩空間，居民亦可使用。"],["擠塞／擠迫／擠逼／爭用／塞車","擠塞：旅客與居民爭用公共設施及交通，造成擠塞。"],["示範效應／模仿／潮流","示範效應：年輕人模仿旅客的服飾、飲食習慣及消費模式。"],["商業化／文化商業化／迎合旅客／大量生產","文化商業化：手工藝品為迎合旅客而大量生產，失去原有文化意義。"],["罪案／扒手／治安／犯罪","道德議題：人多令扒手等罪案發生機會增加。"],["疾病／傳染病／健康","健康問題：大量旅客聚集，增加傳播疾病的風險。"]]},{"tp":"1-24","cs":["非生物環境影響","生物環境影響"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項旅遊業可能對{地}一帶環境造成的負面影響，並加以說明。","a":[["水質污染／油污／污水","水質污染：遊船油污及污水排放污染附近水域。"],["空氣污染／廢氣／旅遊巴","空氣污染：大量旅遊巴及車輛進出，排放廢氣。"],["土壤污染／垃圾／膠樽／膠袋","土壤污染：旅客亂拋膠樽、膠袋等不可降解的垃圾。"],["噪音／嘈吵／喧嘩","噪音污染：大量旅客喧嘩及擴音器聲浪滋擾附近居民。"],["視覺污染／招牌／廣告牌／塗鴉","視覺污染：巨型廣告招牌或設計拙劣的建築破壞景觀。"],["踐踏／採摘／花草／植物","生物環境影響：旅客踐踏或採摘花草樹木，破壞植物生長。"],["野生動物／棲息地／餵飼／雀鳥","生物環境影響：旅客餵飼野生動物或侵佔棲息地，改變其覓食習性。"],["塗污／刻字／損毀古蹟／磨損","旅客觸摸、刻字或塗污古蹟，令文物受到磨損。"]]},{"tp":"1-24","cs":["過分依賴","流失"],"ty":[],"q":"分析{n}項旅遊業發展可能為{地}一帶帶來的經濟負面影響。","a":[["物價／通脹／通貨膨脹／消費價格／加價","高消費價格：旅客需求推高物價，出現通貨膨脹，加重居民負擔。"],["地價／租金／樓價／舖租","高地價：土地需求增加推高地價及舖租，小店難以經營。"],["過分依賴／過度依賴／依賴旅客／只靠旅客","過分依賴：經濟過分依賴旅遊業，旅客減少時商戶及就業大受打擊。"],["進口／流失／外資／外國品牌","流失：旅客購買進口貨品或光顧外資企業，收益流失到外地。"],["季節性／淡季／旺季／收入不穩","旅遊業有淡旺季，淡季時收入不穩，員工可能開工不足。"],["民生店舖／藥房／金舖／店舖單一","店舖轉做旅客生意，民生店舖減少，居民消費選擇減少。"]]},{"tp":"2-1","cs":[],"ty":["hotel"],"q":"以{地}為例，從{n}個酒店分類的準則，描述該酒店所屬的類型，並以你觀察到的特徵作例證。","a":[["地理位置／市中心／市區／近郊／機場酒店／交通便捷","地理位置：位於市區、交通便捷的屬市中心酒店；鄰近機場的則屬機場酒店。"],["會議酒店／商務酒店／度假酒店／賭場酒店／水療酒店／溫泉酒店","功能設施：設有大型會議廳及宴會廳的屬會議酒店；設完善商務中心的屬商務酒店。"],["全套服務／有限度服務／有限服務／長期住宅式／服務式住宅","服務水平：設多間餐廳、宴會場地及禮賓服務的屬全套服務式酒店。"],["規模／客房數目／房間數目／間客房／小型酒店／大型酒店","規模：以房間數目反映規模，少於100間客房屬小型酒店，超過3000間屬特大型。"],["房價／房租／每晚／豪華型／經濟型／廉價","房價：分為豪華型及經濟型，例如經濟型酒店每晚房價可低於八百元。"],["五星／四星／星級／甲級／乙級／中價","評級：例如獲評為五星級的酒店，設施及服務水平最高。"],["產權／擁有人／股東／業主／集團擁有","產權：酒店由獨立擁有人、合夥人或企業股東擁有，並由他們決定經營方式。"],["精品酒店／主題酒店／古蹟酒店／歷史建築／改建","特色：由歷史建築改建並保留歷史特色的，屬舊式建築改建酒店。"]]},{"tp":"2-1","cs":["服務水平","功能設施"],"ty":["hotel"],"q":"根據你在{地}的觀察，指出{n}項設施或服務，以判斷{地}屬全套服務式酒店還是有限度服務式酒店。","a":[["餐廳／中菜廳／扒房／自助餐／酒吧","餐飲：全套服務式酒店設多間餐廳及酒吧；有限度服務式酒店則少或沒有餐飲設施。"],["宴會廳／會議室／多功能廳／婚宴","宴會及會議場地：全套服務式酒店設有宴會廳及會議室；有限度服務式酒店少或沒有。"],["禮賓／門僮／行李生／泊車","增值服務：全套服務式酒店設禮賓部，代客安排交通、訂座及處理行李。"],["送餐／客房餐飲／房內用膳","客房送餐：全套服務式酒店提供客房送餐，有限度服務式酒店多不提供。"],["健身室／游泳池／泳池／水療","康樂設施：全套服務式酒店設泳池、健身室及水療等康樂設施。"],["洗熨／洗衣／乾洗","洗熨服務：全套服務式酒店為住客提供洗熨衣物服務。"],["房間面積／客房空間／寬敞／房間細小","客房：有限度服務式酒店客房空間不大，服務以清潔客房為主。"],["商務中心／影印／秘書","商務中心：全套服務式酒店提供秘書、影印及小型會議室等支援。"]]},{"tp":"2-1","cs":["功能設施","服務水平"],"ty":["hotel"],"q":"酒店的設施與其目標客源有密切關係。根據你在{地}的觀察，指出{n}類{地}的目標客源，並各以一項設施或服務作例證。","a":[["商務旅客／商務客／公幹／行政人員","商務旅客：酒店設商務中心及行政樓層，方便他們工作及開會。"],["會議／展覽／參展商／與會者","會議及展覽人士：酒店設會議廳及宴會廳，可舉辦大型會議及活動。"],["家庭／親子／兒童／小朋友","家庭旅客：酒店提供家庭房、兒童遊樂室及保姆服務。"],["度假旅客／休閒旅客／渡假／度假客","度假旅客：酒店設泳池、水療及康樂設施，讓旅客放鬆身心。"],["高消費／富裕／名人／政要","高消費旅客：酒店設總統套房及高級餐廳，提供個人化服務。"],["長住／長期住客／月租","長期住客：服務式住宅設廚房及洗衣設施，適合長時間逗留。"],["本地居民／本地人／本地客／婚宴","本地居民：酒店餐廳、婚宴及住宿優惠吸引本地客光顧。"],["預算有限／背包客／學生／經濟型","預算有限的旅客：有限度服務式酒店房價較低，滿足基本住宿需要。"]]},{"tp":"2-1","cs":["地理位置","功能設施","服務水平"],"ty":[],"q":"如{地}一帶要興建一間酒店，以接待到訪{地}的旅客，建議{n}類合適的酒店類型，並加以解釋。","a":[["市中心酒店／市區酒店","市中心酒店：交通便捷，旅客遊覽{地}後可方便前往其他景點。"],["度假酒店／度假村／渡假村","度假酒店：配合一帶的自然風景，提供康樂設施吸引旅客留宿度假。"],["會議酒店／商務酒店","會議或商務酒店：接待前來一帶參加會議展覽或公幹的商務旅客。"],["主題酒店／精品酒店／設計酒店","主題或精品酒店：以{地}的特色為設計主題，提供獨特住宿體驗。"],["古蹟酒店／歷史建築／活化／改建","舊式建築改建酒店：活化附近的歷史建築，讓旅客體驗當地歷史文化。"],["經濟型／旅舍／賓館／有限度服務","經濟型酒店或旅舍：房價較低，適合預算有限的年輕旅客及學生。"],["服務式住宅／長期住宅式／長住","長期住宅式酒店：設廚房及洗衣設施，適合長時間逗留的旅客。"]]},{"tp":"2-2","cs":["酒店設施","酒店地點","職員與客房數目比例","酒店實際平均房租","商務組合","甲級高價酒店","乙級高價酒店","中價酒店","旅客賓館"],"ty":["hotel"],"q":"香港旅遊發展局以五項指標把酒店分為甲級高價、乙級高價、中價酒店及旅客賓館。根據你在{地}觀察或搜集所得的資料，判斷{地}所屬的級別，並就{n}項指標加以說明。","a":[["餐廳／餐飲場地／健身室／泳池／商務中心／無障礙","設施（佔25%）：餐飲、電訊、商務及康樂設施越多，得分越高。"],["地點／位置／地區／尖沙咀／中環／市中心","地點：位於尖沙咀、中環、金鐘、銅鑼灣等地區的酒店得分最高。"],["職員比例／員工比例／員工數目／人手／SRR","職員與客房數目比例：職員相對客房越多，服務越周到，得分越高。"],["房租／房價／每晚／ARR","實際平均房租：每晚實際房租越高，得分越高。"],["商務旅客／商務客／商務組合／公幹","商務組合：商務旅客佔住客的比率越高，得分越高。"]]},{"tp":"2-2","cs":["酒店設施","職員與客房數目比例","酒店實際平均房租","商務組合","中價酒店","乙級高價酒店"],"ty":[],"q":"假設{地}一帶有一間中價酒店希望提升至乙級高價酒店。參考香港旅遊發展局的酒店分類制度，建議{n}項可行的措施，並指出所涉及的評級指標。","a":[["餐廳／餐飲場地／酒吧／咖啡室","設施：增設餐廳或酒吧，增加飲食設施數目。"],["Wi-Fi／寬頻／上網／手提電腦","設施：提升電訊設施，例如寬頻、無綫上網及可租借手提電腦。"],["商務中心／會議室／宴會廳／行政樓層","設施：增設商務中心、會議設施或行政樓層。"],["健身室／泳池／水療／按摩／桑拿","設施：增設健身室、泳池或水療按摩等康樂設施。"],["無障礙／殘疾／輪椅","設施：增設為殘疾旅客而設的無障礙客房，屬其他設施。"],["增聘／聘請／增加職員／增加人手／更多員工／職員比例","職員與客房數目比例：增聘員工，提高比例及服務水平。"],["提高房價／提高房租／提升房租／加價／房價較高／實際房租","實際平均房租：提升客房質素，以較高房價出售客房。"],["商務優惠／公司價／企業客戶／商務旅客","商務組合：推出商務優惠或公司價，吸引更多商務旅客。"]]},{"tp":"2-3","cs":["標準級客房","特級客房","豪華級客房","行政套房","總統套房"],"ty":["hotel"],"q":"根據你在{地}的觀察或其網頁資料，比較{地}兩種不同等級的客房，指出{n}項差異。","a":[["景觀／海景／山景／園景／景色","景觀：標準級客房景觀較差；豪華級客房景色優美，例如享有海景。"],["高層／頂樓／低層／較高樓層","位置：等級越高的客房多位於越高樓層，總統套房通常設於頂樓。"],["面積／空間／寬敞／起居間／工作間","面積及間隔：行政套房分工作間和睡房，比標準級客房寬敞。"],["裝修／傢俬／家具／名貴／用品","設備：等級越高，裝修越豪華，選用越名貴的設施及用品。"],["果籃／報章／免費上網／迎賓","附加服務：特級客房有免費報章，豪華級客房有迎賓果籃。"],["行政酒廊／行政樓層／特快登記／快速登記","行政樓層服務：行政套房住客可特快辦理入住及使用行政酒廊。"],["房價／價錢／收費／房租","房價：等級越高，房價越貴，總統套房收費最高。"],["保安／通行證／密碼／門禁","保安：總統套房保安嚴密，電梯要通行證才能到達該樓層。"]]},{"tp":"2-3","cs":["行政套房","總統套房"],"ty":["hotel"],"q":"如{地}要吸引高級行政人員及政要名人入住其最高級別的客房，建議{n}項它應提供的設施或服務。","a":[["特快登記／快速登記／專屬櫃檯／房內登記","特快辦理入住及退房手續，可在行政樓層或客房內登記。"],["行政酒廊／下午茶／雞尾酒／免費早餐","可於行政樓層酒廊享用免費早餐、下午茶、雞尾酒及小食。"],["果籃／報章／免費上網／Wi-Fi","提供迎賓果籃、免費報章及免費上網。"],["健身中心／健身室／泳池","免費使用健身中心等康樂設施。"],["折扣／八折／九折／優惠價","商務中心、餐廳、按摩美容及洗熨服務享有折扣。"],["樓層管家／私人管家／專人服務／專屬管家","提供行政樓層管家或專人服務，所有服務均優先辦理。"],["保安／密碼／通行證／門禁","保安嚴密，電梯須以密碼或通行證才能到達該樓層。"],["工作間／商務中心／會議室","房內設工作間，並提供商務中心及會議室，方便處理公務。"]]},{"tp":"2-3","cs":["標準級客房","豪華級客房","行政套房","總統套房"],"ty":[],"q":"到訪{地}的旅客類型多元化。如{地}一帶要興建一間酒店，建議{n}類應設置的客房，並說明其目標顧客。","a":[["標準級／標準房／標準客房","標準級客房：房價較低，適合預算有限的一般旅客。"],["特級／豪華級／豪華房","特級或豪華級客房：景觀較佳、設施較多，適合度假旅客。"],["行政套房／行政樓層／行政客房","行政套房：設工作間及行政酒廊，適合商務旅客及公司客戶。"],["總統套房／總統房","總統套房：景觀最佳、保安嚴密，適合政要名人及富裕旅客。"],["無障礙／扶手／緊急按鈕","無障礙客房：設扶手及緊急按鈕，適合殘疾人士及長者。"],["三人房／家庭房／兩張床／加床","三人房或家庭房：有多張床或可加床，適合一家大小。"],["雙人房／荷李活式／荷里活式／大床","雙人房：設雙人床或大床，適合夫婦入住。"],["單人房／單人床","單人房：面積較小，只供一位客人入住，適合獨遊旅客。"]]},{"tp":"2-4","cs":[],"ty":["hotel"],"q":"根據你在{地}搜集的房價資料，指出{n}項令{地}客房收費出現差異的因素，並加以說明。","a":[["旺季／淡季／節日／節慶／假期／盛事","旅遊季節節慶及活動：旺季、節日或有大型展覽盛事時房價較高，淡季較低。"],["景觀／海景／高層／套房／等級／級別","房間的級別：景觀較佳、樓層較高或等級較高的客房收費較高。"],["早餐／歐陸式／美式／歐式／膳食／包餐","房間計價方法：房價包括早餐或其他膳食的（如歐陸式、美式計價）收費較高。"],["長住／連住／多晚／月租／住得久","租住時間長短：租住時間較長，可獲較佳的折扣。"],["公司價／團體價／會員價／航空公司／同業價","顧客類別：公司客、旅行團及航空公司員工等可享不同的優惠價。"],["周末／週末／平日","周末價：商務客為主的酒店假日入住率較低，會推出周末價。"],["套票／套票價／連門票","套票價：住宿連餐飲或景點門票的套票，多用於淡季以提升入住率。"],["加床／住客人數／入住人數","住客人數：加床需額外收費，入住人數越多，收費越高。"]]},{"tp":"2-4","cs":["房間計價方法"],"ty":["hotel"],"q":"{地}可按不同的房間計價方法收費。就{n}類不同需要的旅客，各建議一種最合適的計價方法，並加以解釋。","a":[["歐式／EP／只包房間／不包餐／不含早餐","歐式計價（EP）：只包房間，適合喜歡在外品嚐當地美食的自由行旅客。"],["歐陸式／CP／只包早餐／只含早餐","歐陸式計價（CP）：包房間及早餐，適合只在酒店吃早餐的商務旅客。"],["修正美式／MAP／兩餐／早晚餐／半膳","修正美式計價（MAP）：包房間及兩餐，適合日間外出、晚上回酒店用膳的旅客。"],["三餐／全膳／全包／早午晚","美式計價（AP）：包房間及三餐，適合入住偏遠度假酒店、難以在外用餐的旅客。"]]},{"tp":"2-4","cs":["旅遊季節節慶及活動","顧客類別","租住時間長短","房間計價方法"],"ty":[],"q":"旅遊淡季期間，{地}一帶的酒店入住率偏低。建議{n}項與房價有關的推廣策略，以吸引旅客入住。","a":[["套票／套票價／連門票／連餐飲","推出套票價，把住宿連同{地}門票或餐飲組合出售，增加吸引力。"],["周末價／週末價／周末優惠","推出周末價，吸引度假旅客在周末入住。"],["團體價／旅行團／旅行社","向旅行社提供團體價，吸引旅行團入住。"],["公司價／公司戶口／企業客戶","與公司簽訂公司價，吸引其商務旅客及外地來客入住。"],["長住／連住／多晚／月租","為連住多晚或長住的旅客提供較佳折扣。"],["會員／常客／積分","推出會員價及積分獎賞，吸引常客再次入住。"],["包早餐／含早餐／歐陸式／免費早餐","提供包早餐的房價（歐陸式計價），以增值代替減價吸引旅客。"],["升級／免費升級","提供免費客房升級，提升物有所值的感覺。"]]},{"tp":"2-5","cs":["入住率","每日平均房價（ADR）","每間可銷售房收入（RevPAR）","超額預訂"],"ty":["hotel"],"q":"酒店業界以入住率、每日平均房價（ADR）及每間可銷售房收入（RevPAR）評估營業表現。以{地}為例，建議{n}項可提升這些指標的措施。","a":[["超額預訂／超額訂房","接受適量超額預訂，填補客人退訂或不出現的空房，提高入住率。"],["套票／周末價／淡季優惠","淡季推出套票或周末價，吸引旅客入住，提高入住率。"],["升級／向上銷售／推銷較高級","款接員向客人推銷較高級的客房，提高每日平均房價。"],["旺季加價／節慶加價／彈性定價／收益管理","旺季、節慶或大型活動期間調高房價，提高每日平均房價。"],["網上／OTA／訂房平台／訂房網站","透過網上訂房平台擴闊銷售渠道，接觸更多客源。"],["會員／常客／積分","推行會員積分計劃，吸引常客重複入住。"],["待修／維修／盡快清潔／OOO","盡快完成待修及未清潔的客房，增加可出售的客房數目。"],["減少折扣／正價","減少不必要的折扣，盡量以正價出售客房。"]]},{"tp":"2-5","cs":["超額預訂"],"ty":[],"q":"旅遊旺季期間，{地}一帶的酒店或會因超額預訂而未能為已訂房的客人安排入住。描述{n}項酒店可採取的處理措施。","a":[["重覆／重複／取消／核對預訂／查證","查證預訂狀況，找出重覆、未及時更改或已取消的預訂。"],["優先／保證預訂／VIP／貴賓","排列處理先後，優先處理行政樓層、總統套房及保證預訂的客人。"],["空房／可供銷售／客房狀況／查核客房","查核所有客房的狀況，找出是否仍有可供銷售的客房。"],["轉介／姊妹酒店／附近酒店／另一間","安排客人轉往附近或姊妹酒店入住。"],["道歉／致歉","由大堂副經理等高級職員親自向客人致歉。"],["升級／較高級","若轉介的酒店較遠，可為客人安排較高級的客房。"],["折扣／交通費／的士費／賠償","提供折扣優惠或支付前往另一酒店的交通費作補償。"],["致電／跟進","高級職員其後再致電客人，了解其入住情況。"]]},{"tp":"2-6","cs":["管理合約"],"ty":["hotel"],"q":"假設{地}的擁有人考慮聘請國際酒店管理公司，以管理合約模式營運酒店。分析此安排對擁有人的{n}項好處或壞處。","a":[["不必參與／毋須參與／只需投入資金","好處：擁有人只需投入資金，不必參與日常營運。"],["專業知識／專業管理／管理質素","好處：管理公司運用專業知識技能，提升管理質素。"],["知名度／品牌／地位","好處：借助國際品牌，提升擁有者地位及酒店知名度。"],["集團支援／訂房系統／培訓","好處：得到酒店集團的支援，例如訂房系統及員工培訓。"],["降低成本／營運成本／規模經濟","好處：通過與集團合作，降低營運成本。"],["攤薄／酬金／管理費／花紅","壞處：須向管理公司支付酬金或花紅，利潤會被攤薄。"],["依賴／控制權／被動","壞處：擁有人依賴性高，失去營運控制權，卻要承擔業務虧損。"],["糾紛／分歧／目標不一","壞處：擁有人重視盈利，管理公司重視酬金和聲譽，目標不一或引起糾紛。"]]},{"tp":"2-6","cs":["獨立擁有及經營","特許經營"],"ty":[],"q":"如{地}一帶要開設一間小型酒店，比較以獨立擁有及經營與特許經營兩種模式營運的{n}項差異。","a":[["品牌／知名度／商譽","品牌：特許經營可使用集團品牌及商譽；獨立經營須自建品牌及口碑。"],["加盟費／特許權費／申請費／推廣費","費用：特許經營須付申請費、特許權費及市場推廣費；獨立經營則毋須。"],["自主／彈性／靈活","自主性：獨立經營自主性較大、營運較有彈性；特許經營須依從集團規定。"],["標準化／獨特／個人化／創新","特色：特許經營服務標準化、難以創新；獨立經營較具獨特性。"],["訂房系統／採購網絡／質量控制／集團支援","支援：特許經營可用集團訂房系統及採購網絡；獨立經營欠缺支援。"],["規模經濟／成本效益","成本：特許經營成本效益較高；獨立經營難以達到規模經濟效益。"],["自負盈虧／風險／入住率","風險：獨立經營完全自負盈虧；特許經營較能保證入住率。"],["集資／擴張／開業","發展：獨立經營集資能力較低、難以擴張；特許經營可縮短開業成長期。"]]},{"tp":"2-7","cs":["前線部門","客務部","餐飲部","營業及市場推廣部"],"ty":["hotel"],"q":"根據你在{地}的觀察，指出{n}個酒店的前線部門或分部，並各舉一項其工作例子。","a":[["款接／接待處／前台／登記","款接部：在大堂櫃檯為客人辦理入住及退房手續。"],["禮賓／門僮／行李生／泊車","禮賓部：為客人開門、處理行李及安排交通。"],["餐飲／餐廳／酒吧／宴會／送餐","餐飲部：在餐廳、酒吧及宴會廳提供各類餐飲服務。"],["營業／市場推廣／推廣部／銷售部／宣傳","營業及市場推廣部：向旅行社及公司促銷，並管理常客優惠計劃。"],["電話／總機／接線生","電話通訊部：處理來電轉駁、叫醒及留言服務。"],["商務中心／秘書／影印","商務中心：為客人提供秘書、影印及小型會議室等支援。"],["訂房／預訂","訂房部：處理各渠道的訂房並確認預訂。"],["大堂副經理／大堂經理／投訴","大堂副經理：在大堂獨立櫃檯處理顧客投訴及查詢。"]]},{"tp":"2-7","cs":["後勤部門","財務部","人力資源部","工程部","保安部"],"ty":["hotel"],"q":"酒店的後勤部門較少與顧客直接接觸。指出{n}個{地}的後勤部門，並以你觀察到的例子說明其職能。","a":[["管家部／房務／布草／清潔","管家部：負責客房及公共地方的清潔，以及布草和物資供應。"],["工程部／維修／保養／技術員","工程部：維修及保養冷氣、升降機等設備，維持物業質素。"],["保安部／保安／閉路電視／巡邏","保安部：巡查消防設施，以閉路電視保障顧客財物及人身安全。"],["人力資源／人事部／招聘／培訓","人力資源部：負責招聘、培訓、薪酬福利及制服管理。"],["財務部／會計／預算／賬目／帳目","財務部：處理收支賬款、發薪、編列預算及成本控制。"],["資訊科技／IT／電腦系統","資訊科技部：統籌酒店電腦系統及網絡的運作。"],["採購部／採購／供應商","採購部：統一處理各部門的採購申請，並建立供應商資料庫。"]]},{"tp":"2-7","cs":["前線部門","後勤部門","財務部","人力資源部","工程部","保安部"],"ty":[],"q":"參考酒店的組織架構，把{地}的運作分為前線及後勤部門，指出{n}個部門並描述其職能。","a":[["售票／票務／詢問處／服務台／接待","票務及詢問處：屬前線部門，負責售票、回答查詢及接待旅客。"],["餐飲／餐廳／咖啡室／食肆","餐飲部門：屬前線部門，經營場內餐廳及咖啡室，帶來收益。"],["市場推廣／宣傳／公關／社交媒體","市場推廣部：策劃宣傳及公關活動，管理社交媒體。"],["財務／會計／收支","財務部：屬後勤部門，處理收支、預算及成本控制。"],["人力資源／人事／招聘／培訓","人力資源部：屬後勤部門，負責招聘及培訓員工。"],["工程／維修／保養","工程部：屬後勤部門，維修及保養場內設備。"],["保安／閉路電視／巡邏","保安部：屬後勤部門，巡邏及監察閉路電視，保障旅客安全。"],["清潔／打掃","清潔部門：類似酒店管家部，負責公共地方的清潔。"]]},{"tp":"2-8","cs":["抵埗","入住"],"ty":["hotel"],"q":"根據你在{地}的觀察，描述顧客在抵埗及入住階段會接觸到的{n}項酒店服務。","a":[["迎接／開門／門僮／歡迎","抵埗時，禮賓部員工在門口迎接客人並為他們開門。"],["行李生／搬運行李／行李","行李生協助客人搬運行李，並陪同前往客房。"],["登記／核對證件／護照／簽名","款接部為客人辦理登記，核對訂房資料及證件，並請客人簽名。"],["按金／信用卡／付款方式","款接員確認付款方式，請客人以現金或信用卡交付按金。"],["房卡／房匙／鑰匙／鎖匙／匙卡","款接員分發房匙，並介紹早餐時間等酒店資訊。"],["執房／清潔客房／開床","入住期間，管家部負責清潔客房及提供開床服務。"],["送餐／客房餐飲／房內用膳","入住期間，客人可享用客房送餐服務。"],["叫醒／保險箱／掛賬／簽賬","客人可使用叫醒服務及保險箱，並以掛賬形式使用設施。"]]},{"tp":"2-8","cs":["離開"],"ty":["hotel"],"q":"描述{n}項{地}款接部在客人退房離開時的工作程序。","a":[["問候／微笑","客人接近櫃台時，微笑並問候客人，詢問是否需要協助。"],["查房／管家部","透過資產管理系統通知管家部查房。"],["迷你酒吧／收費服務","詢問客人有否使用房內迷你酒吧及其他收費服務。"],["保險箱／貴重物品","提示客人勿忘記取回保險箱內的物品。"],["漏賬／延遲／附加費","核對有否漏賬，以及客人是否需支付延遲退房的附加費用。"],["核對賬單／列印賬單／賬單／帳單","列印賬單請客人再次核對，如有問題須查證及解釋。"],["按金／信用卡／現金／結賬／結帳","請客人簽署單據，以按金、信用卡或現金結賬。"],["歷史紀錄／客房狀況／更新紀錄","更新資產管理系統內的客房狀況及顧客歷史紀錄。"]]},{"tp":"2-8","cs":["抵埗前","抵埗","入住","離開"],"ty":[],"q":"參考酒店顧客流程的四個階段，就{n}個不同階段，各描述一項{地}為旅客提供的服務。","a":[["網上購票／預約／官網／預訂／網站","抵埗前：旅客可在官網查閱資訊，並網上預約或購票。"],["售票處／驗票／迎接／入口／寄存／登記","抵埗：職員在入口迎接旅客，協助驗票或登記，並提供寄存服務。"],["導賞／導覽／指示牌／詢問處／地圖／客房服務","參觀（入住）期間：提供導賞、指示牌及詢問處，協助旅客遊覽。"],["禮品店／紀念品／問卷／意見／退房／出口","離開：協助旅客辦理退房或在出口設禮品店，並收集旅客意見。"]]},{"tp":"2-8","cs":["抵埗前"],"ty":["hotel"],"q":"一個有年幼子女的家庭預訂了{地}的客房，並提出多項特別要求。描述訂房部在客人抵埗前可如何與{n}個部門協調，以滿足他們的需要。","a":[["禮賓／接機／司機／接送","通知禮賓部客人的航班資料，安排機場接送。"],["管家部／房務／嬰兒床／兒童用品／毛巾","通知管家部預備嬰兒床、兒童用品及額外毛巾。"],["餐飲部／廚房／兒童餐／過敏","通知餐飲部客人的飲食要求，例如幼兒對花生過敏。"],["款接／前台／預先分配／編排","通知款接部預先分配合適的客房，方便客人抵埗後盡快入住。"]]},{"tp":"2-9","cs":["前堂經理","大堂副經理","款接部","禮賓部","訂房部","電話通訊部"],"ty":["hotel"],"q":"根據你在{地}大堂的觀察，指出{n}個前堂部的崗位或分部，並描述其職能。","a":[["前堂經理／前堂主管","前堂經理：大堂範圍的最高級職員，領導員工並接待重要人物。"],["大堂副經理／大堂經理／副經理","大堂副經理：在大堂獨立櫃檯處理投訴及查詢，維持大堂秩序。"],["款接／接待處／前台／登記","款接部：為客人辦理入住及退房，並負責保險箱及外幣兌換。"],["禮賓／門僮／行李生／泊車","禮賓部：負責行李安排、汽車接送、泊車及開門等服務。"],["訂房／預訂","訂房部：處理訂房、編製重要人物名單及決定是否超額預訂。"],["電話／總機／接線生","電話通訊部：處理來電轉駁、叫醒及留言服務。"],["商務中心／秘書","商務中心：提供秘書服務、會議室及電腦設備。"],["出納／收銀／結賬／結帳","出納部：處理客人結賬款項。"]]},{"tp":"2-9","cs":["禮賓部"],"ty":["hotel"],"q":"除了處理行李外，描述{n}項{地}禮賓部可為住客提供的服務。","a":[["接送／接機／司機／轎車／的士","安排汽車接送，例如機場接機、專車或召喚的士。"],["泊車／開門／代客","為駕車客人代客泊車，並在門口為客人開門。"],["代訂／訂座／訂票／門票","代客人預訂餐廳座位及表演門票。"],["旅遊資訊／購物資訊／地圖／推介／當地餐廳","提供當地餐廳、購物及旅遊景點等資訊。"],["機票／航班","協助客人處理機票及航班等問題。"],["郵遞／寄信／速遞／包裹","代客人辦理郵遞及寄送包裹。"],["介紹設備／酒店設施／酒店服務","向客人介紹酒店內的設備及服務。"]]},{"tp":"2-9","cs":["款接部"],"ty":["hotel"],"q":"一個旅行團將於傍晚抵達{地}。描述款接部可作出的{n}項安排，以免團體客人影響大堂秩序及其他客人辦理手續。","a":[["預先分配／事前分配／預留","在團體客人到達前，預先分配所需客房。"],["等候區／等候地方／另設櫃檯／分流","安排團體客人在指定地方等候，避免大批客人擠在大堂。"],["領隊／導遊","把鎖匙卡、早餐券等文件交予領隊統一分發。"],["護照／證件／核實身分","核實所有團體客人的個人資料，例如護照。"],["注意事項／早餐時間／集合時間","向領隊說明注意事項，例如早餐時間及退房時間。"],["行李生／搬運／送上樓層","由行李生把行李搬到客人所住樓層，再由客人認領。"],["更新紀錄／更新資料／PMS","分配房間後，更新各房間的住客資料紀錄。"]]},{"tp":"2-9","cs":["款接部","禮賓部","大堂副經理","電話通訊部"],"ty":[],"q":"參考酒店前堂部的職能，建議{n}項{地}的詢問處或服務台可為旅客提供的服務。","a":[["查詢／地圖／小冊子／指示","像款接部一樣回答旅客查詢，並提供地圖及小冊子。"],["投訴／意見","像大堂副經理一樣處理旅客投訴及聆聽意見。"],["寄存／儲物櫃／行李","像禮賓部一樣提供行李及物品寄存服務。"],["的士／接駁／交通","協助旅客召喚的士，或提供接駁交通資訊。"],["代訂／訂座／預約","代旅客預訂餐廳座位、導賞團或活動名額。"],["借用／輪椅／嬰兒車","借出輪椅及嬰兒車，照顧有需要的旅客。"],["廣播／電話","像電話通訊部一樣接聽電話查詢及作出廣播。"],["推介／推銷／介紹活動","適時向旅客推介場內活動、餐飲及紀念品，增加收入。"]]},{"tp":"2-10","cs":["客房樓層","公共地方","制服及布草房","洗衣房","其他職能","管家部辦公室"],"ty":["hotel"],"q":"根據你在{地}的觀察，指出{n}項由管家部負責的工作，並以你看見的例子說明。","a":[["客房清潔／執房／開床／鋪床／房務員","客房樓層：房務員清潔客房，並為住客提供開床服務。"],["大堂／洗手間／走廊／升降機／公共地方","公共地方：清潔大堂、洗手間、走廊及升降機等地方。"],["布草／床單／毛巾／被鋪／枕袋","制服及布草房：保管、收發及修補床單、毛巾等布草用品。"],["洗衣／洗熨／熨衫／乾洗","洗衣房：洗熨員工制服、布草及住客衣物。"],["花卉／鮮花／植物／園藝／盆栽","其他職能：負責花卉植物及園藝，美化酒店環境。"],["防蟲／滅蟲／蚊蟲／曱甴","其他職能：進行防蟲工作，保持環境衞生。"],["失物／遺失／失物認領","管家部辦公室：設失物認領中心，處理住客遺留的物品。"],["補充用品／洗漱用品／迷你酒吧","房務員補充客房用品，並檢查迷你酒吧。"]]},{"tp":"2-10","cs":["客房樓層"],"ty":["hotel"],"q":"描述{n}項{地}房務員清潔及整理客房時須注意的事項。","a":[["敲門／表明身分","進房前先敲門並表明身分，尊重住客私隱。"],["請勿打擾／DND","留意門外「請勿打擾」指示，不應進房打擾住客。"],["更換床單／更換毛巾／布草","更換床單及毛巾等布草，並把床鋪整理妥當。"],["補充／洗漱用品／茶包／拖鞋","補充洗漱用品、茶包及拖鞋等客房用品。"],["迷你酒吧／迷你吧","檢查迷你酒吧的消耗並記錄收費。"],["報修／故障／工程部","發現設備故障時，通知工程部維修。"],["失物／遺留物品","拾獲住客遺留的物品，交管家部辦公室處理。"],["次序／優先／VD／先清潔","按客房狀況編排清潔次序，例如優先清潔即將有客人入住的空房。"]]},{"tp":"2-10","cs":["客房樓層","洗衣房","制服及布草房"],"ty":["hotel"],"q":"建議{n}項{地}管家部可推行的環保措施，並解釋其成效。","a":[["重用卡／毛巾重用／床單重用／不用每天更換","放置布草重用卡，讓住客選擇毋須每天更換毛巾床單，節約用水。"],["LED／節能燈／慳電","全面轉用LED燈泡，減少用電。"],["大支裝／補充裝／即棄用品／梳洗用品","以大支裝洗髮液取代小支裝即棄用品，減少塑膠廢物。"],["環保清潔劑／天然清潔劑","使用環保清潔劑，減少洗滌劑對環境的污染。"],["節水／慳水／省水","於浴室安裝節水裝置，減少用水量。"],["回收／分類","在客房及後勤區設回收箱，分類回收廢物。"],["房卡／感應器／自動關燈","以房卡或感應器控制電源，住客離房後自動關燈及冷氣。"],["捐贈／肥皂","收集住客用剩的肥皂，消毒後捐贈予有需要人士。"]]},{"tp":"2-10","cs":["公共地方","其他職能"],"ty":[],"q":"參考酒店管家部的職能，指出{n}項{地}保持公共地方清潔整潔的工作，並說明其重要性。","a":[["洗手間／廁所","定時清潔洗手間並補充用品，避免異味影響旅客觀感。"],["地面／地板／拖地／吸塵","定時清潔地面，保持整潔並防止旅客滑倒。"],["扶手／升降機按鈕／門柄／消毒","定時消毒扶手及升降機按鈕等常觸摸位置，減少病菌傳播。"],["垃圾桶／垃圾／回收","定時清理垃圾桶及回收箱，避免垃圾滿溢。"],["花卉／植物／園藝／盆栽","打理花卉植物及園藝，美化環境。"],["防蟲／滅蟲／蚊蟲／曱甴","定期進行防蟲工作，避免蚊蟲滋擾旅客。"],["失物／遺失","設失物認領服務，處理旅客遺留的物品。"],["玻璃／窗戶／展櫃","抹拭玻璃門窗及展櫃，保持景觀及展品清晰。"]]},{"tp":"2-11","cs":["酒店市場","閒暇市場","商業及工業市場","交通市場","學生市場","零售市場","醫護市場","其他公營部門市場"],"ty":[],"q":"根據你在{地}及其附近的觀察，按餐飲服務的市場分類，指出{n}類餐飲服務，並各舉一個你看見的例子。","a":[["酒店市場／酒店餐廳／酒店咖啡室","酒店市場：設於酒店內的餐廳，為住客及外來客服務。"],["閒暇市場／景點餐廳／景點內／休閒場所","閒暇市場：設在旅遊景點及休閒場所的餐廳，例如主題公園或博物館內的咖啡室。"],["商業及工業／員工飯堂／商業區／寫字樓","商業及工業市場：位於商業或工業區，主要提供早餐、午餐及下午茶。"],["交通市場／車站／機場／碼頭／港鐵","交通市場：設於交通樞紐的食肆，或交通工具上的膳食。"],["學生市場／學校／大學／校園","學生市場：設於大專院校及中學的食堂或餐廳。"],["零售市場／便利店／超級市場／超市","零售市場：在便利店、超市出售場內用餐或外賣的餐飲。"],["醫護市場／醫院／安老院／護老院","醫護市場：服務醫院及療養院的病人，着重食品控制和健康。"],["公營部門／政府／懲教","其他公營部門市場：由政府擁有或批准的承辦商經營，降低成本及售價。"]]},{"tp":"2-11","cs":["酒店市場"],"ty":["hotel"],"q":"以{地}為例，描述{n}項酒店市場餐飲服務的特點。","a":[["外來客／非住客／本地客／房客","酒店餐廳同時為房客及外來客人服務。"],["高級餐廳／咖啡室／自助餐","大規模的酒店會設有高級餐廳和咖啡室等不同餐廳。"],["獨立經營／租戶／外判／品牌餐廳","酒店內的餐廳不一定由酒店全資經營，部分可能由獨立經營者經營。"],["級別／風格","酒店餐廳的規模、設計和營運模式與酒店的級別和風格關係密切。"],["當地特色／本地菜／地道","國際酒店集團會配合市場，提供具當地特色的餐飲產品。"],["高檔形象／氣氛／高素質","藉酒店高檔形象、高素質服務和環境氣氛吸引外來客光顧。"],["宴會／婚宴／到會","餐飲部提供宴會及到會服務。"],["送餐／客房餐飲","為住客提供客房送餐服務。"]]},{"tp":"2-11","cs":[],"ty":[],"q":"連鎖式經營的餐廳十分普遍。以{地}內或附近的餐廳為例，描述{n}項連鎖式經營餐廳的優點或缺點。","a":[["成本效益／中央採購／大量採購／中央廚房","優點：集團中央採購及設中央廚房，成本效益良好。"],["調動／調配／靈活","優點：資源調動靈活，可在分店之間調配人手及食材。"],["市場佔有率／佔有率／分店多","優點：分店眾多，能維持較高的市場佔有率。"],["品牌效應／知名度／品牌","優點：具品牌效應，顧客容易認識及信任。"],["標準化／一致／統一","優點：透過標準化保持高質素，各分店的食物及服務一致。"],["失去特色／欠特色／千篇一律／獨有特色","缺點：容易失去獨有特色，難以迎合個別地區顧客的口味。"],["行政成本／財務成本／總公司","缺點：設總公司作中央管理，行政及財務成本高昂。"]]},{"tp":"2-12","cs":["市場方面","顧客方面","營運方面","與食物有關的因素","食材成本與餐單價格"],"ty":["restaurant","hotel"],"q":"細閱{地}的餐牌，以例子分析其規劃餐單時考慮的{n}項因素。","a":[["潮流／新菜式／新口味／打卡","迎合飲食潮流：定期檢視菜式並加入新菜式，例如流行的植物肉菜式。"],["形象／主題／風格","配合餐廳形象主題：菜式名稱及款式配合餐廳的形象和主題。"],["節慶／節日／季節／時令／應節","配合節慶與季節：推出應節及時令菜式，令顧客感受節日氣氛。"],["消費能力／人均消費／價錢範圍／價位","消費能力：菜式價錢配合目標顧客群預計的人均消費。"],["素食／清真／過敏／飲食要求／宗教","飲食要求：提供素食及標示致敏食材，照顧顧客不同的飲食需要。"],["營業時間／午市／晚市／早餐／下午茶","營業時間：不同時段提供不同餐單，例如午市套餐及下午茶。"],["營養／健康／少油／少鹽","營養價值：加入標榜健康飲食的菜式，例如少油少鹽的選擇。"],["成本／利潤／定價","食材成本與餐單價格：平衡食材成本與售價，確保有利潤。"]]},{"tp":"2-12","cs":["市場方面","顧客方面","營運方面","與食物有關的因素","食材成本與餐單價格"],"ty":[],"q":"如{地}要開設一間餐廳，從{n}個方面解釋規劃餐單時應考慮的因素，並以{地}的情況加以說明。","a":[["市場方面／潮流／同行／競爭／形象／節慶","市場方面：迎合飲食潮流、參考同行做法，並配合{地}的形象主題。"],["顧客方面／目標顧客／消費能力／飲食要求／素食／用餐習慣","顧客方面：考慮到訪{地}的目標顧客群、其消費能力及飲食要求。"],["營運方面／營業時間／廚房／人手／製作時間","營運方面：配合{地}的開放時間，並考慮廚房設備、人手及製作時間。"],["與食物有關／食材供應／營養／食物安全／衞生／衛生","與食物有關的因素：考慮食材供應是否穩定、營養價值及食物衞生安全。"],["成本／價格／利潤／定價","食材成本與餐單價格：平衡食材成本與售價，令顧客覺得物有所值。"]]},{"tp":"2-12","cs":["顧客方面"],"ty":[],"q":"到訪{地}的旅客可能來自不同國家及文化背景。建議{n}項{地}內或附近的餐廳在規劃餐單時可照顧他們需要的做法。","a":[["清真／Halal／穆斯林／回教","為穆斯林旅客提供清真食品，不含豬肉及酒精。"],["素食／齋菜／Vegan／蔬食","提供素食選擇，照顧素食者及部分宗教人士。"],["牛肉／印度教","提供不含牛肉的菜式，照顧印度教徒的飲食禁忌。"],["過敏／致敏／花生／麩質","在餐單上標示致敏食材，例如花生及海鮮。"],["多語言／英文／日文／翻譯／外語","提供多語言餐單，方便外地旅客點餐。"],["圖片／相片／照片","在餐單附上菜式圖片，讓旅客容易理解。"],["本地特色／地道／港式／傳統","加入本地特色菜式，讓旅客體驗地道飲食文化。"],["份量／小份／半份","提供不同份量選擇，照顧不同食量及用餐習慣的旅客。"]]},{"tp":"2-12","cs":["營運方面"],"ty":["restaurant"],"q":"以{地}為例，解釋{n}項營運方面的因素如何影響其餐單的設計。","a":[["位置／地點／客流／人流","餐廳位置：餐廳位置與客流及顧客的餐飲要求關係密切。"],["營業時間／午市／晚市／早市","營業時間：不同時段提供不同餐單，例如午市套餐、晚市自選餐。"],["廚藝／廚師／人手／員工數目","廚房員工廚藝及人數：主廚須考慮員工能否應付餐單上的菜式。"],["廚房設備／焗爐／儲存／保鮮","廚房設備：餐單要配合儲存、保鮮及烹調設備。"],["製作時間／上菜時間／等候","製作時間：製作時間太長會影響營業額，對快餐店尤其重要。"],["樓面／座位／餐桌","樓面設施：樓面設計與餐桌擺設須配合餐單上的菜式。"]]},{"tp":"2-13","cs":["用餐區","水吧","款接部","收銀部","經理室及行政部","員工儲物室和更衣室","電子銷售終端機（POS）"],"ty":["restaurant","hotel"],"q":"根據你在{地}的觀察，指出{n}個餐廳的功能區域或設施，並描述其作用。","a":[["用餐區／座位／餐桌／貴賓房","用餐區：供客人用餐，劃分為多個區域，由侍應分區負責。"],["水吧／吧枱／吧台／吧檯／調酒","水吧：負責提供各類飲料，設於用餐區能增加格調和氣氛。"],["款接／帶位／訂座／接待","款接部：在入口安排座位及接受訂座，把客人平均分配到各區域。"],["收銀／結賬／結帳／付款／埋單","收銀部：負責收銀工作，處理客人付款。"],["POS／點餐機／落單機／平板","電子銷售終端機（POS）：用於輸入客人訂單，餐具亦放於附近。"],["廚房／製作區／開放式廚房","食物製作區：廚師烹調食物，開放式廚房更可增加表演性。"],["經理室／行政部／辦公室","經理室及行政部：處理行政及會計工作，放置電腦系統及保險箱。"],["更衣室／儲物室","員工儲物室和更衣室：供員工更換制服及存放私人物品。"]]},{"tp":"2-13","cs":["用餐區"],"ty":["restaurant"],"q":"根據你在{地}用餐區的觀察，描述{n}項座位或餐桌佈局的設計，並解釋其對餐廳營運或顧客的好處。","a":[["分區／劃分／負責範圍／侍應分區","分區：每區由侍應負責，權責清楚、工作量平均，便於管理。"],["貴賓房／包廂／私人房／最低消費","貴賓房：私隱度較高、環境更舒適，並可要求最低消費以增加收入。"],["停用／關閉部分／暫停使用","平日較清閒時停用部分區域，方便管理及減低成本。"],["併枱／拼枱／拼台／兩人枱／小枱","使用兩人小餐桌，可按人數併合成較大的餐桌，增加彈性。"],["圓枱／圓檯／翻開／大圓枱面","四人枱可翻開成六人圓枱，或加上大圓枱面接待大夥人。"],["一整排／卡位／長椅／梳化","部分座位設計成一整排，方便按人數靈活編排。"],["寬敞／距離／空間","餐枱之間越寬敞，客人用餐越享受，但可招待的人數較少。"],["單人座位／吧枱座位／吧台","水吧前設單人座位，方便客人與調酒員接觸。"]]},{"tp":"2-13","cs":["用餐區","款接部","收銀部","水吧","電子銷售終端機（POS）"],"ty":[],"q":"如{地}要開設一間餐廳，建議{n}項餐廳佈局的設計，以配合到訪{地}的旅客的需要。","a":[["家庭區／分區／團體區／貴賓房","劃分家庭區及團體區，方便接待不同類型的旅客。"],["併枱／拼枱／大圓枱／彈性","採用可併合的小餐桌，靈活接待團體旅客。"],["等候區／款接／帶位／訂座","在入口設款接部及等候區，管理人流及訂座。"],["收銀／自助付款／電子付款","收銀處設於出口附近並接受電子付款，加快結賬。"],["水吧／外賣窗口／外賣櫃檯","設水吧及外賣窗口，方便趕時間的旅客購買飲品。"],["點餐機／QR／掃碼／POS","設自助點餐機或掃碼點餐，提供多語言介面。"],["無障礙／輪椅／斜道","設無障礙通道及座位，方便輪椅使用者。"],["嬰兒車／行李／儲物","設嬰兒車及行李存放處，方便家庭及遊客。"]]},{"tp":"2-13","cs":["款接部"],"ty":["restaurant"],"q":"描述{n}項餐廳款接部（入口接待處）的工作，並以{地}為例解釋其對餐廳營運的作用。","a":[["帶位／安排座位／入座","安排客人入座，避免客人自行選位造成混亂。"],["訂座／預約","接受訂座並預先安排座位，方便控制客流。"],["平均分配／分配區域／回轉率／翻檯率","把客人平均分配到各區域，增加餐桌回轉率和營業額。"],["輪候／取籌／排隊／等位","管理輪候的客人，例如派籌及估計等候時間。"],["迎接／歡迎／送客","在入口迎接及歡送客人，給予良好的第一印象。"],["餐牌／推介","為客人送上餐牌並介紹推介菜式。"],["嬰兒椅／特別要求／輪椅","處理客人的特別要求，例如安排嬰兒椅或無障礙座位。"]]},{"tp":"2-14","cs":["視覺","觸覺","聽覺","嗅覺","溫度"],"ty":["restaurant","hotel"],"q":"根據你在{地}的觀察，從{n}個感官方面描述餐廳如何營造環境氣氛。","a":[["視覺／燈光／顏色／裝修／擺設／佈置","視覺：以暖色及柔和燈光營造溫暖浪漫的氣氛。"],["觸覺／座椅／餐具／枱布／質感／地板","觸覺：舒適的座椅及質感良好的餐具，令客人感覺舒適。"],["聽覺／音樂／聲浪／寧靜／嘈吵","聽覺：播放輕柔的背景音樂，配合放鬆或談心的場合。"],["嗅覺／香味／氣味／香氣","嗅覺：咖啡及烘麵包的香氣吸引客人，廚房氣味不會散發到樓面。"],["溫度／冷氣／室溫／暖氣／涼快","溫度：室溫適中，避免客人感到悶熱或冷清。"]]},{"tp":"2-14","cs":["視覺","觸覺","聽覺","嗅覺","溫度"],"ty":[],"q":"{地}內或附近的餐飲設施可運用感官元素配合{地}的特色。建議{n}項改善環境氣氛的措施，並指出所涉及的感官方面。","a":[["裝飾／裝修／壁畫／擺設／照片","視覺：以配合{地}特色的裝飾及照片佈置牆身。"],["燈光／照明／柔和","視覺：調整燈光強弱，例如以柔和燈光營造輕鬆氣氛。"],["制服／服飾／服裝","視覺：員工穿上配合{地}特色的制服。"],["音樂／歌曲／金曲","聽覺：播放配合{地}特色的背景音樂。"],["傢俬／餐具／座椅／木枱","觸覺：選用配合特色、質感良好的傢俬及餐具。"],["香味／香氣／氣味／咖啡香","嗅覺：以食物或咖啡的香氣吸引途人，並避免異味。"],["冷氣／室溫／溫度／暖爐","溫度：調節室溫，令客人感到舒適。"],["即場烹調／鐵板／明火／客人面前","溫度：在客人面前即場烹調，讓客人感受熱力。"]]},{"tp":"2-14","cs":["視覺","觸覺","聽覺","嗅覺","溫度"],"ty":["restaurant","hotel"],"q":"根據你在{地}的觀察，指出{n}項可能影響顧客用餐感受的負面感官因素，並建議改善方法。","a":[["嘈吵／嘈雜／噪音／隔音","聽覺：餐廳太嘈吵，可加設隔音物料或播放輕柔音樂。"],["油煙／異味／抽氣／通風","嗅覺：廚房油煙及異味散發到樓面，應改善抽氣系統。"],["太冷／太熱／悶熱／冷氣","溫度：室溫太冷或太熱，應調節冷氣。"],["太暗／刺眼／昏暗／光猛","視覺：燈光太暗或太刺眼，應按時段調節燈光。"],["座椅／椅子／黏手／梳化","觸覺：座椅太硬或餐桌黏手，應更換座椅並保持清潔。"],["擠迫／太窄／距離","觸覺：餐桌太擠迫，可減少餐桌數目，增加距離。"],["濕滑／防滑","觸覺：地面濕滑，應保持乾爽並鋪防滑地墊。"],["凌亂／污漬／殘渣","視覺：餐桌凌亂或有污漬，應盡快收拾。"]]},{"tp":"2-14","cs":["視覺","觸覺","聽覺","嗅覺","溫度"],"ty":[],"q":"感官元素除可用於餐廳外，亦可提升{地}的旅客體驗。從{n}個感官方面，分析{地}的設計如何影響旅客的感受。","a":[["視覺／燈光／顏色／佈置／景觀","視覺：以燈光及顏色配合展品或主題，營造合適氣氛。"],["觸覺／觸摸／互動／質感","觸覺：設可觸摸的互動裝置，加深旅客印象。"],["聽覺／音樂／音效／聲音","聽覺：播放配合主題的音樂或音效，增加投入感。"],["嗅覺／香味／氣味／花香","嗅覺：以香氣配合主題，或避免異味影響觀感。"],["溫度／冷氣／涼快／炎熱／通風","溫度：室內冷氣適中，戶外設遮蔭及風扇，令旅客舒適。"]]},{"tp":"2-15","cs":[],"ty":[],"q":"根據你在{地}的觀察，指出{n}項防火安全設施，並說明其用途。","a":[["滅火筒／滅火器","滅火筒：火警剛發生時使用，不同火源須用不同類型的滅火筒。"],["滅火氈／滅火毯","滅火氈：覆蓋燃燒中的易燃液體以隔絕空氣，適用於廚房小火。"],["應急照明／緊急照明／出口燈／出口指示","應急照明系統：電力中斷時自動啟動，協助人群疏散。"],["警鐘／火警鐘／警報／煙霧感應","火警警報系統：發生火警時發出警報，通知人群疏散。"],["喉轆／消防栓／消防喉","消防喉轆及消防栓：供撲救較大的火警，須每年最少檢查一次。"],["花灑／灑水","自動花灑系統：感應到熱力達至限度時自動灑水滅火。"],["走火通道／緊急出口／逃生","走火通道及緊急出口：供人群在火警時安全疏散。"],["防火門／防煙門","防火門：阻隔火勢及濃煙蔓延，須保持關閉。"]]},{"tp":"2-15","cs":["二氧化碳式滅火筒","乾粉式滅火筒","水式滅火筒","泡沫式滅火筒","滅火氈"],"ty":["restaurant","hotel"],"q":"{地}的廚房及樓面可能發生不同類型的火警。指出{n}種滅火工具，並說明其適用的火警類型。","a":[["二氧化碳／CO2","二氧化碳式滅火筒：適用於電火及易燃液體火警，不會損壞電子儀器。"],["乾粉式／乾粉","乾粉式滅火筒：適用於大多數火警，但使用後會降低能見度。"],["泡沫式／泡沫","泡沫式滅火筒：隔絕燃燒中液體的表面，適用於易燃液體，切勿用於電火。"],["水式／水劑","水式滅火筒：適用於紙、布、木等固體火警，切勿用於電火及油火。"],["滅火氈／滅火毯","滅火氈：覆蓋油鍋小火以隔絕空氣，並關掉煤氣等熱源。"],["淨劑／淨劑式","淨劑滅火筒：適用於撲滅電火。"],["沙桶／乾沙","沙桶：適用於小火或清理濺落地面的易燃液體，沙要保持乾爽。"],["喉轆／消防喉／消防栓","消防喉轆：撲救固體物料引起的較大火警，不可用於電火及油火。"]]},{"tp":"2-15","cs":["可燃物","溫度","氧氣","連鎖反應"],"ty":["restaurant","hotel"],"q":"燃燒需要四個條件，移除其中任何一個便可滅火。以{地}的廚房為例，解釋{n}項預防火警或滅火的方法。","a":[["可燃物／雜物／油污／易燃物品／抽油煙罩","移除可燃物：清理爐頭附近的雜物及油污，易燃物品遠離火源。"],["關掉煤氣／熄火／關火／熱源","降低溫度：關掉煤氣等熱源，切斷燃燒所需的熱力。"],["降溫／冷卻／灑水／花灑","降低溫度：以水或自動花灑系統降溫滅火（不適用於油火及電火）。"],["滅火氈／鍋蓋／隔絕空氣／蓋熄","隔絕氧氣：以滅火氈或鍋蓋覆蓋油鍋，令火焰缺乏空氣而熄滅。"],["泡沫／二氧化碳","隔絕氧氣：使用泡沫或二氧化碳滅火筒，令燃燒物缺乏氧氣。"],["連鎖反應／乾粉／抑制","中斷連鎖反應：以乾粉滅火筒抑制燃燒，令燃燒不能持續。"]]},{"tp":"2-15","cs":[],"ty":[],"q":"建議{n}項{地}可加強防火安全的管理措施，並解釋其作用。","a":[["定期檢查／保養／測試","定期檢查及測試消防設備，例如喉轆每年最少檢查一次。"],["訓練／演習／培訓","為員工提供消防訓練，並定期進行火警演習。"],["通道暢通／不可阻塞／雜物","保持走火通道暢通，不可堆放雜物。"],["易燃／石油氣／化學品","妥善存放易燃物品及化學品，遠離火源。"],["禁煙／吸煙","在場內實施禁煙，減少火警風險。"],["拖板／電線／超負荷","避免電線及拖板超負荷，定期檢查電器。"],["指示牌／平面圖／逃生路線","張貼逃生路線圖及指示牌，方便旅客疏散。"],["人數／人流控制／限額","控制場內人數，確保發生火警時能有效疏散。"]]},{"tp":"2-16","cs":["細菌性","化學性","物理性"],"ty":[],"q":"以{地}內或附近的餐飲設施為例，指出{n}項可能令食物受污染的情況，並說明它屬於哪一類食物污染。","a":[["室溫／放置過久／擺放太久","細菌性：熟食長時間存放在4°C至60°C之間，令細菌大量繁殖。"],["生熟混放／交叉污染／同一砧板","細菌性：生熟食物混放或共用砧板，引致交叉污染。"],["未煮熟／半生熟／生食／刺身","細菌性：食物未經徹底煮熟，或進食未煮的食物。"],["傷口／生病／咳嗽／帶菌","細菌性：員工患病、帶菌或手有傷口，把細菌傳到食物。"],["清潔劑／化學品","化學性：清潔劑或化學品存放不當，污染食物。"],["農藥／未洗淨","化學性：蔬菜殘餘農藥，未有徹底洗淨浸泡。"],["容器／發泡膠／重金屬","化學性：不合規格的容器遇熱釋出重金屬或有害物質。"],["頭髮／異物／玻璃／碎片／蒼蠅","物理性：頭髮、玻璃碎或昆蟲等異物混入食物。"]]},{"tp":"2-16","cs":["細菌性","沙門氏菌","金黃葡萄球菌","副溶血性弧菌","李斯特菌"],"ty":["restaurant","hotel"],"q":"細閱{地}的餐牌，以{n}款菜式或食物為例，指出它們較易涉及的致病細菌，並建議預防方法。","a":[["沙門氏菌／溫泉蛋／生蛋／半熟蛋／溏心蛋","沙門氏菌：見於未煮熟的蛋類及肉類，例如溫泉蛋，須徹底煮熟。"],["副溶血性弧菌／弧菌／刺身／生蠔／海產","副溶血性弧菌：見於海產，例如生蠔，海產須徹底煮熟。"],["金黃葡萄球菌／葡萄球菌／傷口／人手接觸","金黃葡萄球菌：來自人的皮膚及傷口，處理即食食物須戴手套。"],["李斯特菌／軟芝士／凍肉／沙律／冷盤","李斯特菌：見於軟芝士、凍肉及沙律，能在雪櫃低溫下生長。"],["臘樣芽孢桿菌／芽孢桿菌／炒飯／隔夜飯","臘樣芽孢桿菌：見於炒飯，煮好的飯應盡快食用或冷藏。"]]},{"tp":"2-16","cs":["物理性"],"ty":[],"q":"物理性食物污染不一定傷害顧客，但會打擊食肆形象。以{地}內或附近的餐飲設施為例，指出{n}種可能混入食物的異物，並建議預防方法。","a":[["頭髮／髮網／帽子","頭髮：員工應戴上髮網或帽子。"],["指甲／指甲油","指甲：員工不應留長指甲及塗指甲油。"],["蒼蠅／曱甴／昆蟲／蚊蟲","昆蟲：做好防蟲工作，並把食物蓋好。"],["玻璃／崩裂／裂紋／碎片","玻璃碎：有裂紋或崩裂的碗碟及杯須丟掉。"],["包裝／膠紙／標籤","包裝物料：小心開啟食物包裝，避免遺留在食物中。"],["首飾／戒指／耳環","首飾：處理食物時不應佩戴首飾。"],["膠布／傷口","膠布：傷口須以防水膠布覆蓋並戴上手套。"],["釘書釘／金屬／螺絲","金屬：留意包裝上的釘書釘或設備鬆脫的螺絲。"]]},{"tp":"2-17","cs":["精明選擇","保持清潔","生熟分開","煮熟食物","安全溫度"],"ty":["restaurant","hotel"],"q":"根據你在{地}的觀察，以食物安全五要點指出{n}項{地}確保食物安全的做法。","a":[["供應商／來源／產地／衞生證明／衛生證明","精明選擇：向持牌及信譽良好的供應商購買食材。"],["洗手／手套／口罩／髮網／消毒","保持清潔：員工戴手套、口罩及髮網，並保持用具清潔。"],["生熟分開／砧板／分開存放／不同顏色","生熟分開：以不同顏色的砧板及用具處理生熟食物。"],["煮熟／熟透／75度／中心溫度","煮熟食物：食物要徹底煮熟，生肉中心須加熱至75°C。"],["雪櫃／冷藏／保溫／溫度計／60度／4度","安全溫度：熱食保存在60°C或以上，冷食保存在4°C或以下。"]]},{"tp":"2-17","cs":["保持清潔","生熟分開","安全溫度"],"ty":["restaurant","hotel"],"q":"如{地}提供自助餐，建議{n}項確保陳列食物安全的做法。","a":[["看管／專人／受訓員工","由受過訓練的員工看管陳列供顧客自取的食物。"],["食物罩／護罩／蓋好／防噴嚏","蓋好沒有包裝的食物，或以食物護罩保護。"],["少量展示／少量多次／經常替換","每次只以少量展示，增加替換頻率，保持食物新鮮。"],["整盤更換／整盤／不加添","補充食物時要整盤更換，不應把新食物加添到舊食物上。"],["夾子／食物夾／各自用具／獨立用具","每類食物使用各自的調配用具，並經常更換。"],["燒味／獨立陳列櫃／生熟分開","燒味及鹵味放在獨立陳列櫃，生熟食物不可放在一起陳列。"],["保溫爐／暖爐／60度／加熱","熱吃食物須保持在60°C或以上。"],["冰面／碎冰／冷藏櫃／4度","冷吃食物放在冰面或冷藏櫃，保持在4°C或以下。"]]},{"tp":"2-17","cs":["精明選擇","保持清潔","生熟分開","煮熟食物","安全溫度"],"ty":[],"q":"選出{n}個食物處理工序，就每個工序建議一項{地}內或附近的餐廳確保食物安全的做法。","a":[["選購／供應商／有牌","選購：向持牌及信譽良好的供應商購買，勿購違禁食品。"],["收貨／驗收／保質期／包裝完好","收貨：檢查保質期、包裝是否完好及食物溫度。"],["貯存／先入先出／離地／30厘米","貯存：按先入先出原則，食物放在離地最少30厘米的架上。"],["解凍／流動水／微波爐","解凍：在雪櫃、流動水或微波爐解凍，切勿在室溫解凍。"],["烹煮／75度／中心溫度","烹煮：生肉中心須加熱至75°C，並維持至少15秒。"],["熱存／保溫／60度","熱存：熱食蓋好並保存在60°C或以上的保溫設備內。"],["翻熱／重新加熱／再加熱","翻熱：盡快加熱至75°C或以上，已翻熱的食物不可再翻熱。"],["端送／上菜／傳送","端送：上菜時手指不應觸及食物及客人用餐時接觸的餐具位置。"]]},{"tp":"2-17","cs":["精明選擇","保持清潔","生熟分開","煮熟食物","安全溫度"],"ty":["restaurant","hotel"],"q":"假設{地}因颱風而停電及停水。根據食物安全五要點，建議{n}項確保食物安全的應變措施。","a":[["檢查來貨／拒收／檢查包裝","精明選擇：收貨時檢查食物包裝及狀況，拒收已變壞的食材。"],["樽裝水／蒸餾水／煮沸","保持清潔：預備樽裝水或把水煮沸，用作清洗及處理食物。"],["搓手液／酒精／消毒","保持清潔：缺水時以酒精搓手液消毒雙手。"],["即棄餐具／一次性","保持清潔：改用即棄餐具，減少清洗的需要。"],["換手套／分開存放／生熟","生熟分開：雪櫃空間不足時仍須分開存放生熟食物，並勤換手套。"],["煤氣爐／燒烤／罐頭","煮熟食物：改用煤氣爐或燒烤方式煮食，確保食物徹底煮熟。"],["冰塊／凝膠包／乾冰／冰袋","安全溫度：以冰塊、冷凍凝膠包或乾冰維持低溫。"],["棄置／丟棄／減少選項","安全溫度：棄置已變質的食物，並減少餐單選項。"]]},{"tp":"x:款待業","cs":["文化多樣性"],"ty":[],"q":"款待業具文化多樣性的特點。根據你在{地}的觀察，指出{n}項{地}照顧不同文化背景旅客的設施或安排。","a":[["多語言／英文／日文／韓文／翻譯／外語","提供多語言的指示牌、單張及導覽，方便不同國籍的旅客。"],["清真／Halal／穆斯林","餐廳提供清真食品，照顧穆斯林旅客。"],["素食／齋菜／Vegan","提供素食選擇，照顧素食者及不同宗教人士。"],["祈禱室／祈禱","設祈禱室，方便有宗教需要的旅客。"],["電子支付／外幣／兌換／支付寶","接受不同國家的電子支付及提供外幣兌換。"],["外籍員工／語言能力","聘請懂不同語言的員工，以旅客的語言接待他們。"],["禮儀培訓／尊重習俗／習俗","培訓員工認識不同國家的禮儀及習俗。"],["節慶／聖誕／新年／開齋節","因應不同文化的節慶推出活動及佈置。"]]},{"tp":"x:款待業","cs":["勞工密集"],"ty":[],"q":"款待業屬勞工密集的行業。根據你在{地}的觀察，指出{n}個需要大量人手的崗位，並說明原因。","a":[["接待／前台／售票／詢問處","接待及售票員：須面對面招呼大量旅客，回答查詢。"],["侍應／樓面／服務員","侍應：須逐一為客人點餐、上菜及收拾。"],["廚師／廚房","廚師：菜式須即點即製，難以完全以機器取代。"],["清潔／房務員","清潔員及房務員：須持續清潔客房及公共地方。"],["保安／護衞","保安員：須二十四小時巡邏及維持秩序。"],["導賞／講解","導賞員：須為旅客講解，提供個人化服務。"],["禮賓／行李生／門僮","禮賓及行李員：協助旅客處理行李及交通。"],["收銀／結賬／結帳","收銀員：處理大量付款及結賬工作。"]]},{"tp":"x:款待業","cs":["產品服務組合"],"ty":[],"q":"款待業提供的是有形產品與無形服務的組合。根據你在{地}的觀察，舉例說明{地}的有形產品及無形服務，共{n}項。","a":[["食物／飲品／菜式","有形產品：例如餐廳提供的食物及飲品。"],["裝潢／裝修／傢俬／建築","有形產品：例如場地的裝潢、傢俬及建築。"],["紀念品／商品／禮品","有形產品：例如禮品店出售的紀念品。"],["門票／地圖／單張","有形產品：例如門票、地圖及單張等印刷品。"],["態度／友善／微笑／禮貌","無形服務：例如員工友善的態度及微笑。"],["氣氛／舒適感／感受","無形服務：例如舒適的環境氣氛帶來的感受。"],["專業知識／講解／介紹","無形服務：例如員工以專業知識為旅客講解。"],["效率／快捷／等候時間","無形服務：例如快捷有效率的服務過程。"]]},{"tp":"x:餐廳類型","cs":["高級餐廳","咖啡室","快餐店","自助食堂","特色餐廳","主題餐廳","酒吧","休閒餐廳"],"ty":[],"q":"根據你在{地}內或附近的觀察，指出{n}類不同類型的餐廳，並各舉一個例子。","a":[["高級餐廳／米芝蓮／扒房","高級餐廳：提供自選餐單、即點即煮，有衣著要求並收取服務費。"],["咖啡室／咖啡店／咖啡館／Cafe","咖啡室：提供簡單餐單，座位舒適，鼓勵顧客逗留。"],["快餐店／快餐","快餐店：菜式有限、服務快捷，翻檯率高。"],["自助食堂／食堂／飯堂","自助食堂：顧客在櫃檯排隊選取食物，常見於學校及公司。"],["特色餐廳／素食餐廳／地方菜／日本菜／泰國菜","特色餐廳：以單一種類食物或地方菜為主，例如素食餐廳。"],["主題餐廳／懷舊","主題餐廳：由裝修、食物到音樂都配合主題。"],["酒吧／酒廊／Bar","酒吧：主要供應酒精飲品，只招待18歲以上人士。"],["休閒餐廳／茶餐廳／家庭餐廳","休閒餐廳：價錢中等、氣氛輕鬆，適合家庭及朋友聚會。"]]},{"tp":"x:餐廳類型","cs":[],"ty":["restaurant"],"q":"指出{地}屬於哪一類餐廳，並從{n}個方面描述它的特徵。","a":[["自選餐／套餐／餐單／餐牌","餐單：高級餐廳提供自選餐；快餐店以套餐為主，選擇有限。"],["侍應／櫃檯／自助／餐桌服務","服務方式：高級餐廳由侍應提供餐桌服務；快餐店須到櫃檯點餐取餐。"],["價錢／價格／人均消費／定價","價格：高級餐廳定價較高；快餐店及咖啡室價錢較相宜。"],["服務費／加一","服務費：高級餐廳收取一成服務費；快餐店則不收取。"],["裝修／燈光／氣氛／餐桌擺設","環境氣氛：高級餐廳有正式餐桌擺設、燈光柔和；快餐店色彩鮮艷。"],["翻檯率／翻枱率／流轉率／逗留時間","翻檯率：快餐店翻檯率高；高級餐廳客人逗留時間較長。"],["職員比例／員工比例／人手","職員與顧客比例：高級餐廳比例高；快餐店比例低。"],["衣著／服飾規定／西裝","衣著要求：高級餐廳或有衣著要求；快餐店則沒有。"]]},{"tp":"x:餐廳類型","cs":["主題餐廳"],"ty":[],"q":"主題餐廳以概念凌駕一切。如{地}內要開設一間主題餐廳，建議{n}項可配合{地}特色的設計。","a":[["名稱／命名／店名","以{地}的元素為餐廳及菜式命名。"],["裝飾／裝修／擺設／壁畫","以配合{地}特色的裝飾及擺設佈置餐廳。"],["制服／服飾","員工穿着配合主題的制服。"],["造型／擺盤／菜式外形","菜式造型及擺盤加入{地}的元素。"],["餐具／杯碟","使用印有主題圖案的餐具及杯碟。"],["音樂／歌曲／音效","播放配合主題的音樂或音效。"],["紀念品／精品／周邊","出售主題紀念品，增加收入並延續體驗。"],["表演／互動／打卡","安排表演或互動活動，吸引旅客拍照打卡。"]]},{"tp":"x:餐單","cs":["套餐","自選餐","兒童餐單","自助餐","是日精選"],"ty":["restaurant","hotel"],"q":"細閱{地}的餐牌，指出{n}種不同的餐單種類，並以餐牌上的例子說明。","a":[["套餐／A餐／午市套餐／常餐","套餐：以預定的菜式組合及價錢出售，例如午市套餐。"],["自選／散叫／單點／散餐","自選餐：客人可自由選擇菜式，每項獨立定價。"],["兒童餐／小童餐","兒童餐單：份量較少，常以圖畫及謎語吸引小朋友。"],["自助餐／任食／放題／Buffet","自助餐：以一個價錢任食，食物預先煮好供客人自取。"],["是日精選／今日推介／廚師推介","是日精選：餐廳每天推介的菜式，可配合時令食材。"],["飲品餐單／飲品牌／酒單／酒水","飲品餐單：與主餐單分開，列出各類飲品及餐酒。"],["季節限定／應節／時令／節日","季節或節日餐單：推出應節或時令菜式。"],["周期餐單／循環餐單","周期餐單：在一個周期內每天提供不同但固定的菜式。"]]},{"tp":"x:餐單","cs":["套餐","自選餐"],"ty":[],"q":"不少餐廳以套餐吸引顧客。以{地}內或附近的餐廳為例，從餐廳的角度解釋{n}項套餐較自選餐優勝之處。","a":[["成本較低／平均成本／大量購入","食材種類較少並可大量購入，平均成本較低。"],["簡化採購／易監察／採購程序","食材採購變得更簡單，更容易監察。"],["預先準備／預先烹調／效率","部分食物可預先準備或大量烹調，烹調更有效率。"],["落單方便／點餐方便／容易落單","服務員落單更方便，減少出錯。"],["上菜快／翻檯率／流轉率","上菜較快，提高翻檯率及營業額。"],["浪費／預算份量／存貨","較易預算食材份量，減少浪費。"],["質素一致／份量一致／標準化","菜式固定，較易保持質素及份量一致。"],["猶豫不決／容易選擇／選擇困難","方便猶豫不決的顧客作出選擇。"]]},{"tp":"x:餐單","cs":["兒童餐單"],"ty":[],"q":"如{地}內或附近的餐廳推出兒童餐單吸引家庭客，建議{n}項設計重點。","a":[["份量較少／小份量／細份","份量較少，配合小朋友的食量。"],["價錢較低／半價／較便宜／相宜","價錢較成人餐低，吸引家庭光顧。"],["營養／健康／少油／少鹽","營養均衡，少油少鹽，令家長放心。"],["玩具／禮物／小禮品","附送玩具或小禮物，吸引小朋友。"],["造型／卡通／動物形狀","食物以卡通或動物造型呈現，增加趣味。"],["填色／謎語／圖畫／遊戲","餐單印上填色、謎語及圖畫，讓小朋友等候時打發時間。"],["膠杯／安全餐具／小餐具","提供安全的小餐具及膠杯。"],["辛辣／魚骨／去骨／致敏","避免辛辣、有骨或常見致敏的食材。"]]},{"tp":"x:餐單","cs":["自助餐"],"ty":["restaurant","hotel"],"q":"如{地}提供自助餐，建議{n}項既能減少食物浪費又能令顧客滿意的措施。","a":[["少量展示／按時補充／少量多次","少量展示食物但按時補充，確保顧客有足夠選擇。"],["提醒／解釋理念／勸喻","員工提醒顧客勿取過量食物，並解釋餐廳的理念。"],["細碟／較小餐碟／合適尺寸","提供合適尺寸的餐碟，防止顧客一次過取用太多。"],["標示份量／告示／提示牌","在自助餐枱標示每次可取的份量及珍惜食物的提示。"],["補充時間／下一輪","展示下一輪補充食物的時間，讓顧客安心等候。"],["收集意見／調整份量／調節種類","收集顧客意見，調節食物的份量及種類。"],["任點／點餐形式／即點即煮","改為任點任食的點餐形式，由服務員送上，減少剩食。"]]},{"tp":"3-1","cs":["亞洲","歐洲","非洲","北美洲","南美洲","大洋洲"],"ty":[],"q":"根據你在{地}的觀察（例如旅客的語言或指示牌的文字），指出{n}個到訪{地}的旅客可能來自的大洲，並各舉一個國家為例。","a":[["亞洲／東南亞／東亞","亞洲：例如日本、韓國及東南亞旅客，{地}設有日文、韓文指示。"],["歐洲／西歐／歐陸","歐洲：例如英國及法國旅客，屬長途旅客。"],["北美洲／北美","北美洲：例如美國及加拿大旅客。"],["南美洲／南美／拉丁美洲","南美洲：例如巴西旅客，官方語言為葡萄牙語。"],["大洋洲／澳紐","大洋洲：例如澳洲及新西蘭旅客，多以英語溝通。"],["非洲／北非","非洲：例如南非及埃及旅客。"]]},{"tp":"3-1","cs":[],"ty":[],"q":"{地}接待不少來自不同時區的海外旅客。解釋{n}項{地}在接待這些旅客時須注意的事項，並提出相應安排。","a":[["時差／疲倦／休息區","長途旅客受時差影響容易疲倦，{地}可增設休息區。"],["當地時間／換算／訂錯","網上預約須列明以當地時間計算，以免旅客訂錯日期或時段。"],["24小時／網上客服／電郵","不同地區旅客查詢時間不一，可設24小時網上客服。"],["開放時間／營業時間／延長","旅客抵埗時間各異，可延長開放時間或增設夜間活動。"],["清晨／深夜／寄存行李","長途航班多在清晨或深夜抵達，可提供行李寄存服務。"],["發布時間／宣傳時段／社交媒體","配合客源地的作息時段在社交媒體發布宣傳，提高效果。"]]},{"tp":"3-1","cs":[],"ty":["overseas"],"q":"某香港學校將舉辦前往{地}的考察團。從基本世界地理概念出發，指出{n}項同學出發前應了解有關{地}的資料，並說明其對行程的影響。","a":[["時區／時差／UTC／調校手錶","{地}與香港時區不同，要調校手錶，並以當地時間核對航班。"],["南半球／北半球／季節相反","若{地}位於南半球，季節與香港相反，要準備合適衣物。"],["緯度／赤道／高緯度／低緯度","緯度影響氣溫：低緯度地區較炎熱，高緯度地區較寒冷。"],["大洲／亞洲／歐洲／美洲／非洲","了解{地}所屬大洲，有助估計航程遠近及航線安排。"],["日期變更線／換日線／相差一天","若航程越過國際日期變更線，抵達日期會前進或倒退一天。"],["飛行時間／長途／直航／轉機","{地}與香港的距離決定飛行時間，長途航程要預留休息。"]]},{"tp":"3-1","cs":[],"ty":["overseas"],"q":"寫出{n}項有關{地}的基本地理資料：所屬大洲及氣候類型。","a":[],"dyn":"facts"},{"tp":"3-2","cs":[],"ty":[],"q":"以{地}為例，解釋{n}項氣候及季節變化對景點營運或旅客人數的影響。","a":[["淡季／旺季／淡旺季","天氣宜人時是{地}的旺季，其他月份旅客較少，屬淡季。"],["颱風／暴雨／雷暴／惡劣天氣","颱風或暴雨會令戶外設施暫停甚至全日關閉，收入減少。"],["炎熱／酷熱／中暑／寒冷","酷熱或寒冷天氣令旅客不適，縮短逗留時間。"],["室內／有蓋／冷氣","{地}需增設室內或有蓋設施，令旅客不受天氣影響。"],["節慶活動／萬聖節／聖誕節","按季節舉辦節慶活動，例如萬聖節及聖誕節，吸引旅客到訪。"],["人手／兼職／排班","{地}需按旅客人數彈性調配人手，繁忙時增聘兼職員工。"],["折扣／優惠／減價","在旅客較少的月份推出門票優惠，吸引本地居民到訪。"]]},{"tp":"3-2","cs":[],"ty":[],"q":"根據你在{地}的觀察，指出{n}項{地}為應付當地天氣而設的設施或安排，並加以說明。","a":[["有蓋／上蓋／遮蔭／涼亭","設有蓋通道及排隊區，讓旅客遮陽避雨。"],["冷氣／風扇／噴霧","室內有冷氣，戶外設風扇或噴霧裝置降溫。"],["飲水機／補充水分","設飲水機，方便旅客補充水分，預防中暑。"],["雨傘／雨衣","售賣或借出雨傘、雨衣，方便旅客在雨天遊覽。"],["颱風訊號／暴雨警告／暫停開放","懸掛颱風訊號或發出暴雨警告時暫停開放，保障安全。"],["防滑／排水","地面採用防滑物料並排水良好，減少雨天滑倒意外。"],["室內場館／室內活動／室內展覽／室內表演","提供室內展覽或表演，惡劣天氣下旅客仍有活動選擇。"]]},{"tp":"3-2","cs":[],"ty":["overseas"],"q":"解釋{n}項{地}的氣候對香港旅客行程安排的影響。","a":[["出發月份／最佳時間／避開","應選擇{地}天氣最宜人的月份出發，避開酷熱或嚴寒的季節。"],["衣物／保暖／防寒","要按{地}的氣溫準備衣物，寒冷地區要帶備保暖衣物。"],["防曬／中暑／補充水分","炎熱或乾旱地區陽光猛烈，要做好防曬並多補充水分。"],["滑雪／賞雪／水上活動／海灘","氣候決定可參與的活動，例如冬季滑雪、夏季玩水上活動。"],["颶風／颱風／沙塵暴／暴雨","部分季節有颶風或沙塵暴，航班及戶外活動可能取消。"],["日照／日落／日短","高緯度地區冬季日照時間短，戶外行程要提早完成。"],["賞櫻／紅葉／四季景觀","四季分明的地方可按季節安排賞櫻或賞紅葉。"]]},{"tp":"3-2","cs":[],"ty":["overseas"],"q":"根據課本的氣候分類，指出{地}的氣候類型及所屬大洲，共{n}項。","a":[],"dyn":"facts"},{"tp":"3-5","cs":["中國","馬來西亞","泰國"],"ty":[],"q":"{地}經常接待來自亞洲不同地區的旅客，例如中國內地、泰國及馬來西亞。建議{n}項{地}可作出的安排，以照顧這些旅客在語言、宗教及習慣上的需要。","a":[["簡體字／普通話","提供簡體字資料及會說普通話的職員，方便內地旅客。"],["泰文／馬來文／翻譯","提供泰文及馬來文的單張，或安排翻譯服務。"],["清真／Halal／不含豬肉","不少馬來西亞旅客是穆斯林，可提供清真食物並標明不含豬肉。"],["祈禱室／麥加方向","設祈禱室並標示麥加方向，方便穆斯林旅客每日禮拜。"],["電子支付／支付寶／微信支付","接受內地旅客常用的電子支付，例如支付寶及微信支付。"],["摸頭／合十／禮儀","職員要注意禮儀，例如不可觸摸泰國小孩的頭部，可合十問好。"],["素食／齋菜","為佛教徒或茹素旅客提供素食選擇。"]]},{"tp":"3-5","cs":[],"ty":["overseas"],"q":"解釋{n}項{地}吸引香港旅客前往的原因。","a":[["航程短／距離近／飛行時間短","{地}與香港距離較近，航程短，適合短假期出遊。"],["物價／價格競爭力／消費較低","{地}物價相對較低，具價格競爭力，旅客覺得物有所值。"],["免簽證／簽證／入境方便","香港特區護照持有人入境手續簡便，部分地方更可免簽證。"],["美食／地道食物／小吃","{地}有豐富的地道美食，吸引喜歡品嚐美食的香港旅客。"],["購物／夜市／市集／商場","{地}有夜市、市集及大型商場，購物選擇多。"],["寺廟／古蹟／世界遺產／歷史","{地}有豐富的人文資源，例如寺廟、古蹟及世界遺產。"],["海灘／海島／山嶺／國家公園","{地}有優美的自然資源，例如海灘、海島及國家公園。"],["廉航／廉價航空／航班多／航班頻密／航空網絡","往來香港與{地}的航班頻密，亦有廉價航空，交通方便。"]]},{"tp":"3-5","cs":[],"ty":["overseas"],"q":"指出{n}個{地}的著名景點或節慶，並簡介其特色。","a":[],"dyn":"sights"},{"tp":"3-5","cs":["中國","馬來西亞","泰國","迪拜（阿聯酋）"],"ty":["themepark"],"q":"{地}面對亞洲其他主題公園的競爭。指出{n}個位於亞洲其他地方的主題公園或度假區，並說明其所在國家或城市。","a":[["上海迪士尼／上海","上海迪士尼樂園位於中國上海，與{地}爭奪內地家庭旅客。"],["長隆／海洋王國","長隆旅遊度假區位於廣東珠海及廣州，設有海洋王國。"],["樂高樂園／樂高","馬來西亞樂高樂園位於柔佛州，以樂高積木為主題。"],["雙威／Sunway","雙威水上樂園位於馬來西亞吉隆坡附近。"],["雲頂／Genting","雲頂高原位於馬來西亞，設有室內外主題公園及娛樂設施。"],["夢幻樂園／夢幻世界","夢幻樂園位於泰國曼谷，設有機動遊戲及雪屋。"],["IMG／冒險世界／冰雪世界","IMG冒險世界及冰雪世界位於迪拜（阿聯酋）。"],["環球影城／大阪／新加坡","日本大阪及新加坡均設有環球影城。"]]},{"tp":"3-6","cs":["埃及"],"ty":[],"q":"如{地}要舉辦以埃及古文明為主題的特備展覽或活動，建議{n}項可加入的埃及旅遊元素，並加以說明。","a":[["金字塔／吉薩","以吉薩金字塔為佈景，介紹古埃及王室陵墓的建築。"],["獅身人面像／獅身人首像","展示獅身人面像模型，供旅客拍照。"],["尼羅河／遊船","模擬尼羅河遊船之旅，介紹沿岸的文化景點。"],["神廟／卡奈克／阿布辛貝","介紹卡奈克神廟及阿布辛貝神廟等古蹟。"],["木乃伊／法老／象形文字","展示木乃伊及象形文字，介紹古埃及文明。"],["市集／香料","重現開羅的傳統大市集，售賣香料及手工藝品。"],["沙漠／駱駝","設沙漠及駱駝佈景，展示埃及乾旱氣候的景觀。"]]},{"tp":"3-6","cs":["摩洛哥","突尼斯","埃及"],"ty":[],"q":"{地}希望吸引更多來自北非及中東伊斯蘭國家（例如埃及、摩洛哥、突尼斯）的旅客。建議{n}項{地}可作出的接待安排。","a":[["清真／Halal／不含豬肉","提供清真認證食物，並清楚標明不含豬肉及酒精。"],["祈禱室／祈禱墊／麥加方向","設祈禱室及祈禱墊，並標示麥加方向，方便每日禮拜。"],["阿拉伯文／法文／翻譯","提供阿拉伯文或法文的單張，或安排翻譯服務。"],["齋戒月／開齋／日落","齋戒月期間在日落後供應餐飲，配合穆斯林的作息。"],["左手／握手／禮儀","職員要注意禮儀，例如遞物時避免用左手，握手前先觀察對方意願。"],["簽證／直航／轉機","提供簽證及轉機資訊，方便長途旅客安排行程。"]]},{"tp":"3-6","cs":[],"ty":[],"q":"參考《全球旅遊業競爭力報告》的評估範疇，分析{n}項{地}所在國家或地區發展旅遊業的強項或弱項。","a":[["價格競爭力／物價／價格便宜","價格競爭力：物價及酒店價格較低，旅客覺得物有所值。"],["自然資源／自然景觀／海灘","自然資源：擁有優美的山嶺、海灘等自然景觀。"],["文化資源／世界遺產／古蹟","文化資源：擁有豐富古蹟及世界文化遺產。"],["航空運輸／機場／航班","航空運輸設施：國際機場完善，航班網絡廣。"],["安全與保安／治安／罪案","安全與保安：治安好壞直接影響旅客信心。"],["衛生與健康／衛生／疾病","衛生與健康：衛生欠佳或有傳染病會令旅客卻步。"],["國際開放／簽證／免簽","國際開放程度：簽證政策寬鬆，方便旅客入境。"],["基本設施／住宿／旅遊服務","旅遊服務基本設施：酒店及旅遊服務是否足夠完善。"]]},{"tp":"3-6","cs":[],"ty":["overseas"],"q":"某旅行社計劃為香港旅客設計{地}的觀光行程。建議{n}個應納入行程的著名景點，並簡介其吸引之處。","a":[],"dyn":"sights"},{"tp":"3-7","cs":["法國","意大利","西班牙"],"ty":[],"q":"如{地}要舉辦以法國、意大利或西班牙為主題的文化節，建議{n}項可加入的旅遊元素，並加以說明。","a":[["艾菲爾鐵塔／鐵塔","設巴黎艾菲爾鐵塔模型作打卡位，介紹法國地標。"],["羅浮宮／蒙娜麗莎","展示《蒙娜麗莎》複製畫，介紹羅浮宮的藝術收藏。"],["競技場／比薩斜塔／許願泉","介紹古羅馬競技場、比薩斜塔等意大利古蹟。"],["威尼斯／面具／貢多拉","舉辦威尼斯嘉年華面具工作坊。"],["聖家堂／聖家教堂／高第","介紹巴塞隆拿聖家堂等高第建築。"],["弗拉門哥／佛朗明哥／奔牛節","安排弗拉門哥舞表演，並介紹西班牙奔牛節。"],["薄餅／意粉／海鮮飯","設攤位售賣意大利薄餅及西班牙海鮮飯。"],["葡萄酒／酒莊／波爾多","介紹法國波爾多等地的葡萄酒文化。"]]},{"tp":"3-7","cs":[],"ty":[],"q":"以{地}及其周邊地區為例，指出{n}項吸引外地旅客的自然資源或人文資源，並加以說明。","a":[["山嶺／山脈／高山／行山徑","自然資源：山嶺景觀，旅客可遠足或觀景。"],["海灘／海岸／海港／海景","自然資源：海灘、海岸或海港景色。"],["河流／湖泊／瀑布／濕地","自然資源：河流、湖泊或濕地生態。"],["郊野公園／國家公園／野生動物","自然資源：郊野公園或國家公園內豐富的動植物。"],["古蹟／歷史建築／世界遺產","人文資源：古蹟及歷史建築，展現當地歷史。"],["博物館／美術館／藝術","人文資源：博物館及美術館的藝術展覽。"],["節慶／傳統習俗／宗教","人文資源：傳統節慶、習俗及宗教活動。"],["美食／地道小食／購物","人文資源：地道美食及購物文化。"]]},{"tp":"3-7","cs":[],"ty":["overseas"],"q":"以{地}的著名景點為例，描述{n}個吸引香港旅客前往{地}的旅遊資源。","a":[],"dyn":"sights"},{"tp":"3-8","cs":[],"ty":[],"q":"評估{地}的交通方便程度，指出{n}項有利或不利旅客到訪{地}的因素，並加以說明。","a":[["機場／航班／直航","國際機場及直航航班令外地旅客容易抵達。"],["港鐵／鐵路／高鐵／地鐵","鄰近鐵路站，旅客可乘鐵路直達。"],["巴士站／巴士路線／公共巴士／小巴／的士","附近有巴士站、小巴或的士，班次頻密。"],["渡輪／碼頭／郵輪","有渡輪或郵輪碼頭連接，可經水路前往。"],["接駁／穿梭巴士／免費巴士","提供接駁或穿梭巴士往返市區或車站。"],["停車場／泊車／旅遊巴","設停車場及旅遊巴上落客區，方便自駕及旅行團。"],["偏遠／路程遠／山路","位置偏遠、路程長，需多次轉乘，降低到訪意欲。"],["指示牌／路線圖／步行","沿途有清晰指示牌，方便旅客步行前往。"]]},{"tp":"3-8","cs":["美國","墨西哥","加拿大"],"ty":[],"q":"如{地}要舉辦以美國、加拿大及墨西哥為主題的旅遊展覽，建議{n}個可介紹的北美洲著名景點或節慶，並加以說明。","a":[["自由神像／紐約","介紹紐約的自由神像，象徵自由。"],["大峽谷／黃石","介紹大峽谷及黃石國家公園等自然景觀。"],["金門大橋／三藩市／舊金山","介紹三藩市的金門大橋。"],["拉斯維加斯／賭城","介紹以賭場及表演聞名的拉斯維加斯。"],["環球影城／荷里活","介紹以電影為主題的環球影城。"],["尼亞加拉／大瀑布","介紹加美邊境的尼亞加拉大瀑布。"],["電視塔／CN塔／洛磯山","介紹多倫多國家電視塔及洛磯山景色。"],["亡靈節／奇琴伊察／坎昆","介紹墨西哥亡靈節及瑪雅古城奇琴伊察。"]]},{"tp":"3-8","cs":[],"ty":["overseas"],"q":"你將以導遊身分帶領香港旅客遊覽{地}。介紹{n}個{地}的著名景點或節慶。","a":[],"dyn":"sights"},{"tp":"3-9","cs":["巴西","阿根廷","智利"],"ty":[],"q":"{地}希望吸引來自南半球國家（例如巴西、阿根廷、智利）的旅客。解釋{n}項南北半球季節相反對{地}推廣及接待工作的影響。","a":[["避寒／冬天／淡季","南半球6至8月是冬季，可吸引旅客到{地}避寒，填補夏季淡季。"],["聖誕／新年／十二月／12月","南半球的暑假在12月至1月，可配合聖誕新年活動推出套票。"],["衣物／保暖／天氣資訊","提醒旅客兩地季節不同，須帶備合適衣物。"],["宣傳時間／宣傳時段／旅遊展","按南半球的假期時間安排宣傳，例如參加當地旅遊展。"]]},{"tp":"3-9","cs":["巴西","阿根廷","智利"],"ty":[],"q":"如{地}要舉辦以巴西、阿根廷及智利為主題的嘉年華，建議{n}項可加入的南美洲旅遊元素，並加以說明。","a":[["森巴／狂歡節／巡遊","加入巴西里約熱內盧嘉年華的森巴舞巡遊。"],["探戈／Tango","安排阿根廷探戈舞表演及體驗班。"],["牛肉／燒烤／扒房","售賣阿根廷著名的牛肉燒烤美食。"],["基督像／基督山／糖麵包山","設里約熱內盧基督山巨像佈景供旅客拍照。"],["伊瓜蘇／大瀑布","介紹巴西與阿根廷邊境的伊瓜蘇瀑布。"],["亞馬遜／雨林","以亞馬遜熱帶雨林為主題，介紹雨林動植物。"],["復活節島／石像／摩艾","展示智利復活節島的摩艾石像模型。"],["葡萄酒／酒莊／門多薩","介紹智利及阿根廷酒莊的葡萄酒文化。"]]},{"tp":"3-9","cs":[],"ty":["overseas"],"q":"指出{n}個{地}的著名景點，並解釋它們如何吸引外地旅客。","a":[],"dyn":"sights"},{"tp":"3-3","cs":[],"ty":[],"q":"根據你在{地}的觀察，指出{n}項成功的景點的特性，並各舉一個{地}的例子加以說明。","a":[["高品質／高級質素／外觀／保養","高品質：{地}外觀整潔、保養良好，設清晰指示牌及洗手間。"],["真實性／原貌／原有氛圍","真實性：{地}保留原來的色彩和氛圍，讓旅客感受當地特色。"],["獨特性／獨一無二／獨有","獨特性：{地}有其他地方沒有的獨特之處，難以被模仿。"],["吸客能力／吸引力／吸引性／重遊","吸客能力：{地}吸引大批旅客到訪，旅客亦有大機會重遊。"],["活動選擇／活動選項／多元活動","活動選擇：{地}提供導賞、工作坊及表演等活動，玩之不盡。"],["可達度／交通便利／港鐵／接駁","可達度高：{地}交通方便，有鐵路或接駁巴士直達。"]]},{"tp":"3-3","cs":[],"ty":[],"q":"就成功的景點的特性，建議{n}項{地}可作出的改善措施，並說明有關措施如何提升{地}的吸引力。","a":[["指示牌／洗手間／維修保養","高品質：增設清晰指示牌及洗手間，並定期維修保養。"],["友善／培訓員工／禮貌","高品質：培訓員工提供友善貼心的服務，提升旅客滿意度。"],["保留原貌／保留原有／地道／本土","真實性：保留原有建築及氛圍，並引入地道小店。"],["獨家／限定／獨有","獨特性：推出只在{地}才有的限定展覽或活動。"],["年票／會員／重遊優惠","吸客能力：推出年票或會員優惠，吸引旅客重遊。"],["工作坊／導賞團／表演","活動選擇：增設工作坊、導賞團及表演，延長逗留時間。"],["接駁巴士／穿梭巴士／交通配套","可達度高：增設接駁巴士，連接鐵路站及市區。"]]},{"tp":"3-3","cs":["高品質"],"ty":[],"q":"「高品質」是成功的景點的特性之一。根據你在{地}的觀察，舉出{n}個例子說明{地}如何做到高品質。","a":[["外觀／整潔／乾淨／清潔","外觀：{地}環境整潔乾淨，外觀吸引。"],["保養／維修／保育／翻新","資源保護：{地}的設施及展品得到恰當的維護保養。"],["指示牌／地圖／路線圖","顧客主導的營運：設清晰指示牌及地圖，方便旅客找路。"],["洗手間／廁所／停車場","顧客主導的營運：設足夠的洗手間及停車場。"],["無障礙／輪椅／斜道／升降機","顧客主導的營運：設無障礙通道及升降機，照顧行動不便人士。"],["友善／有禮／笑容／主動","友善：職員態度友善有禮，主動協助旅客。"],["說明牌／展板／語音導賞","顧客主導的營運：提供說明牌及語音導賞，介紹景點資料。"]]},{"tp":"3-3","cs":["真實性"],"ty":[],"q":"以{地}為例，建議{n}項措施，讓{地}在吸引旅客的同時，仍能保持景點的「真實性」。","a":[["保留原貌／保育／修復","保留建築及環境原貌，以修復代替重建。"],["商業化／商店數目／廣告","控制商店及廣告數目，避免過度商業化破壞原有氛圍。"],["本地居民／社區參與／原居民","邀請本地居民參與營運，保留地道的生活色彩。"],["傳統手藝／師傅／示範","邀請傳統手藝師傅現場示範，讓旅客看到真實的文化。"],["導賞／解說／歷史背景","透過導賞及解說介紹歷史背景，加深旅客認識。"],["舞台真實性／重現／表演","以表演重現昔日生活（舞台真實性），同時保護原址。"],["人數／限額／預約","限制同一時間的參觀人數，保持原有的寧靜氛圍。"]]},{"tp":"3-4","cs":["核心產品","實際產品","延伸產品"],"ty":[],"q":"根據Kotler產品的三個層次，以{地}為例，舉例說明其中{n}個層次。","a":[["核心產品／核心／無形益處","核心產品：旅客到{地}追求的無形益處，例如放鬆、樂趣或知識。"],["實際產品／支援產品／有形","實際產品：有形的項目，例如{地}的展品、機動遊戲或表演。"],["延伸產品／促成產
