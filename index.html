品／配套","延伸產品：促成購買的配套，例如網上購票、儲物櫃及接駁巴士。"]]},{"tp":"3-4","cs":["延伸產品"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項屬於延伸產品的配套服務，並解釋其如何促成旅客消費或提升體驗。","a":[["儲物櫃／寄存／行李","儲物櫃及行李寄存，讓旅客輕鬆參觀。"],["Wi-Fi／無線上網／充電","免費Wi-Fi及充電站，方便旅客查資料及分享相片。"],["網上購票／手機程式／電子門票","網上購票及手機程式，方便預約及查看等候時間。"],["接駁巴士／穿梭巴士／泊車","接駁巴士及停車場，方便旅客往返{地}。"],["輪椅／嬰兒車／租借","租借輪椅及嬰兒車，照顧有需要人士。"],["語音導賞／導覽機／多語言","多語言語音導賞，協助旅客了解展品。"],["詢問處／客務中心／失物","詢問處提供資訊及失物認領，令旅客安心。"],["會員／積分／年票","會員積分及年票優惠，鼓勵旅客重遊。"]]},{"tp":"3-4","cs":["核心產品"],"ty":[],"q":"以{地}為例，解釋{n}種旅客到訪{地}時尋求的核心產品（無形益處）。","a":[["放鬆／減壓／休閒","放鬆身心：旅客到{地}暫時離開日常的工作壓力。"],["刺激／興奮／樂趣","刺激興奮：旅客追求樂趣及刺激的感受。"],["知識／學習／求知","增長知識：旅客希望透過參觀學習新事物。"],["家庭樂／親子／親友／家人／朋友","與親友共聚：旅客希望與家人朋友共享歡樂時光。"],["回憶／難忘／打卡","難忘回憶：旅客希望留下回憶並在社交媒體分享。"],["文化體驗／懷舊／歸屬感","文化體驗：旅客希望感受當地文化或懷舊氣氛。"],["大自然／親近自然","親近大自然：旅客希望在安全的環境下接觸自然。"]]},{"tp":"x:主題公園","cs":[],"ty":["themepark"],"q":"根據你在{地}的觀察，指出{n}項主題公園的成功因素，並各舉{地}的一個例子加以說明。","a":[["教育與娛樂／寓教於樂／教育","教育與娛樂：{地}以展館及工作坊介紹保育知識，寓教於樂。"],["互動體驗／互動／VR／4D","互動體驗：{地}設有餵飼動物、VR或4D影院等互動項目。"],["環保／太陽能／回收／綠色","整體環保設計：{地}使用太陽能及設回收設施，減少廢物。"],["長者／年長／坐下欣賞","年長客群：{地}提供可坐下欣賞的表演，照顧長者的需要。"],["整潔／舒適／有蓋／休息區","整潔和舒適的環境：{地}設有蓋排隊區、休息區及風扇。"],["物有所值／一票任玩／巡遊／煙花","物有所值：一張門票可玩所有設施，並有巡遊及煙花表演。"]]},{"tp":"x:主題公園","cs":["年長客群"],"ty":[],"q":"{地}希望吸引更多年長旅客（例如與子孫同遊的祖父母）。建議{n}項{地}可提供的設施或服務。","a":[["座位／休息區／長椅","增設座位及休息區，讓長者隨時坐下休息。"],["室內表演／坐下欣賞／劇場","提供可坐下欣賞的室內表演，減少體力消耗。"],["特別通道／優先／免排隊","設特別通道或優先入場，免長者長時間排隊。"],["輪椅／升降機／斜道","提供輪椅租借、升降機及斜道，方便行動不便的長者。"],["長者優惠／長者票／門票優惠／敬老／半價","推出長者門票優惠，吸引年長旅客。"],["園林／慢活／低體能","設園林及低體能活動，配合長者較慢的節奏。"],["大字體／清晰廣播／放大","指示牌用大字體並清晰廣播，方便視力或聽力較弱的長者。"]]},{"tp":"x:主題公園","cs":["整體環保設計"],"ty":[],"q":"建議{n}項{地}可採用的環保設計或措施，以吸引注重環保的旅客。","a":[["太陽能／可再生能源／風力","安裝太陽能板，使用可再生能源。"],["綠色建築／綠色認證／節能建築","興建取得綠色認證的建築，減少耗電。"],["電動車／電動車輛","使用電動車輛接駁，減少廢氣排放。"],["回收／分類／回收箱","設回收箱，鼓勵旅客把垃圾分類回收。"],["廚餘／堆肥","處理廚餘並製成堆肥，減少棄置到堆填區。"],["污水／雨水／節水","收集雨水及處理污水循環再用，節約用水。"],["走塑／重用餐具／飲水機","推行走塑，提供可重用餐具及飲水機。"]]},{"tp":"x:主題公園","cs":["教育與娛樂","互動體驗"],"ty":["themepark"],"q":"{地}希望吸引不再只追求刺激的新客群。建議{n}項結合「教育與娛樂」或「互動體驗」的新項目，並加以說明。","a":[["工作坊／課程／講座","舉辦保育工作坊，讓旅客學習新知識。"],["餵飼／飼養員／動物接觸","安排餵飼動物及與飼養員交流，近距離認識動物。"],["VR／虛擬實境／擴增實境","引入虛擬實境或擴增實境遊戲，令旅客身歷其境。"],["4D／5D／多感官","設多感官的4D或5D影院。"],["展館／水族館／保育知識","設動物展館及保育展板，介紹生態知識。"],["幕後／後台","舉辦幕後導賞，參觀動物護理或機動遊戲的運作。"],["角色扮演／尋寶／魔杖","設角色扮演或尋寶遊戲，讓旅客親身參與故事。"]]},{"tp":"x:景點類型","cs":[],"ty":[],"q":"{地}及其附近有不同類型的景點。根據景點的分類，指出{n}類你在{地}或附近觀察到的景點，並各舉一例。","a":[["自然景點／大自然／天然","自然景點：例如{地}附近的海灘、山嶺或濕地。"],["非為吸引／原本用途／宗教建築／歷史建築","人工但非為吸引旅客而建：例如廟宇、舊警署等歷史建築。"],["並為吸引／專為旅客／專為吸引／摩天輪／觀景台","人工並為吸引旅客而建：例如摩天輪、觀景台。"],["特別活動／盛事／節慶／嘉年華","特別活動（盛事）：例如節慶活動或體育比賽。"],["文化景點／博物館／古蹟／文物","文化景點：例如博物館、古蹟或文物展覽。"],["消閒康樂／燒烤／行山／單車","消閒康樂景點：例如燒烤場、行山徑及單車徑。"],["娛樂演出／主題公園／賭場／演唱會","娛樂演出景點：例如主題公園或演唱會場館。"]]},{"tp":"x:景點類型","cs":["特別活動（盛事）"],"ty":[],"q":"建議{n}項{地}可舉辦的特別活動（盛事），以吸引旅客在淡季到訪。","a":[["萬聖節／聖誕節／農曆新年","節日慶典：例如萬聖節或聖誕活動，營造節日氣氛。"],["比賽／賽事／跑步／馬拉松","體育活動：例如在{地}舉辦跑步比賽。"],["音樂會／演唱會／音樂節","音樂活動：舉辦戶外音樂會，吸引年輕旅客。"],["美食節／市集／嘉年華","商業活動：舉辦美食節或市集。"],["藝術節／藝術展／特備展覽／裝置藝術","文化活動：舉辦藝術節或特備展覽。"],["煙花／燈光匯演／光雕","舉辦煙花或燈光匯演，吸引晚間旅客。"],["傳統節慶／舞龍／舞獅","傳統節慶：例如舞龍舞獅表演，展現本地文化。"]]},{"tp":"x:景點類型","cs":["自然景點"],"ty":["nature"],"q":"{地}屬自然景點。指出{n}項自然景點發展旅遊時面對的挑戰，並加以解釋。","a":[["天氣／颱風／季節","受天氣及季節影響，惡劣天氣時不宜到訪。"],["垃圾／踐踏／破壞","旅客亂拋垃圾或踐踏植物，破壞自然環境。"],["偏遠／交通不便／路途遙遠","位置偏遠、交通不便，限制旅客人數。"],["洗手間／休息處／配套不足","配套不足，例如缺乏洗手間及休息處。"],["安全／迷路／意外／受傷","旅客可能迷路或發生意外，安全成疑。"],["收入／免費／經費","多數免費開放，缺乏收入維護設施。"],["生態／野生動物／滋擾","人流滋擾野生動物，影響生態平衡。"]]},{"tp":"x:景點類型","cs":["人工但非為吸引旅客而建","文化景點"],"ty":["heritage"],"q":"{地}原本並非為吸引旅客而建。解釋{n}項把這類地方發展為旅遊景點的好處。","a":[["保育／保存／修復","可保存歷史建築，避免被清拆。"],["活化／新用途／再利用","活化為展覽或餐飲場地，賦予建築新用途。"],["就業／收入","帶來門票及消費收入，並創造就業機會。"],["認識歷史／教育／集體回憶","讓旅客及市民認識歷史，保留集體回憶。"],["真實性／原有氛圍／地道","保留原有氛圍，具真實性，吸引文化旅客。"],["社區／歸屬感／本土身份","加強居民的歸屬感及本土身份認同。"],["地標／形象／品牌","成為城市地標，提升目的地的形象。"]]},{"tp":"x:首選次選","cs":["首選景點"],"ty":[],"q":"如果{地}是旅客的首選景點，指出{n}項{地}具備的首選景點特徵，並加以說明。","a":[["專程／主要目的／主要理由","旅客專程前往{地}，是出遊的主要目的。"],["數小時／一整天／花最多時間","旅客在{地}花最多時間，逗留數小時甚至一整天。"],["入場費／門票較貴／收費較高","{地}的入場費往往較高。"],["獨特性／象徵性／地標","{地}具獨特或象徵性的景物，難以被取代。"],["特殊興趣／特定客群／發燒友","{地}能吸引有特殊興趣的旅客專門探索。"],["遠道而來／長途／不辭勞苦","旅客願意遠道而來，不辭勞苦前往{地}。"]]},{"tp":"x:首選次選","cs":["次選景點"],"ty":[],"q":"解釋{n}項次選景點的特點或作用，並以{地}附近的地方為例加以說明。","a":[["打斷／中途休息／休息站／歇腳","打斷漫長旅程，讓旅客途中休息。"],["用膳／食飯／餐飲","提供用膳機會，例如途中的餐廳或美食廣場。"],["新意／多樣化／豐富行程","令行程更多樣化，增添新意。"],["順道／順便／途經","旅客往返首選景點時順道到訪，無須專程。"],["妥協／不想去／其他成員","安撫團體中不想去首選景點的成員，作為妥協。"],["數分鐘／時間較短／短暫","旅客只會短暫停留，有時只逗留數分鐘。"]]},{"tp":"x:首選次選","cs":["首選景點","次選景點"],"ty":[],"q":"比較首選景點與次選景點，指出{n}項兩者的分別，並以{地}為例說明。","a":[["專程／主要目的／主要理由","首選景點是旅客專程前往的主要目的；次選景點則否。"],["逗留時間／數小時／數分鐘","旅客在首選景點逗留數小時，在次選景點只逗留較短時間。"],["入場費／收費／免費","首選景點入場費往往較高，次選景點多為免費或收費較低。"],["獨特性／象徵性","首選景點具獨特或象徵性的景物，次選景點則較普通。"],["打斷／休息／用膳","次選景點的主要作用是讓旅客休息或用膳。"],["途中／往返／沿途","次選景點通常位於往返首選景點的途中。"]]},{"tp":"q:主題公園收入","cs":[],"ty":["themepark"],"q":"根據你在{地}的觀察，指出{n}項{地}的收入來源，並舉例說明。","a":[["門票／入場費／一日票","門票：旅客購買一日門票入場。"],["年票／會員","年票及會員：吸引本地居民購買年票重遊。"],["餐飲／餐廳／小食","餐飲：園內的主題餐廳及小食亭。"],["紀念品／商品／精品","商品零售：售賣角色精品及紀念品。"],["酒店／住宿","酒店住宿：旗下酒店提供住宿，吸引旅客留宿多天。"],["快速通行／尊享／額外收費","額外收費項目：例如快速通行證或近距離接觸動物的體驗。"],["贊助／冠名／場地租用／婚禮","贊助及場地租用：企業贊助，或租用場地舉辦婚禮及公司活動。"],["拍照／攝影／相片／照片","在機動遊戲或角色合照處出售相片。"]]},{"tp":"q:主題公園收入","cs":["餐飲","商品零售","年票及會員","贊助及場地租用"],"ty":[],"q":"建議{n}項{地}可增加門票以外收入的方法，並加以說明。","a":[["餐飲／餐廳／咖啡室","開設特色餐廳或咖啡室，增加餐飲收入。"],["紀念品／文創／精品","推出文創紀念品，在{地}及網上售賣。"],["場地租用／婚禮／企業活動","出租場地舉辦婚禮、企業活動或會議。"],["會員／年費／捐款","推出會員計劃或接受捐款，增加穩定收入。"],["工作坊／付費導賞／課程","舉辦收費工作坊及導賞團。"],["贊助／冠名","邀請企業贊助或冠名展覽及活動。"],["網上商店／網購","開設網上商店，讓旅客回家後仍可購物。"],["聯乘／品牌合作／授權","與品牌聯乘推出限定產品，收取授權費。"]]},{"tp":"q:主題公園挑戰","cs":[],"ty":["themepark"],"q":"指出{n}項{地}作為主題公園所面對的挑戰，並加以解釋。","a":[["競爭／對手／上海迪士尼／長隆","市場競爭：區內其他主題公園（如上海迪士尼、長隆）爭奪旅客。"],["天氣／颱風／炎熱／暴雨","季節及天氣：颱風、暴雨或酷熱會令入場人數下跌。"],["老化／殘舊／失去新鮮感","設施老化：機動遊戲殘舊會令旅客失去新鮮感。"],["成本／維修費／人工／能源","高昂營運成本：維修、人工及能源開支龐大。"],["安全／意外／故障","安全風險：機動遊戲故障或發生意外會損害聲譽。"],["擠迫／排隊／人流","人流擠迫：旺季排隊時間長，降低旅客滿意度。"],["疫情／旅客減少","外在環境：疫情或經濟逆轉令旅客人數下跌。"],["喜好轉變／新客群／市場轉變","市場轉變：旅客不再只追求刺激，需開拓新客群。"]]},{"tp":"q:主題公園挑戰","cs":["市場競爭","高昂營運成本","季節及天氣"],"ty":[],"q":"如{地}附近要興建一個大型主題公園，指出{n}項該主題公園可能面對的挑戰。","a":[["競爭／對手","區內已有其他主題公園，競爭激烈。"],["投資／成本／資金","興建及營運成本高昂，回本期長。"],["土地／選址","需要大幅土地，選址困難。"],["居民反對／噪音／擠塞","可能帶來噪音及交通擠塞，惹來居民反對。"],["環境破壞／生態","工程可能破壞附近的自然環境及生態。"],["人手／招聘","需要大量員工，可能出現招聘困難。"],["天氣／颱風／季節","受天氣及季節影響，入場人數不穩定。"],["客源／旅客人數／喜好轉變","旅客喜好轉變，客源未必穩定。"]]},{"tp":"q:主題公園挑戰","cs":["設施老化","市場轉變","市場競爭"],"ty":["themepark"],"q":"{地}的機動遊戲及設施需要不斷更新。解釋{n}項主題公園須不斷更新設施的原因。","a":[["新鮮感／重遊／回頭客","保持新鮮感，吸引旅客重遊。"],["競爭／對手","應付區內其他主題公園的競爭。"],["安全／老化／殘舊","舊設施老化，可能影響安全。"],["新科技／VR／虛擬實境","引入新科技，迎合旅客對新體驗的期望。"],["新客群／喜好轉變／市場轉變","迎合旅客喜好轉變，開拓新客群。"],["生命週期／衰退／重生","避免進入產品生命週期的衰退階段。"],["話題／傳媒／宣傳","新設施能製造話題，吸引傳媒報道，起宣傳作用。"]]},{"tp":"q:吸引重遊","cs":[],"ty":[],"q":"建議{n}項{地}可吸引旅客重遊的策略，並加以解釋。","a":[["年票／會員／積分","推出年票或會員積分計劃，鼓勵旅客多次到訪。"],["新設施／新展覽／期間限定","定期推出新設施或期間限定展覽，保持新鮮感。"],["萬聖節／聖誕／節慶活動","按季節舉辦節慶活動，例如萬聖節及聖誕節。"],["優惠／折扣／生日","提供生日免費入場或重遊折扣。"],["套票／酒店套票／組合","推出連酒店或餐飲的套票。"],["服務質素／優質服務／友善／培訓","提供優質服務，令旅客留下好印象。"],["社交媒體／打卡／分享","設打卡位置，並在社交媒體與旅客互動。"],["推送／電郵／通訊","以電郵或手機程式推送最新活動資訊。"]]},{"tp":"q:吸引重遊","cs":[],"ty":[],"q":"解釋{n}項旅客（特別是本地居民）可能不再重遊{地}的原因。","a":[["欠缺新意／沒有新設施／重複","設施及展覽多年不變，欠缺新意。"],["票價貴／收費高／不值","票價太高，旅客覺得不值得再來。"],["擠迫／排隊／人多","人多擠迫，排隊時間長。"],["交通不便／偏遠／路程","交通不便，往返費時。"],["服務差／服務欠佳／態度／衛生／環境欠佳","服務或環境欠佳，留下負面印象。"],["北上／深圳／其他選擇","居民有更多選擇，例如北上深圳消費遊玩。"],["天氣／炎熱／下雨","天氣炎熱或下雨，減低出遊意欲。"]]},{"tp":"q:主題公園類型","cs":[],"ty":["themepark"],"q":"指出{地}所屬的{n}種主題公園類型，並各以一項園內設施作例證。","a":[["大自然／動物／海洋生物","大自然（動物）：園內設動物展館或水族館。"],["冒險／歷險／過山車／刺激","冒險歷險：設過山車等刺激的機動遊戲。"],["歷史文化／懷舊／老大街","歷史文化：重現昔日街道或傳統文化，例如懷舊大街。"],["未來世界／科幻／太空／機械人","未來世界（科學與科技）：設太空或機械人主題的遊樂設施。"],["電影／卡通／角色","電影卡通：以電影或卡通角色為主題。"],["水上樂園／滑水梯／水上","水上樂園：設滑水梯及各種水上活動。"]]},{"tp":"q:主題公園類型","cs":[],"ty":[],"q":"如{地}附近要興建一個新的主題公園，建議{n}種合適的主題公園類型，並解釋原因。","a":[["大自然／動物／生態","大自然（動物）：配合{地}附近的自然環境，展示動植物。"],["冒險／歷險／過山車","冒險歷險：以刺激的機動遊戲吸引年輕旅客。"],["歷史文化／懷舊／傳統","歷史文化：結合{地}一帶的歷史及傳統文化。"],["未來世界／科幻／科技","未來世界（科學與科技）：以新科技吸引學生及家庭。"],["電影／卡通／動漫","電影卡通：以受歡迎的電影或卡通角色吸引家庭旅客。"],["水上樂園／滑水梯／水上","水上樂園：配合炎熱天氣，提供水上活動。"]]},{"tp":"4-1","cs":["可靠性","可信性","有形性","關懷性","反應性"],"ty":[],"q":"根據你在{地}的觀察，以Parasuraman的五個顧客服務特點（RATER）分析，指出{n}項{地}在顧客服務上表現良好的地方，並各舉一個現場例子說明。","a":[["可靠性／準時／準確／守承諾／如期","可靠性：導賞及活動按時間表準時開始，準確兌現{地}的承諾。"],["可信性／可信賴／專業知識／講解／安心","可信性：職員熟悉{地}的資料，講解專業清楚，令旅客安心。"],["有形性／制服／整潔／指示牌／裝潢","有形性：{地}環境整潔、指示牌清晰，職員穿着整齊制服。"],["關懷性／同理心／主動協助／體貼／照顧／個人化","關懷性：職員主動協助長者及輪椅使用者，令旅客感到被重視。"],["反應性／反應能力／迅速／即時／快捷／效率","反應性：旅客查詢或求助時，職員能迅速回應及即時處理。"]]},{"tp":"4-1","cs":["可靠性","可信性","有形性","關懷性","反應性"],"ty":[],"q":"旅客在{地}的繁忙時段往往需要排隊輪候。根據Parasuraman的五個顧客服務特點（RATER），建議{n}項改善{地}排隊安排的方法。","a":[["預計時間／預計輪候／顯示輪候／顯示屏／實時顯示","可靠性：在隊頭及沿途準確顯示預計輪候時間，讓旅客掌握入場時間。"],["預約／分時段／取籌／快速通行證","可靠性：推行網上預約及分時段入場，確保旅客在承諾的時段內進場。"],["插隊／秩序／公平／巡邏","可信性：加派職員巡邏維持秩序，杜絕插隊，令旅客相信排隊制度公平。"],["遮陽／風扇／座椅／冷氣／播放","有形性：設遮陽棚、風扇及座椅，或播放影片，減輕排隊時的不適及沉悶。"],["優先／長者／孕婦／輪椅／暫離","關懷性：為長者、孕婦及輪椅使用者設優先通道，並容許如廁暫離。"],["加開／人手／疏導／即時處理","反應性：人龍過長時即時加開窗口、增派人手疏導，並快速處理投訴。"]]},{"tp":"4-1","cs":["有形性"],"ty":[],"q":"有形性是旅客對{地}留下第一印象和最後印象的關鍵。根據你的觀察，建議{n}項可提升{地}有形性的措施。","a":[["指示牌／標示／路線圖／地圖","增設清晰的多語言指示牌及路線圖，方便旅客尋找方向。"],["制服／儀容／名牌／工作證","統一職員制服及儀容，並佩戴名牌，方便旅客辨認及求助。"],["清潔／整潔／打掃／垃圾","增加清潔次數，保持洗手間及公共地方整潔。"],["翻新／裝修／佈置／燈光","翻新殘舊位置，並改善燈光及佈置，營造舒適氣氛。"],["座椅／休息區／遮蔭","增設座椅及有遮蔭的休息區，讓旅客途中稍作休息。"],["觸控屏／多媒體／QR／二維碼／電子導覽","引入觸控屏及二維碼電子導覽，令資訊展示更吸引。"],["單張／小冊子／宣傳品","提供設計精美的單張及小冊子，讓旅客帶走留念。"]]},{"tp":"4-1","cs":["關懷性"],"ty":[],"q":"以{地}為例，建議{n}項職員可展現關懷性的服務做法，令不同需要的旅客感到被重視。","a":[["服務台／熱線／即時通訊／求助","設當眼的服務台及即時通訊熱線，方便旅客聯絡及求助。"],["多語言／翻譯／手語／普通話","以多種語言或手語與旅客清楚溝通。"],["主動詢問／主動上前／留意需要","主動上前詢問迷路或有困難的旅客，了解其所需。"],["輪椅／無障礙／長者／行動不便","為長者及行動不便人士借出輪椅，並安排無障礙路線。"],["嬰兒車／育嬰室／兒童／幼童","為帶同幼兒的家庭提供嬰兒車及育嬰室。"],["稱呼姓名／個人化／記得喜好","稱呼常客姓名並記得其喜好，提供個人化的支援。"],["耐心／聆聽／體諒","耐心聆聽旅客的問題，表現體諒及關心。"]]},{"tp":"4-2","cs":["簡單積分計劃","級別積分計劃","夥伴計劃"],"ty":[],"q":"建議{n}種{地}可推出的忠誠度計劃，並以{地}的產品或服務為例，說明每種計劃的運作。","a":[["簡單積分／簡單計分／簡單的積分／儲分／印花／集點","簡單積分計劃：每次在{地}消費可賺取積分，換取折扣或紀念品。"],["級別／金卡／銀卡／白金／升級","級別積分計劃：按消費金額分銀、金、白金級別，級別越高優惠越大。"],["夥伴／里數／聯營／聯乘／跨企業","夥伴計劃：與航空公司或銀行合作，可用里數或信用卡積分兌換{地}門票。"]]},{"tp":"4-2","cs":[],"ty":[],"q":"解釋{n}項{地}推行忠誠度計劃以留住顧客的好處。","a":[["成本效益／成本／開拓新客","維繫舊客的成本較開拓新客低，增加成本效益。"],["穩定收入／重複光顧／再次光顧／回頭客／收入來源","會員會重複光顧，為{地}帶來穩定收入來源。"],["利潤／盈利／消費更多","會員為賺取積分或升級而消費更多，增加經營利潤。"],["市場佔有率／競爭對手／轉投","會員較少轉投競爭對手，有助{地}維持市場佔有率。"],["改善建議／意見回饋／收集意見","忠誠顧客較願意提出意見和改善建議。"],["包容／體諒／偶有失誤","忠誠顧客對偶爾的失誤較包容，給予{地}改善空間。"],["口碑／推薦／介紹親友／新顧客","會員會向親友推薦{地}，以口碑引入新顧客。"],["數據庫／顧客資料／消費紀錄／大數據","透過會員資料及消費紀錄建立龐大數據庫，制定精準推廣。"]]},{"tp":"4-2","cs":["夥伴計劃"],"ty":[],"q":"假設{地}的營運機構計劃推出夥伴計劃，建議{n}類合適的合作企業，並說明會員可如何賺取或兌換積分。","a":[["航空公司／飛行里數／里數","航空公司：會員在{地}消費可賺取飛行里數，亦可用里數兌換門票。"],["酒店住宿／酒店集團／住宿優惠","酒店集團：入住合作酒店可獲積分，換取{地}的優惠。"],["信用卡／銀行／簽賬","銀行：信用卡簽賬積分可兌換{地}的門票或禮品。"],["餐廳／食肆／餐飲集團","餐飲集團：在合作餐廳消費可賺取積分，在{地}使用。"],["八達通／鐵路／巴士／交通機構","交通機構：乘搭合作交通工具可賺取積分，換領{地}優惠。"],["旅行社／網上旅遊代理／OTA","旅行社：經合作旅行社或網上平台購買套票可獲雙倍積分。"],["商場／零售／購物","零售商戶：在合作商場購物所得的積分可與{地}積分互換。"]]},{"tp":"4-2","cs":["級別積分計劃"],"ty":[],"q":"分析{地}採用級別積分計劃的{n}項優點或缺點。","a":[["消費更多／刺激消費／多消費","優點：消費金額越大級別越高，能吸引顧客消費更多。"],["長期光顧／持續光顧／保級／長期價值","優點：會員為保持或提升級別而長期持續光顧。"],["受尊重／尊貴／優越感／地位","優點：高級別會員享專屬禮遇，感到受尊重，滿足尊重需要。"],["門檻／難以達到／失去吸引力","缺點：若門檻過高，大部分會員難享高級別獎賞，計劃失去吸引力。"],["獎賞成本／成本上升／成本增加／優惠開支","缺點：級別越高優惠越大，{地}的獎賞成本隨之上升。"],["複雜／行政／難以明白","缺點：規則較簡單積分計劃複雜，行政管理工作較多。"]]},{"tp":"4-3","cs":["對外行銷","互動行銷","內部行銷"],"ty":[],"q":"根據你在{地}的觀察，以服務金三角分析，指出{n}個{地}的行銷例子，並說明各屬於對外行銷、互動行銷還是內部行銷。","a":[["廣告／海報／宣傳片／單張","對外行銷：{地}以廣告、海報及宣傳片吸引顧客，製造承諾。"],["社交媒體／官方網站／網上平台／IG","對外行銷：在官方網站及社交媒體發布資訊，影響顧客期望。"],["導賞／講解／接待／解答查詢","互動行銷：職員親身接待、導賞及解答查詢，兌現服務承諾。"],["客服熱線／網上客服／即時通訊／電話","互動行銷：以客服熱線或網上客服回應查詢，與顧客保持聯繫。"],["合作夥伴／場內商戶／外判","互動行銷：顧客與{地}合作夥伴（如場內餐廳）的接觸，亦影響承諾能否兌現。"],["培訓／嘉許／最佳員工／表揚","內部行銷：安排員工培訓及張貼嘉許，鼓勵員工做好服務。"],["員工休息室／員工福利／員工飯堂／待遇","內部行銷：設員工休息室及提供員工福利，先令「內部顧客」滿意。"],["意見卡／意見調查／問卷","對外行銷：以意見調查了解顧客需要，顧客回饋亦會影響企業。"]]},{"tp":"4-3","cs":["內部行銷","企業","員工"],"ty":[],"q":"建議{n}項{地}管理層可推行的內部行銷措施，讓前線員工提供更優質的服務。","a":[["培訓／訓練／工作坊","提供培訓，教授員工運用{地}設施及提升顧客滿意度的技巧。"],["招聘／聘用／挑選","優化聘用工序，挑選適合的員工。"],["營運標準／工作流程／守則／手冊","制定清晰的營運標準與流程，支援員工提供服務。"],["器材／對講機／電腦系統／工具","提供適當的技術與器材，例如對講機及電腦系統。"],["授權／權力／自行決定","賦予前線員工處理顧客問題的權力。"],["待遇／薪酬／福利／休息室／工作環境","提供良好待遇與工作環境，例如合理薪酬及員工休息室。"],["獎勵／嘉許／表揚／獎金","設嘉許及獎勵計劃，鼓勵表現出色的員工。"],["定期分享／團隊精神／公司文化／溝通","定期與員工分享發展目標，建立互信的團隊精神。"]]},{"tp":"4-3","cs":["企業","員工","顧客"],"ty":[],"q":"以{地}為例，根據服務金三角，指出{n}種企業、員工及顧客之間的關係，並各舉一例說明。","a":[["企業對顧客／公司對顧客／宣傳推廣","企業對顧客：{地}透過宣傳推廣吸引顧客，並影響其期望。"],["顧客對企業／顧客對公司／投訴／回饋","顧客對企業：顧客購票消費，並以意見及投訴影響{地}的服務。"],["員工對顧客／職員對顧客／接待顧客／解答查詢","員工對顧客：前線員工接待旅客及解答查詢，兌現服務承諾。"],["顧客對員工／顧客對職員／讚賞員工／尊重員工","顧客對員工：旅客讚賞或尊重員工，有助員工做好服務；反之會破壞其表現。"],["企業對員工／公司對員工／管理層對員工／培訓／待遇","企業對員工：管理層提供培訓及良好待遇，令員工滿意。"],["員工對企業／員工對公司／員工對管理層／反映意見","員工對企業：員工向管理層反映顧客意見，並執行既定工作標準。"]]},{"tp":"4-3","cs":["對外行銷"],"ty":[],"q":"建議{n}項{地}可採用的對外行銷方法，並說明它們如何影響顧客對{地}的期望。","a":[["廣告／電視廣告／戶外廣告／宣傳片","以廣告及宣傳片介紹{地}特色，增加知名度，吸引潛在顧客。"],["社交媒體／網紅／KOL／IG","邀請網紅在社交媒體分享體驗，吸引年輕顧客。"],["公共關係／傳媒／記者會／新聞稿","透過傳媒報道及公關活動，建立正面形象。"],["網上銷售／網上購票／手機程式／電子門票","在官方網站及手機程式銷售門票，方便顧客購買。"],["直接推銷／旅行社／學校／團體","直接向旅行社、學校及團體推銷團體參觀。"],["優惠／折扣／套票／早鳥","推出折扣及套票等推銷活動，刺激購買意欲。"],["參觀須知／注意事項／常見問題／FAQ","在網站列明參觀須知，讓顧客了解須注意的事項，管理期望。"],["意見調查／問卷／市場調查","進行意見調查了解顧客需要，作為推廣參考。"]]},{"tp":"4-4","cs":["關鍵時刻","接觸點"],"ty":[],"q":"根據你在{地}的考察經歷，按旅客的體驗流程指出{n}個旅客與{地}接觸的關鍵時刻，並說明它們如何影響旅客的滿意度。","a":[["官方網站／網上預約／手機程式／查詢資料","抵達前：旅客在官方網站預約及查詢資料，形成初步印象。"],["交通／指示牌／路牌／入口","抵達時：交通是否便利、指示是否清晰，影響第一印象。"],["購票／售票處／驗票／登記","購票及驗票時職員的態度和效率，影響旅客的評價。"],["保安檢查／安檢／寄存","保安檢查及寄存物品是否快捷有禮，亦是重要的接觸點。"],["導賞／講解／展品／表演／機動遊戲","參觀期間導賞員的講解及展品質素，是核心的關鍵時刻。"],["洗手間／休息區／座椅","洗手間及休息區是否清潔舒適，影響旅客的觀感。"],["餐廳／商店／紀念品","在餐廳及紀念品店消費的體驗，同樣影響整體評價。"],["出口／離開／道別／歡送","離開時職員的道別及出口安排，形成最後印象。"]]},{"tp":"4-4","cs":["關鍵時刻","接觸點"],"ty":[],"q":"建議{n}項{地}可在旅客「抵達」及「離開」這兩個關鍵時刻改善服務的措施，令旅客留下良好的第一印象及最後印象。","a":[["微笑／打招呼／迎接／歡迎","職員在入口以微笑主動打招呼，熱情迎接旅客。"],["指示牌／路線圖／地圖／標示","在入口設清晰的多語言指示牌及路線圖。"],["電子門票／QR／掃碼／自助入場","以電子門票及自助掃碼入場，縮短輪候時間。"],["寄存／儲物櫃／行李","提供行李寄存或儲物櫃，讓旅客輕鬆參觀。"],["道別／歡送／多謝／感謝","職員在出口向旅客道別及致謝。"],["紀念品／小禮物／明信片／印章","離開時送上小禮物或紀念印章，加深美好回憶。"],["意見卡／問卷／評分／收集意見","在出口以意見卡或問卷收集意見，讓旅客感到被重視。"],["交通資訊／接駁／的士站／穿梭巴士","提供交通資訊及接駁安排，方便旅客前往下一站。"]]},{"tp":"4-4","cs":["關鍵時刻"],"ty":[],"q":"以{地}為例，解釋{n}項{地}管理層需要重視「關鍵時刻」的原因。","a":[["整體滿意度／整體印象／形成印象／累積印象","旅客在各接觸點所得的印象，累積成對{地}的整體滿意度。"],["改變評價／扭轉／補救","改善接觸點的表現，可扭轉負面印象，改變旅客的評價。"],["口碑／網上評價／推薦／負評","旅客會在網上分享接觸點的體驗，影響{地}的口碑。"],["回頭客／再次光顧／重遊／忠誠","在接觸點持續提供優質體驗，有助建立忠誠度，吸引旅客重遊。"],["找出問題／針對性／逐一檢視","逐一檢視各接觸點，可找出最需要改善的環節。"],["員工培訓／授權／一言一行","提醒員工一言一行都影響印象，作為培訓及授權的依據。"],["品牌形象／競爭力／聲譽","良好的接觸點體驗能建立{地}的品牌形象，提升競爭力。"]]},{"tp":"4-4","cs":["接觸點","關鍵時刻"],"ty":["hotel"],"q":"根據你在{地}的考察，按顧客流程指出{n}個住客與{地}接觸的關鍵時刻，並建議如何在該時刻提升住客的滿意度。","a":[["訂房／預訂／訂房部","訂房：準確處理網上或電話訂房，並主動確認住客的特別要求。"],["機場接送／接送／門僮／行李","抵達：門僮主動迎接及協助搬運行李，留下良好的第一印象。"],["登記入住／入住登記／前台／接待處","入住登記：前台職員快捷有禮地辦理登記，並介紹酒店設施。"],["客房清潔／房務員／房間清潔","住宿期間：房務員保持客房清潔整齊，符合住客期望。"],["早餐／餐廳／客房送餐","用餐：餐廳及客房送餐服務準確快捷。"],["禮賓／查詢／代訂","禮賓部協助查詢及代訂表演門票，切合住客所需。"],["退房／結賬／離開","退房：快速準確地結賬並禮貌道別，留下良好的最後印象。"]]},{"tp":"4-5","cs":["差距一：認識差距","差距二：服務設計及標準差距","差距三：服務表現差距","差距四：溝通差距","差距五：顧客差距"],"ty":[],"q":"根據你在{地}的觀察或旅客的網上評價，以Parasuraman的服務品質差距模式，指出{n}個{地}可能出現的服務差距，並以例證說明。","a":[["認識差距／認知差距／差距一／不了解期望／估錯需要","差距一（認識差距）：管理層誤解旅客期望，提供的服務不是旅客所需要的。"],["服務設計／標準差距／差距二／人手不足","差距二（服務設計及標準差距）：明白期望但設計欠佳，例如人手不足令旅客久候。"],["表現差距／差距三／態度／出錯","差距三（服務表現差距）：員工未能達到既定標準，例如態度欠佳或出錯。"],["溝通差距／差距四／誇大／與宣傳不符／過度承諾","差距四（溝通差距）：宣傳承諾未能兌現，例如網站介紹的設施暫停開放。"],["顧客差距／差距五／期望落差／期望與認知","差距五（顧客差距）：旅客的期望與實際感受不符，令旅客失望。"]]},{"tp":"4-5","cs":["差距三：服務表現差距"],"ty":[],"q":"{地}的前線員工有時未能達到既定的服務標準。建議{n}項{地}可收窄服務表現差距的方法。","a":[["吸引人才／優厚待遇／薪酬","提供具競爭力的薪酬及待遇，吸引優秀員工加盟。"],["慎選／挑選／面試","招聘時慎選具服務熱誠及合適技能的員工。"],["培訓／訓練／支援","為員工提供培訓與支援，加深其對服務標準及顧客期望的認識。"],["團隊／協作／互相幫忙","建立團隊，鼓勵員工互相協作。"],["授權／下放／決定權","下放決定權予前線員工，讓他們即時解決顧客問題。"],["優質服務文化／服務文化／嘉許","在員工間推動優質服務文化，並公開嘉許表現優秀的員工。"],["挽留／流失率／晉升","提供晉升機會，挽留優秀員工，減低流失率。"],["人手／兼職／旺季","旺季時增派人手或聘請兼職，應付龐大的服務需求。"]]},{"tp":"4-5","cs":["差距四：溝通差距"],"ty":[],"q":"有旅客投訴{地}的實際體驗與宣傳不符。建議{n}項{地}可收窄溝通差距的措施。","a":[["如實／真實／實景照片／不誇大","宣傳照片及描述要如實反映{地}的情況，避免過度承諾。"],["前線意見／諮詢前線／執行人員","設定服務承諾前，先與前線執行人員商討，聽取其意見。"],["內部溝通／各部門／橫向溝通","推出宣傳或優惠前進行內部溝通，確保各部門知悉。"],["相同標準／統一標準／各分店／各分館","確保各個地點提供的服務達相同標準。"],["不同收費／分級收費／價格分級","為不同服務標準設不同收費，調節顧客的期望。"],["清楚列明／限制／暫停開放／條款","清楚列明服務限制，例如設施暫停開放，管理顧客期望。"]]},{"tp":"4-5","cs":["差距一：認識差距"],"ty":[],"q":"建議{n}項{地}管理層可了解旅客真正期望的方法，以收窄認識差距。","a":[["市場調查／問卷調查／意見調查","定期進行市場調查及顧客滿意度調查。"],["投訴個案／分析投訴／投訴紀錄","分析顧客投訴個案，找出旅客不滿的原因。"],["小組座談／焦點小組／座談會","舉辦客戶小組座談，深入了解旅客的需要。"],["直接交流／親身接觸／巡視","決策人員多到前線巡視，直接與旅客交流。"],["下情上達／前線回饋／員工反映","建立下情上達的渠道，讓前線員工反映旅客意見。"],["網上評價／社交媒體／評分網站","定期分析網上評價及社交媒體留言，掌握旅客想法。"],["市場細分／不同客群／分眾","按不同客群進行市場細分，了解各自的需要。"]]},{"tp":"4-6","cs":["憤怒的客人"],"ty":[],"q":"假設一名旅客因在{地}久候而大發雷霆，向前線員工破口大罵。建議{n}項員工應對這位客人的方法。","a":[["冷靜／客觀／理性／不針對","保持冷靜客觀及理性，明白客人並非針對自己。"],["積極態度／態度積極／正面／避免消極","採取積極正面的態度，避免消極回應。"],["聆聽／不打斷／安撫","耐心安撫及積極聆聽，不打斷客人說話。"],["了解原因／找出原因／解決方法／問清楚","了解客人憤怒的原因，並定出解決方法。"],["同情／明白感受／體諒／必會協助","表示同情，讓客人知道你必會提供協助。"],["不批評／不推卸／不卸責","不隨便批評公司或同事，亦不推卸責任。"],["彈性／公司指引／不隨便承諾／補償","在公司指引內保留彈性，例如提供補償，但不隨便承諾。"]]},{"tp":"4-6","cs":["猶豫不決的客人"],"ty":[],"q":"有旅客在{地}選購門票、套票或紀念品時猶豫不決。建議{n}項職員招待這類客人的方法。","a":[["耐心／耐性／保持笑容","保持耐心及良好的服務態度。"],["催促／強迫／態度強硬／擅自離開","切忌態度強硬、催促客人或擅自離開。"],["開放式問題／試探式問題／詢問需要","提出開放式或試探式問題，了解客人的需要。"],["舉措／身體語言／表情／留意反應","留意客人的舉措及反應，找出猶豫的原因。"],["比較／優缺點／不同選擇","清楚介紹不同選擇的分別及優缺點，方便客人比較。"],["引導／推介／提供意見","根據客人反應適時提供意見，引導客人作決定，但不代為決定。"]]},{"tp":"4-6","cs":["憤怒的客人","不滿意的客人","猶豫不決的客人","苛刻或專橫的客人","粗魯或不顧及他人的客人","喋喋不休的客人"],"ty":[],"q":"根據你在{地}的觀察，指出{n}類{地}前線員工可能遇到的不易取悅的客人，並各建議一個招待方法。","a":[["憤怒／發脾氣／破口大罵","憤怒的客人：保持冷靜，積極聆聽，了解原因並提出解決方法。"],["不滿意／不滿／投訴","不滿意的客人：耐心聆聽並覆述問題，再提出解決方法。"],["猶豫不決／猶豫／拿不定主意","猶豫不決的客人：保持耐心，以試探式問題找出原因，引導作決定。"],["苛刻／專橫／難以討好","苛刻或專橫的客人：保持專業，稱呼姓名以示尊重，堅定公平地處理。"],["粗魯／無禮／不顧及他人／插隊／咒罵","粗魯的客人：保持冷靜有禮，專注處理其要求，避免惹起誤會。"],["喋喋不休／健談／長氣","喋喋不休的客人：保持友善，以封閉式問題掌握對話，有禮地結束。"]]},{"tp":"4-6","cs":["喋喋不休的客人","粗魯或不顧及他人的客人"],"ty":[],"q":"{地}的服務櫃位大排長龍時，有客人不停與職員閒聊，亦有客人插隊及大聲喝罵。建議{n}項職員可分別招待這兩類客人的方法。","a":[["友善／不露厭煩／不耐煩","面對喋喋不休的客人，保持友善，不露厭煩之色。"],["封閉式問題／掌握主動／聚焦","運用封閉式問題，掌握對話主動權，聚焦處理其要求。"],["結束對話／肢體動作／說話技巧","適時以肢體動作或說話技巧，有禮貌地結束對話。"],["同事協助／其他同事／加開","請同事協助處理其他排隊的客人，減少他們久候。"],["冷靜／專業態度／保持專業／適當笑容","面對粗魯的客人，保持冷靜、專業態度及適當笑容。"],["記下要求／紙筆／專注","用紙筆記下客人的要求並專注處理，避免受負面言行影響。"],["誤會／排隊規則／解釋規則","有禮地解釋排隊規則，小心別惹起誤會。"]]},{"tp":"x:服務性質","cs":["應變性"],"ty":[],"q":"以{地}為例，舉出{n}個前線員工需要因應旅客的個別要求或突發情況而靈活調整服務的情境，並說明員工應如何處理。","a":[["飲食要求／素食／過敏／清真","旅客有飲食禁忌或過敏，員工按其要求調整餐飲安排。"],["輪椅／行動不便／長者","長者或行動不便的旅客到訪，員工改用無障礙路線並借出輪椅。"],["語言不通／外語／翻譯／手語","遇上語言不通的旅客，員工改用外語、手勢或翻譯工具溝通。"],["天氣／下雨／颱風／酷熱","天氣突變時，員工即時把戶外活動改到室內進行。"],["走失／不適／急救／受傷","旅客走失或身體不適時，員工即時協助並提供急救。"],["故障／停電／暫停","設施故障時，員工即時安排替代方案，並向旅客解釋。"],["嬰兒／嬰幼兒／幼童／小朋友","帶同嬰幼兒的旅客需要協助時，員工靈活提供育嬰用品或地方。"],["改期／取消／臨時更改","旅客臨時要求改期或更改安排，員工按情況彈性處理。"]]},{"tp":"x:服務性質","cs":["情緒性"],"ty":[],"q":"顧客服務除了滿足旅客的實際需要，亦要照顧他們的感受。建議{n}項{地}員工可令旅客感到受尊重或被認同的做法。","a":[["稱呼姓名／稱呼／姓氏","以姓氏稱呼旅客，令他們感到被重視。"],["微笑／眼神接觸／打招呼","以微笑及眼神接觸主動打招呼，令旅客感到被歡迎。"],["讚賞／欣賞／稱讚","適時讚賞旅客的提問或參與，令他們感到被認同。"],["生日／紀念日／驚喜","為慶祝生日或紀念日的旅客送上驚喜，令他們感動。"],["耐心聆聽／聆聽／同理心","耐心聆聽旅客的意見或不滿，表示理解其心情。"],["道謝／感謝／歡送","旅客離開時真誠道謝及歡送，留下美好感覺。"],["敬語／有禮／禮貌用語／尊重不同文化／習俗","使用禮貌用語，並尊重不同文化背景旅客的習俗。"],["個人化／記得喜好／專屬","記得熟客的喜好，提供個人化的服務。"]]},{"tp":"x:服務性質","cs":["應變性","情緒性"],"ty":[],"q":"顧客服務具有應變性及情緒性。以{地}為例，指出{n}項前線員工應具備的個人特質或能力，並加以解釋。","a":[["應變能力／隨機應變／解難","具應變能力，能因應旅客的不同要求及突發情況即時調整。"],["情緒管理／控制情緒／EQ／冷靜","懂得管理自己的情緒，面對無理旅客仍保持冷靜。"],["耐性／耐心","具耐性，願意花時間照顧不同旅客的需要。"],["同理心／體諒／設身處地","具同理心，能體會旅客的感受及被尊重的需要。"],["溝通能力／語言能力／外語","具良好的溝通及語言能力，能與不同背景的旅客溝通。"],["觀察力／細心／察覺","細心觀察，及早察覺旅客的需要及情緒變化。"],["主動／熱誠／熱忱／樂於助人","主動積極，樂意為旅客提供額外協助。"],["團隊合作／協作／互相支援","具團隊精神，遇到突發情況時與同事互相支援。"]]},{"tp":"1-25","cs":["會議"],"ty":["hotel","mice"],"q":"根據你在{地}的觀察，指出{n}類適合在{地}舉行的會議類型，並說明原因。","a":[["股東大會／周年大會／股東會議","股東周年大會：需接待股東及傳媒，{地}有可容納大量人數的場地。"],["員工大會／誓師大會","員工大會：討論營運策略，提升士氣及凝聚向心力。"],["培訓／研討會／工作坊","培訓研討會：讓員工認識企業文化、產品內容和傳銷方法。"],["發布會／發佈會／新產品","產品發布會：邀請分銷商、零售商及傳媒出席。"],["集思會／退修會／行政人員","行政人員集思會：商議未來、加強聯繫，宜在悠閒寧靜的環境舉行。"],["董事會／管理層會議","董事會會議：人數較少，需要私密及高規格的會議室。"],["大型會議／代表大會／協會","大型會議：多由協會主辦，為期數天並包括社交節目。"]]},{"tp":"1-25","cs":["展覽","消費展覽會","商貿展覽會"],"ty":["mice"],"q":"根據你在{地}的觀察，判斷正在舉行的展覽屬消費展覽會還是商貿展覽會，並列出{n}項支持你判斷的證據。","a":[["市民／公眾／業界／業內人士／買家","入場對象：消費展以本地市民為主；商貿展多只供業內人士及買家參觀。"],["人數／人山人海／擠擁","入場人數：消費展的人數較多；商貿展的人數較少。"],["即場售賣／即場購買／即場交易／完成交易／展後","銷售方式：消費展即場售賣；商貿展須再商討，展覽結束後才完成交易。"],["櫃枱／小枱／會客區／展銷櫃","攤位設計：消費展的展銷櫃枱靠近人流通道；商貿展設小枱方便洽談。"],["樣品／價目／目錄","展品：商貿展多展示樣品及介紹資料；消費展的商品標明價目，即買即走。"],["門票／入場登記／名片／入場證","入場安排：消費展公開售票；商貿展須登記並出示名片或入場證。"],["研討會／表演／節目／講座","相關活動：消費展加插表演；商貿展同期舉辦研討會，交流業內資訊。"]]},{"tp":"1-25","cs":["會議","獎勵旅遊","商務","展覽"],"ty":[],"q":"一間跨國公司計劃為各地員工及客戶舉辦為期三天的周年活動，行程包括到訪{地}。建議{n}項活動安排，並指出各屬MICE的哪一個元素。","a":[["開會／會議活動／研討會／周年大會／股東大會／培訓／會議","會議：舉行周年大會及培訓研討會，讓參加者分享資訊。"],["獎勵旅遊／獎勵／頒獎／表揚","獎勵旅遊：為表現優秀的員工安排頒獎晚宴及特色觀光。"],["商務／大型會議／論壇／洽談／商務旅遊","商務（大型會議）：舉辦行業論壇，並安排與本地客戶洽談生意。"],["展覽會／展覽區／產品展覽／產品展示／展銷／展位／展覽","展覽：設產品展示區，向客戶及傳媒介紹新產品。"]]},{"tp":"1-25","cs":[],"ty":[],"q":"以{地}為例，解釋{n}項發展MICE旅遊對當地的好處。","a":[["花費／消費較高／消費高／消費很高／高消費／消費力","MICE旅客花費較多，消費較一般旅客高，為當地帶來較高收入。"],["淡季／淡旺季／季節性","MICE活動不必在旺季舉行，可填補淡季的酒店空房。"],["不依賴景點／不依賴旅遊／毋須景點／景點不多","MICE旅客為參加活動而來，不依賴旅遊景點。"],["相關行業／佈置／供應商／餐飲業","活動需要佈置、餐飲及運輸等供應商，帶動相關行業。"],["就業／職位／工作機會","創造直接及間接職位，增加就業機會。"],["國際形象／知名度／傳媒報道","大型國際活動吸引傳媒報道，提升國際形象及知名度。"],["順道遊覽／會後旅遊／再訪／重遊","與會者會順道遊覽，日後亦可能攜家人再訪。"],["業界交流／新知識／新科技","促進業界交流，引入新知識及新科技。"]]},{"tp":"1-26","cs":["明確性","衡量性","一致性","實際","有時限性"],"ty":["mice","hotel"],"q":"假設主辦機構計劃在{地}舉辦一個大型會議或展覽，根據SMART原則，指出主辦機構訂立活動目標時應符合的{n}個條件，並舉例說明。","a":[["明確／清楚列明／清晰目標","明確性：清楚訂明活動目的，例如推廣本地品牌，讓所有持分者都清楚。"],["衡量／量化／入場人次／參展商數目","衡量性：以入場人次、參展商數目等可量化指標與往年比較。"],["一致／持分者同意／簽訂合約／共識","一致性：目標須經主辦方、參展商等所有持分者同意，例如簽訂合約。"],["實際／資源／人手／可實現","實際：按場地、人手及資金等資源，訂立可實現的目標。"],["時限／限期／截止／完成日期","有時限性：籌備須在限期前完成，例如參展商須在限期前完成攤位設計。"]]},{"tp":"1-26","cs":["明確性","衡量性","一致性","實際","有時限性"],"ty":[],"q":"負責推廣{地}的機構定下目標：「要吸引更多人到訪」。根據SMART原則，指出這個目標的{n}項不足之處，並建議改善方法。","a":[["明確／空泛／目標客群","明確性：目標空泛，應清楚指明對象，例如吸引本地家庭旅客。"],["衡量／量化／具體數字／百分比","衡量性：沒有具體數字，應改為例如入場人次增加百分之十。"],["一致／持分者／同意／共識","一致性：未經員工等持分者同意，應諮詢各部門取得共識。"],["實際／資源／承載力／預算","實際：未考慮人手、預算及承載力，應按資源訂立可達到的數字。"],["時限／限期／期限／完成日期","有時限性：沒有完成時限，應訂明例如在一年內達成。"]]},{"tp":"1-26","cs":["明確性","衡量性","一致性","實際","有時限性"],"ty":[],"q":"{地}計劃爭取更多企業獎勵旅遊團到訪。根據SMART原則，建議{n}項{地}為這個計劃訂立目標時應注意的地方，並舉例說明。","a":[["明確／目標市場／目標客群","明確性：清楚訂明目標市場，例如吸引東南亞的金融企業。"],["衡量／量化／團數／百分比","衡量性：以接待團數或人數量化，例如增加百分之二十。"],["一致／持分者／同意／共識","一致性：目標須經管理層、前線部門及合作旅行社等持分者同意。"],["實際／資源／接待能力／承載力","實際：按場地容量及人手等資源，訂立可達到的數字。"],["時限／限期／期限／季度","有時限性：訂明完成期限，例如明年年底前達標，並按季度檢討。"]]},{"tp":"q:會展旅客特點","cs":["花費較多","平衡旅行需求","不依賴旅遊景點","優質的標準化服務","商務支援","文化多樣性"],"ty":[],"q":"以到訪{地}的旅客為例，比較會展旅客與一般休閒旅客，指出{n}項會展旅客的特點。","a":[["花費／消費較高／消費高／消費很高／高消費／五星級","花費較多：多入住高級酒店、乘搭商務艙，消費較休閒旅客高。"],["淡季／旺季／季節／平衡旅行需求","平衡旅行需求：會展活動不必在旺季舉行，較少受季節影響。"],["不依賴景點／不依賴旅遊／不注重景點／參加活動","不依賴旅遊景點：主要為參加會議或展覽而來，觀光並非主要目的。"],["標準化／高標準／標準一致","優質的標準化服務：對服務水平有相近而高的標準要求。"],["商務中心／影印／翻譯／秘書","商務支援：需要影印、翻譯及秘書等服務處理公務。"],["不同國家／多元文化／飲食禁忌／宗教","文化多樣性：來自不同國家，語言及飲食習慣各異。"],["公司支付／公司價／公司付費／會展價","費用多由公司支付，住宿可享公司價或會展價。"],["時間有限／行程緊湊／空餘時間","行程以工作為主，空餘時間有限，多在會後才順道遊覽。"]]},{"tp":"q:會展旅客特點","cs":["商務支援","文化多樣性","優質的標準化服務"],"ty":["hotel","mice"],"q":"根據你在{地}的觀察，建議{n}項{地}可為會展旅客提供或改善的設施及服務，以配合他們的需要。","a":[["會議室／多功能廳／宴會廳","場地需求：提供不同大小的會議室及多功能廳，方便商務交流。"],["投影機／視聽／螢幕／音響","展示需求：確保投影機及視聽器材運作正常，方便展示產品。"],["商務中心／影印／列印／秘書","商務支援：設商務中心，提供列印、影印及秘書服務。"],["多語言／外語／翻譯／傳譯","文化多樣性：提供多語言接待及翻譯，照顧不同國籍的旅客。"],["清真／素食／國際菜式／飲食禁忌","文化多樣性：提供清真、素食等餐飲，照顧不同的飲食習慣。"],["Wi-Fi／無線上網／充電","提供免費高速Wi-Fi及充電位，方便旅客隨時處理公務。"],["穿梭巴士／接送／交通接駁","安排穿梭巴士接送，連接機場、酒店及會場。"],["客房／行政樓層／會展價","住宿需求：預留足夠客房並提供會展價，方便與會者入住。"]]},{"tp":"q:獎勵旅遊","cs":["狂喜因素","高端獎勵旅遊"],"ty":[],"q":"假設一間跨國公司安排獎勵旅遊團到訪{地}，建議{n}項{地}可為這個團作出的特別安排，令行程更有特色。","a":[["狂喜因素／獨一無二／專場／包場","安排閉館後專場參觀等獨一無二的經歷，成為行程的狂喜因素。"],["晚宴／頒獎／表揚／慶功","在{地}舉行晚宴及頒獎禮，公開表揚得獎員工。"],["專人／VIP／貴賓／專屬","安排專人接待及VIP通道，提供非比尋常的個人服務。"],["企業標誌／企業文化／橫額／品牌","在場地展示公司標誌及口號，配合企業文化。"],["工作坊／團隊活動／互動體驗","安排富創意的工作坊或團隊活動，提升參與感。"],["紀念品／訂製禮物／禮物","送上印有公司名稱的訂製紀念品。"],["簡報會／會議室／商業元素","提供會議室舉行簡報會，配合行程中的商業元素。"],["專家導賞／幕後／後台","由專家帶領參觀幕後地方，帶來其他員工不可能有的特別經歷。"]]},{"tp":"q:獎勵旅遊","cs":["激勵士氣","較現金獎賞優勝"],"ty":[],"q":"一間公司考慮安排表現優秀的員工到{地}進行獎勵旅遊，以代替現金花紅。結合{地}的特點，解釋{n}項獎勵旅遊較現金獎賞優勝的地方。","a":[["宣傳效力／宣傳效果／公開表揚","得獎消息在公司內廣泛宣傳，宣傳效力較現金大。"],["其他同事／發奮／爭取","未得獎的同事會更發奮努力，爭取下次參加。"],["人際網絡／認識同事／聯誼","參加者能在旅程中與不同部門同事及高層建立人際網絡。"],["價值觀／企業文化","高層可藉旅程向參加者灌輸公司價值觀。"],["凝聚力／歸屬感／士氣","共同的旅遊經歷能激勵士氣，增強公司凝聚力。"],["難忘／回憶／印象深刻","在{地}的旅遊經歷難忘，激勵作用較現金持久。"],["傳媒報道／傳媒報導／公關／知名度","傳媒報道獎勵旅遊活動，可提升公司知名度。"]]},{"tp":"q:獎勵旅遊","cs":["影響獎勵旅遊決定的因素"],"ty":[],"q":"會議策畫人為企業挑選獎勵旅遊目的地時會考慮多項因素。以{地}為例，分析{n}項有利或不利{地}吸引獎勵旅遊團的因素。","a":[["安全／治安／健康風險","員工安全：當地治安良好、沒有健康危機，企業才會放心安排。"],["整體費用／預算／成本","整體費用：機票、住宿及活動的總開支須在企業預算之內。"],["購買力／匯率／物價","購買力：匯率及物價水平影響參加者的消費意欲。"],["政治／社會穩定／旅遊警示","政治考慮：政局穩定、沒有旅遊警示，行程才不會受阻。"],["公共設施／交通／基建／服務品質","公共設施及服務品質：機場、交通及酒店完善，服務水平高。"],["氣候／天氣／季節","氣候：天氣宜人的季節較適合安排戶外活動。"],["口碑／形象／評價","口碑及當地形象：評價正面、形象良好，能提升員工參加意欲。"],["旅遊體驗／獨特體驗／文化特色","旅遊體驗：能提供獨特的文化體驗，令員工感到難忘。"]]},{"tp":"q:展覽","cs":["參展的優點"],"ty":[],"q":"假設{地}的營運機構到旅遊展覽會設置攤位推廣{地}，解釋{n}項參展的好處。","a":[["潛在顧客／顧客集中／目標客群","潛在顧客集中：大量旅客及業界買家聚集，有利接觸新客源。"],["省時／節省時間／一次過","省時：在同一地點一次過接觸大量買家，比逐一拜訪省時。"],["市場資訊／競爭對手／最新趨勢","市場資訊密集：可觀察競爭對手，掌握最新市場趨勢。"],["建立關係／人脈／交換名片／旅行社","建立關係：與旅行社等業界面對面交流，建立合作關係。"],["形象／品牌／知名度","建立形象：以精心設計的攤位展示{地}特色，提升知名度。"],["即場售賣／即場銷售／訂單","即場銷售：在公眾開放日即場售賣門票或套票，增加收入。"],["市場反應／新產品／收集意見","測試市場反應：推出新產品並即場收集參觀者意見。"]]},{"tp":"q:展覽","cs":["參展的缺點"],"ty":["mice"],"q":"根據你在{地}的觀察，指出{n}項參展商參加展覽可能面對的缺點或困難，並建議解決方法。","a":[["工作量／人手／佈置","工作量大：須籌備攤位、運送展品及派員駐場；可外判予佈置公司。"],["花費／租金／費用／成本高","花費大：攤位租金、設計及差旅費用高昂；可與合作夥伴合租攤位。"],["保密性／抄襲／商業機密","保密性低：產品公開展示易被抄襲；可只展示樣品或先申請專利。"],["競爭／同類攤位／同行","競爭激烈：同類攤位集中；應突出產品特色吸引買家。"],["成效／回報／難以衡量","成效難以衡量：未必即時有回報；可訂立量化目標並跟進買家。"],["擠迫／人流／難以傾談／難以洽談","人流擠迫：難以與買家深入洽談；可設預約洽談時段。"]]},{"tp":"q:展覽","cs":["攤位設計","消費展覽會","商貿展覽會"],"ty":["mice","hotel"],"q":"假設一間本地中小企首次在{地}參展，建議{n}項它在攤位設計及人手安排上的做法，以提高參展成效。","a":[["人流通道／近通道／入口附近","選擇靠近人流通道的位置，吸引參觀者停留。"],["展銷櫃枱／櫃枱／陳列","消費展宜設展銷櫃枱陳列商品，方便比較及即場售賣。"],["洽談區／小枱／座位","商貿展宜設小枱或洽談區，方便與買家洽談。"],["示範／試用／試食","安排產品示範或試用，增加與參觀者的互動。"],["螢幕／影片／多媒體","以螢幕播放影片介紹產品，吸引參觀者注意。"],["單張／名片／目錄","準備單張、目錄及名片，方便買家日後聯絡。"],["銷售人員／產品知識／培訓","派熟悉產品的銷售人員駐場，並事先培訓推銷技巧。"],["登記資料／QR／顧客資料","設QR碼登記，收集潛在顧客資料以便跟進。"]]},{"tp":"q:MICE相關行業","cs":["酒店","科技基礎配套設施"],"ty":["hotel"],"q":"根據你在{地}的觀察，指出{n}項{地}可為MICE活動提供的設施或服務。","a":[["會議室／多功能廳／演講廳","設不同大小的會議室及多功能廳，可舉行會議及研討會。"],["宴會廳／晚宴／酒會","宴會廳可舉辦晚宴及酒會等接待活動。"],["客房／房間數目／住宿","大量客房讓與會者在同一地點住宿，方便參與活動。"],["茶點／自助餐／餐飲","提供會議茶點、午餐及宴會等餐飲服務。"],["登記系統／登記處／資訊亭","設登記系統及資訊亭，方便與會者報到及查閱資訊。"],["網絡會議／視像會議／Wi-Fi／上網","提供高速上網及在線網絡會議設備。"],["新聞中心／傳媒室／訊息中心","設新聞中心及訊息中心，方便傳媒及辦公室通訊。"],["視聽器材／投影機／同步傳譯","配備投影機、音響及同步傳譯等視聽器材。"]]},{"tp":"q:MICE相關行業","cs":["交通"],"ty":["mice"],"q":"根據你在{地}的考察，分析{n}項{地}的交通配套如何有助吸引大型活動在此舉行。","a":[["鄰近機場／航班／航空樞紐／機場快綫／機場快線","鄰近國際機場及航空樞紐，方便海外參加者抵達。"],["鐵路／港鐵／高鐵","有鐵路直達，方便參加者往返市區及內地。"],["穿梭巴士／接駁／免費巴士","主辦方可安排穿梭巴士，接駁酒店與會場。"],["渡輪／渡輪碼頭／水路／水上的士","設渡輪碼頭或水上的士，參加者可經水路前往。"],["的士站／上落客區／旅遊巴","設的士站及旅遊巴上落客區，方便團體到達。"],["停車場／貨車／運送展品","設停車場及貨車上落區，方便參展商運送展品。"],["有蓋／行人通道／行人天橋／步行","以有蓋行人通道連接附近酒店及車站。"]]},{"tp":"q:MICE相關行業","cs":["旅遊景點","會後旅行團"],"ty":[],"q":"大型會議結束後，主辦機構一般會為外國出席者籌組會後旅行團。建議{n}項{地}可如何吸引及配合會後旅行團到訪。","a":[["團體優惠／套票／團體門票","推出團體門票優惠或套票，方便籌組會後旅行團。"],["指定旅行社／旅行社／導遊","與負責籌組旅行團的指定旅行社合作，並為導遊提供資料。"],["多語言／外語導賞／翻譯","提供多語言導賞或語音導覽，照顧不同國籍的出席者。"],["預留時段／預約／指定時段","預留指定時段供團體參觀，配合緊湊的會議行程。"],["精華遊／短時間／一小時","設計一至兩小時的精華遊路線，切合出席者有限的時間。"],["旅遊巴／上落客區／接送","預留旅遊巴上落客區，方便團體上落。"],["場地租用／晚宴／酒會","租出場地舉行晚宴或酒會，成為行程亮點。"],["會展場地／主辦方／會場推廣","與會展場地或主辦方合作，在會場推廣{地}。"]]},{"tp":"4-7","cs":["資源效益","環境純淨度","生物多樣性","自然的完整性"],"ty":[],"q":"根據你在{地}的觀察，舉出{n}項{地}在環境方面實踐可持續發展旅遊業目標的措施，並指出每項措施所對應的目標。","a":[["節能／能源／省電／慳電／LED／太陽能","資源效益：{地}使用LED燈、感應燈或太陽能，減少使用稀有及非再生能源。"],["節水／省水／慳水／節約用水／節省用水／感應水龍頭","資源效益：洗手間安裝感應水龍頭，節約用水。"],["回收箱／分類回收／循環再用／再造","資源效益：設置分類回收箱，宣揚「減少、再用、循環」的環保意識。"],["飲水機／走塑／即棄／自備水樽／自備水壺／減塑","環境純淨度：設飲水機鼓勵旅客自備水樽，減少即棄膠樽等廢物。"],["無紙化／電子門票／電子單張／減少用紙","資源效益：推行電子門票及電子單張，減少紙張消耗。"],["公共交通／港鐵／地鐵／單車／步行","環境純淨度：鼓勵旅客乘搭公共交通或步行前往，減少空氣污染。"],["綠化／樹木／植物／花草／天台花園","自然的完整性及生物多樣性：保留樹木及綠化，優化景觀並為生物提供棲息地。"],["禁止吸煙／禁煙／無煙","環境純淨度：全場禁止吸煙，減少空氣污染，保持環境清潔。"]]},{"tp":"4-7","cs":["社會公平性","旅遊體驗","地區管理","地區福祉","文化獨特性"],"ty":[],"q":"以{地}為例，指出可持續發展旅遊業議程中社會文化範疇的{n}個目標，並解釋{地}如何達致這些目標。","a":[["社會公平／社區的公平／弱勢社群／社企／居民帶領","社會公平性：聘用弱勢人士或由當地居民帶領導賞，讓旅遊利益公平擴散至社區。"],["旅遊體驗目標／無障礙／多語言／無歧視／滿意度調查","旅遊體驗：設無障礙通道及多語言資訊，無歧視地讓所有旅客得到安全及滿意的經歷。"],["地區管理／當地監管／諮詢／居民參與／社區參與","地區管理：發展及管理前諮詢當地居民及持份者，讓本地社群參與規劃及決策。"],["地區福祉／地區的福祉／社區福祉／社會福祉／居民生活／生活質素","地區福祉：實行預約分流並開放設施予居民共用，維持居民的生活質素。"],["文化獨特性／歷史傳統／傳統文化／文物保育／古蹟","文化獨特性：保育文物及歷史建築，並舉辦活動推廣本土歷史傳統。"]]},{"tp":"4-7","cs":["經濟可行性","地區性繁榮","僱員質素"],"ty":[],"q":"建議{n}項措施，讓{地}在經濟方面達致可持續發展旅遊業的目標，並指出每項措施所對應的目標。","a":[["本地品牌／本地商戶／本地小店／非連鎖","地區性繁榮：引入本地品牌商店及餐廳，讓旅客的消費留在本地。"],["本地供應商／本地產品／本地食材／本地採購","地區性繁榮：向本地供應商採購產品及食材，減少損漏（資金流失）。"],["逗留時間／延長逗留／夜間活動／多元化","地區性繁榮：把旅遊產品多元化，例如舉辦夜間活動，增加旅客逗留時間及消費。"],["僱用本地／聘請本地／本地員工／就業機會／全職職位","僱員質素：增加全年全職職位並聘用本地人士，創造就業機會。"],["培訓／晉升／合理薪酬／福利","僱員質素：為員工提供技能培訓、晉升機會及合理薪酬，提升職位質素。"],["市場調查／問卷／收集意見／旅客意見","經濟可行性：以市場調查了解旅客喜好及滿意度，識別能長期帶來業務的市場。"],["品牌形象／宣傳推廣／知名度","經濟可行性：建立正面及一致的品牌形象，維持景點的吸引力及競爭力。"],["收入來源／租金／出租／場地租用／自負盈虧","經濟可行性：開拓商店租金及場地租用等收入來源，確保長遠的生存能力。"]]},{"tp":"4-7","cs":[],"ty":[],"q":"指出{n}個{地}已實踐的可持續發展旅遊業目標，並以你在{地}觀察到的例子加以說明。","a":[["資源效益／資源效率／有效運用資源／節能／能源／循環再用","資源效益：{地}使用LED燈及感應水龍頭，減少使用稀有及非再生資源。"],["環境純淨度／環境純度／環境清潔／減少污染／減少廢物／走塑","環境純淨度：推行走塑及全場禁煙，減少廢物及空氣污染。"],["生物多樣性／動植物／野生動物／棲息地","生物多樣性：保護場內樹木及野生動物的棲息地，把旅遊帶來的破壞減至最低。"],["旅遊體驗目標／無障礙／無歧視／多語言","旅遊體驗：設無障礙設施及多語言資訊，無歧視地為所有旅客提供滿意的經歷。"],["文化獨特性／歷史傳統／傳統文化／文物保育／古蹟","文化獨特性：保育歷史建築及文物，讓旅客認識當地的歷史傳統。"],["地區福祉／地區的福祉／社區福祉／社會福祉／居民生活／生活質素","地區福祉：以預約制分流人潮，並開放設施予居民使用，維持社區生活質素。"],["地區性繁榮／地區繁榮／本地品牌／本地商戶／本地採購","地區性繁榮：場內商店及餐廳多為本地品牌，讓旅客的消費留在本地。"],["僱員質素／顧員質素／就業質素／就業機會／本地員工／員工培訓","僱員質素：聘用本地員工並提供培訓，增加就業機會及提升職位質素。"]]},{"tp":"4-8","cs":["標準化","同質化"],"ty":[],"q":"根據你在{地}及附近的觀察，舉出{n}個反映旅遊業標準化或同質化的例子，並加以解釋。","a":[["麥當勞／星巴克／肯德基／快餐／連鎖咖啡／咖啡連鎖","餐飲：國際快餐及咖啡連鎖店在世界各地大同小異，食物及服務模式劃一。"],["連鎖酒店／國際酒店／萬豪／希爾頓／洲際","住宿：國際酒店管理集團以劃一的高服務質素標準營運，各地設施相近。"],["購物中心／商場／國際品牌／名牌","購物：商場內的國際品牌及貨品與其他城市相同，購物體驗相似。"],["便利店／藥妝店／連鎖店舖","連鎖便利店及藥妝店遍佈各地，貨品陳列及服務流程一致。"],["制服／標準用語／統一流程／指定程序","職員穿著統一制服，按標準流程及用語服務，令服務均一及可預計。"],["旅行團／團體旅客／行程編排","旅行團行程經精心編排和計算，按承諾兌現服務，各團體驗大同小異。"]]},{"tp":"4-8","cs":["標準化"],"ty":[],"q":"以{地}為例，分析標準化為旅客、旅遊業界及旅遊目的地帶來的{n}項影響。","a":[["熟悉／生活方式／家鄉","旅客：可保留熟悉的服務和平日生活方式，在陌生地方亦感到自在。"],["飲食習慣／水土不服／不適","旅客：可保持平日的飲食習慣，避免因飲食不當引致身體不適。"],["成本效益／效率／降低成本／容易管理","業界：以同一套模式營運，提高成本效益和管理效率。"],["質素穩定／一致／可預計／均一","業界：服務均一和標準，質素穩定可預計，有助維持消費者滿意度。"],["個人化／個性化／度身訂造","業界面對挑戰：要在標準化的大前提下提供更個人化的安排。"],["失去特色／獨有風格／吸引力下降","目的地：服務千篇一律，目的地失去特色，吸引力下降。"],["自由行／個人體驗／避開主流","旅客：為避免標準化行程，更多旅客選擇自由行，追求個人體驗。"],["小商戶／被淘汰／結業／小店","大企業以同一模式擴張，本地小規模經營者難以競爭而被淘汰。"]]},{"tp":"4-8","cs":["同質化"],"ty":[],"q":"建議{n}項措施，讓{地}在發展旅遊的同時減少同質化的影響，保持其獨有特色。","a":[["本地品牌／本地小店／老店／老字號／非連鎖","引入本地品牌及老字號而非國際連鎖店，讓旅客感受地道風格。"],["地道美食／地道小食／地道食物／本地美食／傳統小食／街頭小食","提供地道美食及傳統小食，讓旅客體驗當地的飲食文化。"],["傳統建築／建築風格／保留舊建築／本地設計","保留傳統建築風格並融入本地設計元素，避免與其他城市千篇一律。"],["工作坊／DIY／手作體驗／親手製作","舉辦傳統工藝工作坊，讓旅客親身參與當地文化活動。"],["本地製造／本地工藝／手工藝／原創","售賣本地工匠製作的工藝品及原創紀念品，突顯地方特色。"],["民宿／共享住宿／特色住宿","發展民宿或特色住宿，讓旅客避開國際連鎖酒店同質化的住宿。"],["節慶／傳統節日／民俗／傳統表演","舉辦傳統節慶及民俗表演，讓旅客接觸當地獨有的文化。"],["居民交流／與居民／社區導賞／深度遊","安排與居民交流的社區導賞，讓旅客了解當地人的真實生活。"]]},{"tp":"4-9","cs":["文化商品化"],"ty":[],"q":"根據你在{地}的觀察，舉出{n}個本土文化被商品化的例子，並加以說明。","a":[["紀念品／手信／文創／精品","把文物或傳統圖案印在文創產品及紀念品上出售，以迎合旅客口味。"],["表演／演出／示範表演","把傳統儀式或藝術包裝成定時演出的表演，供旅客觀賞。"],["工作坊／體驗班／DIY／收費體驗","把需長年學習的傳統技藝簡化成收費工作坊，讓旅客在短時間內體驗。"],["大量生產／機器製造／量產／工廠","手工藝品改以機器大量生產，降低成本以應付旅客需求。"],["換裝／租借服飾／傳統服飾／拍照收費","提供傳統服飾租借及收費拍照，把傳統服飾變成商品。"],["主題餐廳／造型甜品／造型食品／主題菜式／聯名","餐廳推出以文物或傳統文化為主題的造型食品，吸引旅客消費。"]]},{"tp":"4-9","cs":["矮化","文化商品化"],"ty":[],"q":"以{地}或你曾到訪的景點為例，分析本土文化在商品化過程中被矮化的{n}種情況。","a":[["簡化／縮短／省略／濃縮","為配合旅客的逗留時間，把表演或工藝步驟簡化及縮短，令內涵變得膚淺。"],["失去原意／原有意義／純娛樂／娛樂化","具宗教或社會意義的儀式被改成純娛樂表演，失去原有意義。"],["每天上演／定時上演／隨時演出／改變時間／脫離原有","節慶活動脫離原有的時間及地點，每天定時上演，方便旅客觀看。"],["迎合旅客／迎合口味／遷就旅客／改變口味／改良／被改動","傳統食物或工藝為迎合旅客口味而被改動，失去真實性。"],["失傳／後繼無人／技藝流失／手藝流失","手工藝被大量生產取代，工匠難以維生，傳統技藝逐漸失傳。"],["扭曲／誇張／不符史實／歪曲","為吸引旅客而誇張或扭曲歷史及傳統，令旅客誤解當地文化。"],["沒落／變質／變異／衝擊","本土文化受到商業化的衝擊，逐漸變異以至沒落。"]]},{"tp":"4-9","cs":["文化商品化","矮化"],"ty":[],"q":"建議{n}項措施，讓{地}在推廣本土文化時減少文化商品化及矮化的情況。","a":[["史實／歷史事實／考證／原貌","表演及展示內容須根據歷史事實改編，保留文化原貌。"],["導賞／講解／解說","安排導賞團向旅客講解傳統及歷史的真相，加深旅客理解。"],["示範／即場製作／工藝表演","安排工匠現場示範傳統技藝，讓旅客欣賞工藝而非只是購物。"],["手工製作／原材料／傳統工序／限量","堅持以原材料及傳統工序手工製作，避免大規模生產。"],["工作坊／DIY／親身參與","舉辦DIY工作坊並先作文化簡介，把焦點由購買轉為文化體驗。"],["諮詢／原居民／居民參與／社區參與","推廣前諮詢原居民及本地社群的意見，尊重當地的文化資產。"],["傳承／學徒／培訓","資助傳承人培訓學徒，讓傳統技藝得以延續。"],["守則／規管／限制商店","制定參觀守則並規管商業活動的數量，避免過度商業化。"]]},{"tp":"4-9","cs":["文化商品化","矮化"],"ty":[],"q":"分析本土文化商品化可能對{地}及當地社群帶來的{n}項正面或負面影響。","a":[["就業／增加收入／帶來收入／生計","正面：文化產品帶來收入及就業機會，改善當地人的生計。"],["知名度／宣傳本土／認識當地","正面：文化產品有助宣傳本土文化，提高旅客對當地文化的認識。"],["延續／傳承／保育資金","正面：商業收益為傳統技藝提供經濟支持，有助傳承延續。"],["真實性／原真性／不真實／失去原貌","負面：文化被包裝以迎合旅客，失去原有的真實性。"],["失傳／技藝失傳／沒落","負面：大量生產取代精心製作，技藝失傳，文化變異以至沒落。"],["居民不滿／反感／衝突","負面：居民不滿傳統被商業化，與旅客或商人產生衝突。"],["外來商人／利益不均／資金外流","負面：利潤多歸外來商人，當地社群受惠有限。"]]},{"tp":"4-10","cs":["公平夥伴合作關係","公平利益分配","旅客與本地居民的公平貿易","合理使用自然資源","合理薪酬與工作環境"],"ty":[],"q":"以{地}為例，指出{n}項符合公平貿易準則的做法，並加以說明。","a":[["僱用本地／聘請本地／本地員工／本地職員","公平夥伴合作關係：僱用本地人士，讓當地社群參與旅遊業。"],["管理職務／培訓本地／晉升","公平夥伴合作關係：訓練和培養本地人士出任管理職務。"],["諮詢／居民意見／社區參與","公平夥伴合作關係：發展前充份諮詢本地社群的意見。"],["本地產品／本地食材／本地供應商／本地原料","公平利益分配：以公平價格向本地供應商採購，使用本地產品和原料，減少流失。"],["明碼實價／價錢牌／合理價格／公道","旅客與本地居民的公平貿易：貨品明碼實價，以公平的市場價格出售。"],["保護環境／環境保護／自然資源／節約資源","合理使用自然資源：投資環境保護，執行有助優化本地環境的措施。"],["合理薪酬／員工待遇／工作環境／福利","合理薪酬與工作環境：參考國際標準，為員工提供合理待遇及工作環境。"],["社企／捐款／回饋社區","公平利益分配：把部分收益撥捐社區或支持社企，讓旅客知道消費能令居民受益。"]]},{"tp":"4-10","cs":[],"ty":[],"q":"解釋{地}的經營者實踐公平貿易可為其業務帶來的{n}項好處。","a":[["社區支持／減少衝突／居民支持","考慮本地持份者的利益，可得到當地社區支持，減少經營衝突。"],["滿意度／感到滿意／滿意的客人／無內疚／忠誠","客人知道消費能惠及當地人而非破壞目的地，感到滿意並更支持企業。"],["聲譽／信譽／企業形象／口碑","公開承諾並實踐道德營商，建立良好信譽，吸引更多消費者再度光臨。"],["本地特色／脫穎而出／與眾不同","使用本地產品及物料，令產品具地道特色，在市場中脫穎而出。"],["高質素產品／旅遊資源／長遠經營","保護當地人與環境，維持高質素的旅遊產品，有利長遠經營。"],["穩定供應／貨源穩定／長期合作／長期關係／供應商關係","以公平價格與本地供應商建立長期合作關係，貨源更穩定。"],["員工士氣／留住員工／歸屬感","合理薪酬與工作環境能提升員工士氣，減少流失，服務質素更穩定。"]]},{"tp":"4-10","cs":["公平利益分配","旅客與本地居民的公平貿易","公平夥伴合作關係"],"ty":[],"q":"建議{n}項措施，讓旅客在{地}的消費更能惠及當地社群，以符合公平貿易的原則。","a":[["本地製作／本地手作／本地工藝／本地工匠／本地藝術家","售賣本地工匠及藝術家製作的產品，讓收益直接惠及本地生產者。"],["本地食材／本地農產品／本地漁農","餐廳採用本地食材，以公平價格向本地農民採購。"],["僱用本地／聘請居民／弱勢社群","聘請當地居民及弱勢社群，為他們創造就業機會。"],["社企／撥捐／捐款／回饋","把部分收益撥捐社區或與社企合作，讓旅客知道消費如何令居民受益。"],["明碼實價／價錢牌／標價","商品明碼實價，確保旅客與本地居民以公平的市場價格交易。"],["導賞／居民帶領／社區遊","邀請居民擔任導賞員，帶領旅客認識社區生活，增加居民收入。"],["小店／街坊店／地區小店","推介附近的地區小店及街坊店，把人流帶到社區，令小商戶受惠。"],["標籤／產地／認證","在產品上標示產地及公平貿易認證，方便旅客作出選擇。"]]},{"tp":"4-11","cs":["老一輩","嬰兒潮","X世代","Y世代","Z世代"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項能吸引不同世代旅客的設施或服務，並說明它們分別迎合哪一個世代的特點。","a":[["老一輩／長者優惠／大字體／座椅","老一輩：重視安全及需要別人照顧，可設長者優惠、大字體指示及休息座椅。"],["嬰兒潮／詳盡資料／深度導賞／退休","嬰兒潮一代：教育程度高，喜歡參觀博物館及歷史遺跡，並要求詳盡資料。"],["X世代／親子／家庭套票／兒童","X世代：喜歡與孩子旅行並追求物有所值，可提供親子活動及家庭套票。"],["Y世代／網上購票／Wi-Fi／購物","Y世代：擅長科技並喜歡購物，可提供網上購票、免費Wi-Fi及商店。"],["Z世代／打卡／社交媒體／網紅","Z世代：數碼原生，重視打卡價值，可設打卡位並以社交媒體宣傳。"]]},{"tp":"4-11","cs":["Z世代"],"ty":[],"q":"Z世代是數碼原生的一代。建議{n}項措施，令{地}更能吸引Z世代旅客，並加以解釋。","a":[["打卡位／拍照位／裝置藝術／打卡","Z世代重視「打卡價值」，設計適合拍照分享的打卡位可吸引他們。"],["社交媒體／網紅／IG／小紅書／短片","他們極度依賴社交媒體作旅遊決定，可邀請網紅推介及拍攝短片宣傳。"],["網上預訂／網上購票／手機程式／APP","他們重視線上預訂及即時資訊，可推出網上購票及手機程式。"],["Wi-Fi／充電／USB","他們非常重視免費Wi-Fi及USB充電位，方便隨時上網分享。"],["走塑／減塑／可持續／低碳","他們關注環保及可持續發展，推行走塑等措施能提升他們的好感。"],["獨特體驗／真實體驗／小眾／沉浸式","他們追求獨特、真實及具體驗性的活動，可推出小眾路線或沉浸式體驗。"],["學生票／學生優惠／性價比／青年","他們對價格敏感，偏好高性價比的產品，可提供學生及青年優惠。"],["素食／植物性／有機","他們重視健康及透明的食品資訊，餐飲可提供素食及有機選擇。"]]},{"tp":"4-11","cs":["老一輩","嬰兒潮"],"ty":[],"q":"{地}希望吸引更多老一輩及嬰兒潮一代的旅客。建議{n}項{地}可作出的改善，並以這兩個世代的特點加以解釋。","a":[["座椅／休息區／長凳／椅子","長者體力有限，增設座椅及休息區讓他們隨時休息。"],["字體／大字／清晰指示","老一輩視力較弱，指示牌及單張應使用較大的字體。"],["無障礙／斜道／升降機／扶手","設施應考慮年老顧客的體力限制，增設斜道、扶手及升降機。"],["長者優惠／長者票／敬老","老一輩在財政上較保守，可提供長者優惠等實惠方案。"],["詳盡／詳細／小冊子／資料單張","嬰兒潮一代不相信簡單的廣告，要求詳盡資料以了解產品。"],["人手售票／售票處／電話預訂／職員協助","老一輩很少使用互聯網，應保留人手售票及電話預訂。"],["保安／防滑／急救／安全措施","老一輩重視安全及保安，可加強保安、鋪設防滑地面及設急救站。"],["深度導賞／導賞團／歷史講座","嬰兒潮一代喜歡參觀博物館及歷史遺跡，可安排深度導賞團。"]]},{"tp":"4-11","cs":["X世代","Y世代"],"ty":[],"q":"建議{n}項措施，令{地}能同時吸引X世代及Y世代的旅客，並以他們的特點加以解釋。","a":[["親子／家庭套票／兒童活動／小朋友","X世代較喜歡與孩子旅行，可設親子活動及家庭套票。"],["物有所值／物超所值／折扣","X世代對定價過高很敏感，會尋找物有所值的產品。"],["網上購票／網上預訂／手機程式／APP","Y世代喜歡用互聯網搜尋及購買旅遊產品，可推出網上購票。"],["新穎／時尚／潮流／限定","Y世代追求新穎時尚的體驗並引領潮流，可推出限定活動。"],["購物／手信店／商店","Y世代旅行時喜歡尋找購物機會，可設商店出售特色手信。"],["Wi-Fi／無線上網／即時回應","Y世代需要即時回應，可提供免費Wi-Fi及即時查詢服務。"],["高品質／尊享／貴賓","Y世代喜歡高品質產品，願意支付額外金錢，可推出尊享服務。"],["獨特體驗／樂趣／主題活動","X世代想獲得樂趣並尋找獨特的旅行體驗，可舉辦主題活動。"]]},{"tp":"4-12","cs":["市面秩序混亂","公共交通受阻","資源被佔用","物價樓價上漲","生活受阻及小販攤檔滋擾"],"ty":[],"q":"根據你在{地}及附近的觀察，指出{n}項過度旅遊可能為當地居民帶來的負面影響，並加以說明。","a":[["秩序混亂／擠迫／擁擠／人潮","市面秩序混亂：大批旅客聚集，行人路擠迫，居民出入不便。"],["交通擠塞／塞車／公共交通／巴士／港鐵／排隊上車","公共交通受阻：旅遊巴及旅客令道路擠塞，居民難以乘搭公共交通。"],["佔用／爭用／爭奪","資源被佔用：旅客佔用公共設施，與居民爭用康樂及休憩地方。"],["物價／樓價／租金／加價","物價樓價上漲：商舖租金上升，物價隨之上漲，加重居民的生活負擔。"],["小販／滋擾／生活受阻／攤檔","生活受阻及小販攤檔滋擾：攤檔林立及旅客聚集，影響居民日常生活。"],["噪音／嘈吵／垃圾／亂拋","旅客喧嘩及亂拋垃圾，影響社區衞生及居民休息。"],["民生小店／街坊小店／藥房／藥妝店／金舖／取代","民生小店被針對旅客的商店取代，居民購買日用品不便。"]]},{"tp":"4-12","cs":[],"ty":[],"q":"建議{n}項{地}可採取的措施，以紓緩過度旅遊帶來的問題，並加以解釋。","a":[["分流／其他景點／小眾景點／隱世","推廣城中其他景點及隱世小店，把旅客分流至不同地區。"],["不同時段／不同時間／分時段／延長開放／錯峰／非繁忙","鼓勵旅客在不同時間到訪，並延長開放時間，分散人流。"],["淡季／旺季加價／差價／價格調節／調整票價","利用價格影響旺淡季的訪客人數，例如淡季提供優惠、旺季加價。"],["預約／限制人數／限額／限時","實行預約制及限制每日入場人數，並在熱點限時逗留。"],["實時／人流資訊／輪候時間／APP","利用手機程式提供輪候時間及擠擁情況，方便旅客選擇到訪時間。"],["上落客區／旅遊巴／行人專區","開設旅遊巴士上落客區及行人專區，改善交通秩序。"],["規管／牌照／發牌／檢討","引入旅遊業相關牌照並檢討團體客的遊覽安排，方便規管。"],["持份者／居民意見／諮詢","設立有持份者參與的旅遊管理小組，定期諮詢居民意見。"]]},{"tp":"4-12","cs":[],"ty":[],"q":"有人建議{地}限制旅客人數以應對過度旅遊。分析此做法可能帶來的{n}項問題。","a":[["經濟放緩／旅遊收益／經濟損失","旅客減少令旅遊收益下降，經濟可能放緩。"],["生計／失業／裁員／從業員收入","旅遊從業員及相關居民的收入及發展受影響，甚至失業。"],["商戶反對／業界反對／質疑","當局貿然減少旅客，會備受商戶及業界等持份者質疑。"],["零售／餐飲業／相關行業／連鎖效應","旅遊業接觸的行業廣闊，零售、餐飲及交通等相關行業亦受影響。"],["形象／不好客／口碑","旅客被拒入場或須預約，可能覺得不受歡迎，損害好客形象。"],["競爭力／其他目的地／流失客源","旅客轉往其他目的地，削弱競爭力。"],["名額／難以執行／執行困難","名額分配及監察執行有困難，或會引起旅客不滿。"]]},{"tp":"4-12","cs":[],"ty":[],"q":"以{地}為例，分析{n}個導致熱門景點出現過度旅遊的原因。","a":[["中產／收入增加／外遊需求","中產階級膨脹，可支配收入增加，外遊需求上升。"],["廉航／旅費低廉／機票便宜","低成本航空公司令旅費低廉，更多人能夠外遊。"],["潮流／風氣","旅遊成為風氣潮流，大量旅客湧往同一熱點。"],["郵輪旅遊／郵輪旅客／大型郵輪","郵輪旅遊發展，一次過把數千名旅客帶到同一目的地。"],["交通網絡／運輸網絡／高鐵／交通便利","運輸網絡發展，例如高鐵及跨境交通，令旅客更容易到達。"],["社交媒體／打卡／網紅／IG","大眾傳播媒介和社交媒體興起，網紅推介令旅客湧往打卡熱點。"],["全球化／經濟全球化","經濟全球化發展，人流及資金流動更頻繁。"]]},{"tp":"4-13","cs":["全球分銷系統（GDS）"],"ty":[],"q":"一位外地旅客計劃到{地}旅遊，並經旅行代理商安排行程。指出{n}項旅行代理商可透過全球分銷系統（GDS）為他查詢或預訂的旅遊產品。","a":[["機票／航班／機位","來回機票：查看航班資料及預留機位。"],["酒店／客房／住宿／訂房","酒店房間：查詢及預訂附近酒店的客房。"],["租車／汽車租賃","租車服務：預訂當地的汽車租賃服務。"],["旅行團／當地遊／一日遊","旅行團：預訂當地旅行團或一日遊。"],["火車票／巴士票／車票／高鐵","巴士及火車票：預訂往返目的地的交通車票。"],["保險／旅遊保險","旅遊保險：為旅程購買保險。"],["接送／機場接送／接機","機場接送服務：預訂抵達後的接送服務。"],["門票／入場券／表演門票","盛事及劇院門票：預訂景點、盛事或表演的門票。"]]},{"tp":"4-13","cs":["全球分銷系統（GDS）","旅客紀錄（PNR）"],"ty":[],"q":"以安排前往{地}的行程為例，解釋全球分銷系統（GDS）為旅行代理商帶來的{n}項好處。","a":[["一站式／集中訂位／同一平台","一站式訂位服務：在同一平台預訂機票、酒店及租車，簡化行程安排。"],["節省時間／資訊集中／省時","旅遊資訊集中地：節省向不同供應商索取資料的時間。"],["更改行程／改期／修改","便於更改行程：航班更改會即時更新，旅行代理商可立即為客人修改行程。"],["格價／比價／比較價格／比較票價／最低成本","可比較票價及存量，以最低成本購買最合適的旅遊產品。"],["即時確認／即時預訂／回應快","系統回應時間少於一秒，可即時預訂及確認。"],["旅客紀錄／PNR／客戶資料／旅遊偏好","安全儲存旅客資料及旅遊偏好，方便安排切合需要的產品。"],["全天候／24小時／任何時候","可在任何時候使用，方便處理不同時區的訂位。"]]},{"tp":"4-14","cs":["提供一站式搜尋","採用元搜索技術","價格便宜","溝通與討論平台"],"ty":[],"q":"越來越多旅客透過網上旅遊代理商（OTA）預訂前往{地}的旅遊產品，例如門票、交通及住宿。解釋{n}項網上旅遊代理商吸引旅客的原因。","a":[["一站式／食住行／同一平台","提供一站式搜尋：可同時購買門票、酒店及交通，令購買過程簡單得多。"],["元搜索／比較價格／格價／比價","採用元搜索技術：一次過比較多個網站的價格，節省搜尋時間。"],["便宜／折扣／較平／平價","價格便宜：只收取供應商很少佣金，價格具競爭力，常有折扣。"],["評價／評論／分享／討論區","溝通與討論平台：可閱讀其他用家的評價及分享，再作決定。"],["24小時／隨時／全天候","可24小時隨時預訂，不受旅行社辦公時間限制。"],["電子門票／即買即用／即時確認／手機入場","購買後即時確認並獲發電子門票，可直接以手機入場。"],["自由行／彈性／自行安排","旅客可自行配搭行程，以自由行方式旅遊，更具彈性。"]]},{"tp":"4-14","cs":[],"ty":[],"q":"分析網上旅遊代理商的興起對{地}的營運可能帶來的{n}項影響。","a":[["銷售渠道／銷售網絡／海外旅客／知名度","正面：擴大銷售網絡，接觸更多海外旅客，提高知名度。"],["佣金／手續費","負面：需向網上旅遊代理商支付佣金，增加成本。"],["競爭／價格透明","負面：旅客可輕易比較價格，加劇同業競爭。"],["難以加價／收費難以上調／減價","負面：旅客容易格價，令收費難以上調，甚至要減價吸客。"],["評價／評論／口碑","網上評價影響旅客的決定，須重視服務質素及回應評論。"],["自由行／散客／個人遊","自由行旅客大增，須加強指示牌及資訊以照顧散客。"],["旅行團減少／團體客減少／團體客","經旅行社安排的旅行團減少，須調整團體客的服務安排。"],["數據／預訂資料／預測人流","可從網上預訂掌握旅客數據，預測人流及安排人手。"]]},{"tp":"4-15","cs":["只提供有限服務","使用次級機場","使用非繁忙時間"],"ty":["overseas"],"q":"如旅客乘搭低成本航空公司的航班前往{地}，指出{n}項他們與乘搭傳統航空公司相比可能遇到的分別。","a":[["寄艙行李／行李／行李額","行李：票價只包括最基本座位，寄艙行李要另外付費。"],["飛機餐／機上餐飲／餐飲付費","機上餐飲：不設免費飛機餐，餐飲需另外購買。"],["選位／揀位／選擇座位／揀座位／座位收費／指定座位","座位：大部分只有標準座位，選擇座位需額外收費。"],["貴賓室／優先登機","機場服務：沒有專用貴賓室，優先登機要另外付款。"],["次級機場／偏遠機場／較遠閘口／遠閘口","機場位置：可能使用稍偏遠的次級機場或路程較遠的登機閘口。"],["機上娛樂／電視／影視","機上娛樂設施較傳統航班少，甚至沒有提供。"],["深夜／早機／紅眼／非繁忙","航班多使用非繁忙時間，例如清晨或深夜航班。"],["退款／改期／退票","取消機票通常不獲退款，改期亦需收費。"]]},{"tp":"4-15","cs":[],"ty":[],"q":"以{地}為例，分析低成本航空公司的發展可能對{地}旅遊業帶來的{n}項影響。","a":[["旅客人數增加／客量增加／更多旅客","票價低廉吸引更多旅客到訪，增加旅遊收入。"],["短途／週末／短線／逗留時間短","廉航以短途航線為主，帶來更多短途及週末旅客，但逗留時間較短。"],["預算有限／消費較低／年輕旅客／背包客","旅客預算有限，人均消費可能較低。"],["經濟型酒店／平價住宿／住宿需求","對經濟型酒店及精選服務酒店的住宿需求增加。"],["新客源／新市場／小城市／新航線","廉航開拓新航線，連接較小的城市，帶來新客源。"],["擠迫／過度旅遊／人潮","旅費低廉是過度旅遊的成因之一，熱門景點更擠迫。"],["外遊／出國／外流","本地居民亦更多乘廉航外遊，本地消費可能外流。"]]},{"tp":"4-16","cs":["協調各部門運作","提高服務水平"],"ty":["hotel"],"q":"以{地}為例，指出酒店資產管理系統（PMS）可協助{n}個不同部門處理的工作，並說明其如何提升服務水平。","a":[["前堂部／款接部／訂房／入住登記","前堂部：處理訂房、入住登記及分配客房，縮短顧客輪候時間。"],["管家部／客房狀況／房務員","管家部：即時更新客房狀況及分配房務員清潔，加快安排可售房間。"],["餐飲部／銷售點／餐廳訂座","餐飲部：透過電子銷售點處理訂座及點菜，並把餐費歸入房賬。"],["財務部／會計／營業報告","財務部：總結住客在酒店內各項設施的消費，並提供營業分析報告。"],["保安部／電子門鎖／門卡","保安部：連接電子門鎖系統，以唯一代碼分辨客人身分及樓層使用權。"],["工程部／能源管理／冷氣／維修","工程部：連接能源管理系統，客人可用手機調節房間溫度及照明。"],["市場推廣／顧客歷史／顧客喜好","營業及市場推廣部：分析顧客歷史記錄及喜好，提供個人化服務及推廣。"]]},{"tp":"4-16","cs":["協調各部門運作","提高服務水平","運作標準化","品牌建立","節省營運成本"],"ty":[],"q":"如{地}或附近的酒店使用酒店資產管理系統（PMS），解釋PMS對酒店營運的{n}項重要性。","a":[["協調／共用資料／重覆輸入／重複輸入／資料互通","協調各部門運作：各部門共用及更新同一套資料，避免重覆輸入。"],["顧客喜好／個人化／歷史記錄","提高服務水平：按顧客的歷史記錄及喜好，提供貼合要求的服務。"],["多語言／多貨幣／外幣","具備多語言及多貨幣計算功能，方便服務不同地區的旅客。"],["培訓／訓練","具備培訓模式，可在公司內聯網供員工培訓之用。"],["標準化／減少錯誤／統一流程","運作標準化：標準化工序可提高效率、減少錯誤，便於管理及監管。"],["品牌／品質指標／監控品質","品牌建立：協助管理人員訂立各類服務要求指標，監控品質。"],["減少人手／節省人手／人手成本／節省成本／營運成本","節省營運成本：提高效率及減少人手，節省營運開支。"]]},{"tp":"4-17","cs":["樓面點餐","廚房出菜","櫃檯結帳","現場座位管理"],"ty":["restaurant"],"q":"根據你在{地}的觀察，描述{n}項{地}運用銷售點系統（POS）的情況，並解釋其好處。","a":[["落單／點餐／點菜機／掃碼／QR／平板電腦","樓面點餐：侍應以點菜機輸入訂單、桌號及烹調要求，資料即時傳到廚房。"],["出菜／庫存／製餐資料","廚房出菜：廚房顯示屏顯示製餐資料，菜式食材與庫存紀錄連結更新。"],["結帳／結賬／收銀／付款／埋單","櫃檯結帳：顧客可在最短時間結賬，結賬後可立即安排新客入座。"],["輪候號碼／叫號／取籌／座位","現場座位管理：候餐區顯示輪候號碼，系統顯示使用中或空置的餐桌。"],["報告／報表／銷售分析／銷售數據","系統可製作銷售及管理報告，協助管理人員分析各菜式的銷售情況。"]]},{"tp":"4-17","cs":["樓面點餐","廚房出菜","櫃檯結帳","現場座位管理"],"ty":[],"q":"如{地}內或附近的餐廳引入銷售點系統（POS），解釋此系統可為餐廳營運帶來的{n}項好處。","a":[["減少錯誤／出錯／字跡","訂單直接傳送，避免手寫訂單字跡模糊或聽錯而出錯。"],["即時傳送／節省時間／傳到廚房","訂單即時傳到廚房及收銀處，加快出菜及服務速度。"],["翻枱／新客入座／快速結賬","結賬快捷，可立即安排新客入座，提高翻枱率。"],["減少人手／節省人手／人手成本","使用手提式點菜機可減少侍應數目，節省人手成本。"],["報告／報表／銷售分析／銷售數據","管理報告列出每項菜式及飲品的銷售，協助管理層作出決策。"],["庫存／存貨／食材","菜式食材與庫存紀錄連結，方便控制存貨及採購。"],["輪候／等位／叫號","座位管理顯示空置餐桌及輪候號碼，減少等位時的混亂。"]]},{"tp":"x:環境趨勢","cs":["減少紅肉","採購本地食品","可持續採購","減少廚餘","減少包裝廢棄物"],"ty":[],"q":"根據你在{地}內或附近餐廳的觀察，指出{n}項餐廳為保護環境而推行的措施，並說明其對環境的好處。","a":[["素食／植物肉／蔬食／白肉","減少紅肉：提供素食或白肉選擇，減少牲畜生產所排放的溫室氣體。"],["本地食材／本地食品／本地農場／本地出產／本地蔬菜","採購本地食品：使用本地食材，縮短運輸距離，減少碳排放。"],["可持續採購／可持續海鮮／海鮮選擇指引／環保海鮮／過度捕撈／認證","可持續採購：參考海鮮選擇指引，避免購買過度捕撈的海產。"],["小份量／小份／細份／半份／過量點菜","減少廚餘：提供小份量菜式，並提醒顧客避免過量點菜。"],["打包／外賣盒／外賣容器／環保餐盒／帶走剩食","減少廚餘：提供環保外賣盒，讓顧客把吃剩的食物打包帶走。"],["即棄／膠飲管／走塑／可重用","減少包裝廢棄物：以可重用餐具取代即棄餐具及膠飲管。"],["回收箱／分類回收／膠樽回收／鋁罐／紙張回收","減少包裝廢棄物：把紙張、膠樽及鋁罐分類回收，減少送往堆填區的廢物。"],["廚餘回收／堆肥／有機肥料","把廚餘分開收集並製成有機肥料，減少送往堆填區的廚餘。"]]},{"tp":"x:環境趨勢","cs":["環保酒店"],"ty":["hotel"],"q":"以{地}為例，描述{n}項環保酒店會推行的措施，並解釋這些措施對酒店的好處。","a":[["重用毛巾／毛巾／床單／布草","邀請住客重用毛巾及床單，減少洗衣的用水及能源。"],["節能／LED／感應燈／房卡取電","使用LED燈及房卡取電，節約能源並減低電費。"],["節水／慳水／低流量","安裝低流量花灑及水龍頭，節約用水。"],["補充裝／皂液機／大支裝","以補充裝皂液取代即棄小瓶洗漱用品，減少固體廢棄物。"],["無紙化／電子登記／電子帳單","推行無紙化入住登記及電子帳單，減少紙張耗用。"],["分類回收／回收箱","在客房及後勤地方設置回收箱，減少送往堆填區的廢物。"],["認證／LEED／綠色酒店","取得環保酒店認證，符合注重環保意識客人的期望，提升市場形象。"],["太陽能／電動車／再生能源","使用太陽能等再生能源及以電動車作酒店轎車，減少碳排放。"]]},{"tp":"x:環境趨勢","cs":["採購本地食品"],"ty":[],"q":"如{地}內或附近的餐廳選用本地出產的食材，解釋此做法可為自然環境帶來的{n}項好處。","a":[["碳排放／食物里程／運輸距離","縮短食物里程，減少運輸、分發及儲存過程中釋放的二氧化碳。"],["農地景觀／保存農地／耕地","農民能從銷售中獲得收入，便會保存農地景觀，不會出售作發展用途。"],["土壤／水資源","農民會盡力管理農場，保護肥沃的土壤及水資源。"],["野生動物／棲息地／雀鳥","受妥善管理的農場能為鳥類及其他野生動物提供理想的棲息地。"],["外來物種／入侵物種","減少依賴進口食材，降低外來入侵物種經物流進入本地的機會。"]]},{"tp":"x:環境趨勢","cs":["減少廚餘"],"ty":[],"q":"建議{n}項措施，協助{地}內或附近的餐廳減少廚餘。","a":[["適量採購／按需要採購／採購適量","採購：按需要採購適量原材料，避免貯存過多食材而變壞。"],["先入先出／存貨流轉","收貨及貯存：執行先入先出原則，先使用較舊的食材。"],["生產計劃／預計人數／按需要烹調","烹調：制定每天的食品生產計劃，避免過度生產。"],["其他菜式／新菜式／邊角料／員工餐","善用剩餘的食物原材料製作其他菜式或員工餐，減少浪費。"],["捐贈／惜食堂／食物銀行","把未用完的食材捐贈予惜食堂等非牟利機構，幫助有需要人士。"],["過量點菜／提醒顧客","提醒顧客避免過量點菜。"],["小份量／半份／細份","提供小份量菜式，或在自助餐減少菜式選擇。"],["打包／外賣盒／外賣容器／環保餐盒／帶走剩食","提供環保外賣盒，讓顧客把吃剩的食物打包帶走。"]]},{"tp":"x:負責任旅遊","cs":["負責任旅遊","良心旅客"],"ty":[],"q":"作為一名負責任的旅客，指出{n}項你在{地}考察時應有的行為，並解釋原因。","a":[["垃圾／不留痕／帶走垃圾","把垃圾帶走或放入回收箱，減少對環境造成的負面影響。"],["餵飼／騷擾動物／採摘／動植物","不餵飼或騷擾動物、不採摘植物，協助保育棲息地及物種。"],["習俗／衣著／禮儀／宗教","尊重當地習俗及宗教禮儀，衣著得體，保存當地文化。"],["閃光燈／徵求同意／私隱","拍照前徵求同意及不使用閃光燈，尊重居民私隱，並避免強光損害文物。"],["本地商戶／本地產品／小店","光顧本地商戶及購買本地產品，為當地社區帶來經濟效益。"],["觸摸／攀爬／參觀守則／遵守規則","遵守參觀守則，不觸摸或攀爬文物古蹟，保存文化資源。"],["安靜／噪音／聲浪","保持安靜，避免噪音滋擾居民及其他旅客。"],["公共交通／步行／單車／碳排放","乘搭公共交通或步行前往，減少碳排放。"]]},{"tp":"x:負責任旅遊","cs":["生態旅遊","地質旅遊"],"ty":["nature"],"q":"根據你在{地}的觀察，指出{n}項{地}推動生態旅遊或地質旅遊的措施，並加以解釋。","a":[["導賞／解說牌／講解／展板","設導賞團及解說牌，教育旅客欣賞及尊重大自然。"],["限制人數／預約／限額","限制每日人數或實行預約，減少對脆弱環境的壓力。"],["指定路線／步道／木棧道／遠足徑","設指定路線及步道，避免旅客踐踏植物。"],["村民／原居民／居民參與／本地導遊","由當地村民帶領活動或售賣產品，改善當地居民的福祉。"],["保育費／保育基金／入場費","收取入場費或保育費，投放於保育工作，維持景點的地理特色。"],["不留痕／帶走垃圾／垃圾","推廣「自己垃圾自己帶走」，保持環境清潔。"],["餵飼／採摘／捕捉／騷擾動物","規定不可餵飼、採摘或捕捉動植物，保護生物多樣性。"],["岩石／化石／地貌","保護岩石、化石及地貌，禁止敲鑿或帶走，維持地理特色。"]]},{"tp":"x:負責任旅遊","cs":["良心旅客","負責任旅遊"],"ty":[],"q":"良心旅客作旅遊選擇時，會先考慮對社會及環境的影響。建議{n}項{地}可作出的安排，以吸引良心旅客。","a":[["認證／環保標籤／綠色","取得環保認證並公開環保政策，讓旅客知道其承擔。"],["走塑／即棄／飲水機／膠樽","推行走塑並設飲水機，減少即棄用品。"],["本地產品／本地員工／本地社群","售賣本地產品及僱用本地員工，讓當地社群受惠。"],["動物福利／動物表演","重視動物福利，不提供動物表演等可能傷害動物的活動。"],["公平貿易／公平價格","出售公平貿易產品，確保生產者得到合理回報。"],["碳補償／低碳／碳排放","推出低碳路線或碳補償計劃，減少旅程的碳足印。"],["文化保育／尊重當地／文物保育","介紹及保育當地文化，鼓勵旅客尊重當地傳統。"],["捐款／撥捐／慈善","把部分收益撥捐社區或保育項目。"]]},{"tp":"x:負責任旅遊","cs":["生態旅遊","地質旅遊","負責任旅遊"],"ty":[],"q":"指出{n}種重視保育環境及當地社區的旅遊類型，並以{地}或其他例子加以說明。","a":[["生態旅遊／生態遊","生態旅遊：尊重大自然，保育環境及改善當地居民的福祉，例如濕地觀鳥。"],["地質旅遊／地質遊","地質旅遊：維持或提升某地的地理特色，例如欣賞地質公園的岩石地貌。"],["負責任旅遊／負責任的旅遊／綠色旅遊","負責任旅遊：以當地社區利益為前提，減少對社會及環境的負面影響。"],["可持續旅遊／持續發展旅遊","可持續發展旅遊：充分考慮目前和未來的經濟、社會和環境影響。"],["道德旅遊／道德","道德旅遊：以社會不公、人權、動物福利等道德議題作主要推動力。"]]},{"tp":"x:社會趨勢","cs":["多代同遊"],"ty":[],"q":"越來越多祖父母與孫兒一同旅遊。建議{n}項{地}可推出的設施、服務或優惠，以吸引多代同遊的家庭。","a":[["套票／祖孫優惠／三代同行／一家三代","推出祖孫同遊套票及折扣，吸引一家三代到訪。"],["老少咸宜／不同年齡／長幼","設計適合不同年齡的活動，讓祖父母與孫兒都能參與。"],["多款菜式／多款選擇／不同口味／自助餐","餐廳提供多款菜式而非標準套餐，讓不同世代各取所好。"],["無障礙／嬰兒車／斜道／升降機","設無障礙通道及升降機，方便長者及嬰兒車通行。"],["座椅／休息區","增設座椅及休息區，讓長者及小朋友隨時休息。"],["工作坊／一同參與／親子互動","舉辦祖孫一同參與的工作坊，促進兩代交流。"],["保健／水療／減壓／刺激","結合長者喜愛的保健元素及年輕人喜愛的刺激元素。"]]},{"tp":"x:社會趨勢","cs":["獨生子女家庭"],"ty":[],"q":"獨生子女家庭的父母會把更多重心放在子女身上。建議{n}項{地}可提供的設施、活動或優惠，以吸引這類家庭。","a":[["遊樂場／遊戲區／兒童泳池／兒童遊樂","設兒童遊樂設施，讓孩子玩得開心，父母亦樂意到訪。"],["親子／烹飪班／工作坊／燒烤","舉辦親子烹飪課或工作坊，促進親子交流。"],["兒童免費／小童免費／兒童優惠／小童優惠／兒童票／小童票","為同行兒童提供兒童票優惠或免費入場。"],["兒童餐／早餐券／免費膳食","為同行兒童送贈早餐券、兒童餐或免費膳食。"],["工作紙／尋寶／兒童導賞","設兒童導賞或尋寶工作紙，寓學習於娛樂。"],["育嬰室／哺乳室／嬰兒車／尿片","設育嬰室及嬰兒車租借，方便有幼兒的家庭。"],["同住一房／家庭房／折扣","酒店為父母與子女同住一房提供折扣及特別優惠。"]]},{"tp":"x:社會趨勢","cs":["樂活社群（LOHAS）"],"ty":[],"q":"樂活社群（LOHAS）重視健康及可持續的生活方式。建議{n}項{地}可推出的產品或服務，以吸引樂活社群。","a":[["有機／素食／蔬食","提供有機及素食餐飲，切合他們對健康的追求。"],["瑜伽／冥想／靜觀","舉辦瑜伽或靜觀活動，促進身心健康。"],["生態導賞／大自然／戶外","推出生態導賞或戶外活動，切合他們追求可持續生態旅遊。"],["走塑／減塑／低碳／環保措施","推行走塑及低碳措施，回應他們的環保意識。"],["公平貿易／社會正義／道德","出售公平貿易產品，符合他們的道德及社會正義標準。"],["本地文化／尊重當地／深度體驗","提供深度文化體驗，切合他們尊重當地文化的取態。"],["單車／步行路線／緩跑","設計單車或步行路線，鼓勵旅客多做運動。"]]},{"tp":"x:社會趨勢","cs":["多代同遊","獨生子女家庭","樂活社群（LOHAS）"],"ty":[],"q":"指出{n}個旅遊業與款待業的社會文化趨勢，並解釋{地}可如何回應這些趨勢。","a":[["人口老化／老化人口／長者","老化人口：長者旅客增加，{地}可增設座椅及無障礙設施。"],["多代同遊／三代／祖孫","多代同遊：推出祖孫套票及老少咸宜的活動。"],["單親／單親家庭","單親家庭遊：按一位成人及一位小童收費，提供合理價格。"],["獨生子女／一孩","獨生子女家庭增多：提供兒童設施及親子活動。"],["良好教育／教育程度／知識水平／搜集資料","受過良好教育的顧客增多：提供詳盡資訊方便他們比較。"],["消費力分化／品味分化／豪華／經濟型","遊客品味和消費力分化：同時提供高級及經濟實惠的選擇。"],["移民／探親","移民和探親遊：推出適合回鄉探親人士與家人同遊的活動。"],["樂活／LOHAS","樂活社群：提供有機餐飲及生態導賞。"]]},{"tp":"x:經濟趨勢","cs":["無障礙旅遊"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項{地}為推動無障礙旅遊而設的設施或服務，並說明它們如何照顧有特殊需要的旅客。","a":[["斜道／坡道","設斜道，方便輪椅使用者及推嬰兒車人士出入。"],["升降機／電梯／升降台","設升降機及升降台，方便行動不便人士到達不同樓層。"],["暢通易達／傷健廁所／殘廁／洗手間","設暢通易達洗手間，配備扶手及緊急求助鐘。"],["點字／觸感／導盲／凸字","設點字、觸感地圖及導盲徑，協助視障人士。"],["借輪椅／輪椅借用／借用輪椅","免費借用輪椅予有需要的旅客。"],["手語／字幕／感應圈／助聽","提供手語導賞、字幕及助聽感應圈，照顧聽障人士。"],["優先通道／專人協助／優先入場","設優先通道及專人協助，減少他們輪候的時間。"],["口述影像／語音導賞","提供口述影像或語音導賞，讓視障人士了解展品及景物。"]]},{"tp":"x:經濟趨勢","cs":["無障礙旅遊"],"ty":[],"q":"解釋{地}推動無障礙旅遊可帶來的{n}項好處。","a":[["擴大客源／新客源／銀髮市場／長者市場","人口老化，長者及殘疾人士的市場龐大，可擴大客源。"],["同行／親友／一家人／多代同遊","長者或殘疾人士能夠到訪，同行親友亦會一同前來，增加旅客人數。"],["共融／平等／不歧視／包容／旅遊體驗目標","體現共融，達致「旅遊體驗」目標，無歧視地讓所有人享受旅遊。"],["形象／社會責任／聲譽","展示企業社會責任，提升形象及聲譽。"],["意外／跌倒／安全","斜道及扶手等設施能減少意外，提升所有旅客的安全。"],["嬰兒車／孕婦／行李","通用設計亦方便推嬰兒車人士、孕婦及攜帶行李的旅客。"],["逗留時間／延長逗留／消費增加","旅客參觀時更舒適，逗留時間更長，消費亦會增加。"]]},{"tp":"x:經濟趨勢","cs":["養生度假"],"ty":["hotel","nature","overseas"],"q":"養生度假是近年的旅遊趨勢。建議{n}項{地}可推出的養生度假產品或服務，並加以解釋。","a":[["水療／按摩／SPA","提供水療及按摩服務，讓旅客放鬆身心。"],["瑜伽／瑜珈","舉辦瑜伽課程，促進身心健康。"],["冥想／靜觀／靜修","安排冥想或靜修活動，紓緩壓力。"],["健康餐／有機／藥膳／素食","提供有機、低油鹽或藥膳等健康餐單。"],["溫泉／浸浴","提供溫泉或浸浴設施，舒緩疲勞。"],["遠足／健身／太極／晨運","安排遠足、太極或健身活動，強身健體。"],["數碼排毒／遠離手機／森林浴","推出數碼排毒或森林浴活動，讓旅客遠離繁囂。"]]},{"tp":"x:經濟趨勢","cs":["無障礙旅遊"],"ty":[],"q":"分析{地}在推動無障礙旅遊時可能遇到的{n}項困難。","a":[["古蹟／歷史建築／保育／結構","歷史建築須保育原貌，難以加建斜道或升降機。"],["成本／費用／資金","加建設施及改裝需要大量資金。"],["空間不足／地方有限／空間","場地空間有限，難以擴闊通道或加設設施。"],["地勢／斜坡／梯級／天然地形","地勢崎嶇或梯級多，輪椅難以通行。"],["人手／培訓／手語","須培訓員工協助有需要人士及掌握手語等技巧，增加人手需求。"],["使用率低／需求少","部分設施使用率低，難以收回投資。"],["資訊不足／不知道／宣傳不足","有需要的旅客未必知道有關設施，資訊不足。"]]},{"tp":"x:科技趨勢","cs":["自助服務科技"],"ty":[],"q":"根據你在{地}的觀察，指出{n}項自助服務科技的應用，並說明其對旅客及{地}的好處。","a":[["售票機／購票機／自助售票","自助售票機讓旅客毋須排隊購票，並可減少售票人手。"],["點餐機／自助點餐","餐廳設自助點餐機，減少落單錯誤及人手。"],["電子門票／掃碼入場／入閘機","旅客以手機電子門票掃碼入場，加快入場速度。"],["儲物櫃／寄存櫃","自助儲物櫃讓旅客寄存行李，參觀更輕鬆。"],["資訊站／觸控屏／觸控螢幕／查詢機","觸控式資訊站提供地圖及路線資訊，毋須依賴職員。"],["手機程式／應用程式／APP","手機程式提供導覽、預約及最新資訊。"],["自助入住／登記入住機／自助退房","酒店的自助入住終端機讓客人毋須款接員協助便可辦理入住。"],["增值機／自助付款／自助結帳","自助付款及增值機加快付款流程。"]]},{"tp":"x:科技趨勢","cs":["自助服務科技"],"ty":[],"q":"分析{地}引入自助服務科技後，部分旅客可能感到不滿或憂慮的{n}個原因。","a":[["科技焦慮／不懂使用／不熟悉","科技焦慮症：長者不熟悉新科技，使用時感到不安。"],["社交焦慮／尷尬／被注視","社交焦慮症：不懂操作而身後有人排隊注視，感到尷尬。"],["私隱／個人資料／資料外洩","需輸入個人資料，擔心私隱外洩。"],["人情味／面對面／冷冰冰","缺乏面對面交流及人情味，個人化服務不足。"],["故障／當機／死機／網絡","系統故障或網絡不穩時無法使用，反而更費時。"],["複雜要求／特別要求／無法處理／未能處理／複雜查詢","機器只能處理常規程序，無法處理複雜要求或特別要求。"],["服務降級／期望落差／高消費","高消費的客人期望有人服侍，自助形式令他們覺得服務降級。"],["語言／外語／翻譯","介面的語言選擇不足，外地旅客難以使用。"]]},{"tp":"x:科技趨勢","cs":["電子餐牌"],"ty":[],"q":"如{地}內或附近的餐廳讓顧客以手機掃描二維碼，使用電子餐牌點餐，解釋{n}項電子餐牌對餐廳營運的好處。","a":[["圖片／相片／菜式資訊","可展示菜式圖片及詳細資訊，吸引顧客點更多菜式，增加盈利。"],["即時更新／售罄／印刷成本／重印","售罄或價格變動可即時更新，省卻重新印製餐牌的成本。"],["減少人手／工作量／人手成本","減少收發餐牌及落單的工作量，員工可專注送餐及清潔。"],["落單錯誤／出錯／誤會","顧客自行落單，減少溝通誤會及出錯，避免食材浪費。"],["會員／積分／顧客資料","結合會員系統收集顧客資料，以積分優惠提高顧客忠誠度。"],["多語言／多種語言／翻譯／外語","可切換多種語言，方便外地旅客。"],["減少接觸／衞生／衛生／無接觸","減少傳遞實體餐牌，更衞生。"]]},{"tp":"x:科技趨勢","cs":["社交媒體"],"ty":[],"q":"建議{n}項{地}可利用社交媒體吸引旅客的方法，並加以解釋。","a":[["網紅／KOL／博主","邀請網紅到訪並分享體驗，借助其影響力吸引追隨者。"],["打卡位／拍照位／打卡點","設計打卡位，鼓勵旅客拍照上載，達到免費宣傳的效果。"],["打卡送／分享送／打卡優惠／分享優惠／標籤","旅客上載相片並加上指定標籤可獲優惠，擴大宣傳。"],["評論／評價／留言","積極回應網上評論及評價，建立良好形象。"],["短片／直播／Reels","拍攝短片或直播活動，生動地介紹景點。"],["抽獎／網上優惠／限時優惠","舉辦網上抽獎或限時優惠，吸引旅客關注及到訪。"],["官方帳號／專頁／IG／小紅書","開設官方帳號及專頁，定期發放最新活動資訊。"]]},{"tp":"x:全球化","cs":["生產轉移"],"ty":[],"q":"觀察{地}或附近商店售賣的紀念品及其產地。分析全球化下「生產轉移」對當地帶來的{n}項影響。","a":[["資金流失／收益外流／流失","紀念品在外地生產，旅遊收益流向外地，造成資金流失。"],["工匠／生計／本地生產商／失業","本地工匠及生產商難以與低成本產品競爭，生計受影響。"],["地方特色／不地道／真實性","外地製造的紀念品失去地方特色及真實性。"   return p ? g.dest + "內的" + p : g.dest;
}
function qgTopic(k){
  if (/^\d-\d+$/.test(k)) { const t = TOPIC.get(k); return t ? {t: t.t, c: t.c} : null; }
  return (QBANK.tt || {})[k] || null;
}
const qgNorm = s => String(s || "").normalize("NFKC").toLowerCase().replace(/[\s　，。、；：！？「」『』（）()【】\[\]{}<>《》〈〉,.;:!?"'`~\-—_…·‧・／\/|｜]/g, "");
// 由題庫及課文配對字典，砌出候選題目（tier 細＝優先）
function qgPool(g, info){
  const cat = (QBANK.cats || []).find(c => c.n === g.cat); if (!cat) return [];
  const tps = cat.tp.filter(k => !g.sel.size || g.sel.has(k)), out = [];
  (QBANK.items || []).forEach((it, i) => {
    if (!tps.includes(it.tp)) return;
    if (it.ty && it.ty.length && !it.ty.some(t => info.ty.has(t))) return;
    if (it.dyn && !info.geo) return;
    // 各洲課題入面專為外地寫嘅題目（景點、吸引原因等），只出喺該國所屬嘅洲
    if (/^3-[5-9]$/.test(it.tp) && (it.dyn || (it.ty || []).includes("overseas")) && (!info.geo || (qgTopic(it.tp) || {}).t !== info.geo.cont)) return;
    // 優先：配合特定部份類型 → 配合目的地類型 → 任何地方都適用
    const ty = it.ty || [], tier = info.sub.size ? (ty.some(t => info.sub.has(t)) ? 0 : ty.length ? 1 : 2) : (ty.length ? 0 : 1);
    out.push({src: "i" + i, tier, it});
  });
  // 後備：用課題概念清單同課文配對字典砌通用題目
  // 概念係景點／國家名，或字典說法與 DSE 評卷不同（三重效應）的課題：唔用通用題目
  const skipList = new Set(["1-18", "1-23", "3-1", "3-5", "3-6", "3-7", "3-8", "3-9"]);
  tps.forEach(k => {
    const T = qgTopic(k); if (!T || skipList.has(k)) return;   // 概念係景點／國家名嘅課題，唔用通用題目
    const byC = new Map();   // 同一概念有幾條字典紀錄：合併做一個得分點
    MRULES.filter(r => r.t === k).forEach(r => {
      const x = byC.get(r.c) || {keys: [r.c], s: r.s}; (RULES.r[r.i].k || []).forEach(w => { if (x.keys.length < 8 && !x.keys.includes(w)) x.keys.push(w); }); byC.set(r.c, x);
    });
    if (byC.size >= 2) out.push({src: "o" + k, tier: 5, it: {tp: k, cs: [], ty: [], q: "根據你在{地}的觀察，舉出{n}個能反映「" + T.t + "」的例子，並指出所涉及的概念。",
      a: [...byC.values()].map(x => [x.keys.join("／"), x.s])}});
    if (T.c.length >= 2) out.push({src: "l" + k, tier: 6, it: {tp: k, cs: [], ty: [], q: "以{地}為例，指出{n}項與「" + T.t + "」有關的概念，並各舉一個例子加以說明。",
      a: T.c.map(c => { const r = MRULES.find(x => x.t === k && x.c === c); return [c, r ? r.s : ""]; })}});
  });
  return out;
}
function qgMake(e, g, info){
  const it = e.it, n = g.n, T = qgTopic(it.tp), place = qgPlace(g);
  const text = it.q.replace(/\{地\}/g, place).replace(/\{n\}/g, NUMW[n]);
  let pts = it.a || [];
  if (it.dyn === "sights" && info.geo) pts = (info.geo.sights || []).filter(([k]) => !qgNorm(place).includes(qgNorm(String(k).split(/[／\/|｜]/)[0])));   // 目的地本身唔計
  if (it.dyn === "facts" && info.geo) {
    const nm = info.geo.name.replace(/（.*）/, "");
    pts = [[info.geo.cont, nm + "位於" + info.geo.cont + "。"]];
    if (info.geo.climate) pts.push([info.geo.ck || info.geo.climate.replace(/（.*）|氣候/g, ""), info.geo.cd || nm + "主要屬" + info.geo.climate + "。"]);
  }
  const qn = qgNorm(text);
  pts = pts.map(([k, s]) => [String(k || "").split(/[／\/|｜]/).map(x => x.trim()).filter(x => x && !qn.includes(qgNorm(x))), s || ""]).filter(([ks]) => ks.length);   // 題目已出現嘅字眼唔可以做關鍵字
  if (pts.length < n) return null;
  return {text, need: n, tp: it.tp, title: T ? T.t : "", src: e.src,
    lines: pts.map(([ks, s]) => ks.join("／") + (s ? " —— " + String(s).replace(/\{地\}/g, place) : ""))};
}
function qgShuffle(list, seed){
  let x = seed || 1;
  const rnd = () => { x = (x * 1103515245 + 12345) % 2147483648; return x / 2147483648; };
  return list.map(v => [v, rnd()]).sort((a, b) => a[0].tier - b[0].tier || a[1] - b[1]).map(v => v[0]);
}
// 出下一條：照次序揀第一條未出過、答案數量夠嘅題目；全部出過就由頭再嚟
function qgNext(g){
  const info = destInfo(g.dest, g.part);
  if (!g.order) { g.order = qgShuffle(qgPool(g, info), Date.now() % 2147483647); g.pos = 0; }
  for (let round = 0; round < 2; round++) {
    while (g.pos < g.order.length) {
      const c = qgMake(g.order[g.pos++], g, info);
      if (c && !g.cands.some(x => x.text === c.text)) return c;
    }
    if (!g.cands.length || round) break;
    g.pos = 0; g.cands = g.cands.slice(); g.wrapped = true;
  }
  return null;
}

/* ── 同步：本機先存，有網絡就逐項上載 ── */
let opSeq = 0, flushing = null, syncing = null;
async function enqueue(op, ref, delay = 800){
  const ops = await getAll("outbox");
  if (!ops.some(o => o.op === op && o.ref === ref && o.id !== S.sync.inflight)) {
    await put("outbox", {id: Date.now() * 1000 + (opSeq++ % 1000), op, ref, tries: 0});
    S.sync.pending = ops.length + 1; paintSync();
  }
  clearTimeout(S.sync.timer); S.sync.timer = setTimeout(() => { flush(); }, delay);
}
function flush(){ if (!flushing) flushing = doFlush().finally(() => { flushing = null; }); return flushing; }
async function doFlush(){
  if (!isStudent() || S.authLost) return;
  S.sync.busy = true; paintSync();
  try {
    for (;;) {
      if (!isStudent() || S.authLost) break;
      const ops = (await getAll("outbox")).sort((a, b) => a.id - b.id);
      S.sync.pending = ops.length;
      if (!ops.length) { S.sync.error = null; S.sync.offline = false; S.sync.last = Date.now(); break; }
      paintSync();
      const op = ops[0];
      let keep = false;
      S.sync.inflight = op.id;
      try { await runOp(op); S.sync.offline = false; }
      catch (e) {
        if (e.net || e.code === "busy" || e.code === "auth") { S.sync.offline = !!e.net; S.sync.error = e.net ? null : e.message; keep = true; }
        else {
          // 其他錯誤先再試幾次；仍然失敗就跳過，免得一項卡住後面全部
          op.tries = (op.tries || 0) + 1;
          logErr("sync", op.op + " 第" + op.tries + "次失敗：" + (e.code || e.name || "") + " " + e.message);
          if (op.tries < (e.code === "error" ? 5 : e.code ? 1 : 3)) { await put("outbox", op); S.sync.error = e.message; keep = true; }
          else {
            S.sync.note = e.message;
            const store = op.op === "trip" ? "trips" : op.op === "point" ? "points" : null;
            if (store) { const x = await getOne(store, op.ref); if (x) { x.rejected = true; await put(store, x); } }
          }
        }
      } finally { S.sync.inflight = null; }
      if (keep) break;
      await del("outbox", op.id);
    }
  } finally {
    S.sync.busy = false;
    S.sync.pending = (await getAll("outbox")).length;
    paintSync();
    sendLogs();
  }
}
async function markSynced(store, id){ const x = await getOne(store, id); if (x && !x.synced) { x.synced = true; delete x.rejected; await put(store, x); } }
async function runOp(op){
  if (op.op === "trip") { const t = await getOne("trips", op.ref); if (t) { await api("saveTrip", {trip: t}); await markSynced("trips", op.ref); } }
  else if (op.op === "tripdel") await api("deleteTrip", {id: op.ref});
  else if (op.op === "point") { const p = await getOne("points", op.ref); if (p) { await api("savePoint", {point: p}); await markSynced("points", op.ref); } }
  else if (op.op === "pointdel") await api("deletePoint", {id: op.ref});
  else if (op.op === "photo") {
    const ph = await getOne("photos", op.ref);
    if (ph && !ph.remote && ph.full) {
      const full = bufToB64(await asBuf(ph.full)), thumb = ph.thumb ? bufToB64(await asBuf(ph.thumb)) : "";
      await api("uploadPhoto", {id: ph.id, full, thumb, w: ph.w, h: ph.h});
      ph.remote = true; await put("photos", ph);
    }
  }
  else if (op.op === "answers") {
    const r = await getOne("responses", op.ref);
    if (r && r.status !== "submitted") await api("saveAnswers", {rid: r.id, answers: r.answers.map(a => a.text || ""), qids: r.answers.map(a => a.qid)});
  }
}
async function pull(){
  const d = await api("pull");
  if (!isStudent()) return;
  const pend = new Set((await getAll("outbox")).map(o => o.ref));
  Object.assign(S.session, {name: d.me.name, cls: d.me.cls, no: d.me.no, email: d.me.email || S.session.email || ""}); await saveSession();
  const sTrips = new Set(d.trips.map(t => t.id)), sPoints = new Set(d.points.map(p => p.id)), sResp = new Set(d.responses.map(r => r.id));
  // 只刪除「曾經上載、而家伺服器冇」嘅紀錄（即係喺其他手機刪咗）；未上載過嘅一定保留
  for (const t of await getAll("trips")) if (!sTrips.has(t.id) && !pend.has(t.id) && t.synced) await del("trips", t.id);
  for (const t of d.trips) if (!pend.has(t.id)) await put("trips", Object.assign(t, {synced: true}));
  for (const p of await getAll("points")) if (!sPoints.has(p.id) && !pend.has(p.id) && p.synced) await del("points", p.id);
  for (const p of d.points) if (!pend.has(p.id)) await put("points", Object.assign(p, {synced: true}));
  const local = new Map((await getAll("photos")).map(p => [p.id, p]));
  for (const m of d.photos) {
    const p = local.get(m.id);
    if (!p) await put("photos", {id: m.id, w: m.w, h: m.h, remote: true, thumb: null, full: null});
    else if (!p.remote) { p.remote = true; await put("photos", p); }
  }
  for (const r of await getAll("responses")) if (!sResp.has(r.id) && !pend.has(r.id)) await del("responses", r.id);
  for (const r of d.responses) {
    if (pend.has(r.id) && r.status !== "submitted") { const loc = await getOne("responses", r.id); if (loc) r.answers = loc.answers; }
    await put("responses", r);
  }
  if (d.scores) await put("meta", {id: "scores", v: d.scores});
  if (d.classes) await put("meta", {id: "classes", v: d.classes});
  await gcPhotos();
  await loadLocal();
  await reconcile();
}
// 補回漏咗排隊嘅紀錄（例如撳完儲存即刻閃退）
async function reconcile(){
  const has = new Set((await getAll("outbox")).map(o => o.op + ":" + o.ref));
  const photos = new Map((await getAll("photos")).map(p => [p.id, p]));
  const needPhoto = id => { const p = photos.get(id); return p && !p.remote && p.full && !has.has("photo:" + id); };
  let n = 0;
  for (const t of await getAll("trips")) {
    if (!t.synced && !t.rejected && !has.has("trip:" + t.id)) { await enqueue("trip", t.id); n++; }
    if (t.cover && needPhoto(t.cover)) { await enqueue("photo", t.cover); n++; }
  }
  for (const p of await getAll("points")) {
    for (const id of p.photos) if (needPhoto(id)) { await enqueue("photo", id); n++; }
    if (!p.synced && !p.rejected && !has.has("point:" + p.id)) { await enqueue("point", p.id); n++; }
  }
  if (n) logErr("reconcile", "補回 " + n + " 項未上載的紀錄");
}
async function gcPhotos(){
  const keep = new Set();
  (await getAll("trips")).forEach(t => { if (t.cover) keep.add(t.cover); });
  (await getAll("points")).forEach(p => p.photos.forEach(id => keep.add(id)));
  (await getAll("outbox")).forEach(o => { if (o.op === "photo") keep.add(o.ref); });
  if (S.draft) S.draft.photos.forEach(id => keep.add(id));
  const dr = await getOne("meta", "draft"); if (dr && dr.d && Array.isArray(dr.d.photos)) dr.d.photos.forEach(id => keep.add(id));
  for (const p of await getAll("photos")) if (!keep.has(p.id)) await dropPhoto(p.id);
}
function syncNow(){
  if (!syncing) syncing = (async () => {
    try {
      await flush();
      if (!isStudent() || S.authLost) return;
      S.sync.busy = true; paintSync();
      await pull();
      S.sync.pulled = true; S.sync.lastPull = Date.now(); S.sync.offline = false;
      missing.clear();   // 其他手機啱啱上載咗嘅相片，下次顯示時再問伺服器
    } catch (e) { if (e.net) S.sync.offline = true; else { S.sync.error = e.message; logErr("pull", (e.code || e.name || "") + " " + e.message); } }
    finally {
      S.sync.busy = false; syncing = null; paintSync();
      if (isStudent() && ((S.route.name === "trips" && !S.homeForm) || (S.route.name === "trip" && !S.codeOpen && !S.menu))) refresh();
    }
  })();
  return syncing;
}
async function loadLocal(){
  S.trips = await getAll("trips"); S.points = await getAll("points"); S.responses = await getAll("responses");
  const sc = await getOne("meta", "scores"); S.scores = (sc && sc.v) || {};
  const cl = await getOne("meta", "classes"); S.classes = (cl && cl.v) || [];
  S.sync.pending = (await getAll("outbox")).length;
}
async function wipeLocal(){
  for (const s of ["trips","points","photos","responses","outbox"]) await clearStore(s);
  await del("meta", "scores"); S.scores = {};
  await del("meta", "classes"); S.classes = [];
  await del("meta", "draft");
  resetPhotoCache();
  S.trips = []; S.points = []; S.responses = []; S.draft = null;
  Object.assign(S.sync, {pending: 0, error: null, note: null, offline: false, last: 0, lastPull: 0, pulled: false});
}
async function startSession(d, force){
  const me = d.me;
  resetPhotoCache(); S.myCode = null;
  if (me.role === "student") {
    const owner = await getOne("meta", "owner");
    if (owner && owner.sid !== me.sid) {
      const n = (await getAll("outbox")).length;
      if (n && !force) { S.swap = {d, owner, n}; return go("switch"); }   // 有其他帳戶未上載嘅紀錄：先問，唔好即刻刪
      await wipeLocal();
    }
    await put("meta", {id: "owner", sid: me.sid, name: me.name, cls: me.cls, no: me.no});
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}   // 請瀏覽器唔好自動清走未上載嘅紀錄
  }
  S.session = {id: "session", token: d.token, role: me.role, sid: me.sid || "", tid: me.tid || "", cls: me.cls || "", no: me.no || "", name: me.name || "", email: me.email || "", tcode: me.tcode || "", school: me.school || "", demo: !!me.demo};
  S.authLost = false; S.t = d.overview ? {overview: {data: d.overview}} : {};   // 老師：登入時已一併取得後台首頁資料
  await saveSession();
  if (me.role === "teacher") {
    go("admin", {tab: "classes"}); sendLogs();
    if (d.newTeacher) toast("登記完成。請先新增班級，再把班級編碼交給學生");
    return;
  }
  await loadLocal();
  if (await restoreDraft()) go("point");
  else go("trips");
  syncNow();
}
async function authLost(why){
  if (!S.session || S.authLost) return;
  S.authLost = true;
  const teacher = isTeacher(), s = S.session, name = s.name;
  logErr("auth", "伺服器表示登入已失效（" + (why || "") + "）");   // 重新登入後會送去「錯誤紀錄」工作表，方便查原因
  S.session = null; S.t = {}; resetPhotoCache(); await dropSession(s.token); S.sheet = null; renderSheet(); document.documentElement.classList.remove("locked");
  const n = teacher ? 0 : (await getAll("outbox")).length;

}

async function keepTrip(t){
  const loc = S.trips.find(x => x.id === t.id), x = Object.assign({}, loc || {}, t, {synced: true});
  delete x.rejected;
  await put("trips", x);
  S.trips = S.trips.filter(y => y.id !== t.id).concat(x);
}
async function purgeLocalTrip(tid){
  const t = S.trips.find(x => x.id === tid);
  for (const p of tripPoints(tid)) { for (const id of p.photos) await dropPhoto(id); await del("points", p.id); }
  for (const r of S.responses.filter(x => x.tripId === tid)) await del("responses", r.id);
  if (t && t.cover) await dropPhoto(t.cover);
  await del("trips", tid);
  S.points = S.points.filter(p => p.tripId !== tid); S.responses = S.responses.filter(r => r.tripId !== tid); S.trips = S.trips.filter(x => x.id !== tid);
}

        const res = await api("tUpdateQset", Object.assign({id: d.id}, body));
        S.qdraft = null; S.t = {};
        go("qset", {id: d.id, back}); toast("已儲存修改" + (res.regraded ? "，並重新評分 " + res.regraded + " 份答案" : ""));
      } else {
        const ov = S.t.overview && S.t.overview.data, k = ov && (ov.classes || []).find(x => x.id === body.classId);
        const res = await api("tCreateQset", body);
        S.qdraft = null; S.t = {}; S.t["qs:" + res.qset.id] = {data: {qset: res.qset, responses: [], className: k ? k.name : ""}};
        go("qset", {id: res.qset.id, fresh: true, back}); toast("已產生考察點編碼 " + res.qset.code);
      }
    } catch (e) { setBusy("qBtn", false); fail(e.message); }
  },
  copyans(el){ const v = el.dataset.v; try { navigator.clipboard.writeText(v).then(() => toast("已複製答案編碼 " + v), () => toast("答案編碼：" + v)); } catch (e) { toast("答案編碼：" + v); } },
  async ansunlock(){
    const rid = S.route.rid, code = ($("#inAnsCode").value || "").normalize("NFKC").replace(/\s+/g, "");
    if (!code) return flashIn("請輸入答案編碼。");
    flashIn(""); setBusy("ansCodeBtn", true, "核對中……");
    try {
      const d = await api("unlockAnswers", {rid, code});
      await put("responses", d.response);
      S.responses = S.responses.map(x => x.id === rid ? d.response : x);
      refresh(); toast("已顯示參考答案");
    } catch (e) { setBusy("ansCodeBtn", false, "顯示答案"); flashIn(e.net ? "需要網絡才可以核對答案編碼。" : e.message); }
  },
  copycode(el){
    const v = el.dataset.v;
    const fallback = () => { const n = $("#bigDigits"); if (n) { const r = document.createRange(); r.selectNodeContents(n); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } toast("已選取編號，請長按複製"); };
    try { navigator.clipboard.writeText(v).then(() => toast("已複製" + (el.dataset.what || "編號") + " " + v), fallback); } catch (e) { fallback(); }
  },

  /* 需要按兩次確認的動作 */
  async confirm(el){
    const key = el.dataset.key;
    if (S.confirm !== key) { S.confirm = key; return refresh(); }
    S.confirm = null;
    const cut = key.indexOf(":"), kind = cut < 0 ? key : key.slice(0, cut), id = cut < 0 ? "" : key.slice(cut + 1);
    if (kind === "deltrip") {
      if (hasSubmitted(id)) return toast("這次考察已提交答案，不能刪除。");
      await purgeLocalTrip(id); go("trips"); toast("已刪除這次考察"); await enqueue("tripdel", id);
    } else if (kind === "delpoint") {
      const d = S.draft, p = S.points.find(x => x.id === id);
      const ids = new Set([...(p ? p.photos : []), ...(d ? d.photos : []), ...(d ? d._removed : [])]);
      for (const pid of ids) await dropPhoto(pid);
      await del("points", id); S.points = S.points.filter(x => x.id !== id); await clearDraft();
      const tid = d ? d.tripId : (p ? p.tripId : null); S.draft = null; tid ? go("trip", {id: tid}) : go("trips"); toast("已刪除紀錄點");
      await enqueue("pointdel", id);
    } else if (kind === "submit") {
      const r = S.responses.find(x => x.id === id); if (!r) return;
      clearTimeout(ansT);
      document.querySelectorAll("textarea[data-ans]").forEach(t => { r.answers[+t.dataset.ans].text = t.value; });
      await put("responses", r);
      setBusy("submitBtn", true, "提交中……");
      try {
        const d = await api("submitAnswers", {rid: r.id, answers: r.answers.map(a => a.text || ""), qids: r.answers.map(a => a.qid)});
        await put("responses", d.response);
        S.responses = S.responses.map(x => x.id === r.id ? d.response : x);
        S.flash = null; refresh(); try { window.scrollTo(0, 0); } catch (e) {}
        toast("已提交，得分 " + d.response.score + " / " + d.response.total);
      } catch (e) {
        S.flash = e.net ? "需要網絡才可以提交。答案已暫存在這部手機，連接網絡後再按提交。" : e.message; refresh();
      }
    } else if (kind === "logout") {
      await sendLogs();
      const tok = S.session ? S.session.token : "";
      api("logout").catch(() => {});
      await wipeLocal(); await dropSession(tok); await del("meta", "owner");
      try { google.accounts.id.disableAutoSelect(); } catch (e) {}
      S.session = null; A.closesheet(); go("login"); toast("已登出");
    } else if (kind === "delqs") {
      try { await api("tDeleteQset", {id}); S.t = {}; const b = S.route.back; b && b.name === "aclass" ? go("aclass", b) : go("admin", {tab: "qsets"}); toast("已刪除考察點"); }
      catch (e) { toast(e.message); refresh(); }
    } else if (kind === "delcls") {
      try { await api("tDeleteClass", {id}); S.t = {}; go("admin", {tab: "classes"}); toast("已刪除班級"); }
      catch (e) { toast(e.message); refresh(); }
    } else if (kind === "rmmem") {
      const [cid, sid] = id.split(":");
      try { await api("tRemoveMember", {classId: cid, sid}); S.t = {}; go("aclass", {id: cid, back: {name: "admin", tab: "classes"}}); toast("已移出班級"); }
      catch (e) { toast(e.message); refresh(); }
    } else if (kind === "swwipe") {
      const w = S.swap; S.swap = null;
      if (w) { try { await startSession(w.d, true); toast("已刪除舊紀錄並登入"); } catch (e) { go("login", {msg: e.message}); } }
    } else if (kind === "delstu") {
      try { await api("tDeleteStudent", {sid: id}); S.t = {}; const b = S.route.back; b && b.name === "aclass" ? go("aclass", b) : go("admin", {tab: "students"}); toast("已刪除帳戶"); }
      catch (e) { toast(e.message); refresh(); }
    } else if (kind === "clearreg") {
      try {
        await api("tClearReg", {sid: id});
        delete S.t["stu:" + id]; delete S.t.overview;
        refresh(); toast("已清除登記，學生需要重新登記");
      } catch (e) { toast(e.message); refresh(); }
    }
  }
};

/* ── 事件 ── */
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const f = A[el.dataset.act]; if (f) f(el, e); });
document.addEventListener("change", e => {
  const t = e.target; if (!t) return;
  if (t.id === "inPhoto") A.addphoto(t); else if (t.id === "inCover") A.addcover(t);
});
let ansT;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "inNote" && S.draft) { S.draft.note = t.value; if (S.confirm === "leave") S.confirm = null; saveDraftSoon(500); }
  else if (t.id === "pkSearch") renderPkList();
  else if (t.dataset && t.dataset.ans !== undefined && S.route.name === "answer") {
    const r = S.responses.find(x => x.id === S.route.rid);
    if (r && r.status !== "submitted") {
      r.answers[+t.dataset.ans].text = t.value;
      clearTimeout(ansT); ansT = setTimeout(async () => {
        const cur = S.responses.find(x => x.id === r.id);
        if (!cur || cur.status === "submitted") return;
        await put("responses", cur); await enqueue("answers", cur.id, 5000);
      }, 600);
    }
  }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Enter" && t.id === "inConcept") { e.preventDefault(); A.addconcept(); }
  if (e.key === "Escape") { if (S.viewer) A.closeviewer(); else if (S.sheet) A.closesheet(); }
  if ((e.key === "Enter" || e.key === " ") && t.tagName === "LABEL" && t.htmlFor && t.getAttribute("role") === "button") { e.preventDefault(); const f = document.getElementById(t.htmlFor); if (f) f.click(); }
});
document.addEventListener("submit", e => {
  e.preventDefault(); const id = e.target.id;
  if (id === "regForm") A.register(); else if (id === "classForm") A.saveclass(); else if (id === "lcForm") A.lclogin(); else if (id === "stuForm") A.savestu(); else if (id === "scoreForm") A.savescore(); else if (id === "ansCodeForm") A.ansunlock();
  else if (id === "tripForm") A.createTrip(); else if (id === "codeForm") A.loadcode(); else if (id === "qForm") A.saveqset();
  else if (id === "joinForm") A.joinclass(); else if (id === "siteForm") A.opensite(); else if (id === "newClassForm") A.newclass();
});
window.addEventListener("online", () => { if (isStudent()) syncNow(); });
document.addEventListener("visibilitychange", () => {
  const vis = document.visibilityState === "visible";
  markAlive(vis);
  if (!vis && S.draft) saveDraftSoon(0);
  if (vis && isStudent() && Date.now() - S.sync.lastPull > 120000) syncNow();
  else if (vis && (isTeacher() || !S.session)) warmUp();
});
window.addEventListener("pagehide", () => { markAlive(false); if (S.draft) saveDraftSoon(0); });
setInterval(() => { if (isStudent() && S.sync.pending && !S.sync.busy) flush(); }, 60000);

(async function boot(){
  if (!API) return go("setup");
  const ok = await openDB(); S.volatile = !ok;
  let sess = null, owner = null, fresh = false;
  try {
    const lg = await getOne("meta", "logs"); if (lg && lg.items) LOGQ.push(...lg.items.slice(-40));
    const alive = await getOne("meta", "alive");
    if (alive && alive.fg) logErr("crash", "上次在「" + (alive.route || "") + "」畫面時突然結束" + (alive.photos ? "（編輯中相片 " + alive.photos + " 張）" : ""));
    sess = await getOne("meta", "session");
    owner = await getOne("meta", "owner");
    fresh = ok && !lg && !alive && !owner;
  } catch (e) { logErr("boot", e && e.message); }
  const bak = sessFromBackup();
  if (!(sess && sess.token) && bak) {
    sess = bak; put("meta", sess);
    logErr("session", (ok ? "資料庫找不到登入資料" : "資料庫未能開啟") + "，已用後備資料保持登入");
  } else if (sess && sess.token && !bak) sessBackup(sess);
  if (!(sess && sess.token)) {
    // 記低點解要重新登入（登入後送去「錯誤紀錄」）：全新空白通常代表瀏覽器清走咗資料，或者喺其他 app 內置瀏覽器開啟
    if (!ok) logErr("session", "資料庫未能開啟，需要重新登入");
    else if (fresh) logErr("session", "這個瀏覽器沒有本機資料（第一次使用，或瀏覽器清除了資料）");
    return go("login");
  }
  S.session = sess;
  if (sess.role === "teacher") { go("admin", {tab: "classes"}); sendLogs(); return; }
  await loadLocal();
  try {
    if (await restoreDraft()) go("point");
    else go("trips");
  } catch (e) {
    logErr("boot", "未能開啟上次的畫面：" + (e && e.message));   // 畫面出錯唔等於登出：返去考察列表
    S.draft = null; S.draftRestored = false; go("trips");
  }
  syncNow();
})();
</script>
